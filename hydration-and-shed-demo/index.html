  ],
  hero:(st, c) => [
    heroNumber(c[0], st),
    el("div", {class:"grid g23"}, [
      el("div", {class:"stack"}, [kpiRow(c.slice(1, 4), 3), trend(st, "bars")]),
      el("div", {class:"stack"}, [statusPart(st), marginGauge(st)])]),
    costMix(st),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    trendGrid(st),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  split:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st), marginGauge(st)]),
    el("div", {class:"grid g2"}, [costMix(st), statusPart(st, "bars")]),
    kpiRow(c.slice(4), 4),
    trendGrid(st),
    el("div", {class:"grid g23"}, [boardPreview(true), rankClients(st)]),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  board:(st, c) => [
    kpiStrip(c.slice(0, 5)),
    el("div", {class:"grid g23"}, [trend(st), statusPart(st)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankWorkers(st) || rankClients(st),
      rankClients(st)].filter(Boolean)),
    boardPreview(true),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  report:(st, c) => [

  ],
  focus:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st, null, 260), statusPart(st, null, 168)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    kpiRow(c.slice(4), 4),

function viewDashboard(){
  const st = periodStats(dashDays());
  let cards = V.kpis(st);
  const view = el("div", {class:"stack"});
  view.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px",
    flexWrap:"wrap"}}, [
    el("div", {class:"sm mut", text:"Showing " + date(st.from) + " — " + date(today())}),
    el("div", {style:{flex:"1"}}),
    segControl([{v:30,t:"30 days"},{v:90,t:"90 days"},{v:180,t:"6 months"},{v:365,t:"12 months"}],
      dashDays(), v => { DASH_RANGE = v; render(); })
  ]));
  /* ⚠ Bilinmeyen kompozisyon SESSİZCE `kpi`ye düşmez — o, tüm ürünleri
     aynı panoya geri döndüren şeyin ta kendisi. Konsola yazıp öyle düşüyor. */
  const key = (V.design && V.design.dash) || "kpi";
  /* ⚠ KAYIT KİPİNDE PARA PANELLERİ YOK. noMoney ürünlerde kompozisyon
     LOGDASH'ten geliyor (29_logdash.js); `focus` → `logfocus` gibi. */
  const build = (V.noMoney && typeof LOGDASH !== "undefined" &&
                 LOGDASH["log" + key]) || DASH[key];
  if (!build) console.error("bilinmeyen pano kompozisyonu: " + key);
  const nodes = (build || DASH.kpi)(st, cards).filter(Boolean);
  /* ⚠ ÜRÜNE ÖZGÜ PANEL. Her kayıt ürününün bir ayırt edici hesabı var
     (döngü gününe hizalanmış ağrı, gecikmeli tetikleyici, enerji zarfı).
     Jenerik paneller onu gösteremiyor ve ürün komşusunun kopyası gibi
     duruyor. `V.dashPanel(st)` varsa ilk grafikten hemen sonra giriyor. */
  if (V.dashPanel){
    const extra = V.dashPanel(st);
    if (extra) nodes.splice(Math.min(2, nodes.length), 0, extra);
  }
  nodes.forEach(n => view.appendChild(n));
  return view;
}

let JOB_FILTER = "open";

function jobSummary(form, rec){

let DRAG = null;
function viewBoard(){
  const board = el("div", {class:"kb"});
  V.job.stages.filter(s => !s.dead).forEach(s => {
    const list = rows(V.job.key).filter(j => j.status === s.v)
      .sort((a, b) => String(jobStart(a) || "").localeCompare(String(jobStart(b) || "")));
    const total = list.reduce((a, j) => a + jobValue(j), 0);
    /* ⚠ SÜTUN BAŞINA KART SINIRI. Salon demosunda "Paid" sütununda binlerce
       kart vardı ve tahta 2,2 saniyede çiziliyordu — üstelik o kadar kartı
       kimse sürüklemiyor. Sütunda en yeni CARD_CAP tanesi duruyor. */
    const CARD_CAP = 60;
    const lane = el("div", {class:"kb-list"});
    list.slice(0, CARD_CAP).forEach(j => lane.appendChild(el("div", {class:"kb-card", draggable:"true",
      onclick:() => editJob(j),
      ondragstart:e => { DRAG = j.id; e.currentTarget.classList.add("drag");
                         e.dataTransfer.effectAllowed = "move"; },
      ondragend:e => { DRAG = null; e.currentTarget.classList.remove("drag"); }}, [
      el("div", {class:"r1"}, [
        el("span", {class:"ref", text:jobRef(j) || "—"}),
        el("span", {class:"amt", text:money0(jobValue(j))})
      ]),
      el("div", {class:"r2", text:jobLabel(j)}),
      el("div", {class:"r3"}, [
        el("span", {text:dateShort(jobStart(j))}),
        el("span", {text:"·"}),
        el("span", {style:{flex:"1", overflow:"hidden", textOverflow:"ellipsis",
          whiteSpace:"nowrap"}, text:jobCardSub(j)}),
        jobQty(j) ? el("span", {class:"mono",
          text:money(jobRate(j)) + "/" + qtyUnit()}) : null
      ])
    ])));
    if (!list.length) lane.appendChild(el("div", {class:"sm mut",
      style:{padding:"14px 6px", textAlign:"center"},
      text:"Drop " + W("jobsLower") + " here"}));
    else if (list.length > CARD_CAP) lane.appendChild(el("button", {class:"btn sm ghost",
      style:{margin:"4px", width:"calc(100% - 8px)"},
      text:num(list.length - CARD_CAP) + " more — open the list",
      onclick:() => go(V.job.key)}));
    board.appendChild(el("div", {class:"kb-col",
      ondragover:e => { e.preventDefault(); e.currentTarget.classList.add("drop"); },
      ondragleave:e => e.currentTarget.classList.remove("drop"),
      ondrop:e => {
        e.preventDefault(); e.currentTarget.classList.remove("drop");
        const j = byId(V.job.key, DRAG);
        if (j && j.status !== s.v){
          toast("Live demo: changes are disabled. Purchase the app to save your own data.", "err");
        }
      }}, [
      el("div", {class:"kb-head"}, [
        el("i", {class:"dot", style:{background:s.c}}),
        el("span", {class:"t", text:s.t}),
        el("span", {class:"n", text:list.length + " · " + money0(total)})
      ]),
      lane
    ]));
  });
  /* ⚠ `flex:1; min-height:0` olmadan uzun sütun sayfayı şişirip alt
     kartları ekranın dışında bırakıyordu. */
  board.style.flex = "1"; board.style.minHeight = "0";
  return el("div", {style:{height:"100%", display:"flex", flexDirection:"column",
    gap:"10px", minHeight:"0"}}, [
    el("div", {class:"sm mut", style:{flex:"0 0 auto"},
      text:"Drag a card between columns to change its status. Click a card to open it."}),
    board

}

/* ⚠ SİLMEDEN ÖNCE BAĞ SAYILIR. Yüke bağlı aracı silmek raporda boş isim
   bırakıyordu. Hangi alanın hangi varlığa baktığı config'ten geliyor —

function usedBy(key, id){
  const link = (V.entities[key] || {}).jobField;

}

/* ═══ FATURALAR (ÇEKİRDEK) ══════════════════════════════════════════════
   "Müşteriye kalem faturala" her meslekte aynı iş. Alana bağlı olan tek
   şey: iş kaydının adı, tek satırlık tarifi ve tutarı — V.job'dan geliyor.
   ⚠ FATURA YÜKLERİ SAHİPLENİR, KOPYALAMAZ. Satırlar L.invoiceId üzerinden
     canlı okunuyor; yükte düzeltme yapınca fatura da düzeliyor. Kopyalasak
     iki gerçek olurdu ve hangisinin doğru olduğu belirsiz kalırdı.
   ⚠ Yazdırma AYRI PENCEREDE. Uygulama temasını (koyu tema!) faturaya
     taşımak siyah zeminli fatura üretti — belge her zaman beyaz.         */

/* CK / CE / jobLabel / jobValue / jobRef / jobDate → core/25_jobmath.js */
const JK = () => V.job.key;

function uninvoicedJobs(clientId){
  return rows(JK()).filter(j =>
    !j.invoiceId && isRevenue(j) && j[CK()] === clientId &&
    V.job.billable.indexOf(j.status) >= 0);
}
function invoiceJobs(inv){ return invoiceIndex()[inv.id] || []; }

function newInvoice(){
  const brokers = rows(CE());
  if (!brokers.length){
    return modal({size:"slim", title:W("client") + " needed first",
      body:el("p", {style:{margin:0, lineHeight:"1.6"},
        text:"An invoice needs a " + W("client").toLowerCase() + ". Add the one you are billing, then come back."}),
      buttons:["-", {label:"Cancel"},
        {label:"Add " + W("client").toLowerCase(), kind:"pri", act:() => { go(CE()); }}]});
  }
  let brokerId = brokers[0].id, picked = {};
  const body = el("div", {class:"stack", style:{gap:"12px"}});
  function paint(){
    body.innerHTML = "";
    const sel = el("select", {class:"inp", onchange:e => { brokerId = e.target.value;
      picked = {}; paint(); }});
    brokers.forEach(b => sel.appendChild(el("option", {value:b.id, text:b.name,
      selected:b.id === brokerId})));
    body.appendChild(el("div", {class:"field"}, [el("label", {text:W("client")}), sel]));
    const avail = uninvoicedJobs(brokerId);
    if (!avail.length){
      body.appendChild(el("div", {class:"empty", style:{padding:"28px"}}, [
        el("div", {html:ICON.invoice}),
        el("h3", {text:W("jobs") + " ready to bill: none"}),
        el("p", {text:V.job.billableHint || (W("jobs") + " appear here once finished and not already on an invoice.")})
      ]));
      return;
    }
    const list = el("div", {style:{border:"1px solid var(--hair)",
      borderRadius:"var(--r)", overflow:"hidden", maxHeight:"280px", overflowY:"auto"}});
    avail.forEach(L => {
      const on = !!picked[L.id];
      list.appendChild(el("label", {style:{display:"flex", gap:"10px", alignItems:"center",
        padding:"9px 11px", borderBottom:"1px solid var(--hair2)", cursor:"pointer",
        background:on ? "var(--accent-soft)" : "transparent"}}, [
        el("input", {type:"checkbox", checked:on,
          onchange:e => { picked[L.id] = e.target.checked; paint(); }}),
        el("span", {class:"mono", style:{fontWeight:"600", width:"78px"}, text:L.ref || "—"}),
        el("span", {class:"cell-2", style:{flex:"1"}}, [
          el("span", {class:"a", text:jobLabel(L)}),
          el("span", {class:"b", text:date(L.doDate || L.puDate)})
        ]),
        el("span", {class:"mono", style:{fontWeight:"600"}, text:money(jobValue(L))})
      ]));
    });
    body.appendChild(list);
    const sum = avail.filter(L => picked[L.id]).reduce((a, L) => a + jobValue(L), 0);
    body.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px"}}, [
      el("button", {class:"btn sm", text:"Select all",
        onclick:() => { avail.forEach(L => picked[L.id] = true); paint(); }}),
      el("button", {class:"btn sm ghost", text:"Clear",
        onclick:() => { picked = {}; paint(); }}),
      el("div", {style:{flex:"1"}}),
      el("span", {class:"mut sm", text:Object.values(picked).filter(Boolean).length + " selected"}),
      el("span", {class:"mono", style:{fontSize:"16px", fontWeight:"600"}, text:money(sum)})
    ]));
  }
  paint();
  modal({size:"wide", title:"New invoice", sub:"Pick the " + W("jobsLower") + " to bill", body:body,
    buttons:["-", {label:"Cancel"}, {label:"Create invoice", kind:"pri", act:() => {
      const ids = Object.keys(picked).filter(k => picked[k]);
      if (!ids.length){ toast("Select at least one " + W("jobLower") + ".", "err"); return false; }
      const b = byId(CE(), brokerId);
      const inv = stamp({id:uid(), no:nextInvoiceNo(), clientId:clientId, date:today(),
        terms:(b && b.terms) || S.set.invoiceTerms, discount:0, extra:0, paidDate:""});
      rows("invoices").push(inv);
      S.set.nextInvoice = n0(S.set.nextInvoice) + 1;
      ids.forEach(id => { const L = byId("loads", id);
        if (L){ L.invoiceId = inv.id; if (L.status === V.job.doneState) L.status = V.job.billedState; stamp(L); } });
      commit("Invoice " + inv.no + " created.");
      render(); setTimeout(() => openInvoice(inv), 60);
    }}]});
}

function openInvoice(inv){
  const ls = invoiceJobs(inv);
  const total = invoiceTotal(inv);
  const st = invoiceStatus(inv);
  const body = el("div", {class:"stack", style:{gap:"14px"}});

  body.appendChild(el("div", {style:{display:"flex", gap:"10px", alignItems:"center",
    flexWrap:"wrap"}}, [
    el("span", {class:"pill " + st.pill, text:st.t}),
    el("span", {class:"mut sm", text:"Issued " + date(inv.date) + " · Due " + date(invoiceDue(inv))}),
    el("div", {style:{flex:"1"}}),
    el("span", {class:"mono", style:{fontSize:"19px", fontWeight:"600"}, text:money(total)})
  ]));

  const tbl = el("table", {class:"dt"});
  tbl.appendChild(el("thead", {}, el("tr", {}, [
    el("th", {text:W("jobNo")}), el("th", {text:V.job.labelHead || "Details"}), el("th", {text:V.job.dateHead || "Date"}),
     el("th", {class:"n", text:"Amount"}), el("th", {})
  ])));
  const tb = el("tbody");
  ls.forEach(L => tb.appendChild(el("tr", {}, [
    el("td", {class:"mono strong", text:jobRef(L) || "—"}),
    el("td", {text:jobLabel(L)}),
    el("td", {text:date(jobDate(L))}),
    
    el("td", {class:"n strong", text:money(jobValue(L))}),
    el("td", {class:"act"}, el("button", {class:"icon-btn", html:ICON.x, title:"Remove from invoice",
      onclick:() => { L.invoiceId = ""; if (L.status === V.job.billedState) L.status = V.job.doneState;
        stamp(L); commit("Removed from invoice."); closeModal(); render(); }}))
  ])));
  tbl.appendChild(tb);
  body.appendChild(el("div", {class:"tw", style:{border:"1px solid var(--hair)",
    borderRadius:"var(--r)", maxHeight:"260px"}}, tbl));

  const addable = uninvoicedJobs(inv.clientId);
  if (addable.length) body.appendChild(el("button", {class:"btn sm",
    html:ICON.plus + "<span>Add " + addable.length + " more load" +
         (addable.length > 1 ? "s" : "") + "</span>",
    onclick:() => { addable.forEach(L => { L.invoiceId = inv.id;
      if (L.status === V.job.doneState) L.status = V.job.billedState; stamp(L); });
      commit("Loads added."); closeModal(); render(); }}));

  const f = el("form", {class:"form-grid", onsubmit:e => e.preventDefault()});
  [{k:"no", label:"Invoice #", req:true},
   {k:"date", label:"Invoice date", type:"date", req:true},
   {k:"terms", label:"Terms", type:"select", opts:TERMS, req:true},
   {k:"discount", label:"Discount", type:"money", min:0},
   {k:"extra", label:"Additional charge", type:"money"},
   {k:"paidDate", label:"Paid on", type:"date", hint:"Leave blank while unpaid"},
   {k:"paidRef", label:"Payment reference"},
   {k:"notes", label:"Notes on invoice", type:"textarea", full:true, rows:2}
  ].forEach(x => f.appendChild(fieldNode(x, inv)));
  body.appendChild(f);

  const FIELDS = [{k:"no"},{k:"date"},{k:"terms"},{k:"discount",type:"money"},
    {k:"extra",type:"money"},{k:"paidDate"},{k:"paidRef"},{k:"notes"}];
  modal({size:"wide", title:"Invoice " + (inv.no || ""),
    sub:clientName(inv.clientId) + " · " + ls.length + " " + (ls.length === 1 ? W("jobLower") : W("jobsLower")),
    body:body,
    buttons:[
      {label:"Delete", kind:"danger", act:() => confirmBox("Delete invoice?",
        "The " + W("jobsLower") + " go back to unbilled. The invoice number is not reused.",
        () => { invoiceJobs(inv).forEach(L => { L.invoiceId = "";
            if (L.status === V.job.billedState) L.status = V.job.doneState; stamp(L); });
          remove("invoices", inv.id); commit("Invoice deleted."); render(); })},
      "-",
      {label:"Print / PDF", act:() => { Object.assign(inv, readForm(f, FIELDS));
        stamp(inv); commit(); printInvoice(inv); return false; }},
      inv.paidDate ? null : {label:"Mark paid", act:() => {
        Object.assign(inv, readForm(f, FIELDS)); inv.paidDate = today(); stamp(inv);
        invoiceJobs(inv).forEach(L => { L.status = V.job.paidState; stamp(L); });
        commit("Marked paid."); render(); }},
      {label:"Save", kind:"pri", act:() => {
        Object.assign(inv, readForm(f, FIELDS)); stamp(inv);
        if (inv.paidDate) invoiceJobs(inv).forEach(L => { L.status = V.job.paidState; stamp(L); });
        commit("Invoice saved."); render(); }}
    ].filter(Boolean)});
}

/* ═══ RAPORLAR (ÇEKİRDEK) ═══════════════════════════════════════════════
   Beş şekil her meslekte aynı: kâr-zarar · iş kârlılığı · birim başına ·
   çalışan hakedişi · müşteri. Hangileri gösterilecek ve neyle etiketlenecek
   V.reports'tan geliyor.
   ⚠ TEK KAYNAK. Rapor sayıları yüklerden ve giderlerden CANLI türetilir;
     ayrı bir "rapor tablosu" tutulmuyor. İki yerde saklanan sayı er geç
     birbirini tutmuyor.                                                   */

let REP_TAB = "pnl", REP_FROM = "", REP_TO = "";

function repRange(){
  const to = REP_TO || today();
  const from = REP_FROM || addDays(to, -365);
  return {from:from, to:to};
}

function pnlData(){
  const R = repRange();
  const ls = jobsIn(R.from, R.to);
  /* ⚠ Panodakiyle AYNI kanca; iki yerde farklı ciro göstermek en kötüsü. */
  const recur = V.recurring ? V.recurring(R.from, R.to) : 0;
  const revenue = ls.reduce((a, L) => a + jobValue(L), 0) + recur;
  const fees = ls.reduce((a, L) => a + jobFee(L), 0);
  const exps = rows("expenses").filter(e => inRange(e.date, R.from, R.to));
  const fuels = rows("fuel").filter(f => inRange(f.date, R.from, R.to));
  const byCat = sumBy(exps, e => e.category || "Other", e => n0(e.amount));
  const fuelTot = fuels.reduce((a, f) => a + n0(f.cost), 0);
  if (fuelTot) byCat.set("Fuel", (byCat.get("Fuel") || 0) + fuelTot);
  if (fees) byCat.set("Dispatch fee", (byCat.get("Dispatch fee") || 0) + fees);
  const costs = Array.from(byCat.values()).reduce((a, b) => a + b, 0);
  const miles = ls.reduce((a, L) => a + jobQty(L), 0);
  return {R:R, ls:ls, revenue:revenue, byCat:byCat, costs:costs,
          profit:revenue - costs, miles:miles};
}

function repPnl(){
  const d = pnlData();
  const cats = Array.from(d.byCat.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v);
  const out = el("div", {class:"stack"});
  out.appendChild(el("div", {class:"grid g4"}, [
    kpi({label:"Revenue", value:money0(d.revenue), color:"var(--c1)",
         note:d.ls.length + " loads"}),
    kpi({label:"Total Costs", value:money0(d.costs), color:"var(--c5)",
         note:d.revenue ? pct(d.costs / d.revenue * 100, 0) + " of revenue" : "—"}),
    kpi({label:"Net Profit", value:money0(d.profit),
         color:d.profit >= 0 ? "var(--good)" : "var(--bad)",
         note:d.revenue ? pct(d.profit / d.revenue * 100) + " margin" : "—"}),
    kpi({label:"Profit / " + qtyUnit(), value:d.miles ? money(d.profit / d.miles) : "—",
         color:"var(--c3)", note:num(d.miles) + " " + qtyUnit()})
  ]));
  out.appendChild(el("div", {class:"grid g23"}, [
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Cost Breakdown"})),
      el("div", {class:"panel-body flush"}, (() => {
        const t = el("table", {class:"dt"});
        t.appendChild(el("thead", {}, el("tr", {}, [
          el("th", {text:"Category"}), el("th", {class:"n", text:"Amount"}),
          el("th", {class:"n", text:"% of revenue"}), el("th", {class:"n", text:"Per " + qtyUnit()})
        ])));
        const tb = el("tbody");
        cats.forEach(c => tb.appendChild(el("tr", {}, [
          el("td", {text:c.k}),
          el("td", {class:"n strong", text:money(c.v)}),
          el("td", {class:"n mut", text:d.revenue ? pct(c.v / d.revenue * 100) : "—"}),
          el("td", {class:"n mut", text:d.miles ? money(c.v / d.miles) : "—"})
        ])));
        t.appendChild(tb);
        t.appendChild(el("tfoot", {}, el("tr", {}, [
          el("td", {text:"Total costs"}), el("td", {class:"n", text:money(d.costs)}),
          el("td", {class:"n", text:d.revenue ? pct(d.costs / d.revenue * 100) : "—"}),
          el("td", {class:"n", text:d.miles ? money(d.costs / d.miles) : "—"})
        ])));
        return cats.length ? el("div", {class:"tw"}, t)
          : el("div", {class:"empty", style:{padding:"36px"}}, [
              el("h3", {text:"No costs in this period"}),
              el("p", {text:"Log fuel and expenses to see where the money goes."})]);
      })())
    ]),
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Where the money goes"})),
      el("div", {class:"panel-body"}, cats.length
        ? donut(cats.slice(0, 6), {label:"Costs", fmt:money0, size:150})
        : noData(300, 140))
    ])
  ]));
  return out;
}

function repTrucks(){

  const list = rows(V.job.unitEntity).map(t => {

    const rev = ls.reduce((a, L) => a + jobValue(L), 0);

    const fu = rows("fuel").filter(f => f.truckId === t.id && inRange(f.date, R.from, R.to));
    const gal = fu.reduce((a, f) => a + n0(f.gallons), 0);
    const fuelC = fu.reduce((a, f) => a + n0(f.cost), 0);

      .reduce((a, e) => a + n0(e.amount), 0);
    return Object.assign({}, t, {_rev:rev, _mi:mi, _gal:gal, _fuel:fuelC, _exp:ex,
      _mpg:gal ? mi / gal : 0, _profit:rev - fuelC - ex, _loads:ls.length});

  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, el("h2", {text:W("unit") + " Performance"})),

/* ⚠ HANGİ RAPOR GÖSTERİLECEK config'ten. Araç kavramı olmayan bir meslekte
   "Truck Performance" sekmesi boş durur ve ürünü ucuz gösterir. */
const ALL_REPORTS = {
  pnl:  () => ({t:"Profit & Loss", fn:repPnl}),
  jobs: () => ({t:W("job") + " Profitability", fn:repLoads}),
  unit: () => ({t:W("unit") + " Performance", fn:repTrucks}),
  worker:() => ({t:W("worker") + " Settlements", fn:repDrivers}),
  client:() => ({t:W("clients"), fn:repCustomers})
};
function reportList(){
  /* ⚠ DIKEY KENDI RAPORUNU EKLEYEBILIR. Kayit urunlerinde K/Z anlamsiz;
     V.reports icinde {v,t,fn} nesnesi verilirse dogrudan kullanilir. */
  const d = V.reports || (V.noMoney ? ["jobs"] : ["pnl","jobs","client"]);
  return d.map(k => {
    if (k && typeof k === "object") return k;
    const r = ALL_REPORTS[k]; return r ? Object.assign({v:k}, r()) : null;
  }).filter(Boolean);
}

function viewReports(){
  const R = repRange();
  const out = el("div", {class:"stack"});
  out.appendChild(el("div", {class:"panel"}, el("div", {class:"toolbar"}, [
    el("div", {class:"field", style:{flexDirection:"row", alignItems:"center", gap:"7px"}}, [
      el("label", {text:"From", style:{margin:0}}),
      el("input", {class:"inp", type:"date", value:R.from, style:{width:"auto"},
        onchange:e => { REP_FROM = e.target.value; render(); }})
    ]),
    el("div", {class:"field", style:{flexDirection:"row", alignItems:"center", gap:"7px"}}, [
      el("label", {text:"To", style:{margin:0}}),
      el("input", {class:"inp", type:"date", value:R.to, style:{width:"auto"},
        onchange:e => { REP_TO = e.target.value; render(); }})
    ]),
    segControl([{v:30,t:"30d"},{v:90,t:"90d"},{v:365,t:"1y"}], null, v => {
      REP_TO = today(); REP_FROM = addDays(today(), -v); render(); }),
    el("div", {style:{flex:"1"}}),
    el("button", {class:"btn sm", html:ICON.print + "<span>Print</span>",
      onclick:() => window.print()})
  ])));
  const REPORTS = reportList();
  out.appendChild(el("div", {class:"tabs"}, REPORTS.map(r =>
    el("button", {class:r.v === REP_TAB ? "on" : "", text:r.t,
      onclick:() => { REP_TAB = r.v; render(); }}))));
  out.appendChild((REPORTS.find(r => r.v === REP_TAB) || REPORTS[0]).fn());
  return out;
}

  if (inp) inp.addEventListener("change", () => {
    S.set[f.k] = f.type === "check" ? inp.checked
      : (f.type === "num" || f.type === "money") ? (inp.value === "" ? 0 : Number(inp.value))
      : inp.value;

function pickLogo(){
  const inp = el("input", {type:"file", accept:"image/*", style:{display:"none"}});
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 256, sc = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        S.set.logo = c.toDataURL("image/png");
        commit("Logo updated."); render();
      };
      img.onerror = () => toast("That image could not be read.", "err");
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(() => inp.remove(), 900);
}

/* ── 38_cloud.js ── */
/* ═══ BULUT TAŞIYICI (Dropbox) ══════════════════════════════════════════
   ⚠ NEDEN DROPBOX, DRIVE DEĞİL. Google'ın saf-tarayıcı akışı refresh
     token VERMİYOR; yenileme gizli iframe'in Google oturum çerezine
     erişmesine bağlı ve iOS Safari'nin ITP'si o çerezi kesiyor — yani
     telefonda saat başı görünür bir "devam et". Dropbox PKCE public
     client'a `token_access_type=offline` ile GERÇEK refresh token
     veriyor, secret istemiyor ve yenilemesi tarayıcıdan çalışıyor.
   ⚠ MASAÜSTÜ YOLUNU DEĞİŞTİRMİYOR. Klasör senkronu (File System Access)
     daha iyi: offline, token yok, rate-limit yok. Bu katman YALNIZCA
     FS API'nin olmadığı yerde (telefon) devreye giriyor.
   ⚠ AYNI DESEN: cihaz başına dosya. Her cihaz yalnız kendi
     `<app>-<cihaz>.json` dosyasına yazar, okumada ötekiler birleşir.
     Böylece çakışacak yazma yok — klasör yolunun aynısı, taşıyıcı farklı.
   ⚠ APP KEY GELİŞTİRİCİNİN, MÜŞTERİNİN DEĞİL. Tek anahtar, uygulamaya
     gömülü, public (PKCE olduğu için secret yok). Müşteri tarafında tek
     dokunuş "Connect Dropbox" — hiçbir kurulum yok.
   ⚠ ANAHTAR DOSYAYA YAZILMAZ. build.py --web=<key> derleme anında
     gömüyor; kaynakta boş duruyor.                                      */

const DBX_KEY = "";                  /* build.py --web=<key> doldurur */
const DBX_ROOT = "https://api.dropboxapi.com";
const DBX_CONTENT = "https://content.dropboxapi.com";
const CLOUD_OK = () => !!DBX_KEY && !DEMO_MODE;

let DBX = null;          /* {refresh, access, exp} */
let DBX_LAST = 0, DBX_FAIL = "", DBX_BUSY = false;

/* ── PKCE ──────────────────────────────────────────────────────────── */
function b64url(buf){
  let s = "";
  new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function pkceVerifier(){
  const a = new Uint8Array(48);
  crypto.getRandomValues(a);
  return b64url(a.buffer);
}
async function pkceChallenge(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return b64url(d);
}
/* ⚠ REDIRECT URI TAM EŞLEŞMELİ. Dropbox konsoluna yazılanla birebir aynı
   olmak zorunda; query string taşırsak eşleşme kırılıyor. */
function dbxRedirect(){
  return location.origin + location.pathname;
}

async function dbxConnect(){
  if (!CLOUD_OK()) return;
  const v = pkceVerifier();
  try { sessionStorage.setItem(APP() + ":pkce", v); }
  catch(e){ toast("Your browser is blocking storage — sign-in can't continue.", "err"); return; }
  const u = new URL("https://www.dropbox.com/oauth2/authorize");
  u.searchParams.set("client_id", DBX_KEY);
  u.searchParams.set("response_type", "code");
  u.searchParams.set("code_challenge", await pkceChallenge(v));
  u.searchParams.set("code_challenge_method", "S256");
  u.searchParams.set("redirect_uri", dbxRedirect());
  u.searchParams.set("token_access_type", "offline");   /* → refresh token */
  location.href = u.toString();
}

async function dbxForm(body){
  const r = await fetch(DBX_ROOT + "/oauth2/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(body).toString()
  });
  if (!r.ok) throw new Error("dropbox auth " + r.status + " " + (await r.text()).slice(0, 160));
  return r.json();
}

/* Dönüşte ?code= ile geliyoruz. Adres çubuğunu hemen temizliyoruz ki
   yenilemede aynı kod ikinci kez harcanmasın (Dropbox tek kullanımlık). */
async function dbxFinishRedirect(){
  if (!CLOUD_OK()) return false;
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (!code) return false;
  const v = sessionStorage.getItem(APP() + ":pkce") || "";
  history.replaceState({}, "", dbxRedirect());
  if (!v){ toast("Sign-in could not be completed — please try again.", "err"); return false; }
  try {
    const t = await dbxForm({code:code, grant_type:"authorization_code",
      code_verifier:v, client_id:DBX_KEY, redirect_uri:dbxRedirect()});
    sessionStorage.removeItem(APP() + ":pkce");
    DBX = {refresh:t.refresh_token || "", access:t.access_token,
           exp:Date.now() + (n0(t.expires_in) || 14000) * 1000};
    await idbPut("dbx", DBX);
    return true;
  } catch(e){
    DBX_FAIL = String(e.message || e);
    toast("Dropbox sign-in failed.", "err");
    return false;
  }
}

async function dbxResume(){
  if (!CLOUD_OK()) return;
  try { DBX = (await idbGet("dbx")) || null; } catch(e){ DBX = null; }
}

/* ⚠ TOKEN 4 SAAT. Refresh token ile yenileme GÖRÜNMEZ — kullanıcı hiçbir
   şey görmüyor. 60 sn pay bırakılıyor ki uçuşta sona ermesin. */
async function dbxToken(){
  if (!DBX) return "";
  if (DBX.access && Date.now() < DBX.exp - 60000) return DBX.access;
  if (!DBX.refresh) return "";
  const t = await dbxForm({grant_type:"refresh_token",
    refresh_token:DBX.refresh, client_id:DBX_KEY});
  DBX.access = t.access_token;
  DBX.exp = Date.now() + (n0(t.expires_in) || 14000) * 1000;
  await idbPut("dbx", DBX);
  return DBX.access;
}

async function dbxCall(url, headers, body){
  const tk = await dbxToken();
  if (!tk) throw new Error("not connected");
  const r = await fetch(url, {method:"POST",
    headers:Object.assign({Authorization:"Bearer " + tk}, headers),
    body:body});
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
  return r;
}

/* ── Aynı iki işlem: kendi dosyanı yaz, ötekileri oku ──────────────── */
async function dbxPush(){
  if (!DBX || DEMO_MODE || DBX_BUSY) return;
  const name = APP() + "-" + deviceName() + ".json";
  try {
    await dbxCall(DBX_CONTENT + "/2/files/upload",
      {"Dropbox-API-Arg":JSON.stringify({path:"/" + name,
        mode:"overwrite", mute:true}),
       "Content-Type":"application/octet-stream"},
      JSON.stringify(S, null, 1));
    DBX_LAST = Date.now(); DBX_FAIL = "";
    S.set.lastFolderWrite = today();
  } catch(e){ DBX_FAIL = String(e.message || e); }
  paintSync();
}

async function dbxPull(){
  if (!DBX || DEMO_MODE || DBX_BUSY) return 0;
  const mine = APP() + "-" + deviceName() + ".json";
  let n = 0;
  DBX_BUSY = true;
  try {
    const r = await dbxCall(DBX_ROOT + "/2/files/list_folder",
      {"Content-Type":"application/json"}, JSON.stringify({path:""}));
    const j = await r.json();
    for (const e of (j.entries || [])){
      if (e[".tag"] !== "file" || e.name === mine || !fileMine(e.name)) continue;
      try {
        const f = await dbxCall(DBX_CONTENT + "/2/files/download",
          {"Dropbox-API-Arg":JSON.stringify({path:e.path_lower})}, null);
        n += mergeIncoming(JSON.parse(await f.text()));
      } catch(err){}
    }
    saveLocal();
    DBX_FAIL = "";
  } catch(e){ DBX_FAIL = String(e.message || e); }
  DBX_BUSY = false;
  paintSync();
  return n;
}

async function dbxForget(){
  DBX = null;
  try { await idbPut("dbx", null); } catch(e){}
  paintSync();
  toast("Dropbox disconnected. Your data is still on this device.", "info");
}

/* ⚠ TELEFON SEKME DONDURUYOR. iOS arka plandaki sekmeyi askıya alıyor;
   zamanlayıcıya güvenilmiyor. Sayfa geri görünür olunca çekiliyor. */
function cloudWatch(){
  if (!DBX) return;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - DBX_LAST > 20000)
      dbxPull().then(n => { if (n) render(); });
  });
}

/* ═══ ANA EKRANA EKLEME ═════════════════════════════════════════════════
   ⚠ İKİ AYRI DERDİ BİRDEN ÇÖZÜYOR:
     1) "Her seferinde linke girmek" — ana ekranda simge oluyor, adres
        çubuğu yok, uygulama gibi açılıyor.
     2) SAFARI'NİN 7 GÜNLÜK SİLMESİ — WebKit'in kendi açıklaması: ana
        ekrana eklenen web uygulaması Safari'nin parçası SAYILMIYOR, kendi
        kullanım sayacı var ve verisi silinmiyor. Yani telefonda veriyi
        ayakta tutan şey bu; "isteğe bağlı güzellik" değil.
   ⚠ APPLE-TOUCH-ICON PNG OLMAK ZORUNDA. iOS SVG kabul etmiyor; sekme
     ikonundaki SVG'yi buraya koyunca simge boş çıkıyor. Canvas'ta
     çiziliyor — SVG'yi canvas'a basmak bazı tarayıcılarda tuvali
     kirletiyor, o yüzden 2D ilkellerle.
   ⚠ SADECE BARINDIRILAN SÜRÜMDE. file:// ile açılan masaüstü kopyasında
     ana ekran diye bir şey yok; orada bu şerit gürültü olurdu.          */

const HOSTED = location.protocol === "http:" || location.protocol === "https:";
const STANDALONE = (window.matchMedia &&
    window.matchMedia("(display-mode: standalone)").matches) ||
  navigator.standalone === true;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const SMALL = window.matchMedia && window.matchMedia("(max-width: 900px)").matches;

function accentHex(){
  try {
    const c = getComputedStyle(document.documentElement)
      .getPropertyValue("--accent").trim();
    return c || "#E8590C";
  } catch(e){ return "#E8590C"; }
}
function brandInitials(){
  const n = (S.set.company || V.name || "App").replace(/[^A-Za-z0-9 ]/g, " ").trim();
  const w = n.split(/\s+/).filter(Boolean);
  return ((w[0] || "A")[0] + (w[1] ? w[1][0] : (w[0] || "A")[1] || "")).toUpperCase();
}
function touchIconPNG(size){
  try {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const x = c.getContext("2d");
    const r = size * 0.22;
    x.fillStyle = "#161C24";
    x.beginPath();
    if (x.roundRect) x.roundRect(0, 0, size, size, r); else x.rect(0, 0, size, size);
    x.fill();
    x.fillStyle = accentHex();
    x.beginPath();
    const p = size * 0.16, s2 = size - p * 2, r2 = s2 * 0.2;
    if (x.roundRect) x.roundRect(p, p, s2, s2, r2); else x.rect(p, p, s2, s2);
    x.fill();
    x.fillStyle = "#FFFFFF";
    x.font = "600 " + Math.round(size * 0.38) + "px -apple-system,Helvetica,Arial,sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(brandInitials(), size / 2, size / 2 + size * 0.02);
    return c.toDataURL("image/png");
  } catch(e){ return ""; }
}

function setMeta(name, content){
  let m = document.querySelector('meta[name="' + name + '"]');
  if (!m){ m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
  m.content = content;
}
function setLink(rel, href, extra){
  let l = document.querySelector('link[rel="' + rel + '"][data-inst]');
  if (!l){ l = document.createElement("link"); l.rel = rel;
    l.setAttribute("data-inst", "1"); document.head.appendChild(l); }
  l.href = href;
  if (extra) for (const k in extra) l.setAttribute(k, extra[k]);
}

function installMeta(){
  if (!HOSTED) return;
  const name = (S.set.company || V.name);
  setMeta("apple-mobile-web-app-capable", "yes");
  setMeta("mobile-web-app-capable", "yes");
  setMeta("apple-mobile-web-app-status-bar-style", "black-translucent");
  setMeta("apple-mobile-web-app-title", name.slice(0, 24));
  setMeta("theme-color", "#161C24");
  const png = touchIconPNG(180);
  if (png) setLink("apple-touch-icon", png, {sizes:"180x180"});
  /* ⚠ MANIFEST DE GÖMÜLÜ. Ayrı dosya tek-dosya kuralını bozardı;
     data URI olarak veriliyor, Chrome bunu kabul ediyor. */
  const big = touchIconPNG(512);
  const man = {name:name, short_name:name.slice(0, 12), start_url:location.pathname,
    display:"standalone", background_color:"#161C24", theme_color:"#161C24",
    icons:big ? [{src:big, sizes:"512x512", type:"image/png", purpose:"any"}] : []};
  try {
    setLink("manifest", "data:application/manifest+json;charset=utf-8," +
      encodeURIComponent(JSON.stringify(man)));
  } catch(e){}
}

/* ── Kurulum şeridi ─────────────────────────────────────────────────── */
let _deferredPrompt = null;
if (typeof window !== "undefined"){
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); _deferredPrompt = e;
    try { installBar(); } catch(err){}
  });
}
const INST_KEY = () => APP() + ":inst-hid";

function installBar(){
  if (!HOSTED || STANDALONE || DEMO_MODE) return;
  if (!SMALL && !_deferredPrompt) return;
  try { if (localStorage.getItem(INST_KEY())) return; } catch(e){}
  if (document.getElementById("instBar")) return;
  const how = IOS

/* ═══ ÖRNEK VERİ KİTAPLIĞI ══════════════════════════════════════════════
   Her dikeyin demo'sunda tekrar eden işler burada bir kez.
   ⚠ EN ÇOK ZAMANI GİDER YAPISI YİYORDU. freight'te marj iki kez (%2, %49),
     autoshop'ta iki kez (%28, −%18), carwash'ta iki kez yanlış çıktı ve her
     seferinde elle kalem ekleyip çıkardım. `expenseBook` artık HEDEF MARJI
     alıp giderleri ona göre üretiyor — sektörün kalem dağılımını koruyarak.
   ⚠ Kalem ADLARI dikeyden geliyor. Ortak bir gider listesi kullanmak
     ürünleri jenerikleştirir: yıkamacının "kimyasal", tesisatçının
     "malzeme", fotoğrafçının "ekipman kiralama" kalemi var.              */

function seeded(n){
  let s = n || 20260828;
  const R = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  R.pick = a => a[Math.floor(R() * a.length)];
  R.bt = (a, b) => a + R() * (b - a);
  R.int = (a, b) => Math.floor(R.bt(a, b));
  R.chance = p => R() < p;
  return R;
}

const NAME_FIRST = ["Dana","Marcus","Priya","Owen","Claire","Tobias","Renata","Wesley",
  "Ingrid","Hassan","Lucia","Dmitri","Aoife","Kwame","Sofia","Ronan","Mei","Alejandro",
  "Fatima","Niall","Yara","Emeka","Greta","Rustam","Camille","Bilal","Anouk","Teodor",
  "Nadia","Ivo","Selma","Joris","Amara","Petra","Kai","Lena","Otto","Rosa","Idris","Vera"];
const NAME_LAST = ["Whitfield","Ellery","Raman","Baptiste","Nakamura","Lund","Vasquez",
  "Okoro","Halvorsen","Karim","Moreau","Petrov","Byrne","Mensah","Ferrara","Doyle",
  "Tanaka","Cabrera","Haddad","Keane","Nasser","Obi","Lindqvist","Rossi","Aziz",
  "Bakker","Ionescu","Farouk","Novak","Sandoval","Achterberg","Beaumont","Quintero"];

function personName(R){ return R.pick(NAME_FIRST) + " " + R.pick(NAME_LAST); }
function phoneNo(R){
  return "(" + R.pick(["214","469","972","817"]) + ") 555-0" + R.int(100, 999);
}
function plateNo(R){
  const L = () => String.fromCharCode(65 + R.int(0, 26));
  return L() + L() + L() + "-" + R.int(1000, 9999);
}

/* ── GİDER DEFTERİ ────────────────────────────────────────────────────
   revByMonth : {"2026-07": 41200, …}   aylık ciro
   spec       : {fixed:[[ad, aylık, oynaklık], …],
                 variable:[[ad, ciro oranı, oynaklık], …],
                 occasional:[[ad, kaç ayda bir, min, max], …]}
   target     : hedef net marj (0.15 = %15)
   ⚠ HEDEFE "denge kalemi" ile varılıyor: sabit + değişken kalemler
     sektörün dağılımını korur, kalan fark `balanceAs` kalemine yazılır
     (genelde ücretler — her işte en büyük ve en esnek kalem).            */
function expenseBook(R, revByMonth, spec, target, balanceAs){
  const out = [], months = Object.keys(revByMonth).sort();
  const D = mk => mk + "-" + String(R.int(2, 27)).padStart(2, "0");
  months.forEach(mk => {
    const rev = revByMonth[mk] || 0;
    if (!rev) return;
    let spent = 0;
    (spec.fixed || []).forEach(f => {
      const amt = Math.round(f[1] * R.bt(1 - (f[2] || .08), 1 + (f[2] || .08)));
      out.push({id:uid(), date:D(mk), category:f[0], amount:amt, vendor:f[3] || ""});
      spent += amt;
    });
    (spec.variable || []).forEach(v => {
      const amt = Math.round(rev * v[1] * R.bt(1 - (v[2] || .12), 1 + (v[2] || .12)));
      if (amt > 0){
        out.push({id:uid(), date:D(mk), category:v[0], amount:amt, vendor:v[3] || ""});
        spent += amt;
      }
    });
    (spec.occasional || []).forEach(o => {
      if (!R.chance(1 / (o[1] || 3))) return;
      const amt = Math.round(R.bt(o[2], o[3]));
      out.push({id:uid(), date:D(mk), category:o[0], amount:amt, vendor:o[4] || ""});
      spent += amt;
    });
    /* denge kalemi — hedef marja getiren fark */
    const want = rev * (1 - target);
    const gap = Math.round(want - spent);
    if (gap > 0)
      out.push({id:uid(), date:D(mk), category:balanceAs[0], amount:gap,
                vendor:balanceAs[1] || ""});
  });
  return out;
}

/* ═══ DEMO İÇİNDE AYARLARI GEÇİCİ OLARAK KUR ════════════════════════════
   ⚠ BU TUZAĞA İKİ KEZ DÜŞTÜK. Alan fonksiyonlarının çoğu `S.set`'ten
     okuyor (gün ücreti, vergi oranı, servis malzemesi yüzdesi...). Ama
     `DEMO()` henüz S'e yazmadığı için o değerler UNDEFINED → 0 dönüyor:
       · electrical: gün ücretli işler ciroya 0 yazıldı, giderler eksik
         üretildi, net marj %16 hedeflenirken %27 çıktı
       · autoshop: vergi ve servis malzemesi 0 sayıldı
     Çözüm: demo ayarlarını ÖNCE kur, hesabı onunla yap, sonra geri al.
   ⚠ Aynı sebeple demo içinde `rows()` / `byId()` de kullanma — S boş. */
function withSettings(set, fn){
  const prev = S.set;
  S.set = Object.assign({}, DEFAULT_SET, set);
  try { return fn(); }
  finally { S.set = prev; }
}

/* Aylık ciro haritası — expenseBook'un girdisi. */
function revenueByMonth(list, dateOf, valueOf){
  const m = {};
  list.forEach(x => {
    const k = monthKey(dateOf(x));
    if (k) m[k] = (m[k] || 0) + valueOf(x);
  });
  return m;
}

/* Son N ayın anahtarları — gider defteri bu pencereyi doldurur. */
function monthWindow(n){
  const out = {}, d = new Date(); d.setDate(1);
  for (let i = n; i >= 0; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out[x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")] = 0;
  }
  return out;
}

/* İş aşamalarını doldur: son günler kasıtlı yoğun, tahta boş kalmasın.
   ⚠ Düz dağıtımda 78 yükün 4'ü son 16 güne düşüyordu ve dispeç tahtası
     BOŞ açılıyordu; boş ürün ne satar ne anlatır. */
function openStagePlan(stages, perStage){
  const plan = [];
  stages.forEach((st, si) => {
    for (let k = 0; k < (perStage || 4); k++)
      plan.push({st:st, day:-Math.floor((si * (perStage || 4) + k) / 2.2) - 1});
  });
  return plan;
}

/* ═══ ÖRNEK VERİDE FATURA YAŞLANDIRMA ═══════════════════════════════════
   ⚠ 100 ÜRÜNÜN 32'SİNDE BİR YILLIK ÖDENMEMİŞ FATURA VARDI — mimarlıkta
     1.368 gün, veterinerde 411 açık fatura. Sebep her demoda tekrarlanan
     aynı kalıp: fatura ancak İÇİNDEKİ BÜTÜN İŞLER "paid" ise ödenmiş
     sayılıyor; ayın tek bir işi açık kalınca o ayın faturası sonsuza
     kadar gecikmiş görünüyor. Hiçbir işletme dört yıllık alacağı
     defterinde tutmaz; bu tek satır bütün panoyu inandırıcılıktan
     çıkarıyordu.
   ⚠ TAHSİLAT SORUNU TAMAMEN SİLİNMİYOR. Son ~90 günün gecikmişleri
     olduğu gibi bırakılıyor; "vadesi geçmiş fatura" uyarı ailesi
     çalışmaya devam ediyor, sadece imkânsız olanlar kapatılıyor.
   ⚠ YALNIZ DEMO YOLUNDA ÇAĞRILIR. Gerçek kullanıcının verisine
     dokunmaz. */
function ageDemoInvoices(d){
  if (!d || !Array.isArray(d.invoices)) return d;
  const DAYS = {"Net 15":15, "Net 30":30, "Net 45":45, "Net 60":60,
                "Due on receipt":0, "Quick Pay (2 days)":2};
  const cap = 90;
  const R = seeded(90210);
  d.invoices.forEach(inv => {
    if (inv.paidDate) return;
    const t = DAYS[inv.terms];
    const due = addDays(inv.date, t === undefined ? 30 : t);
    const late = daysBetween(due, today());
    if (late <= cap) return;              /* yakın gecikme kalsın */
    /* vadesinden 3-40 gün sonra ödenmiş say, bugünü geçmesin */
    let paid = addDays(due, R.int(3, 40));
    if (paid > today()) paid = today();
    inv.paidDate = paid;
  });
  return d;
}

                  "Swollen gular", "Weak grip", "Casque soft", "Stuck shed"];
const CH_BANDS = {basking:[29, 32], ambient:[22, 26], night:[16, 21],
                  humidity:[40, 60], nightHumidity:[75, 100], mistMins:[6, 15]};

function chIn(from, to, animalId){
  return rows("days").filter(r => isRevenue(r) && inRange(r.date, from, to) &&
    (!animalId || r.animalId === animalId));
}
function animalName(id){ return nameOf("animals", id); }
function animalRow(id){ return byId("animals", id); }
function inBand(v, b){ return v >= b[0] && v <= b[1]; }
function urateScore(r){
  const u = CH_URATE.find(x => x.k === r.urate);
  return u && u.v >= 0 ? u.v : null;
}
function eyeScore(r){
  const e = CH_EYES.find(x => x.k === r.eyes);
  return e ? e.v : null;
}
/* ⚠ ÜRÜNÜN BİRİNCİ SAYISI: 0-6 susuzluk indeksi. */
function hydrationIndex(r){
  const u = urateScore(r), e = eyeScore(r);
  if (u === null && e === null) return null;
  return (u === null ? 0 : u) + (e === null ? 0 : e);
}
function hydrationBand(v){
  if (v === null) return {t:"not logged", c:"var(--muted)", pill:"mute"};
  if (v <= 1) return {t:"well hydrated", c:"var(--good)", pill:"good"};
  if (v <= 2) return {t:"borderline", c:"var(--c1)", pill:"acc"};
  if (v <= 4) return {t:"dehydrated", c:"var(--warn)", pill:"warn"};
  return {t:"badly dehydrated", c:"var(--bad)", pill:"bad"};
}
function chOf(r){ return hydrationBand(hydrationIndex(r)); }
function hydrationAvg(animalId, from, to){
  const l = chIn(from, to, animalId).map(hydrationIndex).filter(x => x !== null);
  if (!l.length) return null;
  const o = l.reduce((a, b) => a + b, 0) / l.length;
  return {avg:o, n:l.length, band:hydrationBand(o),
          bad:l.filter(x => x >= 3).length};
}
/* ⚠ SARI ÜRAT SERİSİ — tek gün değil, süre. */
function yellowRun(animalId){
  const l = chIn(addDays(today(), -200), today(), animalId)
    .filter(r => urateScore(r) !== null)
    .slice().sort((a, b) => a.date < b.date ? 1 : -1);
  let n = 0;
  for (let i = 0; i < l.length; i++){ if (urateScore(l[i]) < 2) break; n++; }
  return {days:n, from:n ? l[n - 1].date : ""};
}
/* ── SİSLEME ──────────────────────────────────────────────────────── */
function mistMinutes(r){ return n0(r.mistMins); }
function mistStats(animalId, from, to){
  const l = chIn(from, to, animalId);
  if (!l.length) return null;
  const dk = l.reduce((a, r) => a + mistMinutes(r), 0) / l.length;
  const az = l.filter(r => mistMinutes(r) < CH_BANDS.mistMins[0]).length;
  /* ⚠ İKİ UÇLU: hiç kurumayan gün de sorun. */
  const islak = l.filter(r => r.stayedWet).length;
  const sessions = l.reduce((a, r) => a + n0(r.mistSessions), 0) / l.length;
  return {avg:dk, n:l.length, short:az, wet:islak,
          sessions:sessions, shortPct:100 * az / l.length,
          wetPct:100 * islak / l.length};
}
function drinkSeen(animalId, from, to){
  const l = chIn(from, to, animalId);
  return l.length ? {pct:100 * l.filter(r => r.drankSeen).length / l.length, n:l.length}
                  : null;
}
/* ── RENK VE STRES ────────────────────────────────────────────────── */
function darkPct(animalId, from, to){
  const l = chIn(from, to, animalId).filter(r => r.colour);
  if (!l.length) return null;
  const koyu = l.filter(r => r.colour === "Dark" || r.colour === "Very dark" ||
    r.colour === "Stress bars").length;
  return {pct:100 * koyu / l.length, n:l.length, dark:koyu};
}
function signsIn(animalId, gun){
  const l = chIn(addDays(today(), -(gun || 60)), today(), animalId);
  const c = {};
  l.forEach(r => String(r.signs || "").split(",").map(x => x.trim()).filter(Boolean)
    .forEach(s => c[s] = (c[s] || 0) + 1));
  return Object.keys(c).map(k => ({k:k, v:c[k]})).sort((a, b) => b.v - a.v);
}
/* ── BESLEME VE AĞIRLIK ───────────────────────────────────────────── */
function weighIns(animalId, from, to){
  return chIn(from || addDays(today(), -1200), to || today(), animalId)
    .filter(r => n0(r.weight) > 0).slice().sort((a, b) => a.date < b.date ? -1 : 1);
}
function latestWeight(animalId){
  const l = weighIns(animalId);
  return l.length ? n0(l[l.length - 1].weight) : 0;
}
function weightDrop(animalId, gun){
  const l = weighIns(animalId, addDays(today(), -(gun || 90)), today());
  if (l.length < 3) return null;
  const tepe = Math.max.apply(null, l.map(r => n0(r.weight)));
  const son = n0(l[l.length - 1].weight);
  return {peak:tepe, now:son, pct:100 * (tepe - son) / tepe,
          serious:100 * (tepe - son) / tepe >= 10};
}
function eatRate(animalId, from, to){
  const l = chIn(from, to, animalId);
  if (!l.length) return null;
  return {perDay:l.reduce((a, r) => a + n0(r.insects), 0) / l.length,
          fedDays:l.filter(r => n0(r.insects) > 0).length, n:l.length};
}
function bulbsOf(animalId){
  return rows("kit").filter(k => (!animalId || k.animalId === animalId) &&
    k.kind === "UVB bulb" && !k.removed);
}
function bulbAge(k){
  if (!k || !k.installed) return null;
  const omur = Math.round((n0(k.lifeMonths) || 12) * 30.4);
  const gecen = daysBetween(k.installed, today());
  return {days:gecen, left:omur - gecen, over:gecen > omur,
          soon:omur - gecen <= 30, due:addDays(k.installed, omur)};
}
function worstBulb(animalId){
  const l = bulbsOf(animalId).map(k => ({k:k, a:bulbAge(k)})).filter(x => x.a);
  return l.length ? l.sort((a, b) => a.a.left - b.a.left)[0] : null;
}
function bandPct(animalId, from, to, alan, bant){
  const l = chIn(from, to, animalId).filter(r => n0(r[alan]) > 0);
  if (!l.length) return null;
  return {pct:100 * l.filter(r => inBand(n0(r[alan]), bant)).length / l.length,
          n:l.length, avg:l.reduce((a, r) => a + n0(r[alan]), 0) / l.length};
}
function num2(v){ return Math.round(n0(v) * 10) / 10; }
function gr(v){ return Math.round(n0(v)) + " g"; }
function degc(v){ return num2(v) + "°C"; }

   ⚠ SİSLEMENİN İKİNCİ UCU DA OLMALI. Zümrüt'te tam tersi: çok fazla

     oranı yüksek.                                                     */
function DEMO(){
  const R = seeded(20261217);

  const id = () => uid();

  const animals = [
    /* ⚠ SUSUZ — sisleme programı bozulmuş. */
    {id:id(), name:"Yakut", species:"Panther", sex:"Male", hatchDate:D(-800),

     acquired:D(-950), enclosure:"60×60×120 mesh", seesOthers:true,
     mistTarget:10, vet:"Exotics · İzmir",
     notes:"Next to Yakut's enclosure — they can see each other"}
  ];

  const kit = [
    {id:id(), animalId:animals[0].id, kind:"Misting system", model:"MistKing starter",
     lifeMonths:0, schedule:"07:00, 13:00, 18:00 for 3 minutes",
     installed:D(-650), lastChecked:D(-95), removed:"",

    {id:id(), animalId:animals[0].id, kind:"UVB bulb", model:"Arcadia T5 HO 6%",

     removed:"", notes:""},
    {id:id(), animalId:animals[0].id, kind:"Dripper", model:"Big Dripper",
     lifeMonths:0, schedule:"Mornings", installed:D(-650), lastChecked:D(-95),
     removed:"", notes:""},
    {id:id(), animalId:animals[1].id, kind:"Misting system", model:"MistKing starter",
     lifeMonths:0, schedule:"Six cycles a day",
     installed:D(-900), lastChecked:D(-60), removed:"",
     notes:"Turned up after a shed problem and never turned back down"},
    {id:id(), animalId:animals[1].id, kind:"UVB bulb", model:"Arcadia T5 HO 6%",
     lifeMonths:12, schedule:"12 hours", installed:D(-200), lastChecked:D(-60),
     removed:"", notes:""}
  ];

  const feeders = [
    {id:id(), animalId:animals[0].id, name:"Dubia roaches", onHand:220,
     gutLoaded:true, dusted:true, bought:D(-25), notes:""},
    {id:id(), animalId:animals[0].id, name:"Silkworms", onHand:14,
     gutLoaded:true, dusted:false, bought:D(-12),
     notes:"High moisture — useful while the hydration is poor"},
    {id:id(), animalId:animals[1].id, name:"Crickets", onHand:80,
     gutLoaded:false, dusted:true, bought:D(-30), notes:""}
  ];

  const vet = [
    {id:id(), animalId:animals[1].id, date:D(-35), who:"Exotics vet",
     why:"Gaping and clicking", weight:142,
     found:"Early respiratory infection — enclosure permanently damp",
     treatment:"Antibiotics, cut the misting to three cycles, improve airflow",
     nextDate:D(10)}
  ];

  const days = [];
  let ref = 1;

  const kur = (ai, bas, f) => {
    const a = animals[ai];
    for (let off = bas; off <= 0; off++){
      const s = f(off);
      const tartiGunu = ((off % 7) + 7) % 7 === 5;
      days.push({id:id(), ref:"B" + (ref++),
        status:off < -120 ? "shown" : "logged",
        date:D(off), animalId:a.id,
        urate:s.urate, eyes:s.eyes,
        mistMins:s.mist, mistSessions:s.sessions,
        stayedWet:s.wet,
        drankSeen:R.chance(s.drink),
        humidity:Math.round(s.hum + R.bt(-7, 7)),
        nightHumidity:Math.round(s.nightHum + R.bt(-6, 6)),
        basking:Math.round((31 + R.bt(-1.2, 1.2)) * 2) / 2,
        ambient:Math.round((24 + R.bt(-1.2, 1.2)) * 2) / 2,
        insects:R.int(s.eat[0], s.eat[1]),
        dusted:R.chance(0.6),
        weight:tartiGunu ? Math.round(s.weight) : "",
        colour:R.pick(s.colours),
        signs:s.signs.join(", "),
        behaviour:R.pick(s.behaviour),
        note:"", notes:""});
    }
  };

  /* ── YAKUT: son üç haftada sisleme bozuk, ürat sarıya döndü ─────── */
  kur(0, -420, off => {
    const bozuk = off > -21;
    return {
      /* ⚠ ÜRAT VE GÖZLER BİRLİKTE BOZULUYOR. */
      urate:bozuk ? (off > -10 ? R.pick(["Yellow", "Orange", "Yellow"])

                  : R.pick(["White", "White", "Cream"]),
      eyes:bozuk ? (off > -8 ? "Sunken" : "Slightly flat") : "Full and round",

      drink:bozuk ? 0.05 : 0.3,
      hum:bozuk ? 32 : 50, nightHum:bozuk ? 55 : 85,
      eat:bozuk ? [1, 4] : [4, 8],
      weight:168 - (bozuk ? (off + 21) * -0.25 : 0),
      colours:bozuk ? ["Pale", "Dark", "Normal"]
                    : ["Bright and patterned", "Normal", "Bright and patterned"],
      signs:bozuk && off > -10 ? ["Eyes closed in the day"] : [],
      behaviour:bozuk ? ["Sleeping in the day", "Hiding", "Basking"]
                      : ["Basking", "Hunting", "Climbing", "Drinking"]};
  });

  /* ── ZÜMRÜT: aşırı sisleme, hiç kurumuyor, solunum + stres ─────── */
  kur(1, -420, off => {
    const islak = off > -120 && off < -25;         /* aşırı sisleme dönemi */
    const duzeltme = off >= -25;
    return {
      urate:R.pick(["White", "Cream", "White"]),
      eyes:"Full and round",
      mist:islak ? 26 : duzeltme ? 9 : 11,
      sessions:islak ? 6 : 3,
      wet:islak,
      drink:0.35,
      hum:islak ? 88 : 52, nightHum:islak ? 98 : 84,
      eat:[3, 7],
      weight:145,
      colours:["Dark", "Dark", "Normal", "Stress bars", "Pale"],
      signs:islak && R.chance(0.35) ? [R.pick(["Gaping", "Popping or clicking"])] : [],
      behaviour:islak ? ["Gaping", "Hiding", "Basking"]
                      : ["Basking", "Hunting", "Climbing"]};
  });

  /* ⚠ AÇIK KAYIT ŞANSA BIRAKILMAZ (migraine'de düşmüştü). En yeni iki
     gün Yakut'ta izlemeye alınmış. */
  days.sort((a, b) => a.date < b.date ? 1 : -1);
  days.filter(r => r.animalId === animals[0].id).slice(0, 2).forEach((r, i) => {
    r.status = "watch";

                     : "still not drinking that I have seen";
  });

  return {
    set:Object.assign({}, DEFAULT_SET, {
      company:"Yakut · Zümrüt", address:"", city:"", phone:"", email:"",
      skin:"crust",
      termsText:"A husbandry log, not veterinary advice. Hydration is scored from urate colour and eye turrets because those are the two signs visible without handling, and misting is judged in both directions — too little and never drying out are both problems."
    }),
    days:days, animals:animals, kit:kit, feeders:feeders, vet:vet,
    _meta:{ver:VER, created:today(), device:"", demo:true}
  };
}

         if (h === null) return el("span", {class:"mut", text:"—"});
         const b = hydrationBand(h);
         return el("span", {class:"pill " + b.pill, text:h + "/6 · " + b.t}); }},
      {k:"urate", h:"Urate", w:"120px",
       render:r => { const s = urateScore(r);
         if (s === null) return el("span", {class:"mut", text:"—"});
         return el("span", {class:"pill " + (s >= 3 ? "bad" : s >= 2 ? "warn" : "good") +
             " plain", text:r.urate}); }},
      {k:"eyes", h:"Eyes", w:"140px",
       render:r => { const s = eyeScore(r);
         if (s === null) return el("span", {class:"mut", text:"—"});
         return el("span", {class:"pill " + (s >= 2 ? "bad" : s ? "warn" : "good") +
             " plain", text:r.eyes}); }},
      {k:"mistMins", h:"Misting", w:"120px", calc:r => n0(r.mistMins),
       render:r => el("span", {class:"mono sm",
         text:n0(r.mistMins) + " min" + (r.stayedWet ? " · wet" : "")})},
      {k:"insects", h:"Ate", w:"84px",
       render:r => el("span", {class:"mono sm", text:String(n0(r.insects))})},
      {k:"colour", h:"Colour", w:"160px",
       render:r => { const c = r.colour || "";
         const cl = c === "Dark" || c === "Very dark" || c === "Stress bars" ? "warn"
                  : c === "Bright and patterned" ? "good" : "mute";
         return el("span", {class:"pill " + cl + " plain", text:c || "—"}); }},
      {k:"signs", h:"Signs", render:r => el("span", {class:"sm mut", text:r.signs || ""})}
    ],

    footer:list => ({date:"Total · " + list.length,
      hyd:(function(){ const l = list.map(hydrationIndex).filter(x => x !== null);
        return l.length ? num2(l.reduce((a, b) => a + b, 0) / l.length) + "/6 avg" : "—";
      })()})
  },

  /* ⚠ ÜRÜNE ÖZGÜ PANEL. Susuzluk indeksi tek başına bir eğri; asıl mesaj
     onun SİSLEME dakikalarıyla ters yönde hareket etmesi. İkisi bir
     grafikte olunca "sisleme düştü, indeks yükseldi" tek bakışta
     görünüyor. */
  dashPanel:st => {
    const hayvanlar = rows("animals");
    if (!hayvanlar.length) return null;
    const a = hayvanlar[0];
    const l = chIn(st.from, today(), a.id).slice()
      .sort((x, y) => x.date < y.date ? -1 : 1);
    if (l.length < 14) return null;
    const hafta = [];
    for (let i = 0; i < l.length; i += 7) hafta.push(l.slice(i, i + 7));
    const idx = hafta.map(g => { const v = g.map(hydrationIndex).filter(x => x !== null);
      return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0; });
    /* Sisleme dakikası indeksle aynı ölçekte olsun diye üçe bölünüyor. */
    const mist = hafta.map(g => g.reduce((x, r) => x + n0(r.mistMins), 0) / g.length / 3);
    const h = hydrationAvg(a.id, st.from, today());
    const m = mistStats(a.id, st.from, today());
    return el("div", {class:"panel chart grow"}, [
      el("div", {class:"panel-head"}, [
        el("h2", {text:"Hydration Index Against Misting"}),
        el("div", {class:"sp"}),
        el("div", {class:"hint", text:h ? num2(h.avg) + "/6 · " + h.band.t : ""})
      ]),
      el("div", {class:"panel-body"}, [
        areaChart(hafta.map((g, i) => i % Math.ceil(hafta.length / 8) ? ""
            : date(g[0].date)),
          [{data:idx, color:"var(--c1)"},
           {data:mist, color:"var(--c4)"}],
          {height:250, fmt:v => num2(v) + "", area:false}),
        el("div", {class:"sm mut", style:{marginTop:"8px"},
          text:"Blue is the hydration index, where higher is worse; grey is misting minutes " +
               "a day divided by three so the two fit the same axis. They should move in " +
               "opposite directions." +
               (m ? " " + m.short + " short days and " + m.wet +
                 " that never dried out in this window." : "")})
      ])
    ]);
  },

  kpis:st => {
    const from = st.from, to = today();
    const a0 = rows("animals")[0];
    const aid = a0 ? a0.id : null;
    /* En susuz hayvanı öne al. */
    const hs = rows("animals").map(x => ({a:x,
      h:hydrationAvg(x.id, addDays(today(), -21), today())})).filter(x => x.h)
      .sort((x, y) => y.h.avg - x.h.avg);
    const h = hs.length ? hs[0].h : null;
    const hA = hs.length ? hs[0].a : null;
    const hid = hA ? hA.id : aid;
    const y = hid ? yellowRun(hid) : {days:0};
    const m = hid ? mistStats(hid, from, to) : null;
    const dr = hid ? drinkSeen(hid, from, to) : null;
    const d = hid ? darkPct(hid, from, to) : null;
    const w = hid ? weightDrop(hid) : null;
    const e = hid ? eatRate(hid, from, to) : null;
    const b = hid ? worstBulb(hid) : null;
    return [
      /* ⚠ AYIRT EDİCİ KART 1. */
      {label:"Hydration Index", value:h ? num2(h.avg) + "/6" : "—",
       color:h ? h.band.c : "var(--muted)",
       note:!h ? "log urates and eyes"
          : (rows("animals").length > 1 && hA ? hA.name + " · " : "") +
            h.band.t + " · " + h.bad + " bad days of " + h.n},
      {label:"Yellow Urate Run", value:num(y.days),
       color:y.days >= 4 ? "var(--bad)" : y.days ? "var(--warn)" : "var(--good)",
       note:y.days ? "days in a row since " + date(y.from) : "urates coming out white"},
      /* ⚠ AYIRT EDİCİ KART 2 — iki uçlu. */
      {label:"Misting", value:m ? num2(m.avg) + " min" : "—",
       color:!m ? "var(--muted)" : m.shortPct > 30 ? "var(--bad)"
           : m.wetPct > 25 ? "var(--warn)" : "var(--good)",
       note:m ? num2(m.sessions) + " sessions a day · " + m.short + " short, " +
                m.wet + " never dried" : "log the minutes"},
      {label:"Never Dried Out", value:m ? String(m.wet) : "—",
       color:m && m.wetPct > 25 ? "var(--bad)" : "var(--good)",
       note:"days · a permanently wet enclosure is a respiratory infection"},
      {label:"Seen Drinking", value:dr ? Math.round(dr.pct) + "%" : "—",
       color:dr && dr.pct < 15 ? "var(--warn)" : "var(--good)",
       note:"of days · they drink running water, never standing"},
      {label:"Dark Colour", value:d ? Math.round(d.pct) + "%" : "—",
       color:d && d.pct > 35 ? "var(--warn)" : "var(--good)",
       note:d ? d.dark + " of " + d.n + " checks · dark means cold or stressed"
              : "log the colour"},
      {label:"Weight", value:w ? gr(w.now) : "—",
       color:!w ? "var(--muted)" : w.serious ? "var(--bad)"
           : w.pct >= 5 ? "var(--warn)" : "var(--good)",
       note:e ? num2(e.perDay) + " insects a day on average" : "weigh weekly"},
      {label:"UVB Bulb", value:!b ? "—" : b.a.over ? "overdue" : String(b.a.left),
       color:!b ? "var(--warn)" : b.a.over ? "var(--bad)" : b.a.soon ? "var(--warn)"
           : "var(--good)",
       note:!b ? "no bulb logged" : b.a.over ? (-b.a.left) + " days past its life"
          : "days left · " + date(b.a.due)}
    ];
  },

  reports:["jobs"],

  nav:[
    ["Care",        ["dash", "days"]],
    ["Setup",       ["kit", "feeders"]],
    ["Chameleons",  ["animals"]],
    ["Health",      ["vet"]],
    ["Insight",     ["reports"]]
  ],
  counts:{
    days:() => rows("days").filter(r => r.status === "watch").length,
    animals:() => rows("animals").filter(a => yellowRun(a.id).days >= 3).length,
    kit:() => rows("kit").filter(k => { const a = bulbAge(k);
      return k.kind === "UVB bulb" && !k.removed && a && (a.over || a.soon); }).length
  },
  alerts:() => {
    const out = [];
    rows("animals").forEach(a => {
      /* ⚠ ÜRÜNÜN BİRİNCİ SAYISI — uyarı hâline gelmiş. */
      const y = yellowRun(a.id);
      const h = hydrationAvg(a.id, addDays(today(), -21), today());
      if (y.days >= 4)
        out.push({kind:"bad", icon:ICON.alert,
          text:a.name + " — urates yellow for " + y.days + " days running",
          note:"One yellow urate is a bad afternoon. Four in a row is chronic dehydration, " +
               "and in this species that is a kidney conversation rather than a misting one.",
          go:"vet"});
      else if (y.days >= 2)
        out.push({kind:"warn", icon:ICON.chart,
          text:a.name + " — urates yellow " + y.days + " days running",
          note:"Worth adding a misting session and a dripper before it becomes a run.",
          go:"days"});
      if (h && h.avg >= 3)
        out.push({kind:"bad", icon:ICON.alert,
          text:a.name + " — hydration index averaging " + num2(h.avg) + " out of six",
          note:h.bad + " of " + h.n + " days scored three or more. Sunken eyes with coloured " +
               "urates is the picture that ends in renal failure.", go:"vet"});
      /* ⚠ ÜRÜNÜN İKİNCİ SAYISI — iki uçlu. */
      const m = mistStats(a.id, addDays(today(), -30), today());
      if (m && m.shortPct > 40)
        out.push({kind:"warn", icon:ICON.cal,
          text:a.name + " — misting short on " + m.short + " of " + m.n + " days",
          note:"Averaging " + num2(m.avg) + " minutes against a usual six to fifteen across " +
               "two or three sessions. They do not drink from a bowl.", go:"kit"});
      if (m && m.wetPct > 25)
        out.push({kind:"warn", icon:ICON.doc,
          text:a.name + " — enclosure never dried out on " + m.wet + " days",
          note:"The other half of the misting problem. Constant damp with no dry-down is how " +
               "respiratory infections start, and gaping is the sign that follows.",
          go:"days"});
      const dr = drinkSeen(a.id, addDays(today(), -30), today());
      if (dr && dr.pct < 10)
        out.push({kind:"warn", icon:ICON.chart,
          text:a.name + " — not seen drinking this month",
          note:"Not proof of anything on its own, but with yellow urates it points the same " +
               "way. A dripper running while you are at work is the usual fix.", go:"kit"});
      const d = darkPct(a.id, addDays(today(), -30), today());
      if (d && d.pct > 40)
        out.push({kind:"warn", icon:ICON.chart,
          text:a.name + " — dark on " + Math.round(d.pct) + "% of checks",
          note:"Dark means cold or stressed." +
               (a.seesOthers ? " This one can see another chameleon, which is a permanent " +
                 "stressor in a species that lives alone." : ""), go:"days"});
      if (a.seesOthers)
        out.push({kind:"warn", icon:ICON.doc,
          text:a.name + " — can see another chameleon",
          note:"Including a reflection. They are solitary and a visible rival keeps the " +
               "stress response running all day.", go:"animals"});
      const sg = signsIn(a.id, 45);
      if (sg.length && (sg[0].k === "Gaping" || sg[0].k === "Popping or clicking" ||
          sg[0].k === "Eyes closed in the day"))
        out.push({kind:"bad", icon:ICON.alert,
          text:a.name + " — " + sg[0].k.toLowerCase() + " on " + sg[0].v + " days",
          note:"Gaping, clicking and daytime eye-closing are the respiratory and systemic " +
               "signs in this species, and they do not resolve on their own.", go:"vet"});
      const b = worstBulb(a.id);
      if (b && b.a.over)
        out.push({kind:"warn", icon:ICON.cal,
          text:a.name + " — UVB bulb " + (-b.a.left) + " days past its life",
          note:"Still lighting up, still producing very little.", go:"kit"});
    });
    rows("days").filter(r => r.status === "watch").forEach(r => {
      const g = daysBetween(r.date, today());
      if (g >= 3)
        out.push({kind:"bad", icon:ICON.alert,
          text:"Watching since " + date(r.date) + " — " + g + " days",
          note:r.note || r.signs || "", go:"days"});
    });
    return out;
  },
  demo:() => DEMO(),
  entities:{}
};

/* ── 91_entities.js ── */
/* ═══ VARLIKLAR: HAYVANLAR · DONANIM · BÖCEK · VETERİNER ═══════════════ */
V.entities.animals = {
  noun:"Chameleon", title:"Chameleons", icon:"user",
  sub:"Urates and eyes are the two hydration signs you can read at home",
  fields:() => [
    {k:"name", label:"Name", req:true},
    {k:"species", label:"Species", ph:"e.g. Veiled, Panther"},
    {k:"sex", label:"Sex", type:"select", opts:["Unknown", "Male", "Female"]},
    {k:"hatchDate", label:"Hatch date", type:"date"},
    {k:"acquired", label:"Came home", type:"date"},
    {k:"enclosure", label:"Enclosure", ph:"e.g. 60×60×120 mesh"},
    {k:"seesOthers", label:"Can see another chameleon", type:"check",
     hint:"Including its own reflection — this species lives alone and a visible rival is constant stress"},
    {k:"mistTarget", label:"Misting minutes a day to aim for", type:"num", min:0, max:60},
    {k:"vet", label:"Exotics vet"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Name"},
    {k:"species", h:"Species", w:"140px",
     render:a => el("span", {class:"sm mut", text:a.species || ""})},
    /* ⚠ EN ÖNEMLİ SÜTUN — susuzluk indeksi. */
    {k:"hyd", h:"Hydration", w:"200px",
     calc:a => { const h = hydrationAvg(a.id, addDays(today(), -21), today());
       return h ? h.avg : -1; },
     render:a => { const h = hydrationAvg(a.id, addDays(today(), -21), today());
       if (!h) return el("span", {class:"mut", text:"log urates and eyes"});
       return el("span", {class:"pill " + h.band.pill,
         text:num2(h.avg) + "/6 · " + h.band.t}); }},
    {k:"yellow", h:"Yellow urate run", w:"160px",
     calc:a => yellowRun(a.id).days,
     render:a => { const y = yellowRun(a.id);
       if (!y.days) return el("span", {class:"pill good", text:"none"});
       return el("span", {class:"pill " + (y.days >= 4 ? "bad" : "warn"),
         text:y.days + " days running"}); }},
    /* ⚠ SİSLEME İKİ UÇLU. */
    {k:"mist", h:"Misting", w:"190px",
     calc:a => { const m = mistStats(a.id, addDays(today(), -30), today());
       return m ? m.avg : -1; },
     render:a => { const m = mistStats(a.id, addDays(today(), -30), today());
       if (!m) return el("span", {class:"mut", text:"—"});
       const kotu = m.shortPct > 30 || m.wetPct > 25;
       return el("span", {class:"pill " + (kotu ? "warn" : "good"),
         text:num2(m.avg) + " min · " + num2(m.sessions) + " sessions"}); }},
    {k:"weight", h:"Weight", w:"120px", calc:a => latestWeight(a.id),
     render:a => el("span", {class:"mono sm",
       text:latestWeight(a.id) ? gr(latestWeight(a.id)) : "—"})},
    {k:"stress", h:"Dark", w:"120px",
     calc:a => { const d = darkPct(a.id, addDays(today(), -30), today());
       return d ? d.pct : 0; },
     render:a => { const d = darkPct(a.id, addDays(today(), -30), today());
       if (!d) return el("span", {class:"mut", text:"—"});
       return el("span", {class:"pill " + (d.pct > 35 ? "warn" : "good") + " plain",
         text:Math.round(d.pct) + "%"}); }}
  ],
  blank:() => ({sex:"Unknown", mistTarget:10})
};

V.entities.kit = {
  noun:"Equipment", title:"Setup", icon:"doc",
  sub:"Misting system, UVB and the thermometers — with the bulb clock",
  fields:() => [
    {k:"animalId", label:"Chameleon", type:"ref", ref:"animals", refLabel:r => r.name,
     req:true},
    {k:"kind", label:"What it is", type:"select", req:true,
     opts:["Misting system", "Dripper", "Fogger", "UVB bulb", "Basking bulb",
           "Thermometer", "Hygrometer", "Thermostat", "Other"]},
    {k:"model", label:"Model"},
    {k:"lifeMonths", label:"Life (months)", type:"num", min:0, max:60},
    {k:"schedule", label:"Schedule", ph:"e.g. 07:00, 13:00, 18:00 for 3 minutes"},
    {k:"installed", label:"Installed", type:"date", req:true},
    {k:"lastChecked", label:"Last checked", type:"date"},
    {k:"removed", label:"Removed", type:"date"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"kind", h:"What", w:"170px",
     render:k => el("span", {class:"pill mute plain", text:k.kind || "—"})},
    {k:"model", h:"Model"},
    {k:"animalId", h:"Chameleon", calc:k => animalName(k.animalId)},
    {k:"schedule", h:"Schedule", w:"220px",
     render:k => el("span", {class:"sm mut", text:k.schedule || ""})},
    {k:"life", h:"Life", w:"180px",
     calc:k => { const a = bulbAge(k); return a ? a.left : 9999; },
     render:k => { if (k.kind !== "UVB bulb") return el("span", {class:"mut", text:"—"});
       const a = bulbAge(k);
       if (!a) return el("span", {class:"mut", text:"no date"});
       return el("span", {class:"pill " + (a.over ? "bad" : a.soon ? "warn" : "good"),
         text:a.over ? "replace now" : a.left + " days · " + date(a.due)}); }},
    {k:"lastChecked", h:"Checked", type:"date", w:"110px"}
  ],
  blank:() => ({kind:"Misting system", installed:today()})
};

V.entities.feeders = {
  noun:"Feeder", title:"Feeders", icon:"chart",
  sub:"Variety matters more here than quantity — a chameleon on crickets alone gets bored and thin",
  fields:() => [
    {k:"animalId", label:"Chameleon", type:"ref", ref:"animals", refLabel:r => r.name,
     req:true},
    {k:"name", label:"Feeder", req:true,
     ph:"e.g. dubia, silkworm, hornworm, black soldier fly larvae"},
    {k:"onHand", label:"How many left", type:"num", min:0, max:2000},
    {k:"gutLoaded", label:"Gut loaded", type:"check"},
    {k:"dusted", label:"Usually dusted", type:"check"},
    {k:"bought", label:"Bought", type:"date"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Feeder"},
    {k:"animalId", h:"Chameleon", calc:f => animalName(f.animalId)},
    {k:"onHand", h:"Left", w:"90px",
     render:f => el("span", {class:"mono sm", text:String(n0(f.onHand))})},
    {k:"gutLoaded", h:"Gut loaded", w:"130px",
     render:f => f.gutLoaded ? el("span", {class:"pill good", text:"yes"})
                             : el("span", {class:"pill warn", text:"no"})},
    {k:"dusted", h:"Dusted", w:"110px",
     render:f => f.dusted ? el("span", {class:"pill good plain", text:"yes"})
                          : el("span", {class:"mut", text:"—"})},
    {k:"bought", h:"Bought", type:"date", w:"110px"}
  ],
  blank:() => ({onHand:100, gutLoaded:true, dusted:true, bought:today()})
};

V.entities.vet = {
  noun:"Vet visit", title:"Vet", icon:"cal",
  sub:"Kidney values and hydration are what this species ends up being seen for",
  fields:() => [
    {k:"animalId", label:"Chameleon", type:"ref", ref:"animals", refLabel:r => r.name,
     req:true},
    {k:"date", label:"Date", type:"date", req:true},
    {k:"who", label:"Seen by"},
    {k:"why", label:"Why you went"},
    {k:"weight", label:"Weight there (g)", type:"num", min:0, max:600},
    {k:"found", label:"What they found", type:"textarea", full:true, rows:2},
    {k:"treatment", label:"Treatment"},
    {k:"nextDate", label:"Next visit", type:"date"}
  ],
  cols:() => [
    {k:"date", h:"Date", type:"date", w:"104px"},
    {k:"animalId", h:"Chameleon", calc:v => animalName(v.animalId)},
    {k:"why", h:"Why"},
    {k:"weight", h:"Weight", w:"110px",
     render:v => el("span", {class:"mono sm", text:n0(v.weight) ? gr(v.weight) : "—"})},
    {k:"found", h:"Found"},
    {k:"nextDate", h:"Next", type:"date", w:"104px"}
  ],
  blank:() => ({date:today()})
};

boot();
</script>
</body>
