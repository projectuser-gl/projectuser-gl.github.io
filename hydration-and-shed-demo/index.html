/* ═══ KABUK + BİLEŞENLER ════════════════════════════════════════════════
   ⚠ ARALIK LAYOUT'TAN GELİR. Kardeş grupları flex/grid + gap ile diz;
     eleman başına margin verme (sessizce çakışıyor ya da ikiye katlanıyor).
   ⚠ Geniş içerik (tablo, grafik) KENDİ kabında overflow-x:auto olur;
     gövde asla yana kaymaz.                                              */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:400 13.5px/1.5 var(--f-ui);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── KABUK ─────────────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
#app.rail-collapsed{grid-template-columns:56px 1fr}

/* ── SOL RAY ───────────────────────────────────────────────────────── */
#rail{
  background:var(--rail);display:flex;flex-direction:column;
  border-right:1px solid var(--rail-hair);overflow:hidden;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:14px 14px 12px;
  border-bottom:1px solid var(--rail-hair);min-height:58px;
}
.brand-mark{
  width:30px;height:30px;border-radius:7px;flex:0 0 auto;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:700 13px/1 var(--f-display);
  letter-spacing:.02em;overflow:hidden;
}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.brand-name{
  font:700 13.5px/1.15 var(--f-display);color:var(--rail-active);
  letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-sub{
  font-size:10px;color:var(--rail-ink);opacity:.75;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;
}
.rail-collapsed .brand-txt{display:none}

#nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 4px}
#nav::-webkit-scrollbar{width:8px}
#nav::-webkit-scrollbar-thumb{background:var(--rail-hair);border-radius:4px}
.nav-group{
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--rail-ink);opacity:.5;padding:12px 16px 5px;font-weight:600;
}
.rail-collapsed .nav-group{
  font-size:0;padding:8px 16px 4px;
}
.rail-collapsed .nav-group::after{
  content:"";display:block;height:1px;background:var(--rail-hair);
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 16px;border:0;background:none;cursor:pointer;
  color:var(--rail-ink);text-align:left;font-size:12.8px;
  border-left:2px solid transparent;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--rail-active)}
.nav-item.on{
  background:rgba(255,255,255,.08);color:var(--rail-active);
  border-left-color:var(--accent);font-weight:500;
}
.nav-item .ic{flex:0 0 16px;width:16px;height:16px;opacity:.9}
.nav-item .lbl{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.nav-item .cnt{
  font:500 10.5px/1 var(--f-num);padding:2.5px 5px;border-radius:20px;
  background:rgba(255,255,255,.10);color:var(--rail-ink);
  font-variant-numeric:tabular-nums;
}
.nav-item.on .cnt{background:var(--accent);color:var(--accent-ink)}
.rail-collapsed .nav-item{justify-content:center;padding:8px 0}
.rail-collapsed .nav-item .lbl,.rail-collapsed .nav-item .cnt{display:none}

.rail-foot{border-top:1px solid var(--rail-hair);padding:8px}
.sync-chip{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;
  border-radius:var(--r);border:0;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.05);color:var(--rail-ink);font-size:11.5px;
}
.sync-chip:hover{background:rgba(255,255,255,.09)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync-dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.sync-dot.off{background:var(--warn)}
.sync-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-collapsed .sync-txt{display:none}
.rail-collapsed .sync-chip{justify-content:center}

/* ── ÜST ÇUBUK ─────────────────────────────────────────────────────── */
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--ground)}
#top{
  display:flex;align-items:center;gap:12px;padding:0 18px;min-height:58px;
  background:var(--paper);border-bottom:1px solid var(--hair);flex:0 0 auto;
}
.top-title{display:flex;flex-direction:column;gap:1px;min-width:0;flex:0 0 auto}
.top-title h1{
  margin:0;font:700 17px/1.2 var(--f-display);letter-spacing:-.005em;
  white-space:nowrap;
}
.top-title .sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.top-sp{flex:1}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r);
  border:1px solid transparent;background:none;color:var(--ink2);cursor:pointer;
}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

/* ── İÇERİK ────────────────────────────────────────────────────────── */
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px}
#view::-webkit-scrollbar{width:11px;height:11px}
#view::-webkit-scrollbar-thumb{background:var(--hair);border-radius:6px;border:3px solid var(--ground)}
#view::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g23,.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g2,.g4{grid-template-columns:minmax(0,1fr)}}

/* ═══ TASARIM DEĞİŞKENLİĞİ ══════════════════════════════════════════════
   ⚠ 100 ÜRÜN BİRBİRİNİN KOPYASI OLAMAZ. Yalnız renk değiştirmek yetmiyor —
     kilise uygulaması oto yıkamaya benzememeli. Beş bağımsız eksen:
       shell    : kabuk düzeni      (rail · light · topbar · split)
       surface  : yüzey işlemi      (card · flat · outline · soft)
       type     : yazı eşleşmesi    (dikeyin kendi fontları)
       density  : sıkılık           (compact · regular · relaxed)
       dash     : pano kompozisyonu (kpi · hero · split · board)
     Beşi çarpılınca gerçekten farklı ürünler çıkıyor; her dikey kendi
     kombinasyonunu ALANINA GÖRE seçiyor, rastgele değil.
   ⚠ Her eksen BAĞIMSIZ olmalı. Birbirine bağlarsan kombinasyon sayısı
     düşer ve yine birbirine benzemeye başlar.                            */

/* ── YOĞUNLUK ──────────────────────────────────────────────────────── */
[data-density="compact"]{
  --pad:10px; --pad-lg:12px; --gap:10px; --row:7px;
  --fs:12.5px; --fs-sm:11px; --fs-h:12.5px; --fs-kpi:21px; --rail-w:212px;
}
[data-density="regular"]{
  --pad:14px; --pad-lg:16px; --gap:14px; --row:8px;
  --fs:13.5px; --fs-sm:11.5px; --fs-h:13px; --fs-kpi:24px; --rail-w:236px;
}
[data-density="relaxed"]{
  --pad:18px; --pad-lg:22px; --gap:18px; --row:11px;
  --fs:14px; --fs-sm:12px; --fs-h:14px; --fs-kpi:28px; --rail-w:258px;
}

/* ── YÜZEY İŞLEMİ ──────────────────────────────────────────────────── */
[data-surface="card"]{
  --r:6px; --r-lg:10px; --panel-bd:1px solid var(--hair);
  --panel-sh:var(--shadow); --panel-bg:var(--paper);
  --head-bd:1px solid var(--hair2); --kpi-bar:3px;
}
[data-surface="flat"]{
  --r:0px; --r-lg:0px; --panel-bd:0; --panel-sh:none;
  --panel-bg:var(--paper); --head-bd:2px solid var(--ink);
  --kpi-bar:0px;
}
[data-surface="outline"]{
  --r:3px; --r-lg:4px; --panel-bd:1.5px solid var(--ink);
  --panel-sh:none; --panel-bg:var(--paper);
  --head-bd:1.5px solid var(--ink); --kpi-bar:0px;
}
[data-surface="soft"]{
  --r:10px; --r-lg:18px; --panel-bd:0;
  --panel-sh:0 1px 2px rgba(16,20,26,.04), 0 6px 20px rgba(16,20,26,.06);
  --panel-bg:var(--paper); --head-bd:0; --kpi-bar:0px;
}
[data-surface="soft"] .panel-head{ padding-bottom:2px }
[data-surface="flat"] .panel + .panel{ border-top:1px solid var(--hair) }
[data-surface="outline"] .kpi{ border-width:1.5px; border-color:var(--ink) }
[data-surface="soft"] .kpi{ background:var(--sunk) }

/* KPI'nin sol şeridi yalnız "card"da var; diğerlerinde başka bir işaret */
.kpi::before{ width:var(--kpi-bar, 3px) }
[data-surface="soft"] .kpi::before,
[data-surface="flat"] .kpi::before,
[data-surface="outline"] .kpi::before{ display:none }
[data-surface="soft"] .kpi-label,
[data-surface="outline"] .kpi-label{ color:var(--kc, var(--accent)) }
[data-surface="flat"] .kpi{ border:0; border-top:3px solid var(--kc, var(--accent)) }

/* ── KABUK DÜZENİ ──────────────────────────────────────────────────── */
/* rail: koyu sol ray (varsayılan) — 02_shell.css'te */
[data-shell="light"] #rail{
  background:var(--paper); border-right:1px solid var(--hair);
}
[data-shell="light"] .brand{ border-bottom:1px solid var(--hair) }
[data-shell="light"] .brand-name{ color:var(--ink) }
[data-shell="light"] .brand-sub{ color:var(--muted) }
[data-shell="light"] .nav-group{ color:var(--muted); opacity:1 }
[data-shell="light"] .nav-item{ color:var(--ink2) }
[data-shell="light"] .nav-item:hover{ background:var(--sunk); color:var(--ink) }
[data-shell="light"] .nav-item.on{ background:var(--accent-soft); color:var(--accent) }
[data-shell="light"] .nav-item .cnt{ background:var(--sunk); color:var(--muted) }
[data-shell="light"] .rail-foot{ border-top:1px solid var(--hair) }
[data-shell="light"] .sync-chip{ background:var(--sunk); color:var(--ink2) }
[data-shell="light"] .sync-chip:hover{ background:var(--hair2) }

/* topbar: yatay menü, ray yok — geniş tablolu ürünler için */
[data-shell="topbar"] #app{ grid-template-columns:1fr; grid-template-rows:auto 1fr }
[data-shell="topbar"] #rail{
  flex-direction:row; align-items:center; gap:4px; overflow-x:auto;
  border-right:0; border-bottom:1px solid var(--rail-hair); padding:0 12px;
}
[data-shell="topbar"] .brand{ border-bottom:0; padding:10px 14px 10px 0; min-height:0 }
[data-shell="topbar"] #nav{
  display:flex; align-items:center; gap:2px; padding:0; overflow-x:auto; flex:1;
}
[data-shell="topbar"] .nav-group{ display:none }
[data-shell="topbar"] .nav-item{
  border-left:0; border-bottom:2px solid transparent; padding:14px 11px; white-space:nowrap;
}
[data-shell="topbar"] .nav-item.on{ border-bottom-color:var(--accent); background:none }
[data-shell="topbar"] .rail-foot{ border-top:0; padding:0 0 0 8px }
[data-shell="topbar"] #main{ min-height:0 }
[data-shell="topbar"] #top{ background:var(--ground); border-bottom:1px solid var(--hair) }
[data-shell="topbar"] .rail-collapsed{ grid-template-columns:1fr }

/* split: dar simge rayı — çok sekmeli ürünlerde ekranı açıyor */
[data-shell="split"] #app{ grid-template-columns:62px 1fr }
[data-shell="split"] .brand-txt,
[data-shell="split"] .nav-item .lbl,
[data-shell="split"] .nav-item .cnt,
[data-shell="split"] .sync-txt{ display:none }
[data-shell="split"] .nav-item{ justify-content:center; padding:11px 0 }
[data-shell="split"] .nav-group{ font-size:0; padding:7px 14px 4px }
[data-shell="split"] .nav-group::after{ content:""; display:block; height:1px; background:var(--rail-hair) }
[data-shell="split"] .brand{ justify-content:center; padding:14px 0 }
[data-shell="split"] .sync-chip{ justify-content:center }

/* ── YOĞUNLUK DEĞİŞKENLERİNİ BAĞLA ─────────────────────────────────── */
body{ font-size:var(--fs) }
#app{ grid-template-columns:var(--rail-w) 1fr }
.panel{ border:var(--panel-bd); box-shadow:var(--panel-sh);
        background:var(--panel-bg); border-radius:var(--r-lg) }
.panel-head{ padding:calc(var(--pad) - 2px) var(--pad); border-bottom:var(--head-bd) }
.panel-head h2{ font-size:var(--fs-h) }
.panel-body{ padding:var(--pad) }
.stack{ gap:var(--gap) }
.grid{ gap:var(--gap) }
#view{ padding:var(--pad-lg) }
.kpi{ padding:calc(var(--pad) - 1px) var(--pad); border-radius:var(--r-lg) }
.kpi-val{ font-size:var(--fs-kpi) }
.sm,.kpi-note,.hint{ font-size:var(--fs-sm) }
table.dt td{ padding:var(--row) 10px }
table.dt th{ padding:calc(var(--row) + 1px) 10px }
.btn{ border-radius:var(--r) }
.inp{ border-radius:var(--r) }
.modal{ border-radius:var(--r-lg) }

/* ═══ MOBİL / DAR EKRAN ═════════════════════════════════════════════════
   ⚠ ÜRÜN TARAYICIDA ÇALIŞIYOR — telefondan da açılacak. Sabit 236px'lik
     ray ve üç sütunlu ızgara 390px ekranda ürünü kullanılamaz yapıyordu.
   ⚠ RAY GİZLENMEZ, KAYAR PANEL OLUR. Sadece display:none yapmak menüyü
     tamamen erişilemez bırakıyor.                                        */

@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g23,.g32{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:900px){
  #app,[data-shell="topbar"] #app,[data-shell="split"] #app{
    grid-template-columns:1fr; grid-template-rows:1fr;
  }
  /* ray: ekranın üstüne kayan panel */
  #rail{
    position:fixed; inset:0 auto 0 0; width:min(280px,84vw); z-index:80;
    transform:translateX(-102%); transition:transform .2s cubic-bezier(.2,.9,.3,1);
    flex-direction:column; border-right:1px solid var(--rail-hair);
    box-shadow:var(--shadow-lg);
  }
  body.nav-open #rail{transform:none}
  body.nav-open::after{
    content:""; position:fixed; inset:0; z-index:70;
    background:rgba(9,12,17,.45); backdrop-filter:blur(1px);
  }
  [data-shell="topbar"] #rail,[data-shell="split"] #rail{
    flex-direction:column; padding:0; overflow:visible;
  }
  [data-shell="topbar"] #nav{flex-direction:column; align-items:stretch; padding:8px 0}
  [data-shell="topbar"] .nav-group{display:block}
  [data-shell="topbar"] .nav-item{
    border-bottom:0; border-left:2px solid transparent; padding:9px 16px;
  }
  [data-shell="topbar"] .nav-item.on{border-left-color:var(--accent)}
  [data-shell="split"] .brand-txt,[data-shell="split"] .nav-item .lbl,
  [data-shell="split"] .nav-item .cnt,[data-shell="split"] .sync-txt{display:block}
  [data-shell="split"] .nav-item{justify-content:flex-start; padding:9px 16px}
  [data-shell="split"] .nav-group{font-size:9.5px; padding:12px 16px 5px}
  [data-shell="split"] .brand{justify-content:flex-start; padding:14px}
  .rail-collapsed .brand-txt,.rail-collapsed .nav-item .lbl,
  .rail-collapsed .nav-item .cnt,.rail-collapsed .sync-txt{display:block}
  .rail-collapsed .nav-item{justify-content:flex-start; padding:9px 16px}
  #navToggle{display:grid}
  #top{padding:0 12px; gap:8px}
  .top-title h1{font-size:15.5px}
  .top-title .sub{display:none}
  #view{padding:11px}
  .stack,.grid{gap:11px}
}
@media (min-width:901px){ #navToggle{display:none} }

@media (max-width:640px){
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .modal,.modal.wide,.modal.slim{width:100%; max-height:100vh; border-radius:0}
  .scrim{padding:0; place-items:stretch}
  .modal-body{padding:13px}
  .kpi-val{font-size:20px}
  .toolbar{gap:6px; padding:9px}
  .search{flex:1 1 100%}
  .kb-col{flex:0 0 84vw}
  #toasts{left:12px; right:12px; bottom:12px}
  .toast{max-width:none}
  .panel-head{flex-wrap:wrap}
  /* ⚠ Tablolar dar ekranda kendi kabında kayar; gövde ASLA yana kaymaz. */
  .tw{-webkit-overflow-scrolling:touch}
}

/* ═══ SÜTUN BOŞLUĞU ═════════════════════════════════════════════════════
   ⚠ IZGARADA KISA SÜTUN ALTINDA BOŞLUK BIRAKIYORDU. `hero` panosunda sol
     sütun (KPI + grafik) sağdakinden (halka + gösterge) kısa kalınca
     "Revenue by Month"un altında koca bir boşluk kalıyordu — ekran yarım
     görünüyor ve listing görselini bozuyor.
   ⚠ ÇÖZÜM: ızgara hücreleri eşit yükseklikte, grafik paneli kalan yeri
     DOLDURUYOR. SVG'ye yüzde yükseklik verilebilmesi için kabın flex
     olması ve `min-height:0` olması şart — yoksa taşıyor.               */
.grid > .panel,
.grid > .stack{ height:100%; min-height:0 }
.stack{ display:flex; flex-direction:column }
.panel.grow{ flex:1; min-height:0 }
.panel.chart{ display:flex; flex-direction:column }
.panel.chart > .panel-body{
  flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;
}
.panel.chart > .panel-body > svg{ height:100%; min-height:170px; flex:1 }
/* halka ve gösterge ortalansın, gerilmesin */
.panel.chart.fixed > .panel-body > svg{ flex:0 0 auto; height:auto }

/* ═══ BİLEŞENLER ════════════════════════════════════════════════════════ */

/* ── PANEL ─────────────────────────────────────────────────────────── */
.panel{
  background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;
}
.panel-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--hair2);flex:0 0 auto;
}
.panel-head h2{
  margin:0;font:600 13px/1.2 var(--f-display);letter-spacing:.01em;
}
.panel-head .hint{font-size:11px;color:var(--muted)}
.panel-head .sp{flex:1}
.panel-body{padding:14px;min-width:0}
.panel-body.flush{padding:0}

/* ── KPI KARTI. Değer + delta + kıvılcım; hepsi aynı hizada.           */
.kpi{
  background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:13px 14px;display:flex;flex-direction:column;gap:7px;
  box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;
}
.kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--kc,var(--accent));opacity:.9;
}
.kpi-label{
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;
}
.kpi-val{
  font:600 24px/1.05 var(--f-display);font-variant-numeric:tabular-nums;
  letter-spacing:-.015em;white-space:nowrap;
}
.kpi-foot{display:flex;align-items:center;gap:7px;min-height:16px}
.kpi-delta{
  font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:3px;padding:2.5px 5px;border-radius:4px;
}
.kpi-delta.up{color:var(--good);background:var(--good-soft)}
.kpi-delta.down{color:var(--bad);background:var(--bad-soft)}
.kpi-delta.flat{color:var(--muted);background:var(--sunk)}
.kpi-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-spark{margin-left:auto;flex:0 0 auto;opacity:.85}

/* ── DURUM ROZETİ. Renk + biçim birlikte; yalnız renge güvenme.        */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;
  border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;
  border:1px solid transparent;line-height:1.45;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.plain::before{display:none}
.pill.good{color:var(--good);background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 22%,transparent)}
.pill.bad {color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.info{color:var(--info);background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.pill.mute{color:var(--muted);background:var(--sunk);border-color:var(--hair)}
.pill.acc {color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}

/* ── DÜĞMELER ──────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  border:1px solid var(--hair);background:var(--paper);color:var(--ink);
  font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--sunk);border-color:var(--muted)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4.5px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── FORM ──────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label{
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
.inp{
  width:100%;padding:7px 9px;border-radius:var(--r);
  border:1px solid var(--hair);background:var(--paper);color:var(--ink);
  font-size:13px;transition:border-color .12s,box-shadow .12s;
}
.inp:hover{border-color:var(--muted)}
.inp:focus{
  outline:0;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);
}
.inp.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
select.inp{cursor:pointer;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}

/* ── TABLO. Yapışkan başlık, saç teli ayraç, rakamlar hizalı.          */
.tw{overflow:auto;max-height:100%;border-radius:0}
.tw::-webkit-scrollbar{width:11px;height:11px}
.tw::-webkit-scrollbar-thumb{background:var(--hair);border-radius:6px;border:3px solid var(--paper)}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.dt th{
  position:sticky;top:0;z-index:2;background:var(--paper);
  text-align:left;font:600 10.5px/1.3 var(--f-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--hair);white-space:nowrap;
  cursor:pointer;user-select:none;
}
table.dt th:hover{color:var(--ink)}
table.dt th.no-sort{cursor:default}
table.dt th.no-sort:hover{color:var(--muted)}
table.dt th .ar{opacity:0;margin-left:3px;font-size:9px}
table.dt th.asc .ar,table.dt th.desc .ar{opacity:1;color:var(--accent)}
table.dt th.desc .ar{display:inline-block;transform:rotate(180deg)}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--hair2);vertical-align:middle}
table.dt tbody tr{transition:background .1s}
table.dt tbody tr:hover{background:var(--sunk)}
table.dt tbody tr.sel{background:var(--accent-soft)}
table.dt td.n,table.dt th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.dt th.n{font-family:var(--f-ui)}
table.dt td.strong{font-weight:600}
table.dt td.good{color:var(--good)}
table.dt td.bad{color:var(--bad)}
table.dt td.act{width:1%;white-space:nowrap;text-align:right}
table.dt tfoot td{
  padding:9px 10px;border-top:2px solid var(--hair);font-weight:600;
  background:var(--sunk);position:sticky;bottom:0;
}
.cell-2{display:flex;flex-direction:column;gap:1px;min-width:0}
.cell-2 .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-2 .b{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── ARAÇ ÇUBUĞU (tablo üstü) ──────────────────────────────────────── */
.toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--hair2);flex-wrap:wrap;
}
.search{position:relative;flex:0 1 260px;min-width:150px}
.search .inp{padding-left:29px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.seg button{
  padding:5.5px 10px;border:0;background:var(--paper);color:var(--ink2);
  cursor:pointer;font-size:11.5px;border-right:1px solid var(--hair);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunk)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}

/* ── BOŞ DURUM ─────────────────────────────────────────────────────── */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:52px 20px;text-align:center;color:var(--muted);
}
.empty svg{opacity:.32}
.empty h3{margin:0;font:600 14px/1.3 var(--f-display);color:var(--ink2)}
.empty p{margin:0;font-size:12.5px;max-width:340px;line-height:1.55}

/* ── MODAL ─────────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(9,12,17,.5);backdrop-filter:blur(2px);
  display:grid;place-items:center;z-index:70;padding:22px;
  animation:fade .13s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);width:min(780px,100%);max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:pop .16s cubic-bezier(.2,.9,.3,1);
}
.modal.wide{width:min(1080px,100%)}
.modal.slim{width:min(460px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--hair);flex:0 0 auto;
}
.modal-head h2{margin:0;font:700 15px/1.2 var(--f-display)}
.modal-head .sub{font-size:11.5px;color:var(--muted)}
.modal-body{padding:16px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{
  display:flex;gap:8px;justify-content:flex-end;align-items:center;
  padding:12px 16px;border-top:1px solid var(--hair);background:var(--sunk);flex:0 0 auto;
}
.modal-foot .sp{flex:1}

/* ── SEKMELER ──────────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);padding:0 4px;flex-wrap:wrap}
.tabs button{
  padding:9px 13px;border:0;background:none;cursor:pointer;color:var(--muted);
  font-size:12.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── BİLDİRİM ──────────────────────────────────────────────────────── */
#toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;
  flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r);
  background:var(--paper);border:1px solid var(--hair);box-shadow:var(--shadow-lg);
  font-size:12.5px;min-width:210px;max-width:360px;
  animation:slide .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.ok{border-left:3px solid var(--good)}
.toast.err{border-left:3px solid var(--bad)}
.toast.info{border-left:3px solid var(--info)}

/* ── KANBAN ────────────────────────────────────────────────────────── */
.kb{display:flex;gap:12px;overflow-x:auto;padding:2px;align-items:flex-start;min-height:0}
.kb::-webkit-scrollbar{height:11px}
.kb::-webkit-scrollbar-thumb{background:var(--hair);border-radius:6px;border:3px solid var(--ground)}
.kb-col{
  min-height:0;
  flex:0 0 268px;background:var(--sunk);border:1px solid var(--hair);
  border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:100%;
}
.kb-col.drop{border-color:var(--accent);background:var(--accent-soft)}
.kb-head{
  display:flex;align-items:center;gap:7px;padding:10px 12px;
  border-bottom:1px solid var(--hair);
}
.kb-head .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.kb-head .t{font:600 11.5px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.kb-head .n{margin-left:auto;font:500 11px/1 var(--f-num);color:var(--muted);
  font-variant-numeric:tabular-nums}
.kb-list{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:52px}
.kb-card{
  background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);
  padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 1px 1px rgba(16,20,26,.04);
}
.kb-card:active{cursor:grabbing}
.kb-card.drag{opacity:.4}
.kb-card .r1{display:flex;align-items:center;gap:6px}
.kb-card .ref{font:500 10.5px/1 var(--f-num);color:var(--muted)}
.kb-card .amt{margin-left:auto;font:600 12px/1 var(--f-num);
  font-variant-numeric:tabular-nums}
.kb-card .r2{font-size:12px;font-weight:500;line-height:1.35}
.kb-card .r3{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}

/* ── ÇEŞİTLİ ───────────────────────────────────────────────────────── */
.hr{height:1px;background:var(--hair);border:0;margin:0}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.sm{font-size:11.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{
  width:74px;border:2px solid var(--hair);border-radius:var(--r);cursor:pointer;
  overflow:hidden;background:var(--paper);padding:0;
}
.swatch.on{border-color:var(--accent)}
.swatch .pv{height:32px;display:flex}
.swatch .pv i{flex:1}
.swatch .nm{font-size:10px;padding:4px 2px;color:var(--ink2);text-align:center;
  text-transform:capitalize}

/* ── YAZDIRMA ──────────────────────────────────────────────────────── */
@media print{
  #rail,#top,#toasts,.no-print{display:none!important}
  #app{display:block;height:auto}
  #view{overflow:visible;padding:0;height:auto}
  body{overflow:visible;background:#fff;color:#000;font-size:11px}
  .panel{border:0;box-shadow:none;break-inside:avoid}
  table.dt th{position:static;background:#fff}
  .tw{overflow:visible;max-height:none}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand">
      <div class="brand-mark" id="brandMark">FD</div>
      <div class="brand-txt">
        <div class="brand-name" id="brandName">Freight Dispatch Pro</div>
        <div class="brand-sub">Dispatch &amp; Billing</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button class="sync-chip" id="syncChip">
        <i class="sync-dot"></i><span class="sync-txt">Saved on this device</span>
      </button>
    </div>
  </aside>
  <main id="main">
    <header id="top">
      <button class="icon-btn" id="navToggle" title="Menu"></button>

/* Sözlük. Çekirdek metinleri buradan kurar; "Load"/"Job"/"Repair Order"
   farkı tek yerden geliyor. */
const DEFAULT_WORDS = {
  job:"Job", jobs:"Jobs", jobNo:"Job #", jobLower:"job", jobsLower:"jobs",
  client:"Customer", clients:"Customers",
  worker:"Worker", workers:"Workers",
  unit:"Unit", units:"Units",
  board:"Job Board", value:"Value", newJob:"New job"
};

function W(k){
  const w = (typeof V !== "undefined" && V.words) || {};
  return w[k] !== undefined ? w[k] : DEFAULT_WORDS[k];
}

/* ⚠ AÇILIŞTA DOĞRULA. Eksik config'i çalışma anında fark etmek, ürünü
   yarım yayına göndermek demek. Burada patlasın. */
function validateVertical(){
  const need = ["id","name","tagline","skin","words","entities","job",
                "kpis","reports","demo"];
  const miss = need.filter(k => V[k] === undefined || V[k] === null);
  if (miss.length) throw new Error("Vertical config eksik: " + miss.join(", "));
  ["job","jobs","client","clients"].forEach(k => {
    if (!V.words[k]) throw new Error("V.words." + k + " tanımsız");
  });
  const jk = V.job.key;
  if (!V.entities[jk] && jk !== "jobs") { /* iş varlığı ayrı tanımlanabilir */ }
  Object.keys(V.entities).forEach(k => {
    const e = V.entities[k];
    if (!e.noun || !e.fields || !e.cols)
      throw new Error("entity '" + k + "': noun/fields/cols zorunlu");
  });
  return true;
}

/* ── 10_core.js ── */
/* ═══ ÇEKİRDEK ══════════════════════════════════════════════════════════

/* ⚠ DEPO ANAHTARI DİKEYE ÖZEL OLMALI. Sabit "freight-dispatch-pro" iken
   iki ürün aynı localStorage anahtarını paylaşıyordu: müşteri iki
   uygulamayı da alıp açarsa birinin verisi diğerinde görünüyor, sonra
   üzerine yazılıyor. Tarayıcıda ölçüldü — autoshop, freight'in verisini
   okudu. V dikey dosyasında tanımlandığı için TEMBEL hesaplanıyor. */
const APP = () => V.id;
const VER = "1.0.0";

/* ── DOM yardımcıları ──────────────────────────────────────────────── */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function el(tag, attr, kids){
  const n = document.createElement(tag);
  if (attr) for (const k in attr){
    const v = attr[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k === "data") for (const d in v) n.dataset[d] = v[d];
    else n.setAttribute(k, v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  });
  return n;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ── Biçimlendirme. Para birimi + tarih biçimi AYARDAN gelir.          */
const CURR = {
  USD:["$","en-US"], EUR:["€","de-DE"], GBP:["£","en-GB"], CAD:["CA$","en-CA"],
  AUD:["A$","en-AU"], MXN:["MX$","es-MX"], TRY:["₺","tr-TR"], INR:["₹","en-IN"],
  ZAR:["R","en-ZA"], BRL:["R$","pt-BR"], PLN:["zł","pl-PL"], AED:["AED","en-AE"],
  SAR:["SAR","en-SA"], CHF:["CHF","de-CH"], SEK:["kr","sv-SE"], NZD:["NZ$","en-NZ"]
};
function money(v, dp){
  v = Number(v) || 0;
  const c = CURR[S.set.currency] || CURR.USD;
  const d = dp === undefined ? 2 : dp;
  const s = Math.abs(v).toLocaleString(c[1], {minimumFractionDigits:d, maximumFractionDigits:d});
  return (v < 0 ? "-" : "") + c[0] + s;
}
function money0(v){ return money(v, 0); }
function num(v, dp){
  const d = dp === undefined ? 0 : dp;
  return (Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v, dp){ return (Number(v)||0).toFixed(dp === undefined ? 1 : dp) + "%"; }

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function today(){ const d = new Date(); return iso(d); }
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}
function parseD(s){
  if (!s) return null;
  const p = String(s).split("-");
  if (p.length !== 3) return null;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d) ? null : d;
}
/* ⚠ Tarih biçimi 5 seçenek — ELDON'da 3 var, dünya çapında satılıyor.  */
function date(s){
  const d = parseD(s); if (!d) return "—";
  const D = String(d.getDate()).padStart(2,"0"), M = String(d.getMonth()+1).padStart(2,"0"),
        Y = d.getFullYear(), MN = MON[d.getMonth()];
  switch (S.set.dateFmt){
    case "DD/MM/YYYY": return D+"/"+M+"/"+Y;
    case "YYYY-MM-DD": return Y+"-"+M+"-"+D;
    case "DD MMM YYYY": return D+" "+MN+" "+Y;
    case "MMM DD, YYYY": return MN+" "+D+", "+Y;
    default: return M+"/"+D+"/"+Y;               // MM/DD/YYYY
  }
}
function dateShort(s){
  const d = parseD(s); if (!d) return "—";
  return S.set.dateFmt === "DD/MM/YYYY"
    ? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")
    : MON[d.getMonth()]+" "+d.getDate();
}
function daysBetween(a, b){
  const x = parseD(a), y = parseD(b);
  if (!x || !y) return null;
  return Math.round((y - x) / 864e5);
}
function addDays(s, n){
  const d = parseD(s); if (!d) return null;
  d.setDate(d.getDate() + n); return iso(d);
}
function monthKey(s){ return s ? String(s).slice(0,7) : ""; }
function monthLabel(k){
  if (!k) return "";
  const p = k.split("-"); return MON[+p[1]-1] + " " + String(p[0]).slice(2);
}
function quarterOf(s){
  const d = parseD(s); if (!d) return null;
  return d.getFullYear() + "-Q" + (Math.floor(d.getMonth()/3) + 1);
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ── Toast ─────────────────────────────────────────────────────────── */
function toast(msg, kind){
  const box = $("#toasts");
  const t = el("div", {class:"toast " + (kind || "ok")}, [
    el("span", {class:"mono", style:{color:"var(--"+(kind==="err"?"bad":kind==="info"?"info":"good")+")"}},
       kind === "err" ? "✕" : kind === "info" ? "i" : "✓"),
    el("span", {text:msg})
  ]);
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .2s";
                     setTimeout(() => t.remove(), 220); }, 2600);
}

/* ── Modal ─────────────────────────────────────────────────────────── */
let _modalEsc = null;
function modal(opts){
  closeModal();
  const body = el("div", {class:"modal-body"});
  if (typeof opts.body === "string") body.innerHTML = opts.body;
  else if (opts.body) body.appendChild(opts.body);
  const foot = el("div", {class:"modal-foot"});
  (opts.buttons || []).forEach(b => {
    if (b === "-") { foot.appendChild(el("div", {class:"sp"})); return; }
    foot.appendChild(el("button", {
      class:"btn " + (b.kind || ""), text:b.label,
      onclick: () => { if (!b.act || b.act() !== false) closeModal(); }
    }));
  });
  const box = el("div", {class:"modal " + (opts.size || "")}, [
    el("div", {class:"modal-head"}, [
      el("div", {style:{minWidth:0}}, [
        el("h2", {text:opts.title}),
        opts.sub ? el("div", {class:"sub", text:opts.sub}) : null
      ]),
      el("div", {class:"sp", style:{flex:"1"}}),
      el("button", {class:"icon-btn", html:ICON.x, onclick:closeModal, title:"Close"})
    ]),
    body,
    (opts.buttons || []).length ? foot : null
  ]);
  const scrim = el("div", {class:"scrim", id:"scrim",
    onclick: e => { if (e.target.id === "scrim" && opts.dismiss !== false) closeModal(); }}, box);
  document.body.appendChild(scrim);
  _modalEsc = e => { if (e.key === "Escape" && opts.dismiss !== false) closeModal(); };
  document.addEventListener("keydown", _modalEsc);
  const first = box.querySelector("input,select,textarea");
  if (first) setTimeout(() => first.focus(), 40);
  return box;
}
function closeModal(){
  const s = $("#scrim"); if (s) s.remove();
  if (_modalEsc) { document.removeEventListener("keydown", _modalEsc); _modalEsc = null; }
}
function confirmBox(title, msg, onYes, yesLabel){
  modal({ size:"slim", title:title,
    body: el("p", {style:{margin:"0",lineHeight:"1.6",color:"var(--ink2)"}, text:msg}),
    buttons: ["-", {label:"Cancel"}, {label:yesLabel||"Delete", kind:"danger pri", act:onYes}] });
}

/* ── 11_store.js ── */
/* ═══ DURUM + KALICILIK ═════════════════════════════════════════════════
   ⚠ İKİ KATMAN. localStorage her zaman yazılır (izin istemez, anında).
     Klasör OPSİYONEL: yedek + cihazlar arası taşıma. Klasör yoksa app
     tam çalışır — "klasör seçmeden kullanılamıyor" diye şikâyet gelmesin.
   ⚠ file:// üzerinde showDirectoryPicker Chrome/Edge'de çalışır,
     Safari/Firefox'ta YOK. Yokluğunda düğme gizlenir, app çalışmaya devam.  */

const LS = () => APP() + ":data";

const DEFAULT_SET = {
  company:"", address:"", city:"", phone:"", email:"", mc:"", dot:"", logo:"",
  currency:"USD", dateFmt:"MM/DD/YYYY", skin:"highway",
  dispatchFeePct:0, invoicePrefix:"INV-", nextInvoice:1001,
  invoiceTerms:"Net 30", termsText:"Payment due within 30 days of invoice date.",
  distUnit:"mi", volUnit:"gal", railCollapsed:false, iftaRates:{},
  lastBackup:"", lastPull:"", lastFolderWrite:"", _t:0
};

/* ⚠ LİSTELER DİKEYDEN. Sabit "loads/trucks/drivers" listesi ikinci ürüne
   geçince sessizce yanlış şema kuruyordu. V.entities + V.job.key +
   V.extraLists tek kaynak. */
function blankShape(){
  const o = {set:Object.assign({}, DEFAULT_SET),
             _meta:{ver:VER, created:today(), device:""}};
  dataLists().forEach(k => o[k] = []);
  return o;
}
function dataLists(){
  return [V.job.key].concat(Object.keys(V.entities))
    .concat(V.noMoney ? [] : ["invoices"]).concat(V.extraLists || [])
    .filter((k, i, a) => a.indexOf(k) === i);
}

let S = {set:Object.assign({}, DEFAULT_SET), _meta:{ver:VER, created:"", device:""}};

/* ⚠ ŞEMA GÖÇÜ. Yeni alan eklerken eski dosyayı BOZMA — eksik anahtarları
   varsayılanla doldur, fazlasını sil. Sürüm atlamada veri kaybı olmasın. */
function normalize(d){
  const out = blankShape();
  if (!d || typeof d !== "object") return out;
  for (const k in out){
    if (k === "set" || k === "_meta") continue;
    if (Array.isArray(d[k])) out[k] = d[k];
  }
  out.set = Object.assign({}, DEFAULT_SET, d.set || {});
  out._meta = Object.assign({}, out._meta, d._meta || {});
  out._meta.ver = VER;
  return out;
}

/* ⚠ localStorage'IN 5 MB TAVANI VAR VE SESSİZCE ÇARPILIYOR. Kreş ürünü
   19.692 kayıtta 5,84 MB veri üretiyor; `setItem` QuotaExceededError
   atıyor, ekranda bir uyarı çıkıyor ve KULLANICI SAYFAYI YENİLEYİNCE
   HER ŞEY GİTMİŞ oluyor. Bu tek başına ürünü satılamaz yapardı: veri
   yıllar içinde büyür, tavan bir gün mutlaka gelir.
   Çözüm: taşınca IndexedDB'ye düşülüyor (kota yüzlerce MB) ve
   localStorage'a bir işaret bırakılıyor. Küçük veri hızlı senkron
   yolda kalıyor; büyük veri açılışta IndexedDB'den geliyor. */
const BIG = () => LS() + ":idb";
let _big = false;
/* ⚠ INDEXEDDB YAZMASI ASENKRON — VE SESSİZ. localStorage 5 MB'ı aşınca
   büyük yola düşülüyor; orada `idbPut` sözü bir buçuk iki saniye sonra
   çözülüyor. O aralıkta müşteri sekmeyi kapatırsa ya da sayfayı
   yenilerse SON KAYIT UÇUYOR ve hiçbir yerde uyarı yok. Ölçtük: 10.177
   kayıtlık bir dosyada (5,75 MB) yenileme 0 ms'de kaybediyor, 2.500
   ms'de kurtarıyor. Bir kayıt girip kapağı kapatan kullanıcı için bu
   sessiz veri kaybı demek — üründe kabul edilemez.
   Çözüm: uçan yazma sayılıyor, sayfa kapanmak isterse tarayıcının
   "ayrılsın mı" uyarısı tetikleniyor ve durum satırı "Saving…" diyor. */
let _pending = 0;
function savePending(){ return _pending > 0; }
function saveLocal(){
  if (DEMO_MODE) return;                    /* demo hiçbir şey yazmaz */
  const raw = JSON.stringify(S);
  if (!_big){
    try { return; }
    catch(e){ _big = true; }                /* kota doldu → IndexedDB */
  }
  try {
    localStorage.setItem(BIG(), "1");
    localStorage.removeItem(LS());          /* eski küçük kopya yanıltmasın */
  } catch(e){}
  _pending++;
  if (typeof paintSync === "function") try { paintSync(); } catch(e){}
  Promise.resolve().catch(function(){
    toast("Could not save locally — storage may be full.", "err");
  }).finally(function(){
    _pending = Math.max(0, _pending - 1);
    if (typeof paintSync === "function") try { paintSync(); } catch(e){}
  });
}
/* ⚠ KAPANIŞ KORUMASI. `preventDefault` yalnız kullanıcı sayfayla
   etkileşmişse çalışır — kayıt giren kullanıcı zaten etkileşmiştir. */
if (typeof window !== "undefined"){
  window.addEventListener("beforeunload", function(e){
    if (!savePending()) return;
    e.preventDefault();
    e.returnValue = "";
    return "";
  });
}
function loadLocal(){
  if (DEMO_MODE) return false;              /* demo her açılışta sıfırdan */
  try {
    if (localStorage.getItem(BIG())){ _big = true; return false; }
    const raw = null;
    if (raw) { S = normalize(JSON.parse(raw));
      _lastSet = JSON.stringify(Object.assign({}, S.set, {_t:0})); return true; }
  } catch(e){}
  return false;
}
/* Büyük veri yolu — açılışta bir kez, senkron `loadLocal` boş dönerse. */
async function loadBig(){
  if (DEMO_MODE || !_big) return false;
  try {
    const raw = null;
    if (!raw) return false;
    S = normalize(typeof raw === "string" ? JSON.parse(raw) : raw);
    _lastSet = JSON.stringify(Object.assign({}, S.set, {_t:0}));
    return true;
  } catch(e){ return false; }
}

/* ── KLASÖR (File System Access) ───────────────────────────────────── */
let DIR = null, FILE_NAME = "";
const HAS_FS = typeof window.showDirectoryPicker === "function";

/* ⚠ KALICI DEPOLAMA İSTE. Chrome varsayılan olarak site verisini "en iyi
   çaba" tutar ve disk sıkışınca ATABİLİR. `persist()` bunu engelliyor.
   ÖLÇÜLDÜ: temiz profilde file:// ve http://localhost'ta ikisinde de
   `false` dönüyor — Chrome kararı site etkileşimine bakarak veriyor
   (kurulu PWA, yer imi, sık kullanım). Yani garanti değil; ama istemek
   bedava ve düzenli kullanan müşteride zamanla veriliyor.
   ⚠ Bunu "veriniz güvende" diye SATMA. Gerçek güvence klasör bağlamak. */
async function askPersist(){
  try {
    if (!navigator.storage || !navigator.storage.persist) return false;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch(e){ return false; }
}
async function storageInfo(){
  try {
    const q = await navigator.storage.estimate();
    return {persisted:await navigator.storage.persisted(),
            usedMB:Math.round((q.usage || 0) / 1048576 * 10) / 10,
            quotaMB:Math.round((q.quota || 0) / 1048576)};
  } catch(e){ return {persisted:false, usedMB:0, quotaMB:0}; }
}

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(APP(), 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readwrite");
    t.objectStore("kv").put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej) => {
    const r = db.transaction("kv", "readonly").objectStore("kv").get(k);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

/* Aynı klasörde birden çok ürün duruyorsa yalnız kendi dosyalarını oku. */
function fileMine(name){
  return new RegExp("^" + APP() + "-.*\\.json$").test(name);
}
function deviceName(){
  if (S._meta.device) return S._meta.device;
  const ua = navigator.userAgent;
  const n = /Mac/.test(ua) ? "mac" : /Win/.test(ua) ? "win" : /Linux/.test(ua) ? "linux" : "pc";
  S._meta.device = n + "-" + Math.random().toString(36).slice(2, 6);
  return S._meta.device;
}

async function pickFolder(){
  if (!HAS_FS){ toast("Your browser can't open folders. Use Chrome or Edge.", "err"); return; }
  try {
    const d = await window.showDirectoryPicker({ id:APP(), mode:"readwrite" });
    DIR = d; await idbPut("dir", d);
    FILE_NAME = APP() + "-" + deviceName() + ".json";
    /* ⚠ ÖNCE OKU, SONRA YAZ. Tersi çalışıyordu ve gerçek veri kaybettiriyordu:
       kullanıcı tarayıcı verisini silince uygulama 430 DEMO kaydıyla açılıyor,
       kurtarmak için klasörü bağlayınca o 430 demo kaydı ONUN KLASÖRÜNE
       yazılıyordu — yeni cihaz adıyla, yani kalıcı olarak, ve sonraki her
       cihaza bulaşarak. Artık önce klasördeki gerçek veri okunuyor. */
    const wasDemo = !!S._meta.demo;
    await pullOthers();
    if (!(wasDemo && S._meta.demo)) await pushFile();   /* hâlâ demo ise YAZMA */
    paintSync();
    toast(wasDemo && !S._meta.demo
      ? "Found your data — everything is back."
      : "Folder connected — your work is saved here from now on.");
  } catch(e){ if (e && e.name !== "AbortError") toast("Could not open that folder.", "err"); }
}
async function resumeFolder(){
  if (!HAS_FS) return;
  try {
    const d = await idbGet("dir"); if (!d) return;
    const p = await d.queryPermission({ mode:"readwrite" });
    if (p !== "granted") { DIR = d; paintSync(true); return; }
    DIR = d; FILE_NAME = APP() + "-" + deviceName() + ".json";
    await pullOthers(); paintSync();
  } catch(e){}
}
async function reconnect(){
  if (!DIR) return pickFolder();
  try {
    const p = await DIR.requestPermission({ mode:"readwrite" });
    if (p !== "granted") return;
    FILE_NAME = APP() + "-" + deviceName() + ".json";
    await pullOthers(); await pushFile(); paintSync();
    toast("Reconnected.");
  } catch(e){ toast("Could not reconnect to the folder.", "err"); }
}
async function forgetFolder(){
  DIR = null; await idbPut("dir", null); paintSync();
  toast("Folder disconnected. Your data is still on this device.", "info");
}
/* ⚠ SON YAZMA GÖRÜNÜR OLMALI. "Otomatik yedekleniyor" demek yetmiyor;
   kullanıcı gerçekten yazıldığını GÖRMEDEN güvenmiyor — ve haklı. */
let LAST_PUSH = 0, PUSH_FAIL = "";
async function pushFile(){
  if (DEMO_MODE || !DIR || !FILE_NAME) return;
  try {
    const fh = await DIR.getFileHandle(FILE_NAME, { create:true });
    const w = await fh.createWritable();
    await w.close();
    LAST_PUSH = Date.now(); PUSH_FAIL = "";
    S.set.lastFolderWrite = today();
    const b = document.getElementById("pushStamp");
    if (b) b.textContent = "Saved to your folder just now";
  } catch(e){
    PUSH_FAIL = String(e && e.message || e);
  }
  paintSync();
}
/* ⚠ CİHAZ BAŞINA DOSYA. Her cihaz yalnız kendi dosyasına yazar; okumada
   diğerlerinin dosyaları birleştirilir. Böylece çakışacak yazma yok
   (keeplocal deseni). Birleştirme kimlik bazlı: aynı id'de YENİ olan kazanır. */
const SYNC_LISTS_FN = () => dataLists();

/* ⚠ DEMO ÜZERİNE GERÇEK VERİ GELİNCE DEĞİŞTİR, KARIŞTIRMA.
   Ölçüldü: kullanıcı tarayıcı verisini silince uygulama 430 demo kaydıyla
   açılıyor, sonra klasörü bağlayınca kendi 3 kaydı geliyor ama demo'nun
   430'u KALIYORDU — 433 kayıt, 430'u çöp. Kurtarma yolu kullanılamaz
   hâldeydi.
   ⚠ AYARLAR DA TAŞINMALI. Şirket adı, logo, fatura numarası merge'e hiç
     dahil değildi; kullanıcı verisini geri alıyor ama faturasında demo
     şirketinin adı yazıyordu. */
function mergeIncoming(d){
  let n = 0;
  const incomingIsReal = !(d._meta && d._meta.demo);
  if (S._meta.demo && incomingIsReal){
    SYNC_LISTS_FN().forEach(k => S[k] = []);
    S._meta.demo = false;
    S.set = Object.assign({}, DEFAULT_SET, d.set || {});
  } else if (d.set && n0(d.set._t) > n0(S.set._t)){
    const keep = {railCollapsed:S.set.railCollapsed};   /* bu cihaza ait */
    S.set = Object.assign({}, DEFAULT_SET, d.set, keep);
  }
  SYNC_LISTS_FN().forEach(k => {
    if (!Array.isArray(d[k])) return;
    const mine = new Map(S[k].map(r => [r.id, r]));
    d[k].forEach(r => {
      if (!r || !r.id) return;
      const cur = mine.get(r.id);
      if (!cur || (r._t || 0) > (cur._t || 0)){ mine.set(r.id, r); n++; }
    });
    S[k] = Array.from(mine.values());
  });
  return n;
}

async function pullOthers(){
  if (!DIR) return;
  try {
    for await (const [name, h] of DIR.entries()){
      if (h.kind !== "file" || !fileMine(name) || name === FILE_NAME) continue;
      let d; try { d = JSON.parse(await (await h.getFile()).text()); } catch(e){ continue; }
      mergeIncoming(d);
    }
    saveLocal();
  } catch(e){}
}

/* ── SAFARI YOLU ──────────────────────────────────────────────────────
   ⚠ ÖLÇÜLDÜ (Safari 26.5): showDirectoryPicker / showSaveFilePicker /
     showOpenFilePicker ÜÇÜ DE `undefined`. OPFS ve
     FileSystemWritableFileStream var ama OPFS Finder'da GÖRÜNMEYEN bir
     kum havuzu — Dropbox/iCloud'a konamaz, senkron için işe yaramaz.
     `webkitdirectory` ise ÇALIŞIYOR: klasör OKUNABİLİYOR, yazılamıyor.
   → Safari'de yarım senkron: okuma tek tıkla, yazma indirmeyle.
     Bunu "desteklenmiyor" diye geçmek, çalışan yarısını da atmak olurdu. */
const HAS_DIR_READ = "webkitdirectory" in document.createElement("input");

function pullFromFolderRead(){
  const inp = el("input", {type:"file", style:{display:"none"}});
  inp.webkitdirectory = true; inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || [])
      .filter(f => fileMine(f.name));
    if (!files.length){
      toast("No dispatch files in that folder.", "err");
      return;
    }
    let n = 0, seen = 0;
    for (const f of files){
      let d; try { d = JSON.parse(await f.text()); } catch(e){ continue; }
      seen++; n += mergeIncoming(d);
    }
    saveLocal();
    S.set.lastPull = today();
    commit();
    render();
    toast(n ? (n + " records merged from " + seen + " file" + (seen > 1 ? "s" : "") + ".")
            : "Already up to date.", n ? "ok" : "info");
  };
  document.body.appendChild(inp); inp.click();
  setTimeout(() => inp.remove(), 1200);
}

function pushAsDownload(){
  const name = APP() + "-" + deviceName() + ".json";
  dl(name, "application/json", JSON.stringify(S, null, 1));

}

/* ── TEK GİRİŞ NOKTASI. Her değişiklik buradan geçer. ──────────────── */
let _pushTimer = null, _lastSet = "";
function commit(msg){
  /* ⚠ Ayar damgası YALNIZCA ayar değişince ilerler. Her commit'te
     damgalamak, hiç ayar değiştirmemiş bir cihazın diğerinin ayarlarını
     ezmesine yol açıyordu. */
  const cur = JSON.stringify(Object.assign({}, S.set, {_t:0}));
  if (cur !== _lastSet){ _lastSet = cur; S.set._t = Date.now(); }
  saveLocal();
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(function(){
    pushFile();
    /* ⚠ AYNI GECIKME. Bulut rate-limit'li; her tusa basista yuklemek
       429 getiriyor. Klasor yazmasiyla ayni 900 ms'de toplaniyor. */
    if (typeof dbxPush === "function" && typeof DBX !== "undefined" && DBX) dbxPush();
  }, 900);
}
function stamp(r){ r._t = Date.now(); return r; }

/* ── 13_charts.js ── */
/* ═══ GRAFİKLER (saf SVG, bağımlılık yok) ═══════════════════════════════
   ⚠ Renkler CSS değişkeninden okunur → tema değişince grafik de değişir.
   ⚠ Boş veri sessizce boş kutu bırakmaz; "no data" yazar. Sessiz boşluk
     bir kez "grafik bozuk" şikâyeti gibi göründü.                        */
const NS = "http://www.w3.org/2000/svg";
function sv(t, a){
  const n = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  return n;
}
function cssv(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}
function noData(w, h, msg){
  const s = sv("svg", {viewBox:"0 0 "+w+" "+h, width:"100%", height:h,
                       style:"display:block"});
  s.appendChild(sv("text", {x:w/2, y:h/2, "text-anchor":"middle",
    "dominant-baseline":"middle", fill:"var(--muted)", "font-size":"12",
    "font-family":"var(--f-ui)"})).textContent = msg || "No data yet";
  return s;
}
function niceMax(v){
  if (v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

/* ── Kıvılcım. KPI kartının içinde, eksen yok. ─────────────────────── */
function spark(vals, w, h, color){
  w = w || 62; h = h || 22;
  if (!vals || vals.length < 2) return sv("svg", {width:w, height:h});
  const mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  const rg = (mx - mn) || 1;
  const X = i => (i / (vals.length - 1)) * (w - 2) + 1;
  const Y = v => h - 2 - ((v - mn) / rg) * (h - 4);
  const pts = vals.map((v, i) => X(i) + "," + Y(v));
  const s = sv("svg", {width:w, height:h, viewBox:"0 0 "+w+" "+h, style:"display:block"});
  const c = color || "var(--accent)";
  s.appendChild(sv("polyline", {points:pts.join(" "), fill:"none", stroke:c,
    "stroke-width":1.6, "stroke-linejoin":"round", "stroke-linecap":"round"}));
  s.appendChild(sv("circle", {cx:X(vals.length-1), cy:Y(vals[vals.length-1]), r:2.1, fill:c}));
  return s;
}

/* ── Y ekseni sol boşluğu ──────────────────────────────────────────────
   ⚠ SABİT BOŞLUK PARA ETİKETİNİ KESİYOR. 52 birimlik sol boşluk
     "$2,000,000" gibi on karakterlik bir etiketi kartın dışına taşırıyor;
     100 üründen 78'inde ekseni "000,000" diye okunuyordu ve tek başına
     bütün panonun ucuz görünmesine yetiyordu. Boşluk artık en geniş
     ETİKETTEN hesaplanıyor, sabitten değil. */
function axisLeft(vals, fmt, base){
  let w = 0;
  (vals || []).forEach(v => {
    const s = String(fmt ? fmt(v) : num(v));
    if (s.length > w) w = s.length;
  });
  return Math.max(base || 52, Math.min(98, 10 + w * 6.4));
}

/* ── Alan/çizgi. Zaman serisi. Son nokta vurgulu. ──────────────────── */
function areaChart(labels, series, opts){
  opts = opts || {};
  const h = opts.height || 190, W = 720, P = {t:12, r:12, b:26, l:opts.left || 52};
  if (!labels || !labels.length) return noData(W, h);
  const all = series.reduce((a, s) => a.concat(s.data), []);
  /* ⚠ SIFIRDAN BASLAMAK HER SERIYE UYMUYOR. Tansiyon 80-160, pH 6-8,
     sicaklik 18-24 bandinda; sifirdan cizince cizgi dumduz gorunuyor.
     opts.min:"auto" tabani verinin biraz altina cekiyor. */
  const pos = all.filter(v => v > 0);
  let mn = 0;
  if (opts.min === "auto" && pos.length){
    const lo = Math.min.apply(null, pos), hi = Math.max.apply(null, pos);
    if (lo > 0 && (hi - lo) < lo * 0.9) mn = Math.max(0, Math.floor((lo - (hi - lo) * 0.4) / 5) * 5);
  } else if (typeof opts.min === "number") mn = opts.min;
  const mx = mn ? Math.ceil((Math.max.apply(null, all.concat([mn])) * 1.04) / 5) * 5
                : (niceMax(Math.max.apply(null, all.concat([0])) * 1.08) || 10);
  const span = Math.max(1, mx - mn);
  if (!opts.left) P.l = axisLeft(Array.from({length:5}, (_, i) => mx - (span/4) * i), opts.fmt, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const X = i => P.l + (labels.length === 1 ? iw/2 : (i/(labels.length-1)) * iw);
  const Y = v => P.t + ih - Math.max(0, Math.min(1, (v - mn) / span)) * ih;
  const s = sv("svg", {viewBox:"0 0 "+W+" "+h, width:"100%", height:h,
                       preserveAspectRatio:"none", style:"display:block;overflow:visible"});
  /* ızgara + y ekseni */
  for (let i = 0; i <= 4; i++){
    const y = P.t + (ih/4) * i, v = mx - (span/4) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W-P.r, y2:y,
      stroke:"var(--hair2)", "stroke-width":1}));
    const t = sv("text", {x:P.l-8, y:y+3.5, "text-anchor":"end", fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  series.forEach((ser, si) => {
    const col = ser.color || "var(--c" + ((si % 6) + 1) + ")";
    const pts = ser.data.map((v, i) => X(i) + "," + Y(v));
    if (opts.area !== false){
      const gid = "g" + si + "_" + Math.random().toString(36).slice(2,7);
      const gd = sv("linearGradient", {id:gid, x1:"0", y1:"0", x2:"0", y2:"1"});
      gd.appendChild(sv("stop", {offset:"0%",  "stop-color":col, "stop-opacity":".26"}));
      gd.appendChild(sv("stop", {offset:"100%","stop-color":col, "stop-opacity":"0"}));
      s.appendChild(sv("defs", {})).appendChild(gd);
      s.appendChild(sv("polygon", {fill:"url(#"+gid+")",
        points:(X(0)+","+(P.t+ih))+" "+pts.join(" ")+" "+(X(labels.length-1)+","+(P.t+ih))}));
    }
    s.appendChild(sv("polyline", {points:pts.join(" "), fill:"none", stroke:col,
      "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round"}));
    const li = ser.data.length - 1;
    s.appendChild(sv("circle", {cx:X(li), cy:Y(ser.data[li]), r:3.4, fill:col,
      stroke:"var(--paper)", "stroke-width":1.8}));
  });
  /* x ekseni — kalabalıksa atlayarak yaz */
  const step = Math.ceil(labels.length / 12);
  labels.forEach((L, i) => {
    if (i % step && i !== labels.length - 1) return;
    /* ⚠ SON ETİKET ORTALANIRSA YARISI DIŞARI TAŞAR. Son ay çizimin sağ
   kenarına düşüyor; "Jul 26" ortalanınca kartın dışına sarkıyor ve 100
   üründen 18'inde görünüyordu. İlk ve son etiket kenara yaslanır. */
    const t = sv("text", {x:X(i), y:h-8, "text-anchor":(i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"), fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-ui)"});
    t.textContent = L;
    s.appendChild(t);
  });
  return s;
}

/* ── Dikey çubuk. Kategori karşılaştırması. ────────────────────────── */
function barChart(labels, data, opts){
  opts = opts || {};
  const h = opts.height || 190, W = 720, P = {t:12, r:12, b:26, l:opts.left || 52};
  if (!labels || !labels.length) return noData(W, h);
  const mx = niceMax(Math.max.apply(null, data.concat([0])) * 1.08) || 10;
  if (!opts.left) P.l = axisLeft(Array.from({length:5}, (_, i) => mx - (mx/4) * i), opts.fmt, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const bw = Math.min(46, (iw / labels.length) * .62);
  const s = sv("svg", {viewBox:"0 0 "+W+" "+h, width:"100%", height:h,
                       preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 4; i++){
    const y = P.t + (ih/4) * i, v = mx - (mx/4) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W-P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l-8, y:y+3.5, "text-anchor":"end", fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  data.forEach((v, i) => {
    const cx = P.l + (iw / labels.length) * (i + .5);
    const bh = Math.max(0, (Math.max(0,v) / mx) * ih);
    s.appendChild(sv("rect", {x:cx - bw/2, y:P.t + ih - bh, width:bw, height:bh,
      rx:3, fill:opts.color || "var(--accent)", opacity:opts.dim && i < data.length-1 ? .55 : 1}));
    const t = sv("text", {x:cx, y:h-8, "text-anchor":(i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"), fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-ui)"});
    t.textContent = labels[i];
    s.appendChild(t);
  });
  return s;
}

/* ── Yatay çubuk. Sıralama (en iyi 5 müşteri, sürücü…). ────────────── */
function hbars(items, opts){
  opts = opts || {};
  if (!items || !items.length) return noData(400, opts.height || 150);
  const mx = Math.max.apply(null, items.map(x => x.v).concat([1]));
  const box = el("div", {style:{display:"flex", flexDirection:"column", gap:"9px"}});
  items.forEach((it, i) => {
    box.appendChild(el("div", {style:{display:"flex", flexDirection:"column", gap:"4px"}}, [
      el("div", {style:{display:"flex", gap:"8px", fontSize:"12px", alignItems:"baseline"}}, [
        el("span", {style:{flex:"1", minWidth:"0", overflow:"hidden",
          textOverflow:"ellipsis", whiteSpace:"nowrap"}, text:it.k}),
        el("span", {class:"mono", style:{fontWeight:"600", fontSize:"12px"},
          text:opts.fmt ? opts.fmt(it.v) : num(it.v)})
      ]),
      el("div", {class:"bar"}, el("i", {style:{
        width:Math.max(2, (it.v / mx) * 100) + "%",
        background:it.color || "var(--c" + ((i % 6) + 1) + ")"}}))
    ]));
  });
  return box;
}

/* ── Halka. Dağılım + ortada toplam. ───────────────────────────────── */
function donut(items, opts){
  opts = opts || {};
  const D = opts.size || 168, R = D/2, r0 = R * .62, cx = R, cy = R;
  const tot = items.reduce((a, x) => a + (x.v || 0), 0);
  const wrap = el("div", {style:{display:"flex", gap:"16px", alignItems:"center",
    flexWrap:"wrap", justifyContent:"center"}});
  if (!tot) return noData(300, 150);
  const s = sv("svg", {width:D, height:D, viewBox:"0 0 "+D+" "+D, style:"flex:0 0 auto"});
  let a0 = -Math.PI/2;
  items.forEach((it, i) => {
    const frac = (it.v || 0) / tot;
    if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const p = [
      "M", cx + R*Math.cos(a0), cy + R*Math.sin(a0),
      "A", R, R, 0, big, 1, cx + R*Math.cos(a1), cy + R*Math.sin(a1),
      "L", cx + r0*Math.cos(a1), cy + r0*Math.sin(a1),
      "A", r0, r0, 0, big, 0, cx + r0*Math.cos(a0), cy + r0*Math.sin(a0), "Z"
    ].join(" ");
    s.appendChild(sv("path", {d:p, fill:it.color || "var(--c"+((i%6)+1)+")",
      stroke:"var(--paper)", "stroke-width":1.5}));
    a0 = a1;
  });
  const t1 = sv("text", {x:cx, y:cy-3, "text-anchor":"middle", fill:"var(--ink)",
    "font-size":"19", "font-weight":"600", "font-family":"var(--f-display)"});
  t1.textContent = opts.fmt ? opts.fmt(tot) : num(tot);
  s.appendChild(t1);
  const t2 = sv("text", {x:cx, y:cy+14, "text-anchor":"middle", fill:"var(--muted)",
    "font-size":"10", "font-family":"var(--f-ui)",
    "letter-spacing":"1"});
  t2.textContent = (opts.label || "TOTAL").toUpperCase();
  s.appendChild(t2);
  wrap.appendChild(s);
  const leg = el("div", {style:{display:"flex", flexDirection:"column", gap:"7px",
    minWidth:"0", flex:"1 1 130px"}});
  items.forEach((it, i) => {
    if (!it.v) return;
    leg.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"7px",
      fontSize:"12px", minWidth:"0"}}, [
      el("i", {style:{width:"9px", height:"9px", borderRadius:"2px", flex:"0 0 auto",
        background:it.color || "var(--c"+((i%6)+1)+")"}}),
      el("span", {style:{flex:"1", minWidth:"0", overflow:"hidden", whiteSpace:"nowrap",
        textOverflow:"ellipsis"}, text:it.k}),
      el("span", {class:"mono mut", style:{fontSize:"11px"},
        text:Math.round(it.v/tot*100) + "%"}),
      el("span", {class:"mono", style:{fontWeight:"600", fontSize:"11.5px"},
        text:opts.fmt ? opts.fmt(it.v) : num(it.v)})
    ]));
  });
  wrap.appendChild(leg);
  return wrap;
}

/* ── Yığılmış çubuk. Kategori kırılımını zaman içinde göstermek için. */
function stackChart(labels, series, opts){
  opts = opts || {};
  const h = opts.height || 200, W = 720, P = {t:12, r:12, b:26, l:opts.left || 52};
  if (!labels || !labels.length) return noData(W, h);
  const totals = labels.map((_, i) => series.reduce((a, s) => a + (s.data[i] || 0), 0));
  const mx = niceMax(Math.max.apply(null, totals.concat([0])) * 1.08) || 10;
  if (!opts.left) P.l = axisLeft(Array.from({length:5}, (_, i) => mx - (mx/4) * i), opts.fmt, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const bw = Math.min(44, (iw / labels.length) * .66);
  const s = sv("svg", {viewBox:"0 0 "+W+" "+h, width:"100%", height:h,
                       preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 4; i++){
    const y = P.t + (ih/4) * i, v = mx - (mx/4) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W-P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l-8, y:y+3.5, "text-anchor":"end", fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  labels.forEach((L, i) => {
    const cx = P.l + (iw / labels.length) * (i + .5);
    let acc = 0;
    series.forEach((ser, si) => {
      const v = ser.data[i] || 0;
      if (v <= 0) return;
      const y0 = P.t + ih - ((acc + v) / mx) * ih;
      const y1 = P.t + ih - (acc / mx) * ih;
      s.appendChild(sv("rect", {x:cx - bw/2, y:y0, width:bw,
        height:Math.max(1, y1 - y0),
        fill:ser.color || "var(--c" + ((si % 6) + 1) + ")"}));
      acc += v;
    });
    const step = Math.ceil(labels.length / 12);
    if (i % step === 0 || i === labels.length - 1){
      const t = sv("text", {x:cx, y:h-8, "text-anchor":(i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"), fill:"var(--muted)",
        "font-size":"10", "font-family":"var(--f-ui)"});
      t.textContent = L; s.appendChild(t);
    }
  });
  return s;
}

/* ── Halka göstergesi. Tek oranı büyük göstermek için (marj, doluluk). */
function gauge(pct0, opts){
  opts = opts || {};
  const D = opts.size || 150, R0 = D/2, w = opts.thick || 14, r = R0 - w/2;
  const p = Math.max(0, Math.min(100, pct0));
  const s = sv("svg", {width:"100%", height:D, viewBox:"0 0 "+D+" "+D,
                       style:"display:block;max-width:"+D+"px;margin:0 auto"});
  const C = 2 * Math.PI * r;
  s.appendChild(sv("circle", {cx:R0, cy:R0, r:r, fill:"none",
    stroke:"var(--sunk)", "stroke-width":w}));
  s.appendChild(sv("circle", {cx:R0, cy:R0, r:r, fill:"none",
    stroke:opts.color || "var(--accent)", "stroke-width":w, "stroke-linecap":"round",
    "stroke-dasharray":(C * p / 100) + " " + C,
    transform:"rotate(-90 "+R0+" "+R0+")"}));
  const t1 = sv("text", {x:R0, y:R0-1, "text-anchor":"middle", fill:"var(--ink)",
    "font-size":String(Math.round(D/5.2)), "font-weight":"600",
    "font-family":"var(--f-display)"});
  t1.textContent = opts.text || (Math.round(p) + "%");
  s.appendChild(t1);
  if (opts.label){
    const t2 = sv("text", {x:R0, y:R0+16, "text-anchor":"middle", fill:"var(--muted)",
      "font-size":"10", "letter-spacing":"1", "font-family":"var(--f-ui)"});
    t2.textContent = String(opts.label).toUpperCase();
    s.appendChild(t2);
  }
  return s;
}

/* ── Kıvılcım ızgarası. Çok sayıda küçük seriyi bir arada göstermek. */
function sparkGrid(items, opts){

  const box = el("div", {style:{display:"grid", gap:"1px",
