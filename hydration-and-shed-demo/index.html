/* ── 13b_charts2.js ── */
/* ═══ GRAFİK İSKELETLERİ — İKİNCİ TAKIM ═════════════════════════════════
   ⚠ NEDEN VAR. On üç üründe pano hep aynı beş iskeleti kullanıyordu:
     alan grafiği + halka + yığılmış çubuk + gösterge + yatay çubuk.
     Kompozisyon (hangi kutu nerede) değişiyordu ama ÇİZİM AYNIYDI, ve
     ürünler ilk bakışta birbirinin kopyası gibi duruyordu. Renk paleti
     bunu çözmez — göz iskeleti tanıyor.
   ⚠ HER İSKELET FARKLI BİR SORUYA CEVAP VERİR, süs değildir:
       ısı ızgarası  → iş ne zaman geliyor (mevsim/gün deseni)
       şelale        → cirodan kâra giden yol, kalem kalem
       huni          → aşamalar arası kayıp
       kurşun çubuk  → hedefe göre nerede duruyoruz
       serpme        → iki sayı arasındaki ilişki (büyük iş = kârlı mı?)
       ağaç harita   → payların BÜYÜKLÜK sıralaması, zaman değil
       dağılım       → tek iş değil, işlerin şekli
       eğim          → bu dönem vs geçen dönem, kalem bazında
   ⚠ HEPSİ CSS DEĞİŞKENİNDEN RENK OKUR; tema değişince grafik de değişir.  */

/* ── Isı ızgarası. Satır × sütun yoğunluk. Mevsim/gün deseni. ─────── */
function heatGrid(rowLabels, colLabels, matrix, opts){
  opts = opts || {};
  if (!rowLabels.length || !colLabels.length) return noData(600, 160);
  let mx = 0;
  matrix.forEach(r => r.forEach(v => { if (v > mx) mx = v; }));
  if (!mx) return noData(600, 160, opts.empty || "Nothing logged yet");
  const cell = el("div", {style:{display:"grid", gap:"3px",
    gridTemplateColumns:"minmax(58px,auto) repeat(" + colLabels.length + ",1fr)",
    alignItems:"center"}});
  /* başlık satırı */
  cell.appendChild(el("div", {}));
  colLabels.forEach(c => cell.appendChild(el("div", {class:"sm mut",
    style:{textAlign:"center", fontSize:"9.5px", whiteSpace:"nowrap",
      overflow:"hidden", textOverflow:"ellipsis"}, text:c})));
  rowLabels.forEach((rl, ri) => {
    cell.appendChild(el("div", {class:"sm mut", style:{fontSize:"10.5px",
      whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis",
      paddingRight:"6px"}, text:rl}));
    colLabels.forEach((cl, ci) => {
      const v = (matrix[ri] || [])[ci] || 0;
      const t = v / mx;
      cell.appendChild(el("div", {
        title:rl + " · " + cl + " — " + (opts.fmt ? opts.fmt(v) : num(v)),
        style:{height:(opts.cell || 26) + "px", borderRadius:"3px",
          background:v ? (opts.color || "var(--accent)") : "var(--sunk)",
          /* ⚠ Doğrusal opaklık en yoğun hücreyi tek başına bırakıyordu;
             karekök ölçek orta değerleri de görünür kılıyor. */
          opacity:v ? (0.14 + Math.sqrt(t) * 0.86).toFixed(3) : 1,
          display:"flex", alignItems:"center", justifyContent:"center"}},
        opts.showValue && v ? el("span", {class:"mono", style:{fontSize:"9.5px",
          color:t > .55 ? "var(--accent-ink)" : "var(--ink2)"},
          text:opts.fmt ? opts.fmt(v) : num(v)}) : null));
    });
  });
  const legend = el("div", {style:{display:"flex", alignItems:"center", gap:"6px",
    marginTop:"10px", justifyContent:"flex-end"}}, [
    el("span", {class:"sm mut", style:{fontSize:"10px"}, text:"less"}),
    el("div", {style:{display:"flex", gap:"2px"}},
      [0.16, 0.36, 0.56, 0.78, 1].map(o => el("i", {style:{width:"14px", height:"10px",
        borderRadius:"2px", background:opts.color || "var(--accent)", opacity:String(o)}}))),
    el("span", {class:"sm mut", style:{fontSize:"10px"},
      text:opts.fmt ? opts.fmt(mx) : num(mx)})
  ]);
  return el("div", {class:"viz"}, [cell, legend]);
}

/* ── Şelale. Cirodan kâra giden yol; her kalem bir basamak. ───────── */
function waterfall(items, opts){
  opts = opts || {};
  const h = opts.height || 220, W = 720, P = {t:14, r:12, b:46, l:opts.left || 62};
  if (!items || !items.length) return noData(W, h);
  /* kümülatif taban ve tavan */
  let run = 0, lo = 0, hi = 0;
  const steps = items.map(it => {
    const start = it.total ? 0 : run;
    const end = it.total ? it.v : run + it.v;
    /* ⚠ TOPLAM KALEMİ DE BİRİKİMİ TAŞIR. Taşımayınca "Revenue" basamağından
       sonraki gider sıfırdan aşağı iniyordu ve şelale ters okunuyordu. */
    run = it.total ? it.v : run + it.v;
    lo = Math.min(lo, start, end); hi = Math.max(hi, start, end);
    return {k:it.k, v:it.v, start:start, end:end, total:!!it.total, color:it.color};
  });
  const span = (hi - lo) || 1;
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const Y = v => P.t + ih - ((v - lo) / span) * ih;
  const s = sv("svg", {viewBox:"0 0 " + W + " " + h, width:"100%", height:h,
    preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 3; i++){
    const y = P.t + (ih / 3) * i, v = hi - (span / 3) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W - P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l - 8, y:y + 3.5, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  const bw = Math.min(58, (iw / steps.length) * .64);
  steps.forEach((st, i) => {
    const cx = P.l + (iw / steps.length) * (i + .5);
    const y0 = Math.min(Y(st.start), Y(st.end));
    const hh = Math.max(2, Math.abs(Y(st.end) - Y(st.start)));
    /* ⚠ GİDER ÇUBUĞU YEŞİL OLMAZ. Yeşil "iyi" okunuyor; düşülen kalemler
       sıcak tonda, kalan kâr yeşil olmalı. Kalem kendi rengini verebilir. */
    const col = st.color || (st.total ? (opts.totalColor || "var(--accent)")
      : st.v >= 0 ? (opts.upColor || "var(--good)") : (opts.downColor || "var(--c3)"));
    s.appendChild(sv("rect", {x:cx - bw / 2, y:y0, width:bw, height:hh, rx:2.5,
      fill:col, opacity:st.total ? 1 : .88}));
    /* basamağı bir sonrakine bağlayan ince çizgi */
    if (i < steps.length - 1 && !steps[i + 1].total){
      const nx = P.l + (iw / steps.length) * (i + 1.5);
      s.appendChild(sv("line", {x1:cx + bw / 2, y1:Y(st.end),
        x2:nx - bw / 2, y2:Y(st.end), stroke:"var(--hair)", "stroke-dasharray":"2 2"}));
    }
    const lab = sv("text", {x:cx, y:h - 27, "text-anchor":(i === 0 ? "start" : i === steps.length - 1 ? "end" : "middle"),
      fill:"var(--ink2)", "font-size":"10.5", "font-weight":"600",
      "font-family":"var(--f-num)"});
    lab.textContent = opts.fmt ? opts.fmt(Math.abs(st.v)) : num(Math.abs(st.v));
    s.appendChild(lab);
    const t = sv("text", {x:cx, y:h - 11, "text-anchor":(i === 0 ? "start" : i === steps.length - 1 ? "end" : "middle"), fill:"var(--muted)",
      "font-size":"10", "font-family":"var(--f-ui)"});
    t.textContent = st.k.length > 15 ? st.k.slice(0, 14) + "…" : st.k;
    s.appendChild(t);
  });
  return s;
}

/* ── Huni. Aşamalar arası kayıp; her basamak bir yamuk. ───────────── */
function funnel(items, opts){
  opts = opts || {};
  if (!items || !items.length) return noData(400, 180);
  /* ⚠ İŞ DURUMLARI ALT KÜME DEĞİL, BÖLÜMDÜR. "Bir önceki aşamadan kaç
     tanesi düştü" hesabı burada 400% gibi saçma sayılar üretiyordu:
     65 ödenmiş iş 4 servis edilmişin alt kümesi değil. Genişlik EN BÜYÜK
     aşamaya, sağdaki yüzde ise TOPLAMA göre veriliyor. */
  const top = Math.max.apply(null, items.map(x => x.v || 0).concat([1]));
  const sum = items.reduce((a, x) => a + (x.v || 0), 0) || 1;
  const box = el("div", {class:"viz", style:{display:"flex", flexDirection:"column", gap:"4px"}});
  items.forEach((it, i) => {
    const frac = Math.max(.06, (it.v || 0) / top);
    box.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px"}}, [
      el("div", {class:"sm", style:{flex:"0 0 34%", minWidth:"0", overflow:"hidden",
        textOverflow:"ellipsis", whiteSpace:"nowrap", textAlign:"right",
        color:"var(--ink2)"}, text:it.k}),
      /* ⚠ DAR ÇUBUKTA SAYI İÇERİ SIĞMIYOR. Beyaz yazı 6%'lık bir çubukta
         kırpılıyordu ("16" → "1"); dar çubukta sayı dışarı, mürekkep
         renginde yazılıyor. */
      el("div", {style:{flex:"1", minWidth:"0", display:"flex",
        alignItems:"center", gap:"7px"}}, [
        el("div", {style:{width:(frac * 100) + "%", minWidth:"5%",
          flex:"0 0 auto",
          height:(opts.step || 30) + "px", borderRadius:"3px",
          background:it.color || "var(--c" + ((i % 6) + 1) + ")",
          display:"flex", alignItems:"center", justifyContent:"center",
          opacity:String(1 - i * 0.055)}},
          frac >= .16 ? el("span", {class:"mono", style:{fontSize:"11.5px",
            fontWeight:"600", color:"#fff", whiteSpace:"nowrap"},
            text:opts.fmt ? opts.fmt(it.v) : num(it.v)}) : null),
        frac < .16 ? el("span", {class:"mono", style:{fontSize:"11.5px",
          fontWeight:"600", color:"var(--ink)", whiteSpace:"nowrap"},
          text:opts.fmt ? opts.fmt(it.v) : num(it.v)}) : null
      ]),
      el("div", {class:"sm mut", style:{flex:"0 0 52px", fontSize:"10.5px",
        textAlign:"left"}, text:Math.round((it.v || 0) / sum * 100) + "%"})
    ]));
  });
  return box;
}

/* ── Kurşun çubuk. Hedefe göre nerede duruyoruz. ──────────────────── */
function bulletBars(items, opts){
  opts = opts || {};
  if (!items || !items.length) return noData(400, 140);
  const box = el("div", {class:"viz", style:{display:"flex", flexDirection:"column", gap:"13px"}});
  /* ⚠ ÖLÇEK BÜTÜN SATIRLARDA ORTAK OLMALI. Her satırı kendi tavanına
     göre çizince $437 binlik çubuk %89, $213 binlik çubuk %59 doluyordu
     — iki kat fark gözle bir buçuk kat görünüyor — ve hedef çizgisi her
     satırda başka yere düşüp zikzak çiziyordu. Mermi grafiğinin bütün
     anlamı ortak eksende. */
  const mx = Math.max.apply(null,
    items.map(x => Math.max(x.v || 0, x.target || 0)).concat([1])) * 1.12;
  items.forEach((it, i) => {
    const col = it.color || (it.target && it.v >= it.target ? "var(--good)"
      : it.target ? "var(--warn)" : "var(--c" + ((i % 6) + 1) + ")");
    box.appendChild(el("div", {style:{display:"flex", flexDirection:"column",
      gap:"5px"}}, [
      el("div", {style:{display:"flex", gap:"8px", alignItems:"baseline",
        fontSize:"12px"}}, [
        el("span", {style:{flex:"1", minWidth:"0", overflow:"hidden",
          textOverflow:"ellipsis", whiteSpace:"nowrap"}, text:it.k}),
        el("span", {class:"mono", style:{fontWeight:"600"},
          text:opts.fmt ? opts.fmt(it.v) : num(it.v)}),
        /* ⚠ "of" HEDEFİ PAY-PAYDA GİBİ OKUTUYOR. Hedef ortalamaysa
           satır "437.334 / 321.657" gibi görünüyor ve saçmalıyor. */
        it.target ? el("span", {class:"sm mut", style:{fontSize:"10.5px"},
          text:(opts.targetLabel || "of") + " " +
            (opts.fmt ? opts.fmt(it.target) : num(it.target))}) : null
      ]),
      el("div", {style:{position:"relative", height:"14px", borderRadius:"3px",
        background:"var(--sunk)", overflow:"hidden"}}, [
        el("i", {style:{position:"absolute", left:"0", top:"0", bottom:"0",
          width:Math.min(100, ((it.v || 0) / mx) * 100) + "%", background:col,
          borderRadius:"3px", display:"block"}}),
        /* hedef çizgisi — çubuğun üstünde dikey işaret */
        it.target ? el("i", {style:{position:"absolute", top:"-2px", bottom:"-2px",
          left:Math.min(99.4, (it.target / mx) * 100) + "%", width:"2px",
          background:"var(--ink)", display:"block"}}) : null
      ])
    ]));
  });
  return box;
}

/* ── Serpme. İki sayı arasındaki ilişki; balon = üçüncü sayı. ─────── */
function scatterPlot(points, opts){
  opts = opts || {};
  const h = opts.height || 220, W = 720, P = {t:14, r:16, b:34, l:opts.left || 56};
  if (!points || !points.length) return noData(W, h, opts.empty);
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xmx = niceMax(Math.max.apply(null, xs.concat([1])) * 1.08);
  const ymn = Math.min(0, Math.min.apply(null, ys));
  const ymx = niceMax(Math.max.apply(null, ys.concat([1])) * 1.08);
  const span = (ymx - ymn) || 1;
  if (!opts.left) P.l = axisLeft(Array.from({length:5}, (_, i) =>
    ymx - (span / 4) * i), opts.yfmt, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const X = v => P.l + (v / xmx) * iw;
  const Y = v => P.t + ih - ((v - ymn) / span) * ih;
  const s = sv("svg", {viewBox:"0 0 " + W + " " + h, width:"100%", height:h,
    preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 4; i++){
    const y = P.t + (ih / 4) * i, v = ymx - (span / 4) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W - P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l - 8, y:y + 3.5, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.yfmt ? opts.yfmt(v) : num(v);
    s.appendChild(t);
  }
  /* sıfır ekseni — kâr grafiğinde kırmızı bölge burada başlıyor */
  if (ymn < 0)
    s.appendChild(sv("line", {x1:P.l, y1:Y(0), x2:W - P.r, y2:Y(0),
      stroke:"var(--hair)", "stroke-width":1.5}));
  /* ⚠ HEDEF ÇİZGİSİ VARSA ÇİZ. Serpme tek başına "iyi mi kötü mü"
     sorusuna cevap vermiyor; eşik çizgisi onu karara çeviriyor. */
  if (opts.yTarget !== undefined && opts.yTarget !== null)
    s.appendChild(sv("line", {x1:P.l, y1:Y(opts.yTarget), x2:W - P.r,
      y2:Y(opts.yTarget), stroke:"var(--good)", "stroke-width":1.4,
      "stroke-dasharray":"5 4", opacity:".8"}));
  points.forEach(p => {
    s.appendChild(sv("circle", {cx:X(p.x), cy:Y(p.y), r:p.r || 4.2,
      fill:p.color || "var(--c1)", opacity:".62",
      stroke:"var(--paper)", "stroke-width":".8"}));
  });
  for (let i = 0; i <= 4; i++){
    const v = (xmx / 4) * i;
    const t = sv("text", {x:X(v), y:h - 10,
      "text-anchor":i === 0 ? "start" : i === 4 ? "end" : "middle",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.xfmt ? opts.xfmt(v) : num(v);
    s.appendChild(t);
  }
  if (opts.xLabel){
    const t = sv("text", {x:W - P.r, y:h - 22, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-ui)"});
    t.textContent = opts.xLabel;
    s.appendChild(t);
  }
  return s;
}

/* ── Ağaç harita. Payların büyüklük sırası; zaman yok, oran var. ────
   ⚠ SVG DEĞİL, HTML. SVG sürümünde viewBox 600 birimdi ve panel 1.240px
     olunca yazı iki katına çıkıyordu: "Coach pay $12,257" kocaman, çocuk
     kitabı gibi duruyordu. Kutular yüzdeyle konumlanan div'ler; yazı
     gerçek CSS yazısı, her genişlikte aynı boyda. */
function treemap(items, opts){
  opts = opts || {};
  const list = (items || []).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 9);
  if (!list.length) return noData(600, opts.height || 210, opts.empty);
  const tot = list.reduce((a, x) => a + x.v, 0);
  const H = opts.height || 210;
  const box = el("div", {class:"viz", style:{position:"relative", width:"100%",
    height:H + "px"}});
  /* dilimle-ve-çevir: uzun ince şeritleri önlemek için yön değiştiriyor */
  /* ⚠ YÖN KARARI PİKSELDE VERİLİR, YÜZDEDE DEĞİL. Yüzde uzayında %20 genişlik
     ile %20 yükseklik eşit görünüyor; oysa panel 1.000 × 210 px, yani %1
     genişlik 10 px, %1 yükseklik 2 px. Yüzdeye bakınca her kutu yatay şerite
     dönüşüyordu. */
  const AW = 1000 / 100, AH = H / 100;
  let x = 0, y = 0, w = 100, h = 100, i = 0, rest = tot;
  list.forEach((it, idx) => {
    const last = idx === list.length - 1;
    const frac = last ? 1 : it.v / rest;
    let bx, by, bw, bh;
    if (w * AW >= h * AH){ bw = last ? w : w * frac; bh = h; bx = x; by = y; x += bw; w -= bw; }
    else { bh = last ? h : h * frac; bw = w; bx = x; by = y; y += bh; h -= bh; }
    rest -= it.v;
    const col = it.color || "var(--c" + ((i++ % 6) + 1) + ")";
    const px = bw / 100 * 1000, py = bh / 100 * H;   /* kabaca piksel */
    box.appendChild(el("div", {title:it.k + " — " +
      (opts.fmt ? opts.fmt(it.v) : num(it.v)),
      style:{position:"absolute", left:bx + "%", top:by + "%",
        width:"calc(" + bw + "% - 3px)", height:"calc(" + bh + "% - 3px)",
        background:col, borderRadius:"3px", overflow:"hidden",
        padding:"8px 10px", boxSizing:"border-box",
        display:"flex", flexDirection:"column", gap:"2px",
        justifyContent:"flex-start"}},
      px > 74 && py > 30 ? [
        el("span", {style:{font:"600 11.5px/1.25 var(--f-ui)", color:"#fff",
          whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"},
          text:it.k}),
        py > 48 ? el("span", {class:"mono", style:{fontSize:"11px",
          color:"#fff", opacity:".85", whiteSpace:"nowrap"},
          text:(px > 118 ? (opts.fmt ? opts.fmt(it.v) : num(it.v)) + "  ·  " : "") +
            Math.round(it.v / tot * 100) + "%"}) : null
      ] : null));
  });
  return box;
}

/* ── Dağılım. Tek iş değil, işlerin ŞEKLİ. ────────────────────────── */
function histogram(values, opts){
  opts = opts || {};
  const vals = (values || []).filter(v => isFinite(v) && v > 0);
  const h = opts.height || 200, W = 720, P = {t:12, r:12, b:34, l:opts.left || 46};
  if (vals.length < 3) return noData(W, h, opts.empty || "Not enough records yet");
  /* ⚠ AYKIRI DEĞER EKSENİ YUTUYOR. Çekicide birkaç ağır kurtarma 5.000$;
     eksen oraya kadar uzayınca 1.000 çağrının hepsi tek çubuğa sıkışıyor
     ve grafik hiçbir şey anlatmıyordu. Eksen %95'lik dilimde kesiliyor,
     üstündekiler son kovaya yığılıyor (standart yöntem). */
  const asc = vals.slice().sort((a, b) => a - b);
  const p95 = asc[Math.min(asc.length - 1, Math.floor(asc.length * 0.95))];
  const clipped = vals.filter(v => v > p95).length;
  const mx = niceMax(p95);
  const bins = opts.bins || 14, bw = mx / bins;
  const counts = new Array(bins).fill(0);
  vals.forEach(v => { const i = Math.min(bins - 1, Math.floor(v / bw)); counts[i]++; });
  const cmx = Math.max.apply(null, counts) || 1;
  if (!opts.left) P.l = axisLeft(Array.from({length:4}, (_, i) =>
    Math.round(cmx - (cmx / 3) * i)), null, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const s = sv("svg", {viewBox:"0 0 " + W + " " + h, width:"100%", height:h,
    preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 3; i++){
    const y = P.t + (ih / 3) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W - P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l - 8, y:y + 3.5, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = num(Math.round(cmx - (cmx / 3) * i));
    s.appendChild(t);
  }
  /* medyan çizgisi — ortalamadan daha dürüst, tek büyük iş kaydırmıyor */
  const med = asc[Math.floor(asc.length / 2)];
  counts.forEach((c, i) => {
    const bx = P.l + (iw / bins) * i;
    const bh = (c / cmx) * ih;
    s.appendChild(sv("rect", {x:bx + 1, y:P.t + ih - bh, width:(iw / bins) - 2,
      height:Math.max(0, bh), rx:2, fill:opts.color || "var(--c2)",
      opacity:(i * bw <= med && med < (i + 1) * bw) ? 1 : .62}));
  });
  const mxp = P.l + (med / mx) * iw;
  s.appendChild(sv("line", {x1:mxp, y1:P.t, x2:mxp, y2:P.t + ih,
    stroke:"var(--ink)", "stroke-width":1.4, "stroke-dasharray":"4 3"}));
  const rightRoom = mxp < W - P.r - 90;
  /* beyaz hale — etiket çubuğun üstüne düşse de okunuyor */
  const ml = sv("text", {x:rightRoom ? mxp + 7 : mxp - 7, y:P.t + 10,
    "text-anchor":rightRoom ? "start" : "end",
    fill:"var(--ink)", "font-size":"10", "font-family":"var(--f-ui)",
    stroke:"var(--paper)", "stroke-width":"3", "paint-order":"stroke"});
  ml.textContent = "median " + (opts.fmt ? opts.fmt(med) : num(med));
  s.appendChild(ml);
  /* ⚠ SON TİK KIRPILIYORDU. Ortalanmış etiket çizim alanının dışına
     taşıyor ve "$20,0…" gibi yarım okunuyordu; uçlar hizalanıyor. */
  for (let i = 0; i <= 4; i++){
    const v = (mx / 4) * i;
    const t = sv("text", {x:P.l + (iw / 4) * i, y:h - 10,
      "text-anchor":i === 0 ? "start" : i === 4 ? "end" : "middle",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  /* kesilen kuyruğu SÖYLE — sessizce kırpmak grafiği yalancı yapar */
  if (clipped){
    const c = sv("text", {x:W - P.r, y:P.t + 10, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-ui)"});
    c.textContent = clipped + " above " + (opts.fmt ? opts.fmt(mx) : num(mx)) +
      " in the last bar";
    s.appendChild(c);
  }
  return s;
}

/* ── Eğim. Bu dönem vs geçen dönem, kalem kalem. ──────────────────── */
function slopeChart(items, opts){
  opts = opts || {};
  const list = (items || []).filter(x => (x.a || 0) > 0 || (x.b || 0) > 0).slice(0, 8);
  const h = opts.height || 220, W = 620, P = {t:22, r:150, b:22, l:150};
  if (!list.length) return noData(W, h, opts.empty);
  const mx = Math.max.apply(null, list.map(x => Math.max(x.a || 0, x.b || 0)).concat([1]));
  const ih = h - P.t - P.b;
  const Y = v => P.t + ih - (v / mx) * ih;
  const s = sv("svg", {viewBox:"0 0 " + W + " " + h, width:"100%", height:h,
    preserveAspectRatio:"none", style:"display:block;overflow:visible"});
  [[P.l, opts.aLabel || "before"], [W - P.r, opts.bLabel || "now"]].forEach(c => {
    s.appendChild(sv("line", {x1:c[0], y1:P.t - 8, x2:c[0], y2:P.t + ih + 6,
      stroke:"var(--hair)"}));
    const t = sv("text", {x:c[0], y:P.t - 13, "text-anchor":"middle",
      fill:"var(--muted)", "font-size":"10", "letter-spacing":".06em",
      "font-family":"var(--f-ui)"});
    t.textContent = String(c[1]).toUpperCase();
    s.appendChild(t);
  });
  /* ⚠ ETİKETLER ÜST ÜSTE BİNİYORDU. Yakın değerli üç müşteri aynı satıra
     yazılıp okunmaz hale geliyordu; etiketler en az 13px arayla itiliyor
     (nokta yerinde kalıyor, yalnız yazı kayıyor). */
  const nudge = key => {
    const ys = list.map((it, i) => ({i:i, y:Y(it[key] || 0)}))
      .sort((a, b) => a.y - b.y);
    for (let k = 1; k < ys.length; k++)
      if (ys[k].y - ys[k - 1].y < 13) ys[k].y = ys[k - 1].y + 13;
    const out = [];
    ys.forEach(o => out[o.i] = o.y);
    return out;
  };
  const LA = nudge("a"), LB = nudge("b");
  list.forEach((it, i) => {
    const up = (it.b || 0) >= (it.a || 0);
    const col = it.color || (up ? "var(--good)" : "var(--bad)");
    const ya = Y(it.a || 0), yb = Y(it.b || 0);
    s.appendChild(sv("line", {x1:P.l, y1:ya, x2:W - P.r, y2:yb, stroke:col,
      "stroke-width":1.8, opacity:".8"}));
    s.appendChild(sv("circle", {cx:P.l, cy:ya, r:3.4, fill:col}));
    s.appendChild(sv("circle", {cx:W - P.r, cy:yb, r:3.4, fill:col}));
    const la = sv("text", {x:P.l - 10, y:LA[i] + 3.5, "text-anchor":"end",
      fill:"var(--ink2)", "font-size":"11", "font-family":"var(--f-ui)"});
    la.textContent = (it.k.length > 17 ? it.k.slice(0, 16) + "…" : it.k) +
      "  " + (opts.fmt ? opts.fmt(it.a || 0) : num(it.a || 0));
    s.appendChild(la);
    const lb = sv("text", {x:W - P.r + 10, y:LB[i] + 3.5, fill:"var(--ink)",
      "font-size":"11", "font-weight":"600", "font-family":"var(--f-num)"});
    lb.textContent = opts.fmt ? opts.fmt(it.b || 0) : num(it.b || 0);
    s.appendChild(lb);
  });
  return s;
}

/* ── Kadran çubukları. Halkanın yerine; iç içe yaylar. ────────────── */
function radialBars(items, opts){
  opts = opts || {};
  /* ⚠ BÜYÜK DEĞER DIŞTA. Sırasız çizince en büyük pay en küçük yarıçapa
     düşüyordu ve grafik ters okunuyordu; küçük paylar da sol alttan
     başlayıp havada asılı duran minik hapları andırıyordu. Sıralama
     azalan, başlangıç saat 12, yay 82° boşluk bırakıyor. */
  const list = (items || []).filter(x => x.v > 0)
    .slice().sort((a, b) => b.v - a.v).slice(0, 6);
  const D = opts.size || 200;
  if (!list.length) return noData(300, 160);
  const mx = Math.max.apply(null, list.map(x => x.v));
  const R = D / 2, band = (R * .78) / list.length, SWEEP = .78;
  const s = sv("svg", {width:D, height:D, viewBox:"0 0 " + D + " " + D,
    style:"flex:0 0 auto"});
  list.forEach((it, i) => {
    const r = R - band * (i + .5) - 2;
    const col = it.color || "var(--c" + ((i % 6) + 1) + ")";
    const C = 2 * Math.PI * r;
    const frac = Math.max(.012, it.v / mx) * SWEEP;
    const w = band * .62;
    s.appendChild(sv("circle", {cx:R, cy:R, r:r, fill:"none", stroke:"var(--sunk)",
      "stroke-width":w, "stroke-dasharray":(C * SWEEP) + " " + C,
      "stroke-linecap":"round", transform:"rotate(-90 " + R + " " + R + ")"}));
    s.appendChild(sv("circle", {cx:R, cy:R, r:r, fill:"none", stroke:col,
      "stroke-width":w, "stroke-dasharray":(C * frac) + " " + C,
      "stroke-linecap":"round", transform:"rotate(-90 " + R + " " + R + ")"}));
  });
  const leg = el("div", {style:{display:"flex", flexDirection:"column", gap:"7px",
    minWidth:"0", flex:"1 1 140px"}});
  list.forEach((it, i) => leg.appendChild(el("div", {style:{display:"flex",
    alignItems:"center", gap:"7px", fontSize:"12px", minWidth:"0"}}, [
    el("i", {style:{width:"9px", height:"9px", borderRadius:"2px", flex:"0 0 auto",
      background:it.color || "var(--c" + ((i % 6) + 1) + ")"}}),
    el("span", {style:{flex:"1", minWidth:"0", overflow:"hidden",
      whiteSpace:"nowrap", textOverflow:"ellipsis"}, text:it.k}),
    el("span", {class:"mono", style:{fontWeight:"600", fontSize:"11.5px"},
      text:opts.fmt ? opts.fmt(it.v) : num(it.v)})
  ])));
  return el("div", {class:"viz", style:{display:"flex", gap:"16px", alignItems:"center",
    flexWrap:"wrap", justifyContent:"center"}}, [s, leg]);
}

/* ── Vafil. Yüz kare = bütün; halkanın sayılabilir hali. ──────────── */
function waffle(items, opts){
  opts = opts || {};
  const list = (items || []).filter(x => x.v > 0);
  const tot = list.reduce((a, x) => a + x.v, 0);
  if (!tot) return noData(300, 150);
  const cells = [];
  let used = 0;
  list.forEach((it, i) => {
    const n = i === list.length - 1 ? 100 - used : Math.round(it.v / tot * 100);
    for (let k = 0; k < n; k++)
      cells.push(it.color || "var(--c" + ((i % 6) + 1) + ")");
    used += n;
  });
  const grid = el("div", {style:{display:"grid", gap:"3px",
    gridTemplateColumns:"repeat(10,1fr)", flex:"0 0 auto", width:"152px"}});
  cells.slice(0, 100).forEach(c => grid.appendChild(el("i", {style:{
    display:"block", paddingTop:"100%", borderRadius:"2px", background:c}})));
  const leg = el("div", {style:{display:"flex", flexDirection:"column", gap:"7px",
    minWidth:"0", flex:"1 1 140px"}});
  list.forEach((it, i) => leg.appendChild(el("div", {style:{display:"flex",
    alignItems:"center", gap:"7px", fontSize:"12px", minWidth:"0"}}, [
    el("i", {style:{width:"9px", height:"9px", borderRadius:"2px", flex:"0 0 auto",
      background:it.color || "var(--c" + ((i % 6) + 1) + ")"}}),
    el("span", {style:{flex:"1", minWidth:"0", overflow:"hidden",
      whiteSpace:"nowrap", textOverflow:"ellipsis"}, text:it.k}),
    el("span", {class:"mono mut", style:{fontSize:"11px"},
      text:Math.round(it.v / tot * 100) + "%"}),
    el("span", {class:"mono", style:{fontWeight:"600", fontSize:"11.5px"},
      text:opts.fmt ? opts.fmt(it.v) : num(it.v)})
  ])));
  return el("div", {class:"viz", style:{display:"flex", gap:"16px", alignItems:"center",
    flexWrap:"wrap", justifyContent:"center"}}, [grid, leg]);
}

/* ── Lolipop. Yatay çubuğun daha hafif, daha editoryal hali. ──────── */
function lollipop(items, opts){
  opts = opts || {};
  if (!items || !items.length) return noData(400, opts.height || 150);
  const mx = Math.max.apply(null, items.map(x => x.v).concat([1]));
  const box = el("div", {class:"viz", style:{display:"flex", flexDirection:"column", gap:"11px"}});
  items.forEach((it, i) => {
    const col = it.color || "var(--c" + ((i % 6) + 1) + ")";
    box.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px"}}, [
      el("span", {class:"sm", style:{flex:"0 0 33%", minWidth:"0", overflow:"hidden",
        textOverflow:"ellipsis", whiteSpace:"nowrap", textAlign:"right",
        color:"var(--ink2)"}, text:it.k}),
      el("div", {style:{flex:"1", minWidth:"0", position:"relative", height:"12px"}}, [
        el("i", {style:{position:"absolute", left:"0", top:"5.5px", height:"1.5px",
          width:Math.max(1.5, (it.v / mx) * 100) + "%", background:col,
          opacity:".45", display:"block"}}),
        el("i", {style:{position:"absolute", top:"1.5px", display:"block",
          left:"calc(" + Math.max(1.5, (it.v / mx) * 100) + "% - 4.5px)",
          width:"9px", height:"9px", borderRadius:"50%", background:col}})
      ]),
      el("span", {class:"mono", style:{flex:"0 0 auto", fontWeight:"600",
        fontSize:"12px"}, text:opts.fmt ? opts.fmt(it.v) : num(it.v)})
    ]));
  });
  return box;
}

/* ── İkili. Çubuk + üstünde çizgi; iki büyüklük tek eksende. ──────── */
function comboChart(labels, bars, line, opts){
  opts = opts || {};
  const h = opts.height || 210, W = 720, P = {t:14, r:12, b:26, l:opts.left || 54};
  if (!labels || !labels.length) return noData(W, h);
  const mx = niceMax(Math.max.apply(null, bars.concat([0])) * 1.1) || 10;
  /* ⚠ İKİNCİ EKSEN AYRI ÖLÇEKLENİR. Kâr ciroyla aynı eksende çizilince
     düz bir çizgiye dönüşüyor ve hiçbir şey anlatmıyor. */
  const lmn = Math.min(0, Math.min.apply(null, line.concat([0])));
  const lmx = Math.max.apply(null, line.concat([1])) * 1.15;
  const lspan = (lmx - lmn) || 1;
  if (!opts.left) P.l = axisLeft(Array.from({length:5}, (_, i) =>
    mx - (mx / 4) * i), opts.fmt, P.l);
  const iw = W - P.l - P.r, ih = h - P.t - P.b;
  const s = sv("svg", {viewBox:"0 0 " + W + " " + h, width:"100%", height:h,
    preserveAspectRatio:"none", style:"display:block"});
  for (let i = 0; i <= 4; i++){
    const y = P.t + (ih / 4) * i, v = mx - (mx / 4) * i;
    s.appendChild(sv("line", {x1:P.l, y1:y, x2:W - P.r, y2:y, stroke:"var(--hair2)"}));
    const t = sv("text", {x:P.l - 8, y:y + 3.5, "text-anchor":"end",
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-num)"});
    t.textContent = opts.fmt ? opts.fmt(v) : num(v);
    s.appendChild(t);
  }
  const bw = Math.min(40, (iw / labels.length) * .56);
  const X = i => P.l + (iw / labels.length) * (i + .5);
  bars.forEach((v, i) => {
    const bh = Math.max(0, (Math.max(0, v) / mx) * ih);
    s.appendChild(sv("rect", {x:X(i) - bw / 2, y:P.t + ih - bh, width:bw,
      height:bh, rx:2.5, fill:opts.barColor || "var(--c1)", opacity:".34"}));
  });
  const LY = v => P.t + ih - ((v - lmn) / lspan) * ih;
  if (lmn < 0)
    s.appendChild(sv("line", {x1:P.l, y1:LY(0), x2:W - P.r, y2:LY(0),
      stroke:"var(--hair)", "stroke-dasharray":"3 3"}));
  const pts = line.map((v, i) => X(i) + "," + LY(v));
  s.appendChild(sv("polyline", {points:pts.join(" "), fill:"none",
    stroke:opts.lineColor || "var(--accent)", "stroke-width":2.2,
    "stroke-linejoin":"round", "stroke-linecap":"round"}));
  line.forEach((v, i) => s.appendChild(sv("circle", {cx:X(i), cy:LY(v), r:2.6,
    fill:opts.lineColor || "var(--accent)", stroke:"var(--paper)", "stroke-width":1.3})));
  const step = Math.ceil(labels.length / 12);
  labels.forEach((L, i) => {
    if (i % step && i !== labels.length - 1) return;
    /* ⚠ SON ETİKET ORTALANIRSA YARISI DIŞARI TAŞAR. Son ay çizimin sağ
   kenarına düşüyor; "Jul 26" ortalanınca kartın dışına sarkıyor ve 100
   üründen 18'inde görünüyordu. İlk ve son etiket kenara yaslanır. */
    const t = sv("text", {x:X(i), y:h - 8, "text-anchor":(i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"),
      fill:"var(--muted)", "font-size":"10", "font-family":"var(--f-ui)"});
    t.textContent = L;
    s.appendChild(t);
  });
  return s;
}

/* ── 14_grid.js ── */
/* ═══ TABLO + FORM MOTORU ═══════════════════════════════════════════════
   17 modülün 13'ü aynı şekil: listele / ara / sırala / ekle / düzenle /
   sil / dışa aktar. O şekli BİR kez yazıp konfigürasyonla besliyoruz.
   ⚠ MOTOR ≠ ÜRÜN. Alan adları, doğrulama ve türetilmiş sütunlar modülün
     kendi dosyasında durur; burası onları bilmez.                        */

let SORT = {};       /* modül başına {k, dir} */
let QUERY = {};      /* modül başına arama metni */
let SHOWN = {};      /* modül başına kaç satır çizildi */

/* ⚠ TABLO TÜM SATIRLARI ÇİZMİYOR — ÇİZEMEZ. Salon demosunda 9.817
   randevu vardı ve sayfa iki DAKİKADAN uzun sürede açılıyordu; ölçüm
   betiği bile zaman aşımına uğradı. Bu demo sorunu değil: üç yıl veri
   biriken her müşteri aynı duvara çarpar ve ürünü "donuyor" diye iade
   eder. İlk PAGE_ROWS satır çiziliyor, altta "N / M" ve daha fazlasını
   getiren düğmeler var.
   ⚠ TOPLAM SATIRI TÜM EŞLEŞENLERİ sayar, ekrandakini değil — yoksa
   kullanıcı yanlış toplam görür. */
const PAGE_ROWS = 150;

/* ── Sütun türleri. cls: hizalama sınıfı, get: değer, show: hücre içeriği */
const CELL = {
  text:  { get:(r,c) => r[c.k] || "", show:(v) => v || el("span",{class:"mut"},"—") },
  num:   { cls:"n", get:(r,c) => Number(r[c.k])||0, show:(v,r,c) => num(v, c.dp||0) },
  money: { cls:"n", get:(r,c) => Number(r[c.k])||0, show:(v) => money(v) },
  money0:{ cls:"n", get:(r,c) => Number(r[c.k])||0, show:(v) => money0(v) },
  date:  { cls:"", get:(r,c) => r[c.k] || "", show:(v) => v ? date(v) : el("span",{class:"mut"},"—") },
  pct:   { cls:"n", get:(r,c) => Number(r[c.k])||0, show:(v,r,c) => pct(v, c.dp) }
};

function cellValue(r, c){
  if (c.calc) return c.calc(r);
  const t = CELL[c.type] || CELL.text;
  return t.get(r, c);
}
function cellNode(r, c){
  if (c.render) return c.render(r);
  const v = cellValue(r, c);
  const t = CELL[c.type] || CELL.text;
  const n = t.show(v, r, c);
  return typeof n === "object" ? n : document.createTextNode(String(n));
}

function searchable(r, cols){
  return cols.map(c => {
    if (c.search === false) return "";
    const v = c.searchVal ? c.searchVal(r) : cellValue(r, c);
    return typeof v === "object" ? "" : String(v);
  }).join(" ").toLowerCase();
}

/* ── ANA TABLO ─────────────────────────────────────────────────────── */
function dataTable(cfg){
  const id = cfg.id;
  const cols = cfg.cols.filter(Boolean);
  let list = (cfg.rows || []).slice();

  /* ara */
  const q = (QUERY[id] || "").trim().toLowerCase();
  if (q) list = list.filter(r => searchable(r, cols).indexOf(q) >= 0);
  if (cfg.filter) list = list.filter(cfg.filter);

  /* sırala */
  const so = SORT[id] || (cfg.sort ? {k:cfg.sort, dir:cfg.dir || "desc"} : null);
  if (so){
    const c = cols.find(x => x.k === so.k);
    if (c){
      const dir = so.dir === "asc" ? 1 : -1;
      list.sort((a, b) => {
        let x = cellValue(a, c), y = cellValue(b, c);
        if (typeof x === "object") x = ""; if (typeof y === "object") y = "";
        if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
        return String(x).localeCompare(String(y), undefined, {numeric:true}) * dir;
      });
    }
  }

  const tbl = el("table", {class:"dt"});
  /* başlık */
  const trh = el("tr");
  cols.forEach(c => {
    const t = CELL[c.type] || CELL.text;
    const cls = [(c.cls || t.cls || ""), (c.sortable === false ? "no-sort" : ""),
                 (so && so.k === c.k ? so.dir : "")].filter(Boolean).join(" ");
    trh.appendChild(el("th", {
      class:cls, style:c.w ? {width:c.w} : null, title:c.hint || null,
      onclick: c.sortable === false ? null : () => {
        const cur = SORT[id];
        SORT[id] = (cur && cur.k === c.k)
          ? {k:c.k, dir:cur.dir === "asc" ? "desc" : "asc"}
          : {k:c.k, dir:(c.type === "money" || c.type === "num" || c.type === "date") ? "desc" : "asc"};
        SHOWN[id] = 0; cfg.repaint();
      }
    }, [c.h, c.sortable === false ? null : el("span", {class:"ar", text:"▲"})]));
  });
  if (cfg.onEdit || cfg.onDelete || cfg.rowActions)
    trh.appendChild(el("th", {class:"act no-sort", text:""}));
  tbl.appendChild(el("thead", {}, trh));

  /* gövde */
  const limit = SHOWN[id] || PAGE_ROWS;
  const shown = list.length > limit ? list.slice(0, limit) : list;
  const tb = el("tbody");
  shown.forEach(r => {
    const tr = el("tr", cfg.onEdit ? {ondblclick: () => cfg.onEdit(r), style:{cursor:"pointer"}} : {});
    cols.forEach(c => {
      const t = CELL[c.type] || CELL.text;
      const td = el("td", {class:[(c.cls || t.cls || ""), (c.tdClass ? c.tdClass(r) : "")]
        .filter(Boolean).join(" ")});
      td.appendChild(cellNode(r, c));
      tr.appendChild(td);
    });
    if (cfg.onEdit || cfg.onDelete || cfg.rowActions){
      const td = el("td", {class:"act"});
      const box = el("div", {style:{display:"flex", gap:"2px", justifyContent:"flex-end"}});
      (cfg.rowActions ? cfg.rowActions(r) : []).forEach(a => box.appendChild(
        el("button", {class:"icon-btn", html:a.icon, title:a.title,
          onclick:e => { e.stopPropagation(); a.act(r); }})));
      if (cfg.onEdit) box.appendChild(el("button", {class:"icon-btn", html:ICON.edit,
        title:"Edit", onclick:e => { e.stopPropagation(); cfg.onEdit(r); }}));
      if (cfg.onDelete) box.appendChild(el("button", {class:"icon-btn", html:ICON.trash,
        title:"Delete", style:{color:"var(--bad)"},
        onclick:e => { e.stopPropagation(); cfg.onDelete(r); }}));
      td.appendChild(box); tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);

  /* toplam satırı — ⚠ TÜM eşleşenlerin toplamı, ekrandakinin değil */
  if (cfg.footer){
    const tf = el("tr");
    const f = cfg.footer(list);
    cols.forEach((c, i) => {
      const t = CELL[c.type] || CELL.text;
      const v = f[c.k];
      tf.appendChild(el("td", {class:c.cls || t.cls || "",
        text: v !== undefined ? v : (i === 0 ? "Total · " + list.length : "")}));
    });
    if (cfg.onEdit || cfg.onDelete || cfg.rowActions) tf.appendChild(el("td", {class:"act"}));
    tbl.appendChild(el("tfoot", {}, tf));
  }

  /* ── daha fazlasını getir ── */
  const more = list.length - shown.length;
  const moreBar = more > 0 ? el("div", {style:{display:"flex", gap:"9px",
    alignItems:"center", flexWrap:"wrap", padding:"11px 12px",
    borderTop:"1px solid var(--hair)", background:"var(--sunk)"}}, [
    el("span", {class:"sm mut"},
      "Showing " + num(shown.length) + " of " + num(list.length) + " — "
      + num(more) + " more"),
    el("div", {style:{flex:"1"}}),
    el("button", {class:"btn sm", text:"Show " + num(Math.min(more, PAGE_ROWS * 4)) + " more",
      onclick:() => { SHOWN[id] = limit + PAGE_ROWS * 4; cfg.repaint(); }}),
    more <= 4000 ? el("button", {class:"btn sm ghost", text:"Show all",
      onclick:() => { SHOWN[id] = list.length; cfg.repaint(); }}) : null,
    el("span", {class:"sm mut", style:{flexBasis:"100%"}},
      "Totals below count every matching row, not just the ones on screen.")
  ]) : null;

  if (!list.length){
    return el("div", {}, cfg.empty || el("div", {class:"empty"}, [
      el("div", {html:ICON.search}),
      el("h3", {text: q ? "No matches" : "Nothing here yet"}),
      el("p", {text: q ? "Try a different search term."
                       : "Records you add will appear in this table."})
    ]));
  }
  return moreBar
    ? el("div", {style:{display:"flex", flexDirection:"column", minHeight:"0",
        height:"100%"}}, [
        el("div", {class:"tw", style:{flex:"1", minHeight:"0"}}, tbl), moreBar])
    : el("div", {class:"tw"}, tbl);
}

/* ── ARAÇ ÇUBUĞU ───────────────────────────────────────────────────── */
function toolbar(cfg){
  const bar = el("div", {class:"toolbar"});
  if (cfg.search !== false){
    bar.appendChild(el("div", {class:"search"}, [
      el("div", {html:ICON.search}),
      el("input", {class:"inp", type:"search", placeholder:cfg.placeholder || "Search…",
        value:QUERY[cfg.id] || "",
        oninput:e => { QUERY[cfg.id] = e.target.value; cfg.repaint(true); }})
    ]));
  }
  (cfg.controls || []).forEach(c => bar.appendChild(c));
  bar.appendChild(el("div", {style:{flex:"1"}}));
  (cfg.actions || []).forEach(a => bar.appendChild(a));
  return bar;
}

function segControl(opts, cur, on){
  const b = el("div", {class:"seg"});
  opts.forEach(o => b.appendChild(el("button", {
    class:o.v === cur ? "on" : "", text:o.t, onclick:() => on(o.v)})));
  return b;
}

/* ── FORM. Alan tanımından modal üretir, doğrular, kaydeder. ───────── */
function fieldNode(f, rec){
  const v = rec[f.k];
  let inp;
  if (f.type === "select" || f.type === "ref"){
    const opts = f.type === "ref" ? refOptions(f) : (typeof f.opts === "function" ? f.opts() : f.opts);
    inp = el("select", {class:"inp", name:f.k});
    if (!f.req) inp.appendChild(el("option", {value:"", text:f.blank || "— none —"}));
    opts.forEach(o => {
      const val = typeof o === "object" ? o.v : o, lab = typeof o === "object" ? o.t : o;
      inp.appendChild(el("option", {value:val, text:lab, selected:String(val) === String(v)}));
    });
    if (v !== undefined && v !== null) inp.value = v;
  } else if (f.type === "textarea"){
    inp = el("textarea", {class:"inp", name:f.k, rows:f.rows || 3,
      placeholder:f.ph || ""}); inp.value = v || "";
  } else if (f.type === "check"){
    inp = el("label", {style:{display:"flex", gap:"8px", alignItems:"center",
      fontSize:"13px", padding:"7px 0", cursor:"pointer"}}, [
      el("input", {type:"checkbox", name:f.k, checked:!!v}),
      el("span", {text:f.hint || f.label})
    ]);
    return el("div", {class:"field" + (f.full ? " full" : "")}, inp);
  } else {
    const t = f.type === "date" ? "date" : (f.type === "num" || f.type === "money") ? "number" : "text";
    inp = el("input", {class:"inp" + (t === "number" ? " num" : ""), type:t, name:f.k,
      step:f.type === "money" ? "0.01" : (f.step || "any"),
      min:f.min !== undefined ? f.min : null,
      placeholder:f.ph || "", value: v === undefined || v === null ? "" : v});
  }
  return el("div", {class:"field" + (f.full ? " full" : "")}, [
    el("label", {text:f.label + (f.req ? " *" : "")}), inp,
    f.hint && f.type !== "check" ? el("div", {class:"sm mut", text:f.hint}) : null
  ]);
}
function refOptions(f){
  return rows(f.ref).map(r => ({v:r.id, t:f.refLabel ? f.refLabel(r) : (r.name || r.id)}))
    .sort((a,b) => String(a.t).localeCompare(String(b.t)));
}
function readForm(form, fields){
  const out = {};
  fields.forEach(f => {
    const n = form.querySelector('[name="' + f.k + '"]');
    if (!n) return;
    if (f.type === "check") out[f.k] = n.checked;
    else if (f.type === "num" || f.type === "money"){
      out[f.k] = n.value === "" ? null : Number(n.value);
    } else out[f.k] = n.value;
  });
  return out;
}
/* ⚠ ZORUNLU ALAN SESSİZ GEÇMEZ. Bir kez boş referansla kayıt oluştu ve
   raporlarda "undefined" göründü. Eksikte modal KAPANMAZ.               */
function validate(form, fields){
  let bad = null;
  fields.forEach(f => {
    if (!f.req) return;
    const n = form.querySelector('[name="' + f.k + '"]');
    if (!n) return;
    const empty = f.type === "check" ? false : !String(n.value || "").trim();
    n.style.borderColor = empty ? "var(--bad)" : "";
    if (empty && !bad) bad = {n:n, f:f};
  });
  if (bad){ bad.n.focus(); toast(bad.f.label + " is required.", "err"); return false; }
  return true;
}

function recordForm(cfg){
  const rec = cfg.rec ? JSON.parse(JSON.stringify(cfg.rec)) : {};
  const isNew = !rec.id;
  const fields = typeof cfg.fields === "function" ? cfg.fields(rec) : cfg.fields;
  const form = el("form", {class:"form-grid", onsubmit:e => e.preventDefault()});
  fields.forEach(f => form.appendChild(fieldNode(f, rec)));
  /* ⚠ SIRA (form, rec). Ters yazılmıştı ve "New load" düğmesi HİÇ
     açılmıyordu: loadSummary form sanarak kayıt nesnesine
     addEventListener çağırıyordu. Sözdizimi denetimi göremez —
     yalnız tarayıcıda tıklayınca çıkar. */
  if (cfg.extra) form.appendChild(cfg.extra(form, rec));
  modal({
    size:cfg.size || "", title:cfg.title || (isNew ? "New record" : "Edit record"),
    sub:cfg.sub, body:form,
    buttons:[
      isNew || !cfg.onDelete ? null
        : {label:"Delete", kind:"danger", act:() => { cfg.onDelete(rec); return true; }},
      "-", {label:"Cancel"},
      {label:isNew ? "Create" : "Save", kind:"pri", act:() => {
        if (!validate(form, fields)) return false;
        const data = Object.assign(rec, readForm(form, fields));
        if (!data.id) data.id = uid();
        if (cfg.before) cfg.before(data);
        cfg.onSave(data);
        return true;
      }}
    ].filter(Boolean)
  });
}

/* ═══ DIŞA AKTARMA + YAZDIRMA ═══════════════════════════════════════════
   ⚠ CSV'de Excel tuzağı: "=" ile başlayan hücre formül gibi çalıştırılıyor.
     Başına tırnak koyup etkisizleştiriyoruz.
   ⚠ Yazdırma AYRI PENCERE, TEMASIZ. Uygulamanın koyu teması faturaya
     geçince siyah zeminli belge çıktı — belge her zaman beyaz/siyah.     */

function dl(name, mime, text){
  const b = new Blob([text], {type:mime});
  const u = URL.createObjectURL(b);
  const a = el("a", {href:u, download:name});
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 400);
}
function csvCell(v){
  let s = v === null || v === undefined ? "" : String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV(name, cols, list){
  if (!list.length) return toast("Nothing to export.", "err");
  const use = cols.filter(c => c.h);
  const head = use.map(c => csvCell(c.h)).join(",");
  const body = list.map(r => use.map(c => {
    let v = cellValue(r, c);
    if (typeof v === "object") v = "";
    return csvCell(v);
  }).join(",")).join("\n");
  toast("CSV export is part of the full version.", "err");
  return; dl(name + ".csv", "text/csv;charset=utf-8", "﻿" + head + "\n" + body);
  toast(list.length + " rows exported.");
}
function exportBackup(){
  toast("Saving a backup is part of the full version.", "err");
}
function importBackup(){
  const inp = el("input", {type:"file", accept:".json", style:{display:"none"}});
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d; try { d = JSON.parse(r.result); }
      catch(e){ return toast("That file isn't a valid backup.", "err"); }
      const n = ["loads","trucks","drivers","brokers","invoices"]
        .reduce((a, k) => a + (Array.isArray(d[k]) ? d[k].length : 0), 0);
      confirmBox("Replace everything?",
        "This backup holds " + n + " records. Your current data on this device will be replaced.",
        () => toast("Restoring a backup is part of the full version.", "err"), "Restore");
    };
    r.readAsText(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(() => inp.remove(), 900);
}

const FAVICON_DEFAULT =
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
  '<rect width="64" height="64" rx="14" fill="#161C24"/>' +
  '<rect x="9" y="21" width="27" height="18" rx="2.5" fill="#E8590C"/>' +

function faviconHref(){

const n0 = v => Number(v) || 0;

   ⚠ ÖLÇÜLDÜ: salon demosunda müşteri tablosu AÇILMIYORDU. Sebep O(n²):
     `lapsedClients()` tüm müşteri × tüm randevu tarıyor ve tablo bunu HER

let _MEMO = {};
function memo(key, fn){
  if (!(key in _MEMO)) _MEMO[key] = fn();
  return _MEMO[key];
}
function memoClear(){ _MEMO = {}; }

const CK = () => V.job.clientKey;

const jobQty   = j => (V.job.qty ? V.job.qty(j) : 0);

const jobCardSub = j => (V.job.cardSub ? V.job.cardSub(j) : clientName(j[CK()]));
const qtyUnit  = () => (V.job.qtyUnit ? V.job.qtyUnit() : "");
const qtyUnitLabel = () => (V.job.qtyHead || qtyUnit().toUpperCase());

function isOpen(j){ return V.job.open.indexOf(j.status) >= 0; }
function isRevenue(j){ return V.job.dead.indexOf(j.status) < 0; }

function inRange(d, from, to){
  if (!d) return false;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}
function jobsIn(from, to){
  return rows(V.job.key).filter(j => isRevenue(j) && inRange(jobDate(j), from, to));
}
function sumBy(list, keyFn, valFn){
  const m = new Map();
  list.forEach(r => {
    const k = keyFn(r); if (k === "" || k === null || k === undefined) return;
    m.set(k, (m.get(k) || 0) + valFn(r));
  });
  return m;
}
function topN(map, n, fmtKey){
  return Array.from(map.entries())
    .map(([k, v]) => ({k:fmtKey ? fmtKey(k) : k, v:v}))
    .sort((a, b) => b.v - a.v).slice(0, n || 5);
}
/* ⚠ İÇİNDE BULUNULAN AY DIŞARIDA. Yarım ay grafiğin sonunda uçurum
   yapıyor ve iş çöküyormuş gibi görünüyor — demo ekranında en çok göze
   batan şey buydu. Bu ayın durumu KPI kartlarında zaten var. */
function lastMonths(n, includeCurrent){
  const out = [], d = new Date(); d.setDate(1);
  const off = includeCurrent ? 0 : 1;
  for (let i = n - 1 + off; i >= off; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"));
  }
  return out;
}

/* Çalışan hakedişi — ödeme tipi her meslekte aynı üç şekilden biri. */
function workerPay(w, list){
  const wf = V.entities[V.job.workerEntity].jobField;
  const ls = list || rows(V.job.key).filter(j => j[wf] === w.id && isRevenue(j));
  const g = ls.reduce((a, j) => a + jobValue(j), 0);
  const q = ls.reduce((a, j) => a + jobQty(j), 0);
  if (w.payType === "unit") return q * n0(w.payRate);
  if (w.payType === "flat") return ls.length * n0(w.payRate);
  return g * n0(w.payRate) / 100;
}

/* ── Fatura yardımcıları (alan-bağımsız) ─────────────────────────────── */
function nextInvoiceNo(){
  return (S.set.invoicePrefix || "INV-") + (n0(S.set.nextInvoice) || 1001);
}
/* ⚠ FATURA → İŞ İNDEKSİ. Eskiden her fatura için TÜM iş kayıtları
   taranıyordu: salonda 10.000 fatura × 11.771 randevu = 117 milyon işlem,
   fatura sayfası 3,8 saniyede açılıyordu. Tek geçişte indeks kuruluyor,
   her çizimde bir kez. */
function invoiceIndex(){
  return memo("core:invJobs", function(){
    const ix = {};
    rows(V.job.key).forEach(j => {
      if (!j.invoiceId) return;
      (ix[j.invoiceId] || (ix[j.invoiceId] = [])).push(j);
    });
    return ix;
  });
}
function invoiceTotal(inv){
  const js = invoiceIndex()[inv.id] || [];
  return js.reduce((a, j) => a + jobValue(j), 0) - n0(inv.discount) + n0(inv.extra);
}
function invoiceDue(inv){
  const days = {"Net 15":15, "Net 30":30, "Net 45":45, "Net 60":60,
                "Due on receipt":0, "Quick Pay (2 days)":2}[inv.terms || S.set.invoiceTerms];
  return addDays(inv.date, days === undefined ? 30 : days);
}
function invoiceStatus(inv){
  if (inv.paidDate) return {t:"Paid", pill:"good"};
  const due = invoiceDue(inv), od = due ? daysBetween(due, today()) : 0;
  if (od > 0) return {t:"Overdue " + od + "d", pill:"bad"};
  return {t:"Open", pill:"info"};
}

/* ── Uyarılar. Ortak üç kaynak + config'in eklediği. ─────────────────── */
function alerts(){
  const out = [], t = today();
  rows("docs").forEach(d => {
    if (!d.expires) return;
    const left = daysBetween(t, d.expires);
    if (left === null || left > 45) return;
    out.push({kind:left < 0 ? "bad" : "warn", icon:ICON.doc,
      text:(d.name || "Document") + (d.ownerLabel ? " · " + d.ownerLabel : ""),
      note:left < 0 ? "Expired " + (-left) + " days ago" : "Expires in " + left + " days",
      go:"docs"});
  });
  rows("invoices").forEach(inv => {
    if (inv.paidDate) return;
    const due = invoiceDue(inv), od = due ? daysBetween(due, t) : 0;
    if (od <= 0) return;
    out.push({kind:od > 15 ? "bad" : "warn", icon:ICON.invoice,
      text:(inv.no || "Invoice") + " · " + clientName(inv.clientId),
      note:od + " days overdue · " + money(invoiceTotal(inv)), go:"invoices"});
  });
  rows(V.job.key).forEach(j => {
    if (j.status !== V.job.doneState) return;
    const age = daysBetween(jobDate(j), t);
    if (age !== null && age > 3)
      out.push({kind:"warn", icon:ICON.cash,
        text:W("job") + " " + jobRef(j) + " not invoiced",
        note:"Finished " + age + " days ago · " + money(jobValue(j)), go:V.job.key});
  });
  if (V.alerts) V.alerts().forEach(a => out.push(a));
  const order = {bad:0, warn:1};
  return out.sort((a, b) => (order[a.kind] - order[b.kind])).slice(0, 40);
}

/* ═══ KAYIT KİPİ PANOSU (ÇEKİRDEK) ══════════════════════════════════════
   ⚠ NEDEN AYRI. Mevcut kompozisyonlar `costMix` · `marginGauge` ·
     `rankClients` gibi PARA panellerini sabit çağırıyor. Tarantula bakım
     kaydında bunlar boş kutu olarak duruyor ve ürünü ucuz gösteriyor.
   ⚠ ÜRÜN BAŞINA İŞ YOK. Paneller `V.metric` ve `V.subject` bildiriminden
     kendini kuruyor; 161 kayıt ürünü için tek tek panel yazılmıyor.

     V.metric  = {key, label, unit, low, high, fmt}   ← izlenen asıl sayı
     V.metric2 = ikinci seri (opsiyonel, örn. diyastolik)
     V.subject = {entity, key, label}                 ← neyin kaydı
     V.streak  = {label, everyDays}                   ← seri/aralık kuralı  */

/* ⚠ İZLENEN SAYI HER ZAMAN BİR ALAN DEĞİL. Crohn'da asıl sayı beş
   alandan HESAPLANAN Harvey-Bradshaw indeksi; kayıtta öyle bir alan yok.
   `V.metric.calc` verilirse panel onu kullanıyor. */
function metricVal(m, j){ return m && m.calc ? n0(m.calc(j)) : n0(j[(m || {}).key]); }
function mVal(j){ return metricVal(V.metric, j); }
function mFmt(v){ const m = V.metric || {};
  return m.fmt ? m.fmt(v) : (num2 ? num2(v) : Math.round(v * 10) / 10) +
    (m.unit ? " " + m.unit : ""); }
function logRows(st){ return jobsIn(st.from, today()); }

/* ── izlenen sayının zaman eğrisi (para değil) ─────────────────────── */
function logTrend(st, h){
  const m = V.metric || {}; const ht = h || 230;
  const lab = st.months.map(monthLabel);
  const avgBy = (mm) => st.months.map(mk => {
    const g = rows(V.job.key).filter(j => isRevenue(j) && monthKey(jobDate(j)) === mk);
    if (!g.length) return 0;
    return g.reduce((a, j) => a + metricVal(mm, j), 0) / g.length;
  });
  const s1 = avgBy(m);
  const series = [{data:s1, color:"var(--c1)"}];
  if (V.metric2) series.push({data:avgBy(V.metric2), color:"var(--c5)"});
  const dot = c => el("i", {style:{width:"9px", height:"9px", borderRadius:"2px", background:c}});
  const legend = el("div", {class:"sm", style:{display:"flex", gap:"12px"}},
    [[m.label, "var(--c1)"]].concat(V.metric2 ? [[V.metric2.label, "var(--c5)"]] : [])
      .map(p => el("span", {style:{display:"flex", alignItems:"center", gap:"5px"}},
        [dot(p[1]), el("span", {class:"mut", text:p[0]})])));
  return el("div", {class:"panel chart grow"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:m.label + " by Month"}),
      el("div", {class:"sp"}), legend]),
    el("div", {class:"panel-body"},
      areaChart(lab, series, {height:ht, fmt:mFmt, min:"auto"}))
  ]);
}

/* ── hedef bandı içinde kalma oranı ────────────────────────────────── */
function inRangePct(list){
  const m = V.metric || {};
  if (m.low === undefined && m.high === undefined) return null;
  const ok = list.filter(j => {
    const v = mVal(j);
    if (m.low !== undefined && v < m.low) return false;
    if (m.high !== undefined && v > m.high) return false;
    return true;
  }).length;
  return list.length ? 100 * ok / list.length : 0;
}
function logRangeGauge(st){
  const m = V.metric || {};
  const list = logRows(st);
  const pct = inRangePct(list);
  if (pct === null) return null;
  const hedef = m.targetPct === undefined ? 80 : m.targetPct;
  return el("div", {class:"panel chart grow"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"In Target Range"}),
      el("div", {class:"sp"}),
      el("div", {class:"hint", text:"target " + hedef + "% · band " +
        (m.low !== undefined ? mFmt(m.low) : "") +
        (m.low !== undefined && m.high !== undefined ? " – " : "") +
        (m.high !== undefined ? mFmt(m.high) : "")})]),
    el("div", {class:"panel-body"},
      gauge(pct, {label:"in range", size:170,
        color:pct >= hedef ? "var(--good)" : pct >= hedef * 0.75 ? "var(--warn)" : "var(--bad)"}))
  ]);
}

/* ── neyin kaydı: özneye göre sıralama (araç, hayvan, bitki…) ─────── */
function logRankSubject(st){
  const s = V.subject; if (!s) return null;
  const list = logRows(st);
  const m = new Map();
  list.forEach(j => {
    const id = j[s.key]; if (!id) return;
    const r = m.get(id) || {n:0, sum:0};
    r.n++; r.sum += mVal(j); m.set(id, r);
  });
  const d = Array.from(m.entries()).map(([id, r]) => ({
    k:nameOf(s.entity, id) || "—", v:r.n, avg:r.sum / r.n}))
    .sort((a, b) => b.v - a.v).slice(0, 8);
  if (!d.length) return null;
  return el("div", {class:"panel chart grow"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"Entries by " + (s.label || "Subject")}),
      el("div", {class:"sp"}), el("div", {class:"hint", text:"count · average"})]),
    el("div", {class:"panel-body"},
      hbars(d.map(x => ({k:x.k, v:x.v})), {fmt:num}))
  ]);
}

/* ── kayıt sıklığı: hangi gün, ne kadar boşluk ────────────────────── */
function logCadence(st){
  const list = logRows(st).slice().sort((a, b) =>
    jobDate(a) < jobDate(b) ? -1 : 1);
  if (list.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < list.length; i++)
    gaps.push(daysBetween(jobDate(list[i - 1]), jobDate(list[i])));
  const buckets = [0, 0, 0, 0, 0];
  gaps.forEach(g => buckets[g <= 1 ? 0 : g <= 3 ? 1 : g <= 7 ? 2 : g <= 14 ? 3 : 4]++);
  return el("div", {class:"panel chart grow"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"How Often You Log"}),
      el("div", {class:"sp"}), el("div", {class:"hint", text:"gap between entries"})]),
    el("div", {class:"panel-body"},
      barChart(["same/next day", "2–3 days", "4–7 days", "1–2 weeks", "longer"],
        buckets, {height:200, color:"var(--c4)", fmt:num}))
  ]);
}

/* ── 30_dashboard.js ── */
/* ═══ ANA SAYFA — KOMPOZİSYONLAR ════════════════════════════════════════
   ⚠ DERİ DEĞİŞTİRMEK YETMİYOR. Renk/font/çerçeve farklı olsa da her ürün
     aynı iskeleti kullanırsa (KPI şeridi üstte → grafik → uyarı → tablo)
     100 ürün yine birbirinin kopyası gibi duruyor. Bu yüzden PANONUN
     KOMPOZİSYONU da bir eksen: `V.design.dash`.

       kpi     sayı önce   — 8 kart, sonra grafik + durum, sonra liste
       hero    tek büyük sayı — üstte devasa rakam, yanında destek
       split   iki sütun   — solda iş akışı, sağda yığılı istatistik
       board   tahta önce  — aşama tahtası panonun kendisi, sayılar altta
       report  grafik önce — geniş grafik üstte, KPI ince şerit, sonra tablo
       focus   bugün önce  — "bugün ne var" ana panel, sayılar ikincil

   ⚠ HEPSİ AYNI KELİME DAĞARCIĞINI kullanıyor (kpiRow, trend, statusPart,
     attention, ranking, recentTable). Yeni kompozisyon eklemek widget
     yazmak değil, DİZİLİM yazmak.                                        */

/* ⚠ MEVSİMLİK ÜRÜNLERDE 90 GÜN YANLIŞ PENCERE. Kayak günlüğü eylülde
   açıldığında son 90 günde tek gün yoktu ve pano boş görünüyordu — oysa
   sezon şubatta doluydu. `V.periodDays` bildiren ürünler kendi doğal
   dönemiyle açılıyor; kullanıcı yine de düğmeden değiştirebiliyor.   */
let DASH_RANGE = null;
function dashDays(){
  return DASH_RANGE || n0((typeof V === "object" && V.periodDays) || 0) || 90;
}

function kpi(o){
  return el("div", {class:"kpi", style:{"--kc":o.color || "var(--accent)"}}, [
    el("div", {class:"kpi-label", text:o.label}),
    el("div", {class:"kpi-val", text:o.value}),
    el("div", {class:"kpi-foot"}, [
      o.delta !== undefined && o.delta !== null
        ? el("span", {class:"kpi-delta " + (o.delta > .05 ? "up" : o.delta < -.05 ? "down" : "flat"),
            text:(o.delta > 0 ? "▲ " : o.delta < 0 ? "▼ " : "") + Math.abs(o.delta).toFixed(0) + "%"})
        : null,
      o.note ? el("span", {class:"kpi-note", text:o.note}) : null,
      o.spark && o.spark.length > 1
        ? el("span", {class:"kpi-spark"}, spark(o.spark, 60, 22, o.color || "var(--accent)"))
        : null
    ])
  ]);
}

function periodStats(days){
  const from = addDays(today(), -days), prevFrom = addDays(today(), -days * 2);
  const cur = jobsIn(from, today()), prv = jobsIn(prevFrom, from);
  const rev = cur.reduce((a, j) => a + jobValue(j), 0);
  const revPrev = prv.reduce((a, j) => a + jobValue(j), 0);
  const netRev = cur.reduce((a, j) => a + jobNet(j), 0);
  const qty = cur.reduce((a, j) => a + jobQty(j), 0);
  const exp = rows("expenses").filter(e => inRange(e.date, from, today()))
    .reduce((a, e) => a + n0(e.amount), 0);
  const inputCost = V.job.unitEfficiency
    ? rows(V.job.unitEfficiency.entity).filter(f => inRange(f.date, from, today()))
        .reduce((a, f) => a + n0(f.cost), 0) : 0;
  const open = rows(V.job.key).filter(isOpen);
  const invs = rows("invoices");
  const ar = invs.filter(i => !i.paidDate).reduce((a, i) => a + invoiceTotal(i), 0);
  const overdue = invs.filter(i => {
    if (i.paidDate) return false;
    const d = invoiceDue(i); return d && daysBetween(d, today()) > 0;
  });
  /* ⚠ TEKRAR EDEN GELİR. İş kaydından gelmeyen ciro (üyelik, aidat, kira,
     retainer) V.recurring ile veriliyor. Yoksa K/Z yalancı çıkıyor. */
  const recur = V.recurring ? V.recurring(from, today()) : 0;
  const recurPrev = V.recurring ? V.recurring(prevFrom, from) : 0;
  const months = lastMonths(12);
  const byM = sumBy(rows(V.job.key).filter(isRevenue), j => monthKey(jobDate(j)), j => jobValue(j));
  const expByM = sumBy(rows("expenses"), e => monthKey(e.date), e => n0(e.amount));
  const inByM = V.job.unitEfficiency
    ? sumBy(rows(V.job.unitEfficiency.entity), f => monthKey(f.date), f => n0(f.cost))
    : new Map();
  return {
    from:from, days:days, cur:cur, prv:prv,
    jobRev:rev, recurring:recur,
    rev:rev + recur, revPrev:revPrev + recurPrev,
    net:netRev, qty:qty, exp:exp, inputCost:inputCost,
    profit:netRev + recur - exp - inputCost, open:open, ar:ar, overdue:overdue,
    invoices:invs, months:months,
    revSeries:months.map(m => (byM.get(m) || 0) +
      (V.recurringMonth ? V.recurringMonth(m) : 0)),
    costSeries:months.map(m => (expByM.get(m) || 0) + (inByM.get(m) || 0)),
    delta:function(a, b){ return b ? ((a - b) / b) * 100 : (a ? 100 : null); }
  };
}

/* ── WIDGET DAĞARCIĞI ──────────────────────────────────────────────── */
function panel(title, hint, body, flush, cls){
  return el("div", {class:"panel" + (cls ? " " + cls : "")}, [
    title ? el("div", {class:"panel-head"}, [
      el("h2", {text:title}),

      hint ? el("div", {class:"hint", text:hint}) : null
    ]) : null,
    el("div", {class:"panel-body" + (flush ? " flush" : "")}, body)
  ]);
}
function kpiRow(cards, per){
  const out = el("div", {class:"stack"});
  for (let i = 0; i < cards.length; i += per)
    out.appendChild(el("div", {class:"grid g" + per}, cards.slice(i, i + per).map(kpi)));
  return out;
}
function kpiStrip(cards){
  /* ince şerit — sayılar ikincil olduğunda */
  return el("div", {class:"panel"}, el("div", {style:{display:"grid",
    gridTemplateColumns:"repeat(auto-fit,minmax(132px,1fr))", gap:"1px",
    background:"var(--hair)"}},
    cards.map(c => el("div", {style:{background:"var(--paper)", padding:"11px 13px",
      display:"flex", flexDirection:"column", gap:"2px"}}, [
      el("span", {style:{fontSize:"9.5px", letterSpacing:".08em",
        textTransform:"uppercase", color:"var(--muted)", fontWeight:"600",
        whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}, text:c.label}),
      el("span", {class:"mono", style:{fontSize:"16px", fontWeight:"600",
        color:c.color || "var(--ink)"}, text:c.value}),
      c.note ? el("span", {class:"sm mut", style:{whiteSpace:"nowrap",
        overflow:"hidden", textOverflow:"ellipsis"}, text:c.note}) : null
    ]))));
}
/* ── GRAFİK İSKELET EKSENİ ─────────────────────────────────────────────
   ⚠ KOMPOZİSYON DEĞİŞTİRMEK YETMİYOR. On üç üründe kutuların yeri
     değişiyordu ama içlerindeki çizim aynıydı: alan + halka + yığın +
     gösterge. Ürünler ilk bakışta birbirinin kopyası duruyordu.
     `V.design.charts` her yuvaya farklı bir İSKELET veriyor.
   ⚠ Yuvalar: time (büyük zaman serisi) · mix (para nereye gidiyor) ·
     part (durum dağılımı) · rank (sıralama) · side (kare panel).       */
function CHV(slot, dflt){
  const c = (V.design && V.design.charts) || {};
  return c[slot] || dflt;
}

/* Ay × haftagünü ısı matrisi — "iş ne zaman geliyor" sorusu. */
function heatMatrix(st){
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const idx = {};
  st.months.forEach((mk, i) => idx[mk] = i);
  const m = DOW.map(() => st.months.map(() => 0));
  rows(V.job.key).filter(isRevenue).forEach(j => {
    const d = jobDate(j); if (!d) return;
    const ci = idx[monthKey(d)];
    if (ci === undefined) return;
    const w = (parseD(d).getDay() + 6) % 7;
    m[w][ci] += jobValue(j);
  });
  return {rows:DOW, cols:st.months.map(monthLabel), m:m};
}

/* ⚠ YÜKSEKLİK KOMPOZİSYONA GÖRE. İlk ekranda tek grafik varsa 210px yetmiyor:
   carwash'ta grafik ekranın %13,2'siydi ve pano "boş" ölçülüyordu. */
function trend(st, kind, h){
  const labels = st.months.map(monthLabel);
  const ht = h || 210;
  const v = CHV("time", kind || "area");
  const dot = c => el("i", {style:{width:"9px", height:"9px", borderRadius:"2px",
    background:c}});
  const key = pairs => el("div", {class:"sm", style:{display:"flex", gap:"12px",
    flexWrap:"wrap"}}, pairs.map(pr =>
      el("span", {style:{display:"flex", alignItems:"center", gap:"5px"}},
        [dot(pr[1]), el("span", {class:"mut", text:pr[0]})])));
  let body, title, legend = null, cls = "panel chart grow";
  if (v === "bars"){
    title = "Revenue by Month";
    body = barChart(labels, st.revSeries, {height:ht, fmt:money0,
      color:"var(--c1)", dim:true});
  } else if (v === "combo"){
    title = "Revenue and Profit";
    legend = key([["Revenue", "var(--c1)"], ["Profit", "var(--accent)"]]);
    body = comboChart(labels, st.revSeries,
      st.months.map((mk, i) => st.revSeries[i] - st.costSeries[i]),
      {height:ht, fmt:money0, barColor:"var(--c1)", lineColor:"var(--accent)"});
  } else if (v === "heat"){
    const hm = heatMatrix(st);
    title = "When the Work Lands";
    legend = el("div", {class:"hint", text:"revenue by month and weekday"});
    body = heatGrid(hm.rows, hm.cols, hm.m, {fmt:money0, cell:Math.round(ht / 9)});
    cls = "panel chart fixed grow";
  } else {
    title = "Revenue vs Costs";
    legend = key([["Revenue", "var(--c1)"], ["Costs", "var(--c5)"]]);
    body = areaChart(labels, [{data:st.revSeries, color:"var(--c1)"},
                              {data:st.costSeries, color:"var(--c5)"}],
                     {height:ht, fmt:money0});
  }
  return el("div", {class:cls}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:title}), el("div", {class:"sp"}), legend]),
    el("div", {class:"panel-body"}, body)
  ]);
}
/* ⚠ AÇIK İŞ DÖNEM DIŞINDA KALIYORDU. `st.cur` yalnız tarihi geçmiş
   kayıtları tutuyor; yarına yazılmış sipariş hiçbirine girmiyordu ve
   fırın panosunda yedi aşamadan yalnız üçü görünüyordu (Paid · Invoiced
   · Delivered). Sayılan pencere: hâlâ açık olan iş + bu dönemde kapanan. */
function statusScope(st){
  return memo("dash:scope:" + st.from, function(){
    return rows(V.job.key).filter(j =>
      isOpen(j) || (isRevenue(j) && inRange(jobDate(j), st.from, today())));
  });
}
function statusData(st){
  const live = statusScope(st);
  return V.job.stages.filter(s => !s.dead).map(s => ({
    k:s.t, v:live.filter(j => j.status === s.v).length, color:s.c}));
}
function statusPart(st, kind, size){
  const d = statusData(st);
  const v = CHV("part", kind || "donut");
  const live = d.filter(x => x.v > 0);
  let body, title = W("jobs") + " by Status", hint = "this period";
  if (v === "bars") body = hbars(d, {fmt:num});
  else if (v === "radial") body = radialBars(live, {fmt:num, size:size || 186});
  else if (v === "waffle") body = waffle(live, {fmt:num});
  else if (v === "funnel"){
    /* ⚠ HUNİ SIRAYI OKUR. Aşamalar config'de iş akışı sırasında duruyor;
       halka bunu kaybediyor, huni "nerede kaybediyoruz"u gösteriyor. */
    /* ⚠ HUNİ DÖNEMİ DEĞİL TÜM BORUYU OKUR. Dönem filtresiyle gelecekteki
       teklif ve rezervasyonlar dışarıda kalıyordu: ilk dört aşama sıfır,
       grafik boş duruyordu. */
    /* ⚠ TÜM TARİHİ SAYINCA HUNİ ÖLÜYOR. "Paid" kovası yıllardır birikiyor:
       390'a karşı 5 · 6 · 7 çubuğu okunmaz stub'a dönüyordu. Sayılan şey
       ÖNÜNDEKİ İŞ (hâlâ açık, tarihi ileride olsa bile) artı BU DÖNEMDE
       kapanan iş — sahibin baktığı pencere bu. */
    title = "Where " + W("jobs") + " Stand";
    hint = "open work and this period";
    body = funnel(d, {fmt:num, step:26});
  } else body = donut(d, {label:W("jobs"), size:size || 150});
  return panel(title, hint === "this period" ? "open work and this period" : hint,
    body, false, "chart fixed grow");
}
function attention(){
  /* ⚠ İYİ HABER DE BİR UYARI KALEMİDİR. Kayıt ürünlerinde eşiğe
     ULAŞMAK (nöbetsiz 365 gün, seri, remisyon) en önemli satır; ama
     `good` kalemi sarı boyanınca kötü haber gibi duruyordu. Kırmızı
     önce, sarı sonra, yeşil en altta. */
  const AL = alerts().slice().sort((a, b) => {
    const w = k => k === "bad" ? 0 : k === "good" ? 2 : 1;
    return w(a.kind) - w(b.kind);
  });
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:"Needs Attention"}), el("div", {class:"sp"}),
      AL.length ? el("span", {class:"pill " + (AL.some(a => a.kind === "bad") ? "bad"
        : AL.every(a => a.kind === "good") ? "good" : "warn"),
        text:AL.length + " item" + (AL.length > 1 ? "s" : "")}) : null
    ]),
    el("div", {class:"panel-body flush", style:{maxHeight:"330px", overflowY:"auto"}},
      AL.length ? el("div", {}, AL.slice(0, 12).map(a =>
        el("button", {class:"nav-item", style:{color:"var(--ink)", width:"100%",
          padding:"10px 14px", borderBottom:"1px solid var(--hair2)", borderLeft:"0",
          background:"none"}, onclick:() => go(a.go)}, [
          el("span", {class:"ic", html:a.icon,
            style:{color:"var(--" + (a.kind === "bad" ? "bad"
              : a.kind === "good" ? "good" : "warn") + ")"}}),
          el("span", {class:"cell-2", style:{flex:"1"}}, [
            el("span", {class:"a", style:{fontSize:"12.5px"}, text:a.text}),
            el("span", {class:"b", text:a.note})])
        ])))
      : el("div", {class:"empty", style:{padding:"36px 20px"}}, [
          el("div", {html:ICON.check, style:{color:"var(--good)"}}),
          el("h3", {text:"All clear"}),
          el("p", {text:V.allClear || "Nothing overdue and nothing expiring soon."})]))
  ]);
}
/* Sıralama yuvası — dört iskelet. Eğim iskeleti önceki dönemi de ister. */
function rankBody(cur, prv, empty){
  const v = CHV("rank", "hbars");
  if (!cur.length) return noData(300, 110, empty);
  if (v === "lolli") return lollipop(cur, {fmt:money0});
  if (v === "bullet"){
    /* ⚠ HEDEF ORTALAMA. "En iyi altı" listesi tek başına kimin altta
       kaldığını söylemiyor; ortalama çizgisi onu karara çeviriyor. */
    const avg = cur.reduce((a, x) => a + x.v, 0) / cur.length;
    return bulletBars(cur.map(x => ({k:x.k, v:x.v, target:avg})),
      {fmt:money0, targetLabel:"avg"});
  }
  if (v === "slope"){
    const pm = {};
    prv.forEach(x => pm[x.k] = x.v);
    return slopeChart(cur.map(x => ({k:x.k, a:pm[x.k] || 0, b:x.v})),
      {fmt:money0, aLabel:"prior", bLabel:"now", empty:empty});
  }
  return hbars(cur, {fmt:money0});
}
/* ⚠ "TOP CHILDREN" DİYE BİR PANO OLMAZ. Sıralama panosu her dikeyde
   müşteriyi sıralıyordu; kreşte bu hem anlamsız hem rahatsız edici bir
   başlık üretiyordu ("en çok para getiren çocuklar"). Dikey kendi
   sıralama eksenini verebiliyor: V.rank = {title, field, entity}. */
function rankClients(st){
  const R_ = V.rank || {};
  const field = R_.field || CK();
  /* ⚠ Eksen bir VARLIK ise ada çevrilir; düz bir alansa (konu, tür) değeri
     zaten okunur — clientName'den geçirmek onu boşa çıkarıyordu. */
  const label = R_.entity ? (id => nameOf(R_.entity, id))
    : R_.field ? (k => k || "—") : clientName;
  const title = R_.title || ("Top " + W("clients"));
  const cur = topN(sumBy(st.cur, j => j[field], j => jobValue(j)), 6, label);
  const prv = topN(sumBy(st.prv, j => j[field], j => jobValue(j)), 40, label);
  return panel(title, null,
    rankBody(cur, prv, "No revenue in this period"), false, "grow");
}
function rankWorkers(st){
  const wf = V.job.workerEntity ? V.entities[V.job.workerEntity].jobField : null;
  if (!wf) return null;
  const cur = topN(sumBy(st.cur.filter(j => j[wf]), j => j[wf], j => jobValue(j)), 6,
    id => nameOf(V.job.workerEntity, id));
  const prv = topN(sumBy(st.prv.filter(j => j[wf]), j => j[wf], j => jobValue(j)), 40,
    id => nameOf(V.job.workerEntity, id));
  return panel("Revenue by " + W("worker"), null,
    rankBody(cur, prv, "No " + W("worker").toLowerCase() + " assigned yet"),
    false, "grow");
}

/* Gider kırılımı — dört iskelet. Panoyu grafik ağırlıklı yapan parça. */
/* ⚠ DÖNEM FİLTRESİ ŞART. Bu fonksiyon önce TÜM giderleri topluyordu;
   şelale 90 günün cirosunu 14 ayın gideriyle karşılaştırınca kâr
   −849.620$ çıkıyordu ve grafik tam ters okunuyordu. */
function costCats(n, from, to){
  const m = new Map();
  rows("expenses").forEach(e => {
    if (from && !inRange(e.date, from, to || today())) return;
    const c = e.category || "Other";
    m.set(c, (m.get(c) || 0) + n0(e.amount));
  });
  return Array.from(m.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v).slice(0, n || 6);
}
function costMix(st){
  const v = CHV("mix", "stack");
  const cats = new Map();
  rows("expenses").forEach(e => {
    const k = monthKey(e.date); if (!k) return;
    const c = e.category || "Other";
    if (!cats.has(c)) cats.set(c, {});
    cats.get(c)[k] = (cats.get(c)[k] || 0) + n0(e.amount);
  });
  const top = Array.from(cats.entries())
    .map(([k, m]) => ({k:k, tot:Object.values(m).reduce((a, b) => a + b, 0), m:m}))
    .sort((a, b) => b.tot - a.tot).slice(0, 5);
  const col = i => "var(--c" + ((i % 6) + 1) + ")";
  let title = "Where the Money Goes", legend = null, body, cls = "panel chart grow";
  if (v === "tree"){
    title = "Cost Breakdown";
    legend = el("div", {class:"hint", text:"biggest first"});
    body = treemap(costCats(9, st.from), {fmt:money0, height:220,
      empty:"No costs logged yet"});
  } else if (v === "waterfall"){
    /* ⚠ ŞELALE CİRODAN KÂRA GİDEN YOLU GÖSTERİR. Yığılmış çubuk "ne kadar
       harcandı"yı söylüyor; şelale "geriye ne kaldı"yı söylüyor — sahibin
       sorduğu soru bu. */
    title = "From Revenue to Profit";
    legend = el("div", {class:"hint", text:"this period"});
    const c4 = costCats(4, st.from);
    const rest = (st.rev - st.profit) - c4.reduce((a, x) => a + x.v, 0);
    body = waterfall([{k:"Revenue", v:st.rev, total:true, color:"var(--c2)"}]
      /* ⚠ --c3 HER PALETTE AYNI DEĞİL. highway'de yeşil çıkıyordu ve
         düşülen kalemler "iyi" gibi okunuyordu. --warn her palette sıcak. */
      .concat(c4.map(x => ({k:x.k, v:-x.v, color:"var(--warn)"})))
      .concat(rest > 0 ? [{k:"Everything else", v:-rest, color:"var(--warn)"}] : [])
      .concat([{k:"Profit", v:st.profit, total:true,
                color:st.profit >= 0 ? "var(--good)" : "var(--bad)"}]),
      {fmt:money0, height:230});
  } else if (v === "waffle"){
    title = "Every Dollar Out";
    legend = el("div", {class:"hint", text:"one square is one percent"});
    body = waffle(costCats(6, st.from), {fmt:money0});
    cls = "panel chart fixed grow";
  } else {
    legend = el("div", {class:"sm", style:{display:"flex", gap:"10px",
      flexWrap:"wrap"}}, top.map((t, i) => el("span", {style:{display:"flex",
        alignItems:"center", gap:"5px"}}, [
        el("i", {style:{width:"9px", height:"9px", borderRadius:"2px",
          background:col(i)}}),
        el("span", {class:"mut", text:t.k})])));
    const series = top.map((t, i) => ({color:col(i),
      data:st.months.map(mk => t.m[mk] || 0)}));
    body = series.length
      ? stackChart(st.months.map(monthLabel), series, {height:200, fmt:money0})
      : noData(600, 180, "No costs logged yet");
  }
  return el("div", {class:cls}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:title}), el("div", {class:"sp"}), legend]),
    el("div", {class:"panel-body"}, body)
  ]);
}

/* Kare panel — dört iskelet. Tek oranı büyük göstermek ya da işlerin
   şeklini göstermek; ikisi de aynı yere sığıyor. */
function marginGauge(st){
  const m = st.rev ? st.profit / st.rev * 100 : 0;
  const v = CHV("side", "gauge");
  if (v === "hist"){
    /* ⚠ TEK ORTALAMA YALAN SÖYLER. Bir büyük iş ortalamayı yukarı çekiyor;
       dağılım işlerin gerçek şeklini gösteriyor ve medyanı işaretliyor. */
    return panel(W("job") + " Size Spread", "this period",
      histogram(st.cur.map(jobValue), {fmt:money0, height:210, color:"var(--c2)",
        empty:"Not enough " + W("jobsLower") + " yet"}), false, "chart grow");
  }
  if (v === "scatter"){
    const pts = st.cur.filter(j => jobQty(j) > 0).map(j => ({
      x:jobQty(j), y:jobValue(j), r:3.8,
      color:jobRate(j) >= (V.job.goodRate || 0) ? "var(--good)" : "var(--c3)"}));
    const avg = st.qty ? st.rev / st.qty : 0;
    return panel("Price against " + (qtyUnit() || "size"), "each dot is one " +
      W("jobLower"),
      scatterPlot(pts, {fmt:money0, yfmt:money0, height:210,
        xLabel:qtyUnit(), yTarget:null,
        empty:"No " + W("jobsLower") + " with a " + (qtyUnit() || "size") + " yet"}),
      false, "chart grow");
  }
  if (v === "bullet"){
    const inv = st.invoices, paid = inv.filter(i => i.paidDate).length;
    /* ⚠ "PROFIT MARGIN ... OF 15" HER İŞTE DOĞRU DEĞİL. Kilise panosunda
       bağış fazlasına kâr marjı demek ve %15 hedef koymak yanlıştı;
       dikey kendi etiketini ve hedefini veriyor. */
    const target = V.marginTarget || 15;
    return panel("Against Target", "this period",
      bulletBars([
        {k:V.marginLabel || "Profit margin", v:Math.max(0, m), target:target,
         color:m >= target ? "var(--good)" : "var(--warn)"},
        {k:"Revenue", v:st.rev, target:st.revPrev || st.rev},
        {k:"Invoices paid", v:paid, target:inv.length || 1}
      ], {fmt:v => v >= 1000 ? money0(v) : num(v, v % 1 ? 1 : 0)}),
      false, "chart fixed grow");
  }
  return panel("Profit Margin", "this period",
    el("div", {}, [
      gauge(Math.max(0, m), {size:168, thick:16,
        color:m >= 12 ? "var(--good)" : m > 0 ? "var(--warn)" : "var(--bad)",
        text:pct(m, 1), label:"margin"}),
      el("div", {class:"sm mut", style:{textAlign:"center", marginTop:"9px"},
        text:money0(st.rev) + " in · " + money0(st.rev - st.profit) + " out"})
    ]), false, "chart fixed grow");
}

/* Aylık kırılım kıvılcımları — çok sayıda seriyi az yerde. */
function trendGrid(st){
  const wf = V.job.workerEntity ? V.entities[V.job.workerEntity].jobField : null;
  const items = [];
  items.push({k:"Revenue", v:st.rev, series:st.revSeries.slice(-9), color:"var(--c1)"});
  items.push({k:"Costs", v:st.rev - st.profit, series:st.costSeries.slice(-9),
    color:"var(--c5)"});
  const cnt = st.months.map(mk =>
    rows(V.job.key).filter(j => monthKey(jobDate(j)) === mk && isRevenue(j)).length);
  /* ⚠ SAYIM PARA DEĞİL. Tek `fmt` ile "Orders" satırı $1.632 yazıyordu. */
  items.push({k:W("jobs"), v:st.cur.length, series:cnt.slice(-9),
    color:"var(--c2)", fmt:num});
  const prof = st.months.map((mk, i) => st.revSeries[i] - st.costSeries[i]);
  items.push({k:"Profit", v:st.profit, series:prof.slice(-9), color:"var(--c3)"});
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"Last Nine Months"}),
      el("div", {class:"sp"}), el("div", {class:"hint", text:"month by month"})]),
    el("div", {class:"panel-body flush"}, sparkGrid(items, {fmt:money0}))
  ]);
}

/* ── KOMPOZİSYONLAR ──────────────────────────────────────────────────
   ⚠ HER KOMPOZİSYONUN İLK EKRANINDA GERÇEK GRAFİK OLMALI. Listing görseli
     bu ekran; KPI kartı ve metinden ibaret pano Etsy'de "boş ve gösterişsiz"

     `tools/foldcheck.js` kalıcı denetliyor: alan ≥%18, en büyük ≥%7.     */
const DASH = {

     "Needs Attention" ve tahta metin ağırlıklı; ilk ekranda durduklarında

    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
