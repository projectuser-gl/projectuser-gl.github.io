/* Gider kırılımı — dört iskelet. Panoyu grafik ağırlıklı yapan parça. */
/* ⚠ DÖNEM FİLTRESİ ŞART. Bu fonksiyon önce TÜM giderleri topluyordu;
   şelale 90 günün cirosunu 14 ayın gideriyle karşılaştırınca kâr
   −849.620$ çıkıyordu ve grafik tam ters okunuyordu. */
function costCats(n, from, to){
  const m = new Map();
  rows("expenses").forEach(e => {
    if (from && !inRange(e.date, from, to || today())) return;
    const c = e.category || "Other";
    m.set(c, (m.get(c) || 0) + n0(e.amount));
  });
  return Array.from(m.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v).slice(0, n || 6);
}
function costMix(st){
  const v = CHV("mix", "stack");
  const cats = new Map();
  rows("expenses").forEach(e => {
    const k = monthKey(e.date); if (!k) return;
    const c = e.category || "Other";
    if (!cats.has(c)) cats.set(c, {});
    cats.get(c)[k] = (cats.get(c)[k] || 0) + n0(e.amount);
  });
  const top = Array.from(cats.entries())
    .map(([k, m]) => ({k:k, tot:Object.values(m).reduce((a, b) => a + b, 0), m:m}))
    .sort((a, b) => b.tot - a.tot).slice(0, 5);
  const col = i => "var(--c" + ((i % 6) + 1) + ")";
  let title = "Where the Money Goes", legend = null, body, cls = "panel chart grow";
  if (v === "tree"){
    title = "Cost Breakdown";
    legend = el("div", {class:"hint", text:"biggest first"});
    body = treemap(costCats(9, st.from), {fmt:money0, height:220,
      empty:"No costs logged yet"});
  } else if (v === "waterfall"){
    /* ⚠ ŞELALE CİRODAN KÂRA GİDEN YOLU GÖSTERİR. Yığılmış çubuk "ne kadar
       harcandı"yı söylüyor; şelale "geriye ne kaldı"yı söylüyor — sahibin
       sorduğu soru bu. */
    title = "From Revenue to Profit";
    legend = el("div", {class:"hint", text:"this period"});
    const c4 = costCats(4, st.from);
    const rest = (st.rev - st.profit) - c4.reduce((a, x) => a + x.v, 0);
    body = waterfall([{k:"Revenue", v:st.rev, total:true, color:"var(--c2)"}]
      /* ⚠ --c3 HER PALETTE AYNI DEĞİL. highway'de yeşil çıkıyordu ve
         düşülen kalemler "iyi" gibi okunuyordu. --warn her palette sıcak. */
      .concat(c4.map(x => ({k:x.k, v:-x.v, color:"var(--warn)"})))
      .concat(rest > 0 ? [{k:"Everything else", v:-rest, color:"var(--warn)"}] : [])
      .concat([{k:"Profit", v:st.profit, total:true,
                color:st.profit >= 0 ? "var(--good)" : "var(--bad)"}]),
      {fmt:money0, height:230});
  } else if (v === "waffle"){
    title = "Every Dollar Out";
    legend = el("div", {class:"hint", text:"one square is one percent"});
    body = waffle(costCats(6, st.from), {fmt:money0});
    cls = "panel chart fixed grow";
  } else {
    legend = el("div", {class:"sm", style:{display:"flex", gap:"10px",
      flexWrap:"wrap"}}, top.map((t, i) => el("span", {style:{display:"flex",
        alignItems:"center", gap:"5px"}}, [
        el("i", {style:{width:"9px", height:"9px", borderRadius:"2px",
          background:col(i)}}),
        el("span", {class:"mut", text:t.k})])));
    const series = top.map((t, i) => ({color:col(i),
      data:st.months.map(mk => t.m[mk] || 0)}));
    body = series.length
      ? stackChart(st.months.map(monthLabel), series, {height:200, fmt:money0})
      : noData(600, 180, "No costs logged yet");
  }
  return el("div", {class:cls}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:title}), el("div", {class:"sp"}), legend]),
    el("div", {class:"panel-body"}, body)
  ]);
}

/* Kare panel — dört iskelet. Tek oranı büyük göstermek ya da işlerin
   şeklini göstermek; ikisi de aynı yere sığıyor. */
function marginGauge(st){
  const m = st.rev ? st.profit / st.rev * 100 : 0;
  const v = CHV("side", "gauge");
  if (v === "hist"){
    /* ⚠ TEK ORTALAMA YALAN SÖYLER. Bir büyük iş ortalamayı yukarı çekiyor;
       dağılım işlerin gerçek şeklini gösteriyor ve medyanı işaretliyor. */
    return panel(W("job") + " Size Spread", "this period",
      histogram(st.cur.map(jobValue), {fmt:money0, height:210, color:"var(--c2)",
        empty:"Not enough " + W("jobsLower") + " yet"}), false, "chart grow");
  }
  if (v === "scatter"){
    const pts = st.cur.filter(j => jobQty(j) > 0).map(j => ({
      x:jobQty(j), y:jobValue(j), r:3.8,
      color:jobRate(j) >= (V.job.goodRate || 0) ? "var(--good)" : "var(--c3)"}));
    const avg = st.qty ? st.rev / st.qty : 0;
    return panel("Price against " + (qtyUnit() || "size"), "each dot is one " +
      W("jobLower"),
      scatterPlot(pts, {fmt:money0, yfmt:money0, height:210,
        xLabel:qtyUnit(), yTarget:null,
        empty:"No " + W("jobsLower") + " with a " + (qtyUnit() || "size") + " yet"}),
      false, "chart grow");
  }
  if (v === "bullet"){
    const inv = st.invoices, paid = inv.filter(i => i.paidDate).length;
    /* ⚠ "PROFIT MARGIN ... OF 15" HER İŞTE DOĞRU DEĞİL. Kilise panosunda
       bağış fazlasına kâr marjı demek ve %15 hedef koymak yanlıştı;
       dikey kendi etiketini ve hedefini veriyor. */
    const target = V.marginTarget || 15;
    return panel("Against Target", "this period",
      bulletBars([
        {k:V.marginLabel || "Profit margin", v:Math.max(0, m), target:target,
         color:m >= target ? "var(--good)" : "var(--warn)"},
        {k:"Revenue", v:st.rev, target:st.revPrev || st.rev},
        {k:"Invoices paid", v:paid, target:inv.length || 1}
      ], {fmt:v => v >= 1000 ? money0(v) : num(v, v % 1 ? 1 : 0)}),
      false, "chart fixed grow");
  }
  return panel("Profit Margin", "this period",
    el("div", {}, [
      gauge(Math.max(0, m), {size:168, thick:16,
        color:m >= 12 ? "var(--good)" : m > 0 ? "var(--warn)" : "var(--bad)",
        text:pct(m, 1), label:"margin"}),
      el("div", {class:"sm mut", style:{textAlign:"center", marginTop:"9px"},
        text:money0(st.rev) + " in · " + money0(st.rev - st.profit) + " out"})
    ]), false, "chart fixed grow");
}

/* Aylık kırılım kıvılcımları — çok sayıda seriyi az yerde. */
function trendGrid(st){
  const wf = V.job.workerEntity ? V.entities[V.job.workerEntity].jobField : null;
  const items = [];
  items.push({k:"Revenue", v:st.rev, series:st.revSeries.slice(-9), color:"var(--c1)"});
  items.push({k:"Costs", v:st.rev - st.profit, series:st.costSeries.slice(-9),
    color:"var(--c5)"});
  const cnt = st.months.map(mk =>
    rows(V.job.key).filter(j => monthKey(jobDate(j)) === mk && isRevenue(j)).length);
  /* ⚠ SAYIM PARA DEĞİL. Tek `fmt` ile "Orders" satırı $1.632 yazıyordu. */
  items.push({k:W("jobs"), v:st.cur.length, series:cnt.slice(-9),
    color:"var(--c2)", fmt:num});
  const prof = st.months.map((mk, i) => st.revSeries[i] - st.costSeries[i]);
  items.push({k:"Profit", v:st.profit, series:prof.slice(-9), color:"var(--c3)"});
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"Last Nine Months"}),
      el("div", {class:"sp"}), el("div", {class:"hint", text:"month by month"})]),
    el("div", {class:"panel-body flush"}, sparkGrid(items, {fmt:money0}))
  ]);
}

/* ── KOMPOZİSYONLAR ──────────────────────────────────────────────────
   ⚠ HER KOMPOZİSYONUN İLK EKRANINDA GERÇEK GRAFİK OLMALI. Listing görseli
     bu ekran; KPI kartı ve metinden ibaret pano Etsy'de "boş ve gösterişsiz"
     duruyor ve ürünü ucuz gösteriyor. Ölçüldü: `board` panosu ilk ekranda

     `tools/foldcheck.js` kalıcı denetliyor: alan ≥%18, en büyük ≥%7.     */
const DASH = {
  /* ⚠ SIRA: kartlar → grafikler → sıralamalar → uyarı/tahta → tablo.
     "Needs Attention" ve tahta metin ağırlıklı; ilk ekranda durduklarında

  kpi:(st, c) => [

    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  hero:(st, c) => [
    heroNumber(c[0], st),
    el("div", {class:"grid g23"}, [
      el("div", {class:"stack"}, [kpiRow(c.slice(1, 4), 3), trend(st, "bars")]),
      el("div", {class:"stack"}, [statusPart(st), marginGauge(st)])]),
    costMix(st),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    trendGrid(st),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  split:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st), marginGauge(st)]),
    el("div", {class:"grid g2"}, [costMix(st), statusPart(st, "bars")]),
    kpiRow(c.slice(4), 4),
    trendGrid(st),
    el("div", {class:"grid g23"}, [boardPreview(true), rankClients(st)]),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  board:(st, c) => [
    kpiStrip(c.slice(0, 5)),
    el("div", {class:"grid g23"}, [trend(st), statusPart(st)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankWorkers(st) || rankClients(st),
      rankClients(st)].filter(Boolean)),
    boardPreview(true),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  report:(st, c) => [
    trend(st),
    kpiStrip(c),
    el("div", {class:"grid g23"}, [costMix(st), marginGauge(st)]),
    el("div", {class:"grid g2"}, [statusPart(st), rankClients(st)]),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankWorkers(st), recentTable(8)].filter(Boolean)),
    attention()
  ],
  focus:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st, null, 260), statusPart(st, null, 168)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    kpiRow(c.slice(4), 4),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    el("div", {class:"grid g23"}, [boardPreview(true), attention()]),
    recentTable(6)
  ]
};



function viewDashboard(){
  const st = periodStats(DASH_RANGE);
  let cards = V.kpis(st);
  const view = el("div", {class:"stack"});
  view.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px",
    flexWrap:"wrap"}}, [
    el("div", {class:"sm mut", text:"Showing " + date(st.from) + " — " + date(today())}),
    el("div", {style:{flex:"1"}}),
    segControl([{v:30,t:"30 days"},{v:90,t:"90 days"},{v:180,t:"6 months"},{v:365,t:"12 months"}],
      DASH_RANGE, v => { DASH_RANGE = v; render(); })
  ]));
  /* ⚠ Bilinmeyen kompozisyon SESSİZCE `kpi`ye düşmez — o, tüm ürünleri
     aynı panoya geri döndüren şeyin ta kendisi. Konsola yazıp öyle düşüyor. */
  const key = (V.design && V.design.dash) || "kpi";
  /* ⚠ KAYIT KİPİNDE PARA PANELLERİ YOK. noMoney ürünlerde kompozisyon
     LOGDASH'ten geliyor (29_logdash.js); `focus` → `logfocus` gibi. */
  const build = (V.noMoney && typeof LOGDASH !== "undefined" &&
                 LOGDASH["log" + key]) || DASH[key];
  if (!build) console.error("bilinmeyen pano kompozisyonu: " + key);
  const nodes = (build || DASH.kpi)(st, cards).filter(Boolean);
  /* ⚠ ÜRÜNE ÖZGÜ PANEL. Her kayıt ürününün bir ayırt edici hesabı var
     (döngü gününe hizalanmış ağrı, gecikmeli tetikleyici, enerji zarfı).
     Jenerik paneller onu gösteremiyor ve ürün komşusunun kopyası gibi
     duruyor. `V.dashPanel(st)` varsa ilk grafikten hemen sonra giriyor. */
  if (V.dashPanel){
    const extra = V.dashPanel(st);
    if (extra) nodes.splice(Math.min(2, nodes.length), 0, extra);
  }
  nodes.forEach(n => view.appendChild(n));
  return view;
}

/* ═══ İŞ KAYITLARI: TABLO · TAHTA · EDİTÖR (ÇEKİRDEK) ═══════════════════
   Her meslekte aynı üç ekran: iş listesi, aşama tahtası, iş formu.
   Alanlar, kolonlar, aşamalar ve canlı hesap şeridi config'ten.

   ⚠ EDİTÖR YAZARKEN HESAPLAR. Ustanın/dispeççinin işi kabul edip
     etmeyeceğine baktığı sayı bu; kaydettikten sonra görmek geç.
   ⚠ recordForm'un `extra` geri çağrısı (form, rec) sırasıyla gelir.
     Ters yazılmıştı ve "New job" düğmesi HİÇ açılmıyordu; sözdizimi
     denetimi göremiyor, yalnız tarayıcıda tıklayınca çıkıyor.            */

let JOB_FILTER = "open";

/* Canlı özet şeridi — config'in verdiği hücreleri çizer. */
function jobSummary(form, rec){
  if (!V.job.summary) return el("span", {});
  const box = el("div", {class:"full", style:{
    display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(104px,1fr))", gap:"1px",
    background:"var(--hair)", border:"1px solid var(--hair)", borderRadius:"var(--r)",
    overflow:"hidden", marginTop:"2px"}});
  function paint(){
    const d = readForm(form, V.job.fields());
    const j = Object.assign({}, rec, d);
    box.innerHTML = "";
    V.job.summary(j).forEach(c => box.appendChild(
      el("div", {style:{background:"var(--paper)", padding:"9px 11px",
        display:"flex", flexDirection:"column", gap:"2px"}}, [
        el("span", {style:{fontSize:"9.5px", letterSpacing:".07em",
          textTransform:"uppercase", color:"var(--muted)", fontWeight:"600"}, text:c.k}),
        el("span", {class:"mono", style:{fontSize:"14px", fontWeight:"600",
          color:c.c || "var(--ink)"}, text:c.v})
      ])));
  }
  form.addEventListener("input", paint);
  form.addEventListener("change", paint);
  setTimeout(paint, 0);
  return box;
}

function editJob(rec){
  recordForm({
    size:"wide", rec:rec, fields:V.job.fields(), extra:jobSummary,
    title:rec && rec.id ? W("job") + " " + jobRef(rec) : W("newJob"),

/* ═══ VARLIK EKRANI (ÇEKİRDEK) ══════════════════════════════════════════
   Listele / ara / sırala / ekle / düzenle / sil / dışa aktar. Her meslekte
   aynı iskelet; içini config dolduruyor.
   ⚠ SİLMEDEN ÖNCE BAĞ KONTROLÜ. Yüke bağlı aracı silmek raporda boş isim
     bırakıyordu; artık kaç kayıtta kullanıldığını söyleyip onay istiyoruz. */

/* ⚠ SİLMEDEN ÖNCE BAĞ SAYILIR. Yüke bağlı aracı silmek raporda boş isim
   bırakıyordu. Hangi alanın hangi varlığa baktığı config'ten geliyor —
   çekirdek "truckId" diye bir şey bilmez. */
function usedBy(key, id){
  const link = (V.entities[key] || {}).jobField;
  if (!link) return 0;
  return rows(V.job.key).filter(j => j[link] === id).length;
}

function crudView(cfg){
  const list = rows(cfg.key);
  const open = rec => recordForm({
    size:cfg.size || "", rec:rec, title:rec && rec.id ? cfg.editTitle : cfg.newTitle,
    sub:cfg.sub, fields:cfg.fields, extra:cfg.extra,
    before:cfg.before,
    onSave:d => { upsert(cfg.key, d); commit(cfg.saved || "Saved."); render(); },
    onDelete:d => {
      const n = usedBy(cfg.key, d.id);
      confirmBox("Delete " + (cfg.noun || "record") + "?",
        n ? "This is used on " + n + " load" + (n > 1 ? "s" : "") +
            ". They will keep their history but show a blank name."
          : "This record will be removed. This cannot be undone.",
        () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
    }
  });
  return el("div", {class:"panel", style:{height:"100%"}}, [
    toolbar({
      id:cfg.key, repaint:render, placeholder:cfg.placeholder || "Search…",
      controls:cfg.controls ? cfg.controls() : [],
      actions:[

          onclick:() => exportCSV(cfg.key + "-" + today(), cfg.cols(), list)}),
        el("button", {class:"btn pri sm", html:ICON.plus + "<span>" + (cfg.addLabel || "Add") + "</span>",
          onclick:() => open(cfg.blank ? cfg.blank() : {})})
      ]
    }),
    el("div", {style:{flex:"1", minHeight:"0", overflow:"hidden"}}, dataTable({
      id:cfg.key, rows:list, cols:cfg.cols(), sort:cfg.sort, dir:cfg.dir,
      filter:cfg.filter, footer:cfg.footer, onEdit:open, repaint:render,
      onDelete:d => {
        const n = usedBy(cfg.key, d.id);
        confirmBox("Delete " + (cfg.noun || "record") + "?",
          n ? "Used on " + n + " load" + (n > 1 ? "s" : "") + "."
            : "This record will be removed.",
          () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
      },
      empty:el("div", {class:"empty"}, [
        el("div", {html:cfg.icon || ICON.doc}),

    }))

}

/* ── 35_reports.js ── */
/* ═══ RAPORLAR (ÇEKİRDEK) ═══════════════════════════════════════════════
   Beş şekil her meslekte aynı: kâr-zarar · iş kârlılığı · birim başına ·
   çalışan hakedişi · müşteri. Hangileri gösterilecek ve neyle etiketlenecek
   V.reports'tan geliyor.
   ⚠ TEK KAYNAK. Rapor sayıları yüklerden ve giderlerden CANLI türetilir;
     ayrı bir "rapor tablosu" tutulmuyor. İki yerde saklanan sayı er geç
     birbirini tutmuyor.                                                   */

let REP_TAB = "pnl", REP_FROM = "", REP_TO = "";

function repRange(){
  const to = REP_TO || today();
  const from = REP_FROM || addDays(to, -365);
  return {from:from, to:to};
}

function pnlData(){
  const R = repRange();
  const ls = jobsIn(R.from, R.to);
  /* ⚠ Panodakiyle AYNI kanca; iki yerde farklı ciro göstermek en kötüsü. */
  const recur = V.recurring ? V.recurring(R.from, R.to) : 0;
  const revenue = ls.reduce((a, L) => a + jobValue(L), 0) + recur;
  const fees = ls.reduce((a, L) => a + jobFee(L), 0);
  const exps = rows("expenses").filter(e => inRange(e.date, R.from, R.to));
  const fuels = rows("fuel").filter(f => inRange(f.date, R.from, R.to));
  const byCat = sumBy(exps, e => e.category || "Other", e => n0(e.amount));
  const fuelTot = fuels.reduce((a, f) => a + n0(f.cost), 0);
  if (fuelTot) byCat.set("Fuel", (byCat.get("Fuel") || 0) + fuelTot);
  if (fees) byCat.set("Dispatch fee", (byCat.get("Dispatch fee") || 0) + fees);
  const costs = Array.from(byCat.values()).reduce((a, b) => a + b, 0);
  const miles = ls.reduce((a, L) => a + jobQty(L), 0);
  return {R:R, ls:ls, revenue:revenue, byCat:byCat, costs:costs,
          profit:revenue - costs, miles:miles};
}

function repPnl(){
  const d = pnlData();
  const cats = Array.from(d.byCat.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v);
  const out = el("div", {class:"stack"});
  out.appendChild(el("div", {class:"grid g4"}, [
    kpi({label:"Revenue", value:money0(d.revenue), color:"var(--c1)",
         note:d.ls.length + " loads"}),
    kpi({label:"Total Costs", value:money0(d.costs), color:"var(--c5)",
         note:d.revenue ? pct(d.costs / d.revenue * 100, 0) + " of revenue" : "—"}),
    kpi({label:"Net Profit", value:money0(d.profit),
         color:d.profit >= 0 ? "var(--good)" : "var(--bad)",
         note:d.revenue ? pct(d.profit / d.revenue * 100) + " margin" : "—"}),
    kpi({label:"Profit / " + qtyUnit(), value:d.miles ? money(d.profit / d.miles) : "—",
         color:"var(--c3)", note:num(d.miles) + " " + qtyUnit()})
  ]));
  out.appendChild(el("div", {class:"grid g23"}, [
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Cost Breakdown"})),
      el("div", {class:"panel-body flush"}, (() => {
        const t = el("table", {class:"dt"});
        t.appendChild(el("thead", {}, el("tr", {}, [
          el("th", {text:"Category"}), el("th", {class:"n", text:"Amount"}),
          el("th", {class:"n", text:"% of revenue"}), el("th", {class:"n", text:"Per " + qtyUnit()})
        ])));
        const tb = el("tbody");
        cats.forEach(c => tb.appendChild(el("tr", {}, [
          el("td", {text:c.k}),
          el("td", {class:"n strong", text:money(c.v)}),
          el("td", {class:"n mut", text:d.revenue ? pct(c.v / d.revenue * 100) : "—"}),
          el("td", {class:"n mut", text:d.miles ? money(c.v / d.miles) : "—"})
        ])));
        t.appendChild(tb);
        t.appendChild(el("tfoot", {}, el("tr", {}, [
          el("td", {text:"Total costs"}), el("td", {class:"n", text:money(d.costs)}),
          el("td", {class:"n", text:d.revenue ? pct(d.costs / d.revenue * 100) : "—"}),
          el("td", {class:"n", text:d.miles ? money(d.costs / d.miles) : "—"})
        ])));
        return cats.length ? el("div", {class:"tw"}, t)
          : el("div", {class:"empty", style:{padding:"36px"}}, [
              el("h3", {text:"No costs in this period"}),
              el("p", {text:"Log fuel and expenses to see where the money goes."})]);
      })())
    ]),
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Where the money goes"})),
      el("div", {class:"panel-body"}, cats.length
        ? donut(cats.slice(0, 6), {label:"Costs", fmt:money0, size:150})
        : noData(300, 140))
    ])
  ]));
  return out;
}

function repLoads(){
  const R = repRange();
  const ls = jobsIn(R.from, R.to);

function repTrucks(){
  const R = repRange();
  const list = rows(V.job.unitEntity).map(t => {
    const ls = jobsIn(R.from, R.to).filter(L => L[V.entities[V.job.unitEntity].jobField] === t.id);
    const rev = ls.reduce((a, L) => a + jobValue(L), 0);
    const mi = ls.reduce((a, L) => a + jobQty(L), 0);
    const fu = rows("fuel").filter(f => f.truckId === t.id && inRange(f.date, R.from, R.to));
    const gal = fu.reduce((a, f) => a + n0(f.gallons), 0);
    const fuelC = fu.reduce((a, f) => a + n0(f.cost), 0);
    const ex = rows("expenses").filter(e => e.truckId === t.id && inRange(e.date, R.from, R.to))
      .reduce((a, e) => a + n0(e.amount), 0);
    return Object.assign({}, t, {_rev:rev, _mi:mi, _gal:gal, _fuel:fuelC, _exp:ex,

  return el("div", {class:"panel"}, [

function repCustomers(){
  const R = repRange();
  const list = rows(CE()).map(b => {
    const ls = jobsIn(R.from, R.to).filter(L => L[CK()] === b.id);
    const rev = ls.reduce((a, L) => a + jobValue(L), 0);
    const mi = ls.reduce((a, L) => a + jobQty(L), 0);
    const invs = rows("invoices").filter(i => i.brokerId === b.id);
    const unpaid = invs.filter(i => !i.paidDate).reduce((a, i) => a + invoiceTotal(i), 0);
    const paid = invs.filter(i => i.paidDate);
    const avgPay = paid.length
      ? paid.reduce((a, i) => a + (daysBetween(i.date, i.paidDate) || 0), 0) / paid.length : null;
    return Object.assign({}, b, {_rev:rev, _mi:mi, _loads:ls.length,
      _rpm:mi ? rev / mi : 0, _unpaid:unpaid, _avgPay:avgPay});
  });
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:"Customer Report"}), el("div", {class:"sp"}),
      el("span", {class:"hint", text:"Average days to pay tells you who to keep hauling for"})

function reportList(){
  /* ⚠ DIKEY KENDI RAPORUNU EKLEYEBILIR. Kayit urunlerinde K/Z anlamsiz;
     V.reports icinde {v,t,fn} nesnesi verilirse dogrudan kullanilir. */
  const d = V.reports || (V.noMoney ? ["jobs"] : ["pnl","jobs","client"]);

function setField(f){
  const node = fieldNode(f, S.set);
  const inp = node.querySelector("input,select,textarea");
  if (inp) inp.addEventListener("change", () => {
    S.set[f.k] = f.type === "check" ? inp.checked
      : (f.type === "num" || f.type === "money") ? (inp.value === "" ? 0 : Number(inp.value))
      : inp.value;
    commit();
    if (f.repaint) render();
  });
  return node;
}
function setPanel(title, hint, fields){
  return el("div", {class:"panel"}, [

      el("h2", {text:title}),
      hint ? el("div", {class:"hint", text:hint}) : null
    ]),

  ]);
}

function pickLogo(){
  const inp = el("input", {type:"file", accept:"image/*", style:{display:"none"}});
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 256, sc = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        S.set.logo = c.toDataURL("image/png");
        commit("Logo updated."); render();
      };
      img.onerror = () => toast("That image could not be read.", "err");
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(() => inp.remove(), 900);
}

function b64url(buf){
  let s = "";
  new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function pkceVerifier(){
  const a = new Uint8Array(48);
  crypto.getRandomValues(a);
  return b64url(a.buffer);
}
async function pkceChallenge(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return b64url(d);
}

  if (!CLOUD_OK()) return;
  const v = pkceVerifier();
  try { sessionStorage.setItem(APP() + ":pkce", v); }
  catch(e){ toast("Your browser is blocking storage — sign-in can't continue.", "err"); return; }
  const u = new URL("https://www.dropbox.com/oauth2/authorize");
  u.searchParams.set("client_id", DBX_KEY);
  u.searchParams.set("response_type", "code");
  u.searchParams.set("code_challenge", await pkceChallenge(v));
  u.searchParams.set("code_challenge_method", "S256");
  u.searchParams.set("redirect_uri", dbxRedirect());
  u.searchParams.set("token_access_type", "offline");   /* → refresh token */
  location.href = u.toString();
}

async function dbxForm(body){
  const r = await fetch(DBX_ROOT + "/oauth2/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(body).toString()
  });
  if (!r.ok) throw new Error("dropbox auth " + r.status + " " + (await r.text()).slice(0, 160));
  return r.json();
}

/* Dönüşte ?code= ile geliyoruz. Adres çubuğunu hemen temizliyoruz ki
   yenilemede aynı kod ikinci kez harcanmasın (Dropbox tek kullanımlık). */
async function dbxFinishRedirect(){
  if (!CLOUD_OK()) return false;
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (!code) return false;
  const v = sessionStorage.getItem(APP() + ":pkce") || "";
  history.replaceState({}, "", dbxRedirect());
  if (!v){ toast("Sign-in could not be completed — please try again.", "err"); return false; }
  try {
    const t = await dbxForm({code:code, grant_type:"authorization_code",
      code_verifier:v, client_id:DBX_KEY, redirect_uri:dbxRedirect()});
    sessionStorage.removeItem(APP() + ":pkce");
    DBX = {refresh:t.refresh_token || "", access:t.access_token,
           exp:Date.now() + (n0(t.expires_in) || 14000) * 1000};
    await idbPut("dbx", DBX);
    return true;
  } catch(e){
    DBX_FAIL = String(e.message || e);
    toast("Dropbox sign-in failed.", "err");
    return false;
  }
}

async function dbxResume(){
  if (!CLOUD_OK()) return;
  try { DBX = (await idbGet("dbx")) || null; } catch(e){ DBX = null; }
}

/* ⚠ TOKEN 4 SAAT. Refresh token ile yenileme GÖRÜNMEZ — kullanıcı hiçbir
   şey görmüyor. 60 sn pay bırakılıyor ki uçuşta sona ermesin. */
async function dbxToken(){
  if (!DBX) return "";
  if (DBX.access && Date.now() < DBX.exp - 60000) return DBX.access;
  if (!DBX.refresh) return "";
  const t = await dbxForm({grant_type:"refresh_token",
    refresh_token:DBX.refresh, client_id:DBX_KEY});
  DBX.access = t.access_token;
  DBX.exp = Date.now() + (n0(t.expires_in) || 14000) * 1000;
  await idbPut("dbx", DBX);
  return DBX.access;
}

async function dbxCall(url, headers, body){
  const tk = await dbxToken();
  if (!tk) throw new Error("not connected");
  const r = await fetch(url, {method:"POST",
    headers:Object.assign({Authorization:"Bearer " + tk}, headers),
    body:body});
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
  return r;
}

/* ── Aynı iki işlem: kendi dosyanı yaz, ötekileri oku ──────────────── */
async function dbxPush(){
  if (!DBX || DEMO_MODE || DBX_BUSY) return;
  const name = APP() + "-" + deviceName() + ".json";
  try {
    await dbxCall(DBX_CONTENT + "/2/files/upload",
      {"Dropbox-API-Arg":JSON.stringify({path:"/" + name,
        mode:"overwrite", mute:true}),
       "Content-Type":"application/octet-stream"},
      JSON.stringify(S, null, 1));
    DBX_LAST = Date.now(); DBX_FAIL = "";
    S.set.lastFolderWrite = today();
  } catch(e){ DBX_FAIL = String(e.message || e); }
  paintSync();
}

async function dbxPull(){
  if (!DBX || DEMO_MODE || DBX_BUSY) return 0;
  const mine = APP() + "-" + deviceName() + ".json";
  let n = 0;
  DBX_BUSY = true;
  try {
    const r = await dbxCall(DBX_ROOT + "/2/files/list_folder",
      {"Content-Type":"application/json"}, JSON.stringify({path:""}));
    const j = await r.json();
    for (const e of (j.entries || [])){
      if (e[".tag"] !== "file" || e.name === mine || !fileMine(e.name)) continue;
      try {
        const f = await dbxCall(DBX_CONTENT + "/2/files/download",
          {"Dropbox-API-Arg":JSON.stringify({path:e.path_lower})}, null);
        n += mergeIncoming(JSON.parse(await f.text()));
      } catch(err){}
    }
    saveLocal();
    DBX_FAIL = "";
  } catch(e){ DBX_FAIL = String(e.message || e); }
  DBX_BUSY = false;
  paintSync();
  return n;
}

async function dbxForget(){
  DBX = null;
  try { await idbPut("dbx", null); } catch(e){}
  paintSync();
  toast("Dropbox disconnected. Your data is still on this device.", "info");
}

/* ⚠ TELEFON SEKME DONDURUYOR. iOS arka plandaki sekmeyi askıya alıyor;
   zamanlayıcıya güvenilmiyor. Sayfa geri görünür olunca çekiliyor. */
function cloudWatch(){
  if (!DBX) return;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - DBX_LAST > 20000)
      dbxPull().then(n => { if (n) render(); });
  });
}

function accentHex(){
  try {
    const c = getComputedStyle(document.documentElement)
      .getPropertyValue("--accent").trim();
    return c || "#E8590C";
  } catch(e){ return "#E8590C"; }
}
function brandInitials(){
  const n = (S.set.company || V.name || "App").replace(/[^A-Za-z0-9 ]/g, " ").trim();
  const w = n.split(/\s+/).filter(Boolean);
  return ((w[0] || "A")[0] + (w[1] ? w[1][0] : (w[0] || "A")[1] || "")).toUpperCase();
}
function touchIconPNG(size){
  try {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const x = c.getContext("2d");
    const r = size * 0.22;
    x.fillStyle = "#161C24";
    x.beginPath();
    if (x.roundRect) x.roundRect(0, 0, size, size, r); else x.rect(0, 0, size, size);
    x.fill();
    x.fillStyle = accentHex();
    x.beginPath();
    const p = size * 0.16, s2 = size - p * 2, r2 = s2 * 0.2;
    if (x.roundRect) x.roundRect(p, p, s2, s2, r2); else x.rect(p, p, s2, s2);
    x.fill();
    x.fillStyle = "#FFFFFF";
    x.font = "600 " + Math.round(size * 0.38) + "px -apple-system,Helvetica,Arial,sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(brandInitials(), size / 2, size / 2 + size * 0.02);
    return c.toDataURL("image/png");
  } catch(e){ return ""; }
}

function setMeta(name, content){
  let m = document.querySelector('meta[name="' + name + '"]');
  if (!m){ m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
  m.content = content;
}
function setLink(rel, href, extra){
  let l = document.querySelector('link[rel="' + rel + '"][data-inst]');
  if (!l){ l = document.createElement("link"); l.rel = rel;
    l.setAttribute("data-inst", "1"); document.head.appendChild(l); }
  l.href = href;
  if (extra) for (const k in extra) l.setAttribute(k, extra[k]);
}

       bilmeden kapatıyordu. */
    if (typeof savePending === "function" && savePending()){

function seeded(n){
  let s = n || 20260828;
  const R = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  R.pick = a => a[Math.floor(R() * a.length)];
  R.bt = (a, b) => a + R() * (b - a);
  R.int = (a, b) => Math.floor(R.bt(a, b));
  R.chance = p => R() < p;
  return R;
}

/* ── GİDER DEFTERİ ────────────────────────────────────────────────────
   revByMonth : {"2026-07": 41200, …}   aylık ciro
   spec       : {fixed:[[ad, aylık, oynaklık], …],
                 variable:[[ad, ciro oranı, oynaklık], …],
                 occasional:[[ad, kaç ayda bir, min, max], …]}
   target     : hedef net marj (0.15 = %15)
   ⚠ HEDEFE "denge kalemi" ile varılıyor: sabit + değişken kalemler
     sektörün dağılımını korur, kalan fark `balanceAs` kalemine yazılır
     (genelde ücretler — her işte en büyük ve en esnek kalem).            */
function expenseBook(R, revByMonth, spec, target, balanceAs){
  const out = [], months = Object.keys(revByMonth).sort();
  const D = mk => mk + "-" + String(R.int(2, 27)).padStart(2, "0");
  months.forEach(mk => {
    const rev = revByMonth[mk] || 0;
    if (!rev) return;
    let spent = 0;
    (spec.fixed || []).forEach(f => {
      const amt = Math.round(f[1] * R.bt(1 - (f[2] || .08), 1 + (f[2] || .08)));
      out.push({id:uid(), date:D(mk), category:f[0], amount:amt, vendor:f[3] || ""});
      spent += amt;
    });
    (spec.variable || []).forEach(v => {
      const amt = Math.round(rev * v[1] * R.bt(1 - (v[2] || .12), 1 + (v[2] || .12)));
      if (amt > 0){
        out.push({id:uid(), date:D(mk), category:v[0], amount:amt, vendor:v[3] || ""});
        spent += amt;
      }
    });
    (spec.occasional || []).forEach(o => {
      if (!R.chance(1 / (o[1] || 3))) return;
      const amt = Math.round(R.bt(o[2], o[3]));
      out.push({id:uid(), date:D(mk), category:o[0], amount:amt, vendor:o[4] || ""});
      spent += amt;
    });
    /* denge kalemi — hedef marja getiren fark */
    const want = rev * (1 - target);
    const gap = Math.round(want - spent);
    if (gap > 0)
      out.push({id:uid(), date:D(mk), category:balanceAs[0], amount:gap,
                vendor:balanceAs[1] || ""});
  });
  return out;
}

/* ═══ DEMO İÇİNDE AYARLARI GEÇİCİ OLARAK KUR ════════════════════════════
   ⚠ BU TUZAĞA İKİ KEZ DÜŞTÜK. Alan fonksiyonlarının çoğu `S.set`'ten
     okuyor (gün ücreti, vergi oranı, servis malzemesi yüzdesi...). Ama
     `DEMO()` henüz S'e yazmadığı için o değerler UNDEFINED → 0 dönüyor:
       · electrical: gün ücretli işler ciroya 0 yazıldı, giderler eksik
         üretildi, net marj %16 hedeflenirken %27 çıktı
       · autoshop: vergi ve servis malzemesi 0 sayıldı
     Çözüm: demo ayarlarını ÖNCE kur, hesabı onunla yap, sonra geri al.
   ⚠ Aynı sebeple demo içinde `rows()` / `byId()` de kullanma — S boş. */
function withSettings(set, fn){
  const prev = S.set;
  S.set = Object.assign({}, DEFAULT_SET, set);
  try { return fn(); }
  finally { S.set = prev; }
}

/* Aylık ciro haritası — expenseBook'un girdisi. */
function revenueByMonth(list, dateOf, valueOf){
  const m = {};
  list.forEach(x => {
    const k = monthKey(dateOf(x));
    if (k) m[k] = (m[k] || 0) + valueOf(x);
  });
  return m;
}

/* Son N ayın anahtarları — gider defteri bu pencereyi doldurur. */
function monthWindow(n){
  const out = {}, d = new Date(); d.setDate(1);
  for (let i = n; i >= 0; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out[x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")] = 0;
  }
  return out;
}

/* İş aşamalarını doldur: son günler kasıtlı yoğun, tahta boş kalmasın.
   ⚠ Düz dağıtımda 78 yükün 4'ü son 16 güne düşüyordu ve dispeç tahtası
     BOŞ açılıyordu; boş ürün ne satar ne anlatır. */
function openStagePlan(stages, perStage){
  const plan = [];
  stages.forEach((st, si) => {
    for (let k = 0; k < (perStage || 4); k++)
      plan.push({st:st, day:-Math.floor((si * (perStage || 4) + k) / 2.2) - 1});
  });
  return plan;
}

/* ═══ ÖRNEK VERİDE FATURA YAŞLANDIRMA ═══════════════════════════════════
   ⚠ 100 ÜRÜNÜN 32'SİNDE BİR YILLIK ÖDENMEMİŞ FATURA VARDI — mimarlıkta
     1.368 gün, veterinerde 411 açık fatura. Sebep her demoda tekrarlanan
     aynı kalıp: fatura ancak İÇİNDEKİ BÜTÜN İŞLER "paid" ise ödenmiş
     sayılıyor; ayın tek bir işi açık kalınca o ayın faturası sonsuza
     kadar gecikmiş görünüyor. Hiçbir işletme dört yıllık alacağı
     defterinde tutmaz; bu tek satır bütün panoyu inandırıcılıktan
     çıkarıyordu.
   ⚠ TAHSİLAT SORUNU TAMAMEN SİLİNMİYOR. Son ~90 günün gecikmişleri
     olduğu gibi bırakılıyor; "vadesi geçmiş fatura" uyarı ailesi
     çalışmaya devam ediyor, sadece imkânsız olanlar kapatılıyor.
   ⚠ YALNIZ DEMO YOLUNDA ÇAĞRILIR. Gerçek kullanıcının verisine
     dokunmaz. */
function ageDemoInvoices(d){
  if (!d || !Array.isArray(d.invoices)) return d;
  const DAYS = {"Net 15":15, "Net 30":30, "Net 45":45, "Net 60":60,
                "Due on receipt":0, "Quick Pay (2 days)":2};
  const cap = 90;
  const R = seeded(90210);
  d.invoices.forEach(inv => {
    if (inv.paidDate) return;
    const t = DAYS[inv.terms];
    const due = addDays(inv.date, t === undefined ? 30 : t);
    const late = daysBetween(due, today());
    if (late <= cap) return;              /* yakın gecikme kalsın */
    /* vadesinden 3-40 gün sonra ödenmiş say, bugünü geçmesin */
    let paid = addDays(due, R.int(3, 40));
    if (paid > today()) paid = today();
    inv.paidDate = paid;
  });
  return d;
}

/* ═══ ALAN: PEYNİR · TELEME VE OLGUNLAŞMA ═════════════════════════════
   ⚠ ÜRÜNÜN BİRİNCİ SAYISI: RANDIMAN TAHMİN EDİLEBİLİR. "On litre süt bir
     kilo peynir" bir tahmin; endüstride yayımlanmış bir denklem var
     (Van Slyke) ve sütün yağ ile kazein oranından beklenen randımanı
     yüzde olarak veriyor. %4,0 yağ ve %3,3 proteinli sütten %38 rutubetli
     bir peynir için beklenen 10,9 kg/100 L. Ev peynircisi bu sayıyı hiç
     hesaplamıyor, dolayısıyla eline geçen 9,4 kg'ın az mı normal mi
     olduğunu bilmiyor. Ürün her partide beklenen ile gerçekleşeni yan
     yana koyuyor.
   ⚠ AYNI HESABIN İKİNCİ YÜZÜ: EKSİK RANDIMAN YAĞIN PEYNİR ALTI SUYUNA
     KAÇMASIDIR. Teleme çok küçük kesilmiş, çok sert karıştırılmış ya da
     erken kesilmişse yağ süzülüp gidiyor. Ürün farkı 100 litre başına
     kiloya ve yıllık kayba çeviriyor — o zaman "biraz azmış" bir sayı
     hâline geliyor.
   ⚠ İKİNCİ SAYI: ASİTLENME HIZI. Peynir yapımı takvimle değil pH ile
     yürüyor: mayalama 6,55, kesim 6,45, süzme 6,15, tuzlama 5,35. İki
     ölçümden saatlik pH düşüşü çıkıyor ve geri kalan bütün adımların
     saati oradan geliyor. Yavaş asitlenen bir parti bütün günü kaydırıyor
     ve tarifteki saatlere uymak tam olarak yanlış olan şey.
   ⚠ ÜÇÜNCÜ SAYI: MAĞARADA AYLIK AĞIRLIK KAYBI. Sert peynir doğru
     odada ayda %1-2 veriyor; kuru odada çatlıyor, nemli odada yanlış
     küf tutuyor. Ürün her tekerin kendi kayıp hızını ölçüp odayı
     yargılıyor.
   ⚠ DÖRDÜNCÜ SAYI: HANGİ TEKER NE ZAMAN HAZIR.                       */

/* [peynir, hedef rutubet %, en az olgunlaşma günü, aylık kayıp bandı] */
const CH_TYPE = {
  "Cheddar":       [37, 90,  [0.9, 1.8]],
  "Gouda":         [41, 60,  [0.8, 1.6]],
  "Tomme":         [42, 60,  [1.0, 2.0]],
  "Parmesan style":[32, 300, [0.6, 1.4]],
  "Blue":          [45, 60,  [1.2, 2.4]],
  "Camembert":     [52, 21,  [1.5, 3.0]],
  "Feta":          [55, 30,  [0, 0.4]],
  "Halloumi":      [45, 0,   [0, 0.4]],
  "Chèvre":        [60, 7,   [2.0, 4.0]],
  "Manchego style":[38, 90,  [0.9, 1.8]]
};
const CH_TYPE_LIST = Object.keys(CH_TYPE);
const CH_MILK = ["Cow, whole", "Cow, standardised", "Goat", "Sheep",
                 "Cow and goat"];
const CH_CULTURE = ["Mesophilic MA011", "Mesophilic MM100", "Thermophilic TA61",
                    "Flora Danica", "Kefir", "Own whey starter"];
/* pH kilometre taşları — yayımlanmış çalışma aralıkları. */
const CH_PH = {rennet:6.55, cut:6.45, drain:6.15, salt:5.35, press:5.25};
const CH_BANDS = {caseinOfProtein:0.78, vanSlyke:1.09, fatFactor:0.93,
                  loss:0.1, caveC:[10, 14], caveRH:[82, 90],
                  yieldTol:0.4, minWheels:2};

function milkName(id){ return nameOf("milks", id); }
function caveName(id){ return nameOf("caves", id); }
function num2(v){ return Math.round(n0(v) * 10) / 10; }
function num3(v){ return (Math.round(n0(v) * 100) / 100).toFixed(2); }
function ph2(v){ return (Math.round(n0(v) * 100) / 100).toFixed(2); }
function chIn(from, to, milkId){
  return rows("makes").filter(r => isRevenue(r) && inRange(r.date, from, to) &&
    (!milkId || r.milkId === milkId));
}

/* ── ÜRÜNÜN BİRİNCİ SAYISI: VAN SLYKE ─────────────────────────────── */
function milkOf(r){ return byId("milks", r.milkId); }
function typeData(t){ return CH_TYPE[t] || null; }
function caseinOf(protein){ return n0(protein) * CH_BANDS.caseinOfProtein; }
/* Y% = [(0,93·F + C − 0,1) × 1,09] / (1 − M) */
function predictedYield(fat, protein, moisturePct){
  const F = n0(fat), C = caseinOf(protein), M = n0(moisturePct) / 100;
  if (!F || !C || !M || M >= 1) return null;
  return ((CH_BANDS.fatFactor * F + C - CH_BANDS.loss) *
    CH_BANDS.vanSlyke) / (1 - M);
}
function expectedFor(r){
  const m = milkOf(r);
  const t = typeData(r.type);
  if (!m || !t) return null;
  const y = predictedYield(m.fat, m.protein, t[0]);
  if (y === null) return null;
  return {pct:y, kg:y * n0(r.litres) / 100, moisture:t[0],
          fat:n0(m.fat), protein:n0(m.protein), casein:caseinOf(m.protein)};
}
function actualYield(r){
  if (!n0(r.litres) || !n0(r.cheeseKg)) return null;
  return 100 * n0(r.cheeseKg) / n0(r.litres);
}
function yieldGap(r){
  const e = expectedFor(r), a = actualYield(r);
  if (!e || a === null) return null;
  return a - e.pct;
}
function devOf(r){ const g = yieldGap(r); return g === null ? 0 : Math.abs(g); }
function yieldBand(g){
  if (g === null || g === undefined) return {t:"—", c:"var(--muted)",
    pill:"mute"};
  if (Math.abs(g) <= CH_BANDS.yieldTol) return {t:"as the milk predicts",
    c:"var(--good)", pill:"good"};
  if (g < 0) return {t:Math.abs(g) <= 1 ? "a little short"
    : "well short — fat is going into the whey",
    c:Math.abs(g) <= 1 ? "var(--warn)" : "var(--bad)",
    pill:Math.abs(g) <= 1 ? "warn" : "bad"};
  return {t:"above prediction — check the moisture", c:"var(--warn)",
          pill:"warn"};
}
/* Kayıp kaç kiloya ve yılda kaç litre süte denk geliyor. */
function wheyLoss(r){
  const g = yieldGap(r);
  const e = expectedFor(r);
  if (g === null || g >= 0 || !e) return null;
  const kgKayip = -g * n0(r.litres) / 100;
  return {perHundred:-g, kg:kgKayip,
          pct:e.pct ? 100 * -g / e.pct : 0,
          litresWasted:e.pct ? kgKayip / (e.pct / 100) : 0};
}
function shortYield(){
  return rows("makes").filter(r => isRevenue(r))
    .filter(r => { const g = yieldGap(r);
      return g !== null && g < -CH_BANDS.yieldTol; })
    .sort((a, b) => yieldGap(a) - yieldGap(b));
}
function yieldByMilk(){
  const m = {};
  rows("makes").filter(r => isRevenue(r) && yieldGap(r) !== null).forEach(r => {
    const k = r.milkId || "none";
    if (!m[k]) m[k] = {id:k, n:0, gap:0, litres:0, kg:0};
    m[k].n++; m[k].gap += yieldGap(r);
    m[k].litres += n0(r.litres); m[k].kg += n0(r.cheeseKg); });
  return Object.keys(m).map(k => m[k])
    .map(x => { x.avgGap = x.gap / x.n; x.milk = byId("milks", x.id);
      x.actual = x.litres ? 100 * x.kg / x.litres : 0; return x; })
    .filter(x => x.milk)
    .sort((a, b) => a.avgGap - b.avgGap);
}

/* ── İKİNCİ SAYI: ASİTLENME HIZI ──────────────────────────────────── */
function acidRate(r){
  const a = n0(r.phStart), b = n0(r.phEnd);
  const h = n0(r.phHours);
  /* ⚠ `a <= b === false` diye yazmak `(a<=b) === false` oluyor ve asit
     GERÇEKTEN düştüğünde fonksiyonu null döndürüyordu — ürünün ikinci
     sayısı tamamen sessiz kalmıştı. Şart açıkça yazılacak. */
  if (!a || !b || !h) return null;
  if (b >= a) return null;
  return (a - b) / h;
}
function acidClock(r){
  const rate = acidRate(r);
  if (!rate || rate <= 0) return null;
  const bas = n0(r.phStart);
  const saat = hedef => (bas - hedef) / rate;
  return {rate:rate,
          toCut:saat(CH_PH.cut), toDrain:saat(CH_PH.drain),
          toSalt:saat(CH_PH.salt), toPress:saat(CH_PH.press),
          start:bas,
          /* Tipik bir gün 5,5-7 saatte tuzlamaya varıyor. */
          slow:saat(CH_PH.salt) > 8, fast:saat(CH_PH.salt) < 4};
}
function acidSpread(){
  const l = rows("makes").filter(r => isRevenue(r) && acidRate(r));
  if (l.length < 3) return null;
  const v = l.map(r => acidRate(r));
  const ort = v.reduce((a, b) => a + b, 0) / v.length;
  return {n:l.length, avg:ort,
          min:Math.min.apply(null, v), max:Math.max.apply(null, v),
          slowest:l.slice().sort((a, b) => acidRate(a) - acidRate(b))[0],
          fastest:l.slice().sort((a, b) => acidRate(b) - acidRate(a))[0],
          hoursAvg:(CH_PH.rennet - CH_PH.salt) / ort,
          spread:(CH_PH.rennet - CH_PH.salt) *
            (1 / Math.min.apply(null, v) - 1 / Math.max.apply(null, v))};
}
function slowMakes(){
  return rows("makes").filter(r => isRevenue(r))
    .map(r => ({r:r, c:acidClock(r)}))
    .filter(x => x.c && x.c.slow)
    .sort((a, b) => a.c.rate - b.c.rate);
}

/* ── ÜÇÜNCÜ SAYI: MAĞARA VE AĞIRLIK KAYBI ─────────────────────────── */
function wheelsOf(makeId){
  return rows("wheels").filter(w => !makeId || w.makeId === makeId);
}
function wheelLoss(w){
  const m = byId("makes", w.makeId);
  if (!n0(w.startKg) || !n0(w.nowKg) || !m) return null;
  const gun = daysBetween(m.date, n0(w.weighedOn) ? w.weighedOn : today());
  if (gun <= 0) return null;
  const kayip = 100 * (n0(w.startKg) - n0(w.nowKg)) / n0(w.startKg);
  return {pct:kayip, days:gun, perMonth:kayip / (gun / 30),
          kg:n0(w.startKg) - n0(w.nowKg), age:gun};
}
function lossBand(w){
  const l = wheelLoss(w);
  const m = byId("makes", w.makeId);
  const t = m ? typeData(m.type) : null;
  if (!l || !t) return {t:"—", c:"var(--muted)", pill:"mute"};
  const b = t[2];
  if (l.perMonth < b[0]) return {t:"drying too slowly", c:"var(--warn)",
    pill:"warn"};
  if (l.perMonth > b[1]) return {t:"drying too fast", c:"var(--bad)",
    pill:"bad"};
  return {t:"in band", c:"var(--good)", pill:"good"};
}
function caveVerdict(caveId){
  const c = byId("caves", caveId);
  if (!c) return null;
  const l = rows("wheels").filter(w => w.caveId === caveId && wheelLoss(w));
  if (l.length < CH_BANDS.minWheels) return null;
  const v = l.map(w => wheelLoss(w).perMonth);
  const ort = v.reduce((a, b) => a + b, 0) / v.length;
  const hizli = l.filter(w => lossBand(w).pill === "bad").length;
  const yavas = l.filter(w => lossBand(w).pill === "warn").length;
  return {cave:c, n:l.length, avg:ort, fast:hizli, slow:yavas,
          tempOk:n0(c.tempC) >= CH_BANDS.caveC[0] &&
            n0(c.tempC) <= CH_BANDS.caveC[1],
          rhOk:n0(c.rh) >= CH_BANDS.caveRH[0] && n0(c.rh) <= CH_BANDS.caveRH[1],
          /* Nem düşükse kayıp hızlanıyor — ikisi birlikte okunmalı. */
          dry:n0(c.rh) < CH_BANDS.caveRH[0] && hizli > 0,
          damp:n0(c.rh) > CH_BANDS.caveRH[1]};
}
function badCaves(){
  return rows("caves").map(c => caveVerdict(c.id)).filter(Boolean)
    .filter(v => !v.tempOk || !v.rhOk || v.fast > 0)
    .sort((a, b) => b.avg - a.avg);
}
function dryingFast(){
  return rows("wheels").filter(w => !w.sold && lossBand(w).pill === "bad")
    .sort((a, b) => (wheelLoss(b) || {perMonth:0}).perMonth -
      (wheelLoss(a) || {perMonth:0}).perMonth);
}

/* ── DÖRDÜNCÜ SAYI: HAZIR MI ──────────────────────────────────────── */
function readyState(w){
  const m = byId("makes", w.makeId);
  const t = m ? typeData(m.type) : null;
  if (!m || !t) return null;
  const yas = daysBetween(m.date, today());
  const hedef = n0(w.ageDays) || t[1];
  return {age:yas, target:hedef, left:hedef - yas,
          ready:yas >= hedef, type:m.type,
          pct:hedef ? 100 * yas / hedef : 100,
          date:addDays(m.date, hedef)};
}
function readyNow(){
  return rows("wheels").filter(w => !w.sold)
    .map(w => ({w:w, r:readyState(w)}))
    .filter(x => x.r && x.r.ready)
    .sort((a, b) => b.r.age - a.r.age);
}
function comingUp(){
  return rows("wheels").filter(w => !w.sold)
    .map(w => ({w:w, r:readyState(w)}))
    .filter(x => x.r && !x.r.ready)
    .sort((a, b) => a.r.left - b.r.left);
}
function inCave(){
  return rows("wheels").filter(w => !w.sold).length;
}
function totalAgeing(){
  return rows("wheels").filter(w => !w.sold)
    .reduce((a, w) => a + n0(w.nowKg), 0);
}
function openMakes(){
  return rows("makes").filter(r => isRevenue(r) && r.status === "watch");
}

/* ═══ ÖRNEK VERİ — KÜÇÜK BİR PEYNİRHANE ═══════════════════════════════
   ⚠ ÜRÜNÜN BİRİNCİ SAYISI ancak PEYNİR AĞIRLIĞI VAN SLYKE'DAN
     TÜRETİLİRSE anlamlı: beklenen randıman hesaplanıp üstüne bilerek bir
     kayıp konuyor. Rastgele kilo verilseydi fark gürültü olurdu ve ürün
     "peynir altı suyuna yağ gidiyor" diyemezdi.
   ⚠ SÜTÜN YAĞI MEVSİMLE DEĞİŞİYOR — kışın yüksek, yazın düşük. Sabit
     olsaydı randımanın neden dalgalandığı sorusu doğmazdı.
   ⚠ İKİNCİ SAYI için asitlenme hızı partiden partiye gerçekten
     değişiyor; biri belirgin biçimde yavaş.
   ⚠ ÜÇÜNCÜ SAYI için iki mağara var ve biri fazla kuru — tekerleri
     bandın üstünde kaybediyor.                                        */
function DEMO(){
  const R = seeded(61830542);
  const D = n => addDays(today(), n);
  const id = () => uid();

  const caves = [
    {id:id(), name:"The old dairy", kind:"Stone cellar", tempC:12.4, rh:86,
     shelves:40, notes:"North wall, stays put all year"},
    /* ⚠ FAZLA KURU — tekerler bandın üstünde kaybediyor. */
    {id:id(), name:"Converted fridge", kind:"Wine fridge with a controller",
     tempC:11.8, rh:74, shelves:14,
     notes:"The compressor dries it out and the tray needs filling weekly"}
  ];
  const [mahzen, dolap] = caves;

  /* [ad, tür, çiftlik, yağ, protein, litre, gün] */
  const M = [
    ["Winter milk, Hollow Farm", "Cow, whole", "Hollow Farm", 4.35, 3.45,
     400, -300],
    ["Spring milk, Hollow Farm", "Cow, whole", "Hollow Farm", 3.95, 3.25,
     500, -190],
    /* ⚠ YAZ SÜTÜ — yağ düşük, randıman doğal olarak düşük. */
    ["Summer milk, Hollow Farm", "Cow, whole", "Hollow Farm", 3.72, 3.15,
     500, -95],
    /* ⚠ SÜREKLİ EKSİK VEREN SÜT — kâğıtta yazan yağ iyimser. */
    ["Roadside dairy", "Cow, standardised", "Roadside dairy", 3.90, 3.20,
     300, -240],
    ["Goat, Nether Farm", "Goat", "Nether Farm", 3.60, 3.05, 160, -140]
  ];
  const milks = M.map(m => ({id:id(), name:m[0], kind:m[1], farm:m[2],
    fat:m[3], protein:m[4], litres:m[5], date:D(m[6]),
    perLitre:m[1] === "Goat" ? 1.6 : 0.72, notes:""}));
  const byName = n => milks.filter(x => x.name === n)[0];

  /* Van Slyke — demo üretiminde de aynı denklem. */
  const vs = (fat, protein, moisture) =>
    ((0.93 * fat + 0.78 * protein - 0.1) * 1.09) / (1 - moisture / 100);

  const makes = [];
  const wheels = [];
  let ref = 1, wref = 1;

  /* [gün, peynir, süt adı, litre, randıman kaybı (kg/100L),
      asitlenme hızı (pH/saat), teker sayısı, mağara, kesim mm]        */
  const K = [
    [-292, "Cheddar", "Winter milk, Hollow Farm", 90, 0.10, 0.218, 2, mahzen, 8],
    [-268, "Tomme", "Winter milk, Hollow Farm", 60, 0.15, 0.205, 1, mahzen, 10],
    /* ⚠ İNCE KESİM — yağ suya kaçmış. */
    [-236, "Cheddar", "Roadside dairy", 80, 1.15, 0.211, 2, mahzen, 5],
    [-210, "Gouda", "Roadside dairy", 70, 0.95, 0.226, 1, dolap, 9],
    [-182, "Cheddar", "Spring milk, Hollow Farm", 100, 0.12, 0.224, 2, mahzen,
     8],
    [-160, "Camembert", "Spring milk, Hollow Farm", 40, 0.20, 0.176, 4, dolap,
     20],
    /* ⚠ YAVAŞ ASİTLENME — bütün gün kaymış. */
    [-134, "Tomme", "Goat, Nether Farm", 55, 0.25, 0.082, 1, dolap, 10],
    [-112, "Gouda", "Spring milk, Hollow Farm", 90, 0.18, 0.219, 2, mahzen, 9],
    [-84, "Cheddar", "Summer milk, Hollow Farm", 100, 0.22, 0.231, 2, mahzen,
     8],
    /* ⚠ İKİNCİ İNCE KESİM. */
    [-58, "Cheddar", "Summer milk, Hollow Farm", 90, 1.35, 0.208, 2, mahzen, 5],
    [-34, "Feta", "Goat, Nether Farm", 45, 0.10, 0.243, 0, dolap, 15],
    [-15, "Gouda", "Summer milk, Hollow Farm", 80, 0.30, 0.215, 2, dolap, 9]
  ];

  K.forEach(k => {
    const sut = byName(k[2]);
    const t = CH_TYPE[k[1]];
    const beklenen = vs(sut.fat, sut.protein, t[0]);
    const gercek = Math.max(1, beklenen - k[4]);
    const kg = Math.round(gercek * k[3] / 100 * 100) / 100;
    const mid = id();
    const hiz = k[5];
    const phBas = 6.55;
    const phSaat = 2;
    makes.push({id:mid, ref:"C" + String(ref++).padStart(4, "0"),
      date:D(k[0]), type:k[1], milkId:sut.id, litres:k[3], cheeseKg:kg,
      culture:k[1] === "Camembert" ? "Flora Danica"
        : k[1] === "Gouda" ? "Mesophilic MM100" : "Mesophilic MA011",
      phStart:phBas,
      phEnd:Math.round((phBas - hiz * phSaat) * 100) / 100,
      phHours:phSaat, cutMm:k[8],
      cookC:k[1] === "Cheddar" ? 39 : k[1] === "Gouda" ? 37 : 32,
      status:k[4] > 0.4 ? "watch" : k[4] <= 0.2 ? "shown" : "logged",
      note:k[8] <= 5 ? "Cut finer than usual to speed the drain" : "",
      notes:""});

    /* ── TEKERLER ────────────────────────────────────────────────────
       ⚠ ÜÇÜNCÜ SAYI: mağaraya göre aylık kayıp. */
    const aylik = k[7] === dolap ? R.bt(2.1, 2.9) : R.bt(1.1, 1.6);
    for (let i = 0; i < k[6]; i++){
      const bas = Math.round(kg / k[6] * 100) / 100;
      const gun = Math.min(-k[0], 400);
      const kayip = aylik * (gun / 30);
      wheels.push({id:id(), name:k[1] + " " + String(wref++).padStart(3, "0"),
        makeId:mid, caveId:k[7].id,
        startKg:bas,
        nowKg:Math.round(bas * (1 - kayip / 100) * 100) / 100,
        weighedOn:D(-2), ageDays:0,
        /* ⚠ YUMUŞAK PEYNİR RAFTA BEKLEMİYOR: 160 günlük bir camembert
           diye bir şey yok. Tür ayrımı yapılmazsa "hazır" listesi
           gerçekte var olmayan tekerlerle doluyor. */
        sold:(["Camembert", "Feta", "Chèvre"].indexOf(k[1]) >= 0)
          ? k[0] < -60 : k[0] < -180,
        notes:""});
    }
  });

  makes.sort((a, b) => a.date < b.date ? -1 : 1);
  return {milks:milks, makes:makes, wheels:wheels, caves:caves};
}
