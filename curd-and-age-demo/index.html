/* ═══ DİKEY: CURD & AGE ═══════════════════════════════════════════════
   Peynir yapım kaydı. Kayıt kipi.
   Yüzü industrial, bölünmüş kabuk, düz yüzey, normal, split pano. */
const V = {
  id:"cheesemaking",
  name:"Curd & Age",
  initials:"CA",
  tagline:"Ten Litres to a Kilo Is a Guess. The Milk Already Told You.",
  skin:"cream",
  noMoney:true,
  seasonal:true,
  design:{ type:"industrial", shell:"split", surface:"flat",
           density:"regular", dash:"split",
           charts:{time:"area", mix:"donut", part:"bars",
                   rank:"hbars", side:"histogram"} },
  about:"Cheese yield is not a mystery and it is not a rule of thumb. There is a published formula, used across the industry for a century, that turns the fat and protein of the milk into the kilos of cheese it should give at a stated moisture — and it is accurate to within a few per cent. Home cheesemakers never use it, so when ten litres gives nine hundred grams instead of a kilo there is nothing to compare it against and the loss goes unnoticed for years. This works the expected yield for every make from that day's milk, sets it against what actually came out of the press, and turns the gap into kilos and litres, because a shortfall is fat that went down the drain with the whey: cut too small, stirred too hard, or drained too early. The second thing it does is put the day on a pH clock rather than a kitchen clock. Acidification is the process; every step from cutting to salting happens at a stated pH, and two readings an hour apart give the rate, which gives the time for everything that follows. A slow make and a fast one are not the same day with different luck, they are different timetables. Ageing is handled the same way: a wheel's weight loss per month against the published band for its type, which judges the cave far better than a hygrometer does. Runs on your own computer: no account, no subscription, no internet needed.",
  dashSub:"What the milk should give, how fast the acid is running, and what the cave is doing to the wheels",
  allClear:"On yield, on the clock, and drying at the right rate.",
  rank:{title:"Makes by Milk", field:"milkId", entity:"milks"},

  metric:{key:"yield", label:"Off the predicted yield", unit:"kg/100L",
          low:0, high:3, targetPct:70, calc:r => devOf(r),
          fmt:v => num2(v) + ""},
  subject:{entity:"milks", key:"milkId", label:"Milk"},

  words:{
    job:"Make", jobs:"Makes", jobNo:"Make",
    jobLower:"make", jobsLower:"makes",
    client:"Milk", clients:"Milk",
    board:"By yield", value:"Off by", newJob:"Log a make"
  },

  job:{
    key:"makes", icon:"chart", board:false,
    clientKey:"milkId", clientEntity:"milks",
    refKey:"ref", startKey:"date", dateKey:"date",
    labelHead:"Make", dateHead:"Made", qtyHead:"Litres",
    rateHead:"Off yield", wasteHead:"Acid",
    goodRate:0, badRate:3,
    sub:"Litres in, kilos out, and two pH readings an hour apart",
    newHint:"Two pH readings are worth more than a page of timings. From them the rest of the day can be planned rather than guessed",
    emptyText:"Log a make with the milk and the cheese weight. The predicted yield comes from the milk's own fat and protein.",

    stages:[
      {v:"watch",  t:"Short yield", c:"var(--bad)",   pill:"bad"},
      {v:"logged", t:"Made",        c:"var(--c1)",    pill:"acc"},
      {v:"shown",  t:"On yield",    c:"var(--good)",  pill:"good"},
      {v:"void",   t:"Failed",      c:"var(--muted)", pill:"mute", dead:true}
    ],
    open:["watch"],
    dead:["void"],
    doneState:"logged",

    value:r => devOf(r),
    fee:() => 0,
    qty:r => n0(r.litres),
    qtyUnit:() => "litres",
    label:r => (r.type || "Cheese") + " — " + date(r.date),
    cardSub:r => num2(r.litres) + " litres into " + num2(r.cheeseKg) +
      " kg" + (actualYield(r) !== null ? " · " + num2(actualYield(r)) +
        " kg a hundred litres" : ""),
    blank:() => ({status:"logged", date:today(), type:"Cheddar", litres:20,
                  phStart:6.55, phHours:2}),

    summary:r => {
      const e = expectedFor(r);
      const a = actualYield(r);
      const g = yieldGap(r);
      const wl = wheyLoss(r);
      const c = acidClock(r);
      const asp = acidSpread();
      const ws = wheelsOf(r.id);
      const t = typeData(r.type);
      const ym = yieldByMilk();
      return [
        /* ⚠ ÜRÜNÜN BİRİNCİ SAYISI. */
        {k:"What the milk should give", v:!e
          ? "record the milk's fat and protein"
          : num2(e.pct) + " kg a hundred litres — " + num2(e.kg) +
            " kg from " + num2(r.litres) + " · from " + num2(e.fat) +
            "% fat and " + num2(e.casein) + "% casein at " + e.moisture +
            "% moisture",
         c:"var(--c1)"},
        {k:"What it gave", v:a === null ? "weigh the cheese"
          : num2(a) + " kg a hundred litres · " + num2(r.cheeseKg) + " kg" +
            (g !== null ? " · " + (g > 0 ? "+" : "") + num2(g) + " against " +
              "prediction" : ""),
         c:yieldBand(g).c},
        {k:"Verdict", v:g === null ? "—" : yieldBand(g).t,
         c:yieldBand(g).c},
        /* ⚠ AYNI HESABIN İKİNCİ YÜZÜ. */
        {k:"What the whey took", v:!wl ? "nothing — the yield is where it " +
          "should be"
          : num2(wl.kg) + " kg of cheese went out with the whey on this make " +
            "alone — " + num2(wl.pct) + "% of what the milk was carrying, or " +
            num2(wl.litresWasted) + " litres of milk bought for nothing",
         c:wl ? "var(--bad)" : "var(--good)"},
        /* ⚠ İKİNCİ SAYI. */
        {k:"Acid rate", v:!c ? "two pH readings and the hours between them"
          : num3(c.rate) + " pH points an hour from " + ph2(r.phStart) +
            " · " + (c.slow ? "slow" : c.fast ? "fast" : "a normal day"),
         c:!c ? "var(--muted)" : (c.slow || c.fast) ? "var(--warn)"
           : "var(--good)"},
        {k:"Which puts the day at", v:!c ? "—"
          : "cut at " + num2(c.toCut) + " h, drain at " + num2(c.toDrain) +
            " h, salt at " + num2(c.toSalt) + " h, press at " +
            num2(c.toPress) + " — from the start of the make",
         c:"var(--muted)"},
        {k:"Against your other makes", v:!asp ? "—"
          : "your rates run " + num3(asp.min) + " to " + num3(asp.max) +
            " points an hour, which is " + num2(asp.spread) +
            " hours of difference to salting across the same recipe",
         c:"var(--muted)"},
        /* ⚠ ÜÇÜNCÜ SAYI. */
        {k:"Wheels from this make", v:!ws.length ? "none recorded"
          : ws.length + " · " +
            ws.map(w => { const l = wheelLoss(w);
              return w.name + (l ? " " + num2(l.perMonth) + "%/month" : ""); })
              .join(" · "),
         c:"var(--muted)"},
        {k:"The band for " + (r.type || "this type").toLowerCase(), v:!t ? "—"
          : t[2][0] + " to " + t[2][1] + "% a month, and at least " + t[1] +
            " days before it is worth cutting",
         c:"var(--muted)"},
        /* ⚠ DÖRDÜNCÜ SAYI. */
        {k:"Ready", v:!ws.length ? "—"
          : ws.map(w => { const rd = readyState(w);
              return w.name + (rd ? (rd.ready ? " ready"
                : " in " + rd.left + " days") : ""); }).join(" · "),
         c:"var(--muted)"}
      ];
    },

    fields:() => [
      {k:"date", label:"Made", type:"date", req:true},
      {k:"type", label:"Cheese", type:"select", opts:CH_TYPE_LIST, req:true},
      {k:"milkId", label:"Milk", type:"ref", ref:"milks", refLabel:r => r.name,
       req:true},
      {k:"litres", label:"Litres", type:"num", req:true, min:0, max:20000},
      {k:"cheeseKg", label:"Cheese out of the press (kg)", type:"num", min:0,
       max:2000},
      {k:"culture", label:"Culture", type:"select", opts:CH_CULTURE},
      {k:"phStart", label:"pH at renneting", type:"num", min:4, max:7,
       hint:"With the second reading and the hours between, this sets the " +
            "whole day's timetable"},
      {k:"phEnd", label:"pH at the second reading", type:"num", min:4, max:7},
      {k:"phHours", label:"Hours between the two", type:"num", min:0, max:24},
      {k:"cutMm", label:"Curd cut to (mm)", type:"num", min:0, max:50},
      {k:"cookC", label:"Cooked to (°C)", type:"num", min:0, max:60},
      {k:"status", label:"Status", type:"select",
       opts:V.job.stages.map(s => ({v:s.v, t:s.t}))},
      {k:"note", label:"Note"},
      {k:"notes", label:"Longer note", type:"textarea", full:true, rows:2}
    ],

    cols:() => [
      {k:"date", h:"Made", type:"date", w:"104px"},
      {k:"type", h:"Cheese", w:"150px",
       render:r => el("span", {class:"pill mute plain", text:r.type || "—"})},
      {k:"litres", h:"Litres", w:"100px", calc:r => n0(r.litres),
       render:r => el("span", {class:"mono sm", text:num2(r.litres)})},
      /* ⚠ ÜRÜNÜN BİRİNCİ SAYISI SÜTUN OLARAK. */
      {k:"yield", h:"Yield against the milk", w:"230px", calc:r => devOf(r),
       render:r => { const e = expectedFor(r), a = actualYield(r);
         if (!e || a === null) return el("span", {class:"mut", text:"—"});
         return el("span", {class:"sm"}, [
           el("span", {class:"pill " + yieldBand(yieldGap(r)).pill,
             text:num2(a) + " of " + num2(e.pct)}),
           el("span", {class:"mut", text:"  kg a hundred litres"})]); }},
      {k:"lost", h:"Into the whey", w:"150px",
       calc:r => { const w = wheyLoss(r); return w ? w.kg : -1; },
       render:r => { const w = wheyLoss(r);
         if (!w) return el("span", {class:"pill good plain", text:"nothing"});
         return el("span", {class:"pill bad plain",
           text:num2(w.kg) + " kg"}); }},
      /* ⚠ İKİNCİ SAYI SÜTUN OLARAK. */
      {k:"acid", h:"Acid rate", w:"190px",
       calc:r => acidRate(r) || 0,
       render:r => { const c = acidClock(r);
         if (!c) return el("span", {class:"mut", text:"—"});
         return el("span", {class:"sm"}, [
           el("span", {class:"pill " + (c.slow || c.fast ? "warn" : "good"),
             text:num3(c.rate) + " /h"}),
           el("span", {class:"mut",
             text:"  salt at " + num2(c.toSalt) + " h"})]); }},
      {k:"milkId", h:"Milk", w:"170px", calc:r => milkName(r.milkId)},
      {k:"wheels", h:"Wheels", w:"110px",
       calc:r => wheelsOf(r.id).length,
       render:r => el("span", {class:"sm mut",
         text:String(wheelsOf(r.id).length)})}
    ],

    footer:list => ({date:"Makes · " + list.length,
      litres:num(list.reduce((a, r) => a + n0(r.litres), 0)) +
        " litres into " + num2(list.reduce((a, r) => a + n0(r.cheeseKg), 0)) +
        " kg"})
  },

  /* ⚠ ÜRÜNE ÖZGÜ PANEL: BEKLENEN RANDIMANA KARŞI GERÇEKLEŞEN.
     Sıfır çizgisi sütün söylediği; altına düşen her çubuk peynir altı
     suyuna giden yağ. */
  dashPanel:st => {
    const l = rows("makes").filter(r => isRevenue(r) && yieldGap(r) !== null)
      .slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(-16);
    if (l.length < 3) return null;
    const sy = shortYield();
    const toplam = l.filter(r => yieldGap(r) < 0)
      .reduce((a, r) => a + (wheyLoss(r) ? wheyLoss(r).kg : 0), 0);
    return el("div", {class:"panel chart grow"}, [
      el("div", {class:"panel-head"}, [
        el("h2", {text:"Against What the Milk Said"}),
        el("div", {class:"sp"}),
        el("div", {class:"hint",
          text:"kilos a hundred litres, above or below prediction"})
      ]),
      el("div", {class:"panel-body"}, [
        barChart(l.map(r => date(r.date).slice(0, 5)),
          l.map(r => Math.round(yieldGap(r) * 100) / 100),
          {height:230, color:"var(--c1)",
           fmt:v => (v > 0 ? "+" : "") + num2(v) + " kg a hundred litres"}),
        el("div", {class:"sm mut", style:{marginTop:"8px"},
          text:!sy.length
            ? "Every make is landing within " + CH_BANDS.yieldTol +
              " of what the milk's fat and casein predict, which is as close " +
              "as the formula gets."
            : sy.length + " of these came in short, and across the makes " +
              "shown that is " + num2(toplam) + " kg of cheese that went out " +
              "with the whey. The prediction is not a target to beat — it is " +
              "what the milk was carrying, so a shortfall is fat and fines " +
              "physically leaving in the drain. Curd cut smaller than the " +
              "recipe says, stirred before it has healed, or drained while " +
              "still soft all show up here and nowhere else, because the " +
              "cheese still looks right coming out of the press."})
      ])
    ]);
  },

  kpis:st => {
    const sy = shortYield();
    const ym = yieldByMilk();
    const asp = acidSpread();
    const sm = slowMakes();
    const bc = badCaves();
    const df = dryingFast();
    const rn = readyNow();
    const cu = comingUp();
    const l = rows("makes").filter(r => isRevenue(r) && yieldGap(r) !== null);
    const toplamKayip = l.reduce((a, r) =>
      a + (wheyLoss(r) ? wheyLoss(r).kg : 0), 0);
    const toplamLitre = l.reduce((a, r) => a + n0(r.litres), 0);
    return [
      /* ⚠ AYIRT EDİCİ KART 1. */
      {label:"Cheese Lost to the Whey",
       value:l.length ? num2(toplamKayip) + " kg" : "—",
       color:toplamKayip > 1 ? "var(--bad)" : "var(--good)",
       note:l.length ? "across " + l.length + " makes and " +
              num(toplamLitre) + " litres · the milk's fat and casein said " +
              "there was more cheese in it than came out of the press"
            : "record the milk's fat and protein"},
      {label:"Worst Make",
       value:sy.length ? num2(yieldGap(sy[0])) + " kg" : "—",
       color:sy.length ? "var(--bad)" : "var(--good)",
       note:sy.length ? sy[0].type + " on " + date(sy[0].date) + " · " +
              num2(actualYield(sy[0])) + " against " +
              num2(expectedFor(sy[0]).pct) + " predicted, which is " +
              num2(wheyLoss(sy[0]).litresWasted) + " litres of milk for nothing"
            : "every make landed on prediction"},
      {label:"Milk That Under-Delivers",
       value:ym.length ? num2(ym[0].avgGap) + " kg" : "—",
       color:ym.length && ym[0].avgGap < -CH_BANDS.yieldTol ? "var(--warn)"
         : "var(--good)",
       note:ym.length ? ym[0].milk.name + " · " + num2(ym[0].actual) +
              " kg a hundred litres across " + ym[0].n +
              " makes, against what its " + num2(ym[0].milk.fat) +
              "% fat should give" : "—"},
      /* ⚠ AYIRT EDİCİ KART 2. */
      {label:"Acid Rate Spread",
       value:asp ? num2(asp.spread) + " h" : "—",
       color:asp && asp.spread > 2 ? "var(--warn)" : "var(--c1)",
       note:asp ? "of difference to salting between your slowest and fastest " +
              "make · " + num3(asp.min) + " to " + num3(asp.max) +
              " pH points an hour across " + asp.n + " makes"
            : "take two pH readings on each make"},
      {label:"Slow Days", value:String(sm.length),
       color:sm.length ? "var(--warn)" : "var(--good)",
       note:sm.length ? sm[0].r.type + " on " + date(sm[0].r.date) +
              " ran at " + num3(sm[0].c.rate) + " points an hour · " +
              num2(sm[0].c.toSalt) + " hours to salting rather than the usual " +
              (asp ? num2(asp.hoursAvg) : "six")
            : "acidification is keeping to time"},
      /* ⚠ ÜÇÜNCÜ SAYI. */
      {label:"Wheels Drying Too Fast", value:String(df.length),
       color:df.length ? "var(--bad)" : "var(--good)",
       note:df.length ? df[0].name + " at " +
              num2(wheelLoss(df[0]).perMonth) + "% a month · a rind that " +
              "dries faster than the paste can follow is what cracks"
            : "every wheel is inside the band for its type"},
      {label:"Caves Out of Range", value:String(bc.length),
       color:bc.length ? "var(--warn)" : "var(--good)",
       note:bc.length ? bc[0].cave.name + " at " + num2(bc[0].cave.tempC) +
              " °C and " + num2(bc[0].cave.rh) + "% · its wheels average " +
              num2(bc[0].avg) + "% a month" +
              (bc[0].dry ? ", which is what a dry cave looks like" : "")
            : "both temperature and humidity are where they should be"},
      /* ⚠ DÖRDÜNCÜ SAYI. */
      {label:"Ready to Cut", value:String(rn.length),
       color:rn.length ? "var(--good)" : "var(--c2)",
       note:rn.length ? rn[0].w.name + " has been " + rn[0].r.age +
              " days against a minimum of " + rn[0].r.target +
              (cu.length ? " · " + cu[0].w.name + " in " + cu[0].r.left +
                " days" : "")
            : cu.length ? cu[0].w.name + " is next, in " + cu[0].r.left +
              " days" : "nothing on the shelves"}
    ];
  },

  reports:["jobs"],

  nav:[
    ["Makes",  ["dash", "makes"]],
    ["Milk",   ["milks"]],
    ["Wheels", ["wheels"]],
    ["Caves",  ["caves"]],
    ["Insight",["reports"]]
  ],
  counts:{
    makes:() => shortYield().length + openMakes().length,
    wheels:() => dryingFast().length + readyNow().length,
    caves:() => badCaves().length
  },
  alerts:() => {
    const out = [];
    /* ⚠ ÜRÜNÜN BİRİNCİ SAYISI. */
    shortYield().slice(0, 5).forEach(r => {
      const e = expectedFor(r), w = wheyLoss(r);
      out.push({kind:"warn", icon:ICON.chart,
        text:r.type + " on " + date(r.date) + " gave " +
             num2(actualYield(r)) + " where the milk said " + num2(e.pct),
        note:"The milk was " + num2(e.fat) + "% fat and " + num2(e.protein) +
             "% protein, which is " + num2(e.casein) + "% casein. At " +
             e.moisture + "% moisture that predicts " + num2(e.kg) +
             " kg from " + num2(r.litres) + " litres and " +
             num2(r.cheeseKg) + " came out — " + num2(w.kg) +
             " kg short, or " + num2(w.litresWasted) +
             " litres of milk bought for nothing. " +
             (n0(r.cutMm) && n0(r.cutMm) < 8
               ? "The curd was cut to " + n0(r.cutMm) +
                 " mm, which is small enough to shatter and send fines into " +
                 "the whey."
               : "Cutting smaller than the recipe, stirring before the curd " +
                 "has healed, and draining while it is still soft all show " +
                 "up here and nowhere else."), go:"makes"});
    });
    yieldByMilk().forEach(x => {
      if (x.avgGap >= -CH_BANDS.yieldTol || x.n < 2) return;
      out.push({kind:"warn", icon:ICON.home,
        text:x.milk.name + " is running " + num2(x.avgGap) +
             " kg a hundred litres under prediction",
        note:"Across " + x.n + " makes. That is consistent enough to be the " +
             "milk rather than the day: either the fat and protein on the " +
             "delivery note are optimistic, or it is being standardised " +
             "before it reaches you. Skimming half a point of fat is " +
             "invisible in the jug and worth about half a kilo of cheese in " +
             "every hundred litres.", go:"milks"});
    });
    /* ⚠ İKİNCİ SAYI. */
    slowMakes().slice(0, 4).forEach(x => {
      out.push({kind:"warn", icon:ICON.cal,
        text:x.r.type + " on " + date(x.r.date) + " took " +
             num2(x.c.toSalt) + " hours to reach salting pH",
        note:"The acid ran at " + num3(x.c.rate) + " points an hour from " +
             ph2(x.r.phStart) + ". Working to the recipe's clock rather than " +
             "the pH on a day like this salts the curd while it is still " +
             "sweet, which gives a bitter, pasty cheese that never comes " +
             "right in the cave. The usual causes are a tired culture, milk " +
             "straight from a cold tank, or an inhibitor in the milk.",
        go:"makes"});
    });
    const asp = acidSpread();
    if (asp && asp.spread > 2)
      out.push({kind:"good", icon:ICON.chart,
        text:"Your acid rates vary by " + num2(asp.spread) +
             " hours to salting",
        note:"From " + num3(asp.min) + " to " + num3(asp.max) +
             " pH points an hour across " + asp.n + " makes — the same " +
             "recipe, and " + num2(asp.spread) + " hours between the " +
             "quickest day and the slowest. " +
             asp.slowest.type + " on " + date(asp.slowest.date) +
             " was the slow one. This is exactly why cheese is made to pH " +
             "and not to the clock, and two readings an hour apart are " +
             "enough to know which kind of day it is before lunch.",
        go:"makes"});
    /* ⚠ ÜÇÜNCÜ SAYI. */
    dryingFast().slice(0, 4).forEach(w => {
      const l = wheelLoss(w);
      const m = byId("makes", w.makeId);
      const t = m ? typeData(m.type) : null;
      out.push({kind:"warn", icon:ICON.doc,
        text:w.name + " is losing " + num2(l.perMonth) + "% a month",
        note:"The band for " + (m ? m.type.toLowerCase() : "this type") +
             " is " + (t ? t[2][0] + " to " + t[2][1] : "narrower than this") +
             " per cent. " + num2(l.kg) + " kg has gone in " + l.days +
             " days. A wheel losing weight faster than the band dries its " +
             "rind ahead of the paste, and the rind then cracks and lets air " +
             "into the middle. Wrapping it, or raising the humidity in the " +
             "cave, is the fix — but the humidity number on a hygrometer " +
             "lies far more often than the scales do.", go:"wheels"});
    });
    badCaves().forEach(v => {
      out.push({kind:"warn", icon:ICON.chart,
        text:v.cave.name + " is at " + num2(v.cave.tempC) + " °C and " +
             num2(v.cave.rh) + "% humidity",
        note:"The working range is " + CH_BANDS.caveC[0] + " to " +
             CH_BANDS.caveC[1] + " degrees and " + CH_BANDS.caveRH[0] +
             " to " + CH_BANDS.caveRH[1] + " per cent. Its " + v.n +
             " wheels are losing " + num2(v.avg) + " per cent a month" +
             (v.fast ? ", and " + v.fast + " of them are outside the band " +
               "for their type" : "") + ". " +
             (v.dry ? "A dry cave shows up as fast weight loss before it " +
               "shows up as anything you can see on the rind."
              : v.damp ? "A damp cave grows the moulds you did not choose, " +
                "usually starting where the wheel touches the shelf."
              : "Worth checking the reading against a second instrument."),
        go:"caves"});
    });
    /* ⚠ DÖRDÜNCÜ SAYI. */
    readyNow().slice(0, 4).forEach(x => {
      out.push({kind:"good", icon:ICON.doc,
        text:x.w.name + " is ready — " + x.r.age + " days",
        note:"The minimum for " + x.r.type.toLowerCase() + " is " +
             x.r.target + " days and this has had " + x.r.age + ". " +
             (wheelLoss(x.w)
               ? "It has lost " + num2(wheelLoss(x.w).pct) +
                 " per cent of its pressing weight, which for this type is " +
                 lossBand(x.w).t + ". "
               : "") +
             "Longer will not hurt a hard cheese, but the shelf space is " +
             "worth something and the wheel behind it is coming.",
        go:"wheels"});
    });
    return out;
  },
  demo:() => DEMO(),
  entities:{}
};

/* ── 91_entities.js ── */
/* ═══ VARLIKLAR: SÜT · TEKERLER · MAĞARALAR ═══════════════════════════ */
V.entities.milks = {
  noun:"Milk", title:"Milk", icon:"home",
  sub:"Fat and protein per delivery — which is what the yield is predictable from, and the reason it changes with the season",
  fields:() => [
    {k:"name", label:"Milk", req:true},
    {k:"kind", label:"Kind", type:"select", opts:CH_MILK, req:true},
    {k:"farm", label:"Farm"},
    {k:"fat", label:"Fat (%)", type:"num", req:true, min:0, max:12,
     hint:"Off the delivery note, or a hydrometer. Cow's milk runs 3.6 to " +
          "4.4 through the year and the difference is real money"},
    {k:"protein", label:"Protein (%)", type:"num", req:true, min:0, max:8},
    {k:"litres", label:"Litres taken", type:"num", min:0, max:20000},
    {k:"date", label:"Delivered", type:"date"},
    {k:"perLitre", label:"Price a litre", type:"num", min:0, max:20},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Milk"},
    {k:"kind", h:"Kind", w:"160px",
     render:m => el("span", {class:"pill mute plain", text:m.kind || "—"})},
    {k:"fat", h:"Fat", w:"90px", calc:m => n0(m.fat),
     render:m => el("span", {class:"mono sm", text:num2(m.fat) + "%"})},
    {k:"protein", h:"Protein", w:"110px", calc:m => n0(m.protein),
     render:m => el("span", {class:"mono sm", text:num2(m.protein) + "%"})},
    /* ⚠ ÜRÜNÜN BİRİNCİ SAYISININ ÇEKİRDEĞİ. */
    {k:"casein", h:"Casein", w:"110px", calc:m => caseinOf(m.protein),
     render:m => el("span", {class:"sm mut",
       text:num2(caseinOf(m.protein)) + "%"})},
    {k:"pred", h:"Should give, at 37% moisture", w:"230px",
     calc:m => predictedYield(m.fat, m.protein, 37) || 0,
     render:m => { const y = predictedYield(m.fat, m.protein, 37);
       if (y === null) return el("span", {class:"mut", text:"—"});
       return el("span", {class:"sm"}, [
         el("span", {class:"pill acc", text:num2(y) + " kg a hundred litres"}),
         el("span", {class:"mut",
           text:"  " + num2(100 / y) + " L a kilo"})]); }},
    {k:"actual", h:"Actually gave", w:"170px",
     calc:m => { const x = yieldByMilk().filter(y => y.id === m.id)[0];
       return x ? x.avgGap : 9; },
     render:m => { const x = yieldByMilk().filter(y => y.id === m.id)[0];
       if (!x) return el("span", {class:"mut", text:"not used yet"});
       return el("span", {class:"pill " + yieldBand(x.avgGap).pill,
         text:num2(x.actual) + " kg · " + (x.avgGap > 0 ? "+" : "") +
           num2(x.avgGap)}); }},
    {k:"litres", h:"Litres", w:"110px", calc:m => n0(m.litres),
     render:m => el("span", {class:"mono sm", text:num(m.litres)})}
  ],
  blank:() => ({kind:"Cow, whole", fat:4.0, protein:3.3, date:today()})
};

V.entities.wheels = {
  noun:"Wheel", title:"Wheels", icon:"doc",
  sub:"What is on the shelf, what it weighed then and now, and when it is due",
  fields:() => [
    {k:"name", label:"Wheel", req:true},
    {k:"makeId", label:"From the make", type:"ref", ref:"makes",
     refLabel:r => date(r.date) + " · " + (r.type || ""), req:true},
    {k:"caveId", label:"Ageing in", type:"ref", ref:"caves",
     refLabel:r => r.name},
    {k:"startKg", label:"Weight at pressing (kg)", type:"num", req:true,
     min:0, max:100},
    {k:"nowKg", label:"Weight now (kg)", type:"num", min:0, max:100},
    {k:"weighedOn", label:"Weighed on", type:"date"},
    {k:"ageDays", label:"Age it for (days)", type:"num", min:0, max:2000,
     hint:"Leave blank to use the minimum for the type"},
    {k:"sold", label:"Gone", type:"check"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Wheel"},
    {k:"type", h:"Type", w:"150px",
     calc:w => { const m = byId("makes", w.makeId); return m ? m.type : ""; },
     render:w => { const m = byId("makes", w.makeId);
       return el("span", {class:"pill mute plain",
         text:m ? m.type : "—"}); }},
    {k:"startKg", h:"Pressed at", w:"120px", calc:w => n0(w.startKg),
     render:w => el("span", {class:"mono sm", text:num2(w.startKg) + " kg"})},
    /* ⚠ ÜÇÜNCÜ SAYI SÜTUN OLARAK. */
    {k:"loss", h:"Losing a month", w:"200px",
     calc:w => { const l = wheelLoss(w); return l ? -l.perMonth : 9; },
     render:w => { const l = wheelLoss(w);
       if (!l) return el("span", {class:"mut", text:"weigh it again"});
       return el("span", {class:"sm"}, [
         el("span", {class:"pill " + lossBand(w).pill,
           text:num2(l.perMonth) + "%"}),
         el("span", {class:"mut", text:"  " + lossBand(w).t})]); }},
    {k:"nowKg", h:"Now", w:"110px", calc:w => n0(w.nowKg),
     render:w => el("span", {class:"mono sm",
       text:w.nowKg ? num2(w.nowKg) + " kg" : "—"})},
    /* ⚠ DÖRDÜNCÜ SAYI SÜTUN OLARAK. */
    {k:"ready", h:"Ready", w:"190px",
     calc:w => { const r = readyState(w); return r ? r.left : 9999; },
     render:w => { const r = readyState(w);
       if (!r) return el("span", {class:"mut", text:"—"});
       if (r.ready) return el("span", {class:"pill good",
         text:"ready · day " + r.age});
       return el("span", {class:"sm"}, [
         el("span", {class:"pill acc plain", text:r.left + " days"}),
         el("span", {class:"mut", text:"  " + date(r.date)})]); }},
    {k:"caveId", h:"In", w:"150px", calc:w => caveName(w.caveId)}
  ],
  blank:() => ({weighedOn:today(), sold:false})
};

V.entities.caves = {
  noun:"Cave", title:"Caves", icon:"chart",
  sub:"Temperature and humidity, judged by what the wheels in them are actually doing",
  fields:() => [
    {k:"name", label:"Cave", req:true},
    {k:"kind", label:"Kind",
     hint:"A converted fridge, a cellar, a cheese cave"},
    {k:"tempC", label:"Temperature (°C)", type:"num", req:true, min:0,
     max:30},
    {k:"rh", label:"Humidity (%)", type:"num", req:true, min:0, max:100},
    {k:"shelves", label:"Shelf space (wheels)", type:"num", min:0, max:500},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Cave"},
    {k:"tempC", h:"Temperature", w:"150px", calc:c => n0(c.tempC),
     render:c => el("span", {class:"pill " +
       (n0(c.tempC) >= CH_BANDS.caveC[0] && n0(c.tempC) <= CH_BANDS.caveC[1]
         ? "good" : "warn") + " plain",
       text:num2(c.tempC) + " °C"})},
    {k:"rh", h:"Humidity", w:"150px", calc:c => n0(c.rh),
     render:c => el("span", {class:"pill " +
       (n0(c.rh) >= CH_BANDS.caveRH[0] && n0(c.rh) <= CH_BANDS.caveRH[1]
         ? "good" : "warn") + " plain",
       text:num2(c.rh) + "%"})},
    /* ⚠ ÜÇÜNCÜ SAYI: odayı tekerler yargılıyor. */
    {k:"verdict", h:"What the wheels say", w:"230px",
     calc:c => { const v = caveVerdict(c.id); return v ? -v.avg : 9; },
     render:c => { const v = caveVerdict(c.id);
       if (!v) return el("span", {class:"mut",
         text:"needs " + CH_BANDS.minWheels + " weighed wheels"});
       return el("span", {class:"sm"}, [
         el("span", {class:"pill " + (v.fast ? "bad" : v.slow ? "warn"
             : "good"), text:num2(v.avg) + "% a month"}),
         el("span", {class:"mut", text:"  " + v.n + " wheels"})]); }},
    {k:"holding", h:"Holding", w:"130px",
     calc:c => rows("wheels").filter(w => w.caveId === c.id && !w.sold).length,
     render:c => { const n = rows("wheels").filter(w => w.caveId === c.id &&
         !w.sold).length;
       return el("span", {class:"sm"}, [
         el("span", {class:"mono", text:String(n)}),
         n0(c.shelves) ? el("span", {class:"mut",
           text:"  of " + n0(c.shelves)}) : null]); }},
    {k:"kind", h:"Kind", w:"180px",
     render:c => el("span", {class:"sm mut", text:c.kind || ""})}
  ],
  blank:() => ({tempC:12, rh:85})
};

boot();
</script>
</body>
</html>
