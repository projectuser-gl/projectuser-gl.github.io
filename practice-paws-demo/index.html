/* ═══ İŞ KAYITLARI: TABLO · TAHTA · EDİTÖR (ÇEKİRDEK) ═══════════════════
   Her meslekte aynı üç ekran: iş listesi, aşama tahtası, iş formu.
   Alanlar, kolonlar, aşamalar ve canlı hesap şeridi config'ten.

   ⚠ EDİTÖR YAZARKEN HESAPLAR. Ustanın/dispeççinin işi kabul edip
     etmeyeceğine baktığı sayı bu; kaydettikten sonra görmek geç.
   ⚠ recordForm'un `extra` geri çağrısı (form, rec) sırasıyla gelir.
     Ters yazılmıştı ve "New job" düğmesi HİÇ açılmıyordu; sözdizimi
     denetimi göremiyor, yalnız tarayıcıda tıklayınca çıkıyor.            */

let JOB_FILTER = "open";

/* Canlı özet şeridi — config'in verdiği hücreleri çizer. */
function jobSummary(form, rec){
  if (!V.job.summary) return el("span", {});
  const box = el("div", {class:"full", style:{
    display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(104px,1fr))", gap:"1px",
    background:"var(--hair)", border:"1px solid var(--hair)", borderRadius:"var(--r)",
    overflow:"hidden", marginTop:"2px"}});
  function paint(){
    const d = readForm(form, V.job.fields());
    const j = Object.assign({}, rec, d);
    box.innerHTML = "";
    V.job.summary(j).forEach(c => box.appendChild(
      el("div", {style:{background:"var(--paper)", padding:"9px 11px",
        display:"flex", flexDirection:"column", gap:"2px"}}, [
        el("span", {style:{fontSize:"9.5px", letterSpacing:".07em",
          textTransform:"uppercase", color:"var(--muted)", fontWeight:"600"}, text:c.k}),
        el("span", {class:"mono", style:{fontSize:"14px", fontWeight:"600",
          color:c.c || "var(--ink)"}, text:c.v})
      ])));
  }
  form.addEventListener("input", paint);
  form.addEventListener("change", paint);
  setTimeout(paint, 0);
  return box;
}

function editJob(rec){
  recordForm({
    size:"wide", rec:rec, fields:V.job.fields(), extra:jobSummary,
    title:rec && rec.id ? W("job") + " " + jobRef(rec) : W("newJob"),
    sub:rec && rec.id ? jobLabel(rec) : (V.job.newHint || "Totals calculate as you type"),
    before:d => { if (!d.status) d.status = V.job.stages[0].v;
                  if (V.job.before) V.job.before(d); },
    onSave:d => { upsert(V.job.key, d); commit(W("job") + " saved."); render(); },
    onDelete:d => confirmBox("Delete " + W("jobLower") + "?",
      W("job") + " " + jobRef(d) + " will be removed. This cannot be undone.",
      () => { remove(V.job.key, d.id); commit("Deleted."); render(); })
  });
}
function newJob(){ editJob(V.job.blank ? V.job.blank() : {status:V.job.stages[0].v}); }

      controls:[segControl([

        {v:"unpaid", t:"To bill"},

        el("button", {class:"btn sm", html:ICON.down + "<span>Export</span>",

          onclick:newJob})
      ]
    }),
    el("div", {style:{flex:"1", minHeight:"0", overflow:"hidden"}}, dataTable({
      id:V.job.key, rows:list, cols:V.job.cols(),
      sort:V.job.startKey || V.job.dateKey, dir:"desc",
      onEdit:editJob, repaint:render,
      onDelete:j => confirmBox("Delete " + W("jobLower") + "?",
        W("job") + " " + jobRef(j) + " will be removed.",
        () => { remove(V.job.key, j.id); commit("Deleted."); render(); }),
      footer:V.job.footer,
      empty:el("div", {class:"empty"}, [
        el("div", {html:ICON[V.job.icon] || ICON.load}),
        el("h3", {text:f === "open" ? "No open " + W("jobsLower") : "No " + W("jobsLower") + " yet"}),
        el("p", {text:V.job.emptyText ||
          ("Add your first " + W("jobLower") + " and the dashboard, invoices and reports fill in by themselves.")}),
        el("button", {class:"btn pri", html:ICON.plus + "<span>" + W("newJob") + "</span>",
          onclick:newJob})
      ])
    }))
  ]);
}

/* ═══ AŞAMA TAHTASI (sürükle-bırak) ═════════════════════════════════════ */
let DRAG = null;
function viewBoard(){
  const board = el("div", {class:"kb"});
  V.job.stages.filter(s => !s.dead).forEach(s => {
    const list = rows(V.job.key).filter(j => j.status === s.v)
      .sort((a, b) => String(jobStart(a) || "").localeCompare(String(jobStart(b) || "")));
    const total = list.reduce((a, j) => a + jobValue(j), 0);
    /* ⚠ SÜTUN BAŞINA KART SINIRI. Salon demosunda "Paid" sütununda binlerce
       kart vardı ve tahta 2,2 saniyede çiziliyordu — üstelik o kadar kartı
       kimse sürüklemiyor. Sütunda en yeni CARD_CAP tanesi duruyor. */
    const CARD_CAP = 60;
    const lane = el("div", {class:"kb-list"});
    list.slice(0, CARD_CAP).forEach(j => lane.appendChild(el("div", {class:"kb-card", draggable:"true",
      onclick:() => editJob(j),
      ondragstart:e => { DRAG = j.id; e.currentTarget.classList.add("drag");
                         e.dataTransfer.effectAllowed = "move"; },
      ondragend:e => { DRAG = null; e.currentTarget.classList.remove("drag"); }}, [
      el("div", {class:"r1"}, [
        el("span", {class:"ref", text:jobRef(j) || "—"}),
        el("span", {class:"amt", text:money0(jobValue(j))})
      ]),
      el("div", {class:"r2", text:jobLabel(j)}),
      el("div", {class:"r3"}, [
        el("span", {text:dateShort(jobStart(j))}),
        el("span", {text:"·"}),
        el("span", {style:{flex:"1", overflow:"hidden", textOverflow:"ellipsis",
          whiteSpace:"nowrap"}, text:jobCardSub(j)}),
        jobQty(j) ? el("span", {class:"mono",
          text:money(jobRate(j)) + "/" + qtyUnit()}) : null
      ])
    ])));
    if (!list.length) lane.appendChild(el("div", {class:"sm mut",
      style:{padding:"14px 6px", textAlign:"center"},
      text:"Drop " + W("jobsLower") + " here"}));
    else if (list.length > CARD_CAP) lane.appendChild(el("button", {class:"btn sm ghost",
      style:{margin:"4px", width:"calc(100% - 8px)"},
      text:num(list.length - CARD_CAP) + " more — open the list",
      onclick:() => go(V.job.key)}));
    board.appendChild(el("div", {class:"kb-col",
      ondragover:e => { e.preventDefault(); e.currentTarget.classList.add("drop"); },
      ondragleave:e => e.currentTarget.classList.remove("drop"),
      ondrop:e => {
        e.preventDefault(); e.currentTarget.classList.remove("drop");
        const j = byId(V.job.key, DRAG);
        if (j && j.status !== s.v){
          j.status = s.v; stamp(j); commit("Moved to " + s.t + "."); render();
        }
      }}, [
      el("div", {class:"kb-head"}, [
        el("i", {class:"dot", style:{background:s.c}}),
        el("span", {class:"t", text:s.t}),
        el("span", {class:"n", text:list.length + " · " + money0(total)})
      ]),
      lane
    ]));
  });
  /* ⚠ `flex:1; min-height:0` olmadan uzun sütun sayfayı şişirip alt
     kartları ekranın dışında bırakıyordu. */
  board.style.flex = "1"; board.style.minHeight = "0";
  return el("div", {style:{height:"100%", display:"flex", flexDirection:"column",
    gap:"10px", minHeight:"0"}}, [
    el("div", {class:"sm mut", style:{flex:"0 0 auto"},
      text:"Drag a card between columns to change its status. Click a card to open it."}),
    board
  ]);
}

/* ═══ VARLIK EKRANI (ÇEKİRDEK) ══════════════════════════════════════════
   Listele / ara / sırala / ekle / düzenle / sil / dışa aktar. Her meslekte
   aynı iskelet; içini config dolduruyor.
   ⚠ SİLMEDEN ÖNCE BAĞ KONTROLÜ. Yüke bağlı aracı silmek raporda boş isim
     bırakıyordu; artık kaç kayıtta kullanıldığını söyleyip onay istiyoruz. */

/* ⚠ SİLMEDEN ÖNCE BAĞ SAYILIR. Yüke bağlı aracı silmek raporda boş isim
   bırakıyordu. Hangi alanın hangi varlığa baktığı config'ten geliyor —
   çekirdek "truckId" diye bir şey bilmez. */
function usedBy(key, id){
  const link = (V.entities[key] || {}).jobField;
  if (!link) return 0;
  return rows(V.job.key).filter(j => j[link] === id).length;
}

function crudView(cfg){
  const list = rows(cfg.key);
  const open = rec => recordForm({
    size:cfg.size || "", rec:rec, title:rec && rec.id ? cfg.editTitle : cfg.newTitle,
    sub:cfg.sub, fields:cfg.fields, extra:cfg.extra,
    before:cfg.before,
    onSave:d => { upsert(cfg.key, d); commit(cfg.saved || "Saved."); render(); },
    onDelete:d => {
      const n = usedBy(cfg.key, d.id);
      confirmBox("Delete " + (cfg.noun || "record") + "?",
        n ? "This is used on " + n + " load" + (n > 1 ? "s" : "") +
            ". They will keep their history but show a blank name."
          : "This record will be removed. This cannot be undone.",
        () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
    }
  });
  return el("div", {class:"panel", style:{height:"100%"}}, [
    toolbar({
      id:cfg.key, repaint:render, placeholder:cfg.placeholder || "Search…",
      controls:cfg.controls ? cfg.controls() : [],
      actions:[
        el("button", {class:"btn sm", html:ICON.down + "<span>Export</span>",
          onclick:() => exportCSV(cfg.key + "-" + today(), cfg.cols(), list)}),
        el("button", {class:"btn pri sm", html:ICON.plus + "<span>" + (cfg.addLabel || "Add") + "</span>",
          onclick:() => open(cfg.blank ? cfg.blank() : {})})
      ]
    }),
    el("div", {style:{flex:"1", minHeight:"0", overflow:"hidden"}}, dataTable({
      id:cfg.key, rows:list, cols:cfg.cols(), sort:cfg.sort, dir:cfg.dir,
      filter:cfg.filter, footer:cfg.footer, onEdit:open, repaint:render,
      onDelete:d => {
        const n = usedBy(cfg.key, d.id);
        confirmBox("Delete " + (cfg.noun || "record") + "?",
          n ? "Used on " + n + " load" + (n > 1 ? "s" : "") + "."
            : "This record will be removed.",
          () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
      },
      empty:el("div", {class:"empty"}, [
        el("div", {html:cfg.icon || ICON.doc}),
        el("h3", {text:cfg.emptyTitle || "Nothing here yet"}),
        el("p", {text:cfg.emptyText || ""}),
        el("button", {class:"btn pri", html:ICON.plus + "<span>" + (cfg.addLabel || "Add") + "</span>",
          onclick:() => open(cfg.blank ? cfg.blank() : {})})
      ])
    }))
  ]);
}

/* ═══ FATURALAR (ÇEKİRDEK) ══════════════════════════════════════════════
   "Müşteriye kalem faturala" her meslekte aynı iş. Alana bağlı olan tek
   şey: iş kaydının adı, tek satırlık tarifi ve tutarı — V.job'dan geliyor.
   ⚠ FATURA YÜKLERİ SAHİPLENİR, KOPYALAMAZ. Satırlar L.invoiceId üzerinden
     canlı okunuyor; yükte düzeltme yapınca fatura da düzeliyor. Kopyalasak
     iki gerçek olurdu ve hangisinin doğru olduğu belirsiz kalırdı.
   ⚠ Yazdırma AYRI PENCEREDE. Uygulama temasını (koyu tema!) faturaya
     taşımak siyah zeminli fatura üretti — belge her zaman beyaz.         */

/* CK / CE / jobLabel / jobValue / jobRef / jobDate → core/25_jobmath.js */
const JK = () => V.job.key;

function uninvoicedJobs(clientId){
  return rows(JK()).filter(j =>
    !j.invoiceId && isRevenue(j) && j[CK()] === clientId &&
    V.job.billable.indexOf(j.status) >= 0);
}
function invoiceJobs(inv){ return invoiceIndex()[inv.id] || []; }

function newInvoice(){
  const brokers = rows(CE());
  if (!brokers.length){
    return modal({size:"slim", title:W("client") + " needed first",

        text:"An invoice needs a " + W("client").toLowerCase() + ". Add the one you are billing, then come back."}),
      buttons:["-", {label:"Cancel"},
        {label:"Add " + W("client").toLowerCase(), kind:"pri", act:() => { go(CE()); }}]});
  }
  let brokerId = brokers[0].id, picked = {};
  const body = el("div", {class:"stack", style:{gap:"12px"}});
  function paint(){
    body.innerHTML = "";
    const sel = el("select", {class:"inp", onchange:e => { brokerId = e.target.value;
      picked = {}; paint(); }});
    brokers.forEach(b => sel.appendChild(el("option", {value:b.id, text:b.name,
      selected:b.id === brokerId})));
    body.appendChild(el("div", {class:"field"}, [el("label", {text:W("client")}), sel]));
    const avail = uninvoicedJobs(brokerId);
    if (!avail.length){
      body.appendChild(el("div", {class:"empty", style:{padding:"28px"}}, [
        el("div", {html:ICON.invoice}),
        el("h3", {text:W("jobs") + " ready to bill: none"}),
        el("p", {text:V.job.billableHint || (W("jobs") + " appear here once finished and not already on an invoice.")})
      ]));
      return;
    }
    const list = el("div", {style:{border:"1px solid var(--hair)",
      borderRadius:"var(--r)", overflow:"hidden", maxHeight:"280px", overflowY:"auto"}});
    avail.forEach(L => {
      const on = !!picked[L.id];
      list.appendChild(el("label", {style:{display:"flex", gap:"10px", alignItems:"center",
        padding:"9px 11px", borderBottom:"1px solid var(--hair2)", cursor:"pointer",
        background:on ? "var(--accent-soft)" : "transparent"}}, [
        el("input", {type:"checkbox", checked:on,
          onchange:e => { picked[L.id] = e.target.checked; paint(); }}),
        el("span", {class:"mono", style:{fontWeight:"600", width:"78px"}, text:L.ref || "—"}),
        el("span", {class:"cell-2", style:{flex:"1"}}, [
          el("span", {class:"a", text:jobLabel(L)}),
          el("span", {class:"b", text:date(L.doDate || L.puDate)})
        ]),
        el("span", {class:"mono", style:{fontWeight:"600"}, text:money(jobValue(L))})
      ]));
    });
    body.appendChild(list);
    const sum = avail.filter(L => picked[L.id]).reduce((a, L) => a + jobValue(L), 0);
    body.appendChild(el("div", {style:{display:"flex", alignItems:"center", gap:"10px"}}, [
      el("button", {class:"btn sm", text:"Select all",
        onclick:() => { avail.forEach(L => picked[L.id] = true); paint(); }}),
      el("button", {class:"btn sm ghost", text:"Clear",
        onclick:() => { picked = {}; paint(); }}),
      el("div", {style:{flex:"1"}}),
      el("span", {class:"mut sm", text:Object.values(picked).filter(Boolean).length + " selected"}),
      el("span", {class:"mono", style:{fontSize:"16px", fontWeight:"600"}, text:money(sum)})
    ]));
  }
  paint();
  modal({size:"wide", title:"New invoice", sub:"Pick the " + W("jobsLower") + " to bill", body:body,
    buttons:["-", {label:"Cancel"}, {label:"Create invoice", kind:"pri", act:() => {
      const ids = Object.keys(picked).filter(k => picked[k]);
      if (!ids.length){ toast("Select at least one " + W("jobLower") + ".", "err"); return false; }
      const b = byId(CE(), brokerId);
      const inv = stamp({id:uid(), no:nextInvoiceNo(), clientId:clientId, date:today(),
        terms:(b && b.terms) || S.set.invoiceTerms, discount:0, extra:0, paidDate:""});
      rows("invoices").push(inv);
      S.set.nextInvoice = n0(S.set.nextInvoice) + 1;
      ids.forEach(id => { const L = byId("loads", id);
        if (L){ L.invoiceId = inv.id; if (L.status === V.job.doneState) L.status = V.job.billedState; stamp(L); } });
      commit("Invoice " + inv.no + " created.");
      render(); setTimeout(() => openInvoice(inv), 60);
    }}]});
}

  ]));

    el("th", {text:W("jobNo")}), el("th", {text:V.job.labelHead || "Details"}), el("th", {text:V.job.dateHead || "Date"}),
     el("th", {class:"n", text:"Amount"}), el("th", {})
  ])));
  const tb = el("tbody");
  ls.forEach(L => tb.appendChild(el("tr", {}, [

    el("td", {text:date(jobDate(L))}),
    
    el("td", {class:"n strong", text:money(jobValue(L))}),
    el("td", {class:"act"}, el("button", {class:"icon-btn", html:ICON.x, title:"Remove from invoice",
      onclick:() => { L.invoiceId = ""; if (L.status === V.job.billedState) L.status = V.job.doneState;
        stamp(L); commit("Removed from invoice."); closeModal(); render(); }}))
  ])));
  tbl.appendChild(tb);
  body.appendChild(el("div", {class:"tw", style:{border:"1px solid var(--hair)",
    borderRadius:"var(--r)", maxHeight:"260px"}}, tbl));

  const addable = uninvoicedJobs(inv.clientId);
  if (addable.length) body.appendChild(el("button", {class:"btn sm",
    html:ICON.plus + "<span>Add " + addable.length + " more load" +
         (addable.length > 1 ? "s" : "") + "</span>",
    onclick:() => { addable.forEach(L => { L.invoiceId = inv.id;
      if (L.status === V.job.doneState) L.status = V.job.billedState; stamp(L); });
      commit("Loads added."); closeModal(); render(); }}));

  const f = el("form", {class:"form-grid", onsubmit:e => e.preventDefault()});
  [{k:"no", label:"Invoice #", req:true},
   {k:"date", label:"Invoice date", type:"date", req:true},
   {k:"terms", label:"Terms", type:"select", opts:TERMS, req:true},
   {k:"discount", label:"Discount", type:"money", min:0},
   {k:"extra", label:"Additional charge", type:"money"},
   {k:"paidDate", label:"Paid on", type:"date", hint:"Leave blank while unpaid"},
   {k:"paidRef", label:"Payment reference"},
   {k:"notes", label:"Notes on invoice", type:"textarea", full:true, rows:2}
  ].forEach(x => f.appendChild(fieldNode(x, inv)));
  body.appendChild(f);

  const FIELDS = [{k:"no"},{k:"date"},{k:"terms"},{k:"discount",type:"money"},
    {k:"extra",type:"money"},{k:"paidDate"},{k:"paidRef"},{k:"notes"}];
  modal({size:"wide", title:"Invoice " + (inv.no || ""),
    sub:clientName(inv.clientId) + " · " + ls.length + " " + (ls.length === 1 ? W("jobLower") : W("jobsLower")),
    body:body,
    buttons:[
      {label:"Delete", kind:"danger", act:() => confirmBox("Delete invoice?",
        "The " + W("jobsLower") + " go back to unbilled. The invoice number is not reused.",
        () => { invoiceJobs(inv).forEach(L => { L.invoiceId = "";
            if (L.status === V.job.billedState) L.status = V.job.doneState; stamp(L); });
          remove("invoices", inv.id); commit("Invoice deleted."); render(); })},
      "-",
      {label:"Print / PDF", act:() => { Object.assign(inv, readForm(f, FIELDS));
        stamp(inv); commit(); printInvoice(inv); return false; }},
      inv.paidDate ? null : {label:"Mark paid", act:() => {
        Object.assign(inv, readForm(f, FIELDS)); inv.paidDate = today(); stamp(inv);
        invoiceJobs(inv).forEach(L => { L.status = V.job.paidState; stamp(L); });
        commit("Marked paid."); render(); }},
      {label:"Save", kind:"pri", act:() => {
        Object.assign(inv, readForm(f, FIELDS)); stamp(inv);
        if (inv.paidDate) invoiceJobs(inv).forEach(L => { L.status = V.job.paidState; stamp(L); });
        commit("Invoice saved."); render(); }}
    ].filter(Boolean)});
}

/* ── 35_reports.js ── */
/* ═══ RAPORLAR (ÇEKİRDEK) ═══════════════════════════════════════════════
   Beş şekil her meslekte aynı: kâr-zarar · iş kârlılığı · birim başına ·
   çalışan hakedişi · müşteri. Hangileri gösterilecek ve neyle etiketlenecek
   V.reports'tan geliyor.
   ⚠ TEK KAYNAK. Rapor sayıları yüklerden ve giderlerden CANLI türetilir;
     ayrı bir "rapor tablosu" tutulmuyor. İki yerde saklanan sayı er geç
     birbirini tutmuyor.                                                   */

let REP_TAB = "pnl", REP_FROM = "", REP_TO = "";

function repRange(){
  const to = REP_TO || today();
  const from = REP_FROM || addDays(to, -365);
  return {from:from, to:to};
}

function pnlData(){
  const R = repRange();
  const ls = jobsIn(R.from, R.to);
  /* ⚠ Panodakiyle AYNI kanca; iki yerde farklı ciro göstermek en kötüsü. */
  const recur = V.recurring ? V.recurring(R.from, R.to) : 0;
  const revenue = ls.reduce((a, L) => a + jobValue(L), 0) + recur;
  const fees = ls.reduce((a, L) => a + jobFee(L), 0);
  const exps = rows("expenses").filter(e => inRange(e.date, R.from, R.to));
  const fuels = rows("fuel").filter(f => inRange(f.date, R.from, R.to));
  const byCat = sumBy(exps, e => e.category || "Other", e => n0(e.amount));
  const fuelTot = fuels.reduce((a, f) => a + n0(f.cost), 0);
  if (fuelTot) byCat.set("Fuel", (byCat.get("Fuel") || 0) + fuelTot);
  if (fees) byCat.set("Dispatch fee", (byCat.get("Dispatch fee") || 0) + fees);
  const costs = Array.from(byCat.values()).reduce((a, b) => a + b, 0);
  const miles = ls.reduce((a, L) => a + jobQty(L), 0);
  return {R:R, ls:ls, revenue:revenue, byCat:byCat, costs:costs,
          profit:revenue - costs, miles:miles};
}

function repPnl(){
  const d = pnlData();
  const cats = Array.from(d.byCat.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v);
  const out = el("div", {class:"stack"});
  out.appendChild(el("div", {class:"grid g4"}, [
    kpi({label:"Revenue", value:money0(d.revenue), color:"var(--c1)",
         note:d.ls.length + " loads"}),
    kpi({label:"Total Costs", value:money0(d.costs), color:"var(--c5)",
         note:d.revenue ? pct(d.costs / d.revenue * 100, 0) + " of revenue" : "—"}),
    kpi({label:"Net Profit", value:money0(d.profit),
         color:d.profit >= 0 ? "var(--good)" : "var(--bad)",
         note:d.revenue ? pct(d.profit / d.revenue * 100) + " margin" : "—"}),
    kpi({label:"Profit / " + qtyUnit(), value:d.miles ? money(d.profit / d.miles) : "—",
         color:"var(--c3)", note:num(d.miles) + " " + qtyUnit()})
  ]));
  out.appendChild(el("div", {class:"grid g23"}, [
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Cost Breakdown"})),
      el("div", {class:"panel-body flush"}, (() => {
        const t = el("table", {class:"dt"});
        t.appendChild(el("thead", {}, el("tr", {}, [
          el("th", {text:"Category"}), el("th", {class:"n", text:"Amount"}),
          el("th", {class:"n", text:"% of revenue"}), el("th", {class:"n", text:"Per " + qtyUnit()})
        ])));
        const tb = el("tbody");
        cats.forEach(c => tb.appendChild(el("tr", {}, [
          el("td", {text:c.k}),
          el("td", {class:"n strong", text:money(c.v)}),
          el("td", {class:"n mut", text:d.revenue ? pct(c.v / d.revenue * 100) : "—"}),
          el("td", {class:"n mut", text:d.miles ? money(c.v / d.miles) : "—"})
        ])));
        t.appendChild(tb);
        t.appendChild(el("tfoot", {}, el("tr", {}, [
          el("td", {text:"Total costs"}), el("td", {class:"n", text:money(d.costs)}),
          el("td", {class:"n", text:d.revenue ? pct(d.costs / d.revenue * 100) : "—"}),
          el("td", {class:"n", text:d.miles ? money(d.costs / d.miles) : "—"})
        ])));
        return cats.length ? el("div", {class:"tw"}, t)
          : el("div", {class:"empty", style:{padding:"36px"}}, [
              el("h3", {text:"No costs in this period"}),
              el("p", {text:"Log fuel and expenses to see where the money goes."})]);
      })())
    ]),
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Where the money goes"})),
      el("div", {class:"panel-body"}, cats.length
        ? donut(cats.slice(0, 6), {label:"Costs", fmt:money0, size:150})
        : noData(300, 140))
    ])
  ]));
  return out;
}

function repCustomers(){
  const R = repRange();
  const list = rows(CE()).map(b => {
    const ls = jobsIn(R.from, R.to).filter(L => L[CK()] === b.id);
    const rev = ls.reduce((a, L) => a + jobValue(L), 0);
    const mi = ls.reduce((a, L) => a + jobQty(L), 0);
    const invs = rows("invoices").filter(i => i.brokerId === b.id);
    const unpaid = invs.filter(i => !i.paidDate).reduce((a, i) => a + invoiceTotal(i), 0);
    const paid = invs.filter(i => i.paidDate);
    const avgPay = paid.length
      ? paid.reduce((a, i) => a + (daysBetween(i.date, i.paidDate) || 0), 0) / paid.length : null;
    return Object.assign({}, b, {_rev:rev, _mi:mi, _loads:ls.length,
      _rpm:mi ? rev / mi : 0, _unpaid:unpaid, _avgPay:avgPay});
  });
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:"Customer Report"}), el("div", {class:"sp"}),
      el("span", {class:"hint", text:"Average days to pay tells you who to keep hauling for"})
    ]),
    el("div", {class:"panel-body flush"}, dataTable({
      id:"rep-cust", rows:list, sort:"_rev", dir:"desc", repaint:render,
      cols:[
        {k:"name", h:W("client")},
        {k:"_loads", h:W("jobs"), type:"num"},
        {k:"_mi", h:qtyUnitLabel(), type:"num"},
        {k:"_rev", h:"Revenue", type:"money"},
        {k:"_rpm", h:"Avg $/" + qtyUnit(), type:"money",
          tdClass:b => b._rpm >= 2 ? "good" : b._rpm > 0 && b._rpm < 1.5 ? "bad" : ""},
        {k:"_avgPay", h:"Avg days to pay", type:"num", calc:b => b._avgPay || 0,
          render:b => el("span", {class:"mono",
            text:b._avgPay === null ? "—" : Math.round(b._avgPay) + " d"}),
          tdClass:b => b._avgPay > 45 ? "bad" : b._avgPay !== null && b._avgPay < 20 ? "good" : ""},
        {k:"_unpaid", h:"Outstanding", type:"money", tdClass:b => b._unpaid ? "bad" : ""}
      ],
      footer:l => ({name:"Total · " + l.length,
        _rev:money0(l.reduce((a,b) => a + b._rev, 0)),
        _unpaid:money0(l.reduce((a,b) => a + b._unpaid, 0))})
    }))
  ]);
}

function pickLogo(){
  const inp = el("input", {type:"file", accept:"image/*", style:{display:"none"}});
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 256, sc = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        S.set.logo = c.toDataURL("image/png");
        commit("Logo updated."); render();
      };
      img.onerror = () => toast("That image could not be read.", "err");
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(() => inp.remove(), 900);
}

function viewSync(){
  /* Tarayıcının depolamayı kalıcı sayıp saymadığını GÖSTER ama üzerine
     güvence kurma — Chrome bunu site etkileşimine göre veriyor ve temiz
     bir profilde reddediyor (ölçüldü). Gerçek güvence klasör bağlamak. */
  storageInfo().then(si => {
    const l = document.getElementById("storageLine");
    if (!l) return;
    l.textContent = si.persisted
      ? "Your browser has marked this app's storage as permanent — it won't be cleared to free up space."
      : "Your browser keeps this app's storage on a best-effort basis. It can be cleared if the disk fills up, which is another reason to connect a folder.";
  });
  const n = totalRecords();
  const backedUp = S.set.lastBackup;
  const daysSince = backedUp ? daysBetween(backedUp, today()) : null;
  const auto = !!DIR;
  const out = el("div", {class:"stack"});

  /* ── DURUM ŞERİDİ. Tek bakışta: korunuyor muyum? ── */
  const safe = auto || (daysSince !== null && daysSince <= 14);
  out.appendChild(el("div", {class:"panel", style:{
    borderLeft:"3px solid var(--" + (safe ? "good" : "bad") + ")"}},
    el("div", {class:"panel-body", style:{display:"flex", gap:"13px",
      alignItems:"flex-start", flexWrap:"wrap"}}, [
    el("span", {html:safe ? ICON.check : ICON.alert, style:{flex:"0 0 auto",
      color:"var(--" + (safe ? "good" : "bad") + ")", marginTop:"2px"}}),
    el("div", {style:{flex:"1", minWidth:"250px"}}, [
      el("div", {style:{fontWeight:"600", fontSize:"14px", marginBottom:"3px"},
        text:auto ? "Your work is being saved to your folder automatically"
           : safe ? "You have a recent backup file"
                  : "Your data exists in only one place right now"}),
      el("div", {class:"sm", style:{color:"var(--ink2)", lineHeight:"1.65"}},
        auto ? ("Every change is written to the folder you picked, within a second. " +
                num(n) + " records. Nothing else to do.")
             : ("All " + num(n) + " of your records live in " + browserName() +
                ", on this computer. If the disk fails — or if you clear your browsing data — " +
                "they are gone. Set up automatic saving below; it takes about twenty seconds."))
    ]),
    auto ? el("div", {class:"sm mut", id:"pushStamp", style:{flex:"0 0 auto"},
      text:S.set.lastFolderWrite ? "Last saved " + date(S.set.lastFolderWrite) : ""}) : null,

let PAGES = {}, NAV = [], COUNTS = {}, PAGE = "dash";

function buildPages(){
  PAGES = {
    dash: {t:"Dashboard", s:V.dashSub || "Everything at a glance",
           i:"dash", fn:viewDashboard}
  };
  PAGES[V.job.key] = {t:W("jobs"), s:V.job.sub || ("Every " + W("jobLower") + ", start to paid"),
                      i:V.job.icon || "load", fn:viewJobs};
  if (V.job.board !== false)
    PAGES.board = {t:W("board"), s:"Drag " + W("jobsLower") + " through their stages",
                   i:"board", fn:viewBoard};
  PAGES.invoices = {t:"Invoices", s:"Bill " + W("jobsLower") + " and track what's owed",
                    i:"invoice", fn:viewInvoices};
  Object.keys(V.entities).forEach(k => {
    const e = V.entities[k];
    PAGES[k] = {t:e.title || e.noun + "s", s:e.sub || "", i:e.icon || "doc",
                fn:(function(kk){ return function(){ return entityView(kk); }; })(k)};
  });
  Object.keys(V.pages || {}).forEach(k => { PAGES[k] = V.pages[k]; });
  PAGES.reports  = {t:"Reports", s:V.reportsSub || "Where the money goes", i:"chart", fn:viewReports};
  PAGES.sync     = {t:"Backup & Sync", s:"Keep your work safe — and on both computers if you want",
                    i:"folder", fn:viewSync};
  PAGES.settings = {t:"Settings", s:"Company, look and your data", i:"gear", fn:viewSettings};

  NAV = V.nav.concat([["Your Data", ["sync", "settings"]]]);

  /* ⚠ NAV ile PAGES TUTARLILIĞI. Eksik sayfa açılışta çökertiyor. */
  NAV.forEach(g => g[1].forEach(k => {
    if (!PAGES[k]) throw new Error("nav'da '" + k + "' var ama sayfası yok");
  }));

  COUNTS = {
    invoices: () => rows("invoices").filter(i => !i.paidDate).length,
    sync:     () => DIR ? 0 : (!S.set.lastBackup ||
                daysBetween(S.set.lastBackup, today()) > 14) ? 1 : 0
  };
  COUNTS[V.job.key] = () => rows(V.job.key).filter(isOpen).length;
  if (V.entities.docs) COUNTS.docs = () => rows("docs").filter(d => d.expires &&
    daysBetween(today(), d.expires) < 45).length;
  Object.keys(V.counts || {}).forEach(k => { COUNTS[k] = V.counts[k]; });
}

/* ═══ ÖRNEK VERİ KİTAPLIĞI ══════════════════════════════════════════════
   Her dikeyin demo'sunda tekrar eden işler burada bir kez.
   ⚠ EN ÇOK ZAMANI GİDER YAPISI YİYORDU. freight'te marj iki kez (%2, %49),
     autoshop'ta iki kez (%28, −%18), carwash'ta iki kez yanlış çıktı ve her
     seferinde elle kalem ekleyip çıkardım. `expenseBook` artık HEDEF MARJI
     alıp giderleri ona göre üretiyor — sektörün kalem dağılımını koruyarak.
   ⚠ Kalem ADLARI dikeyden geliyor. Ortak bir gider listesi kullanmak
     ürünleri jenerikleştirir: yıkamacının "kimyasal", tesisatçının
     "malzeme", fotoğrafçının "ekipman kiralama" kalemi var.              */

function seeded(n){
  let s = n || 20260828;
  const R = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  R.pick = a => a[Math.floor(R() * a.length)];
  R.bt = (a, b) => a + R() * (b - a);
  R.int = (a, b) => Math.floor(R.bt(a, b));
  R.chance = p => R() < p;
  return R;
}

/* ── GİDER DEFTERİ ────────────────────────────────────────────────────
   revByMonth : {"2026-07": 41200, …}   aylık ciro
   spec       : {fixed:[[ad, aylık, oynaklık], …],
                 variable:[[ad, ciro oranı, oynaklık], …],
                 occasional:[[ad, kaç ayda bir, min, max], …]}
   target     : hedef net marj (0.15 = %15)
   ⚠ HEDEFE "denge kalemi" ile varılıyor: sabit + değişken kalemler
     sektörün dağılımını korur, kalan fark `balanceAs` kalemine yazılır
     (genelde ücretler — her işte en büyük ve en esnek kalem).            */
function expenseBook(R, revByMonth, spec, target, balanceAs){
  const out = [], months = Object.keys(revByMonth).sort();
  const D = mk => mk + "-" + String(R.int(2, 27)).padStart(2, "0");
  months.forEach(mk => {
    const rev = revByMonth[mk] || 0;
    if (!rev) return;
    let spent = 0;
    (spec.fixed || []).forEach(f => {
      const amt = Math.round(f[1] * R.bt(1 - (f[2] || .08), 1 + (f[2] || .08)));
      out.push({id:uid(), date:D(mk), category:f[0], amount:amt, vendor:f[3] || ""});
      spent += amt;
    });
    (spec.variable || []).forEach(v => {
      const amt = Math.round(rev * v[1] * R.bt(1 - (v[2] || .12), 1 + (v[2] || .12)));
      if (amt > 0){
        out.push({id:uid(), date:D(mk), category:v[0], amount:amt, vendor:v[3] || ""});
        spent += amt;
      }
    });
    (spec.occasional || []).forEach(o => {
      if (!R.chance(1 / (o[1] || 3))) return;
      const amt = Math.round(R.bt(o[2], o[3]));
      out.push({id:uid(), date:D(mk), category:o[0], amount:amt, vendor:o[4] || ""});
      spent += amt;
    });
    /* denge kalemi — hedef marja getiren fark */
    const want = rev * (1 - target);
    const gap = Math.round(want - spent);
    if (gap > 0)
      out.push({id:uid(), date:D(mk), category:balanceAs[0], amount:gap,
                vendor:balanceAs[1] || ""});
  });
  return out;
}

/* ═══ DEMO İÇİNDE AYARLARI GEÇİCİ OLARAK KUR ════════════════════════════
   ⚠ BU TUZAĞA İKİ KEZ DÜŞTÜK. Alan fonksiyonlarının çoğu `S.set`'ten
     okuyor (gün ücreti, vergi oranı, servis malzemesi yüzdesi...). Ama
     `DEMO()` henüz S'e yazmadığı için o değerler UNDEFINED → 0 dönüyor:
       · electrical: gün ücretli işler ciroya 0 yazıldı, giderler eksik
         üretildi, net marj %16 hedeflenirken %27 çıktı
       · autoshop: vergi ve servis malzemesi 0 sayıldı
     Çözüm: demo ayarlarını ÖNCE kur, hesabı onunla yap, sonra geri al.
   ⚠ Aynı sebeple demo içinde `rows()` / `byId()` de kullanma — S boş. */
function withSettings(set, fn){
  const prev = S.set;
  S.set = Object.assign({}, DEFAULT_SET, set);
  try { return fn(); }
  finally { S.set = prev; }
}

/* Aylık ciro haritası — expenseBook'un girdisi. */
function revenueByMonth(list, dateOf, valueOf){
  const m = {};
  list.forEach(x => {
    const k = monthKey(dateOf(x));
    if (k) m[k] = (m[k] || 0) + valueOf(x);
  });
  return m;
}

/* Son N ayın anahtarları — gider defteri bu pencereyi doldurur. */
function monthWindow(n){
  const out = {}, d = new Date(); d.setDate(1);
  for (let i = n; i >= 0; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out[x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")] = 0;
  }
  return out;
}

/* İş aşamalarını doldur: son günler kasıtlı yoğun, tahta boş kalmasın.
   ⚠ Düz dağıtımda 78 yükün 4'ü son 16 güne düşüyordu ve dispeç tahtası
     BOŞ açılıyordu; boş ürün ne satar ne anlatır. */
function openStagePlan(stages, perStage){
  const plan = [];
  stages.forEach((st, si) => {
    for (let k = 0; k < (perStage || 4); k++)
      plan.push({st:st, day:-Math.floor((si * (perStage || 4) + k) / 2.2) - 1});
  });
  return plan;
}

/* ═══ ÖRNEK VERİDE FATURA YAŞLANDIRMA ═══════════════════════════════════
   ⚠ 100 ÜRÜNÜN 32'SİNDE BİR YILLIK ÖDENMEMİŞ FATURA VARDI — mimarlıkta
     1.368 gün, veterinerde 411 açık fatura. Sebep her demoda tekrarlanan
     aynı kalıp: fatura ancak İÇİNDEKİ BÜTÜN İŞLER "paid" ise ödenmiş
     sayılıyor; ayın tek bir işi açık kalınca o ayın faturası sonsuza
     kadar gecikmiş görünüyor. Hiçbir işletme dört yıllık alacağı
     defterinde tutmaz; bu tek satır bütün panoyu inandırıcılıktan
     çıkarıyordu.
   ⚠ TAHSİLAT SORUNU TAMAMEN SİLİNMİYOR. Son ~90 günün gecikmişleri
     olduğu gibi bırakılıyor; "vadesi geçmiş fatura" uyarı ailesi
     çalışmaya devam ediyor, sadece imkânsız olanlar kapatılıyor.
   ⚠ YALNIZ DEMO YOLUNDA ÇAĞRILIR. Gerçek kullanıcının verisine
     dokunmaz. */
function ageDemoInvoices(d){
  if (!d || !Array.isArray(d.invoices)) return d;
  const DAYS = {"Net 15":15, "Net 30":30, "Net 45":45, "Net 60":60,
                "Due on receipt":0, "Quick Pay (2 days)":2};
  const cap = 90;
  const R = seeded(90210);
  d.invoices.forEach(inv => {
    if (inv.paidDate) return;
    const t = DAYS[inv.terms];
    const due = addDays(inv.date, t === undefined ? 30 : t);
    const late = daysBetween(due, today());
    if (late <= cap) return;              /* yakın gecikme kalsın */
    /* vadesinden 3-40 gün sonra ödenmiş say, bugünü geçmesin */
    let paid = addDays(due, R.int(3, 40));
    if (paid > today()) paid = today();
    inv.paidDate = paid;
  });
  return d;
}

/* ═══ VETERİNER KLİNİĞİ ═════════════════════════════════════════════════
   ⚠ VETERİNERİN PARASI İKİ YERDEN GELİR VE İKİSİ AYRI İŞTİR: klinik
     hizmet (muayene, ameliyat, diş) ve SATILAN ÜRÜN (mama, ilaç, parazit
     koruması). Hizmetin brüt kârı %70-80, ürünün %25-40. İkisini tek
     "ciro" altında toplayan klinik, ürün satarak büyüdüğünü sanıp kârının
     düştüğünü göremiyor.
   ⚠ RANDEVU BAŞINA ORTALAMA FATURA (ACT) bu işin kıyas sayısı. Hasta
     sayısını artırmak zor, ACT'yi artırmak mümkün: eksik kalan diş
     temizliği, yapılmayan kan tahlili, satılmayan mama.
   ⚠ AŞI VE PARAZİT HATIRLATMASI GELECEK CİRODUR. Aşısı geçen hayvan
     sessizce başka kliniğe gidiyor; hatırlatma listesi kliniğin en
     kârlı ekranı.
   ⚠ SEKTÖR BANDI: ACT $95-190 · hizmet brüt kâr %70-80 · ürün brüt kâr
     %25-40 · veteriner payı cironun %20-25'i · toplam personel %40-48 ·
     net marj %10-18 · aşı hatırlatma dönüşü %55-75.                     */

const SPECIES = ["Dog","Cat","Rabbit","Guinea pig","Hamster","Ferret","Bird",
  "Reptile","Horse","Small mammal"];
const VISIT_KIND = [
  {v:"consult",   t:"Consultation",     mins:15},
  {v:"vaccine",   t:"Vaccination",      mins:15},
  {v:"followup",  t:"Follow-up",        mins:10},
  {v:"dental",    t:"Dental",           mins:60},
  {v:"neuter",    t:"Neutering",        mins:55},
  {v:"surgery",   t:"Surgery",          mins:90},
  {v:"xray",      t:"Imaging",          mins:30},
  {v:"bloods",    t:"Blood work",       mins:20},
  {v:"emergency", t:"Emergency",        mins:40},
  {v:"euthanasia",t:"Euthanasia",       mins:30},
  {v:"puppy",     t:"Puppy/kitten check", mins:20},
  {v:"repeat",    t:"Repeat prescription", mins:5}
];
const REMINDER = ["Annual booster","Kennel cough","Rabies","Flea & worm",
  "Dental check","Weight clinic","Blood pressure","Senior screen"];

function kindOf(v){ return VISIT_KIND.find(k => k.v === v) || VISIT_KIND[0]; }
function visitMins(A){ return n0(A.minutes) || kindOf(A.kind).mins; }
function visitHours(A){ return visitMins(A) / 60; }

/* ⚠ HİZMET VE ÜRÜN AYRI. Tek toplam iki farklı işi gizliyor. */
function serviceRevenue(A){ return n0(A.serviceFee) + n0(A.procedureFee); }
function productRevenue(A){ return n0(A.medsFee) + n0(A.foodFee); }
function visitValue(A){
  return serviceRevenue(A) + productRevenue(A) - n0(A.discount);
}
function productCost(A){ return n0(A.medsCost) + n0(A.foodCost); }
function serviceCost(A){ return n0(A.consumables) + n0(A.labFee); }
function vetPayFor(A){
  const v = byId("vets", A.vetId);
  if (!v) return 0;
  if (v.payType === "percent") return serviceRevenue(A) * n0(v.payRate) / 100;
  if (v.payType === "flat") return n0(v.payRate);
  return visitHours(A) * n0(v.payRate);
}
function visitGross(A){
  return visitValue(A) - productCost(A) - serviceCost(A);
}
function visitMargin(A){
  const v = visitValue(A); return v ? visitGross(A) / v * 100 : 0;
}
function productGP(A){
  const r = productRevenue(A);
  return r ? (r - productCost(A)) / r * 100 : 0;
}
function serviceGP(A){
  const r = serviceRevenue(A);
  return r ? (r - serviceCost(A)) / r * 100 : 0;
}

/* ── ORTALAMA FATURA (ACT) ────────────────────────────────────────── */
function visitsIn(from, to){
  return memo("vis:" + from + ":" + to, function(){
    return rows("visits").filter(v => isRevenue(v) && inRange(v.date, from, to));
  });
}
function act(from, to){
  const vs = visitsIn(from, to);
  return vs.length ? vs.reduce((a, v) => a + visitValue(v), 0) / vs.length : 0;
}
function serviceShare(from, to){
  const vs = visitsIn(from, to);
  const t = vs.reduce((a, v) => a + visitValue(v), 0);
  return t ? vs.reduce((a, v) => a + serviceRevenue(v), 0) / t * 100 : 0;
}
function productGPOverall(from, to){
  const vs = visitsIn(from, to);
  const r = vs.reduce((a, v) => a + productRevenue(v), 0);
  return r ? (r - vs.reduce((a, v) => a + productCost(v), 0)) / r * 100 : 0;
}
function activeAnimals(from, to){
  return new Set(visitsIn(from, to).map(v => v.animalId)).size;
}

/* ── HATIRLATMALAR ────────────────────────────────────────────────────
   ⚠ Hayvan başına, aşı türü başına bir tarih. Tek alanla tutmak "hangi
     aşı geçti" sorusunu cevaplayamıyordu.                              */
function futureBooked(aid){
  return rows("visits").some(v => v.animalId === aid && v.date > today() &&
    V.job.dead.indexOf(v.status) < 0);
}
function overdueReminders(){
  const t = today();
  return rows("reminders").filter(r => !r.done && r.due && r.due < t &&
    !futureBooked(r.animalId))
    .sort((a, b) => (a.due || "").localeCompare(b.due || ""));
}
function dueReminders(days){
  const t = today(), to = addDays(t, days || 30);
  return rows("reminders").filter(r => !r.done && r.due && r.due >= t &&
    r.due <= to && !futureBooked(r.animalId));
}
function reminderValue(list){
  return list.reduce((a, r) => a + n0(r.value), 0);
}
/* Kayıp hayvan: 18 aydır uğramayan, aktif kayıtlı hasta. */
function lastSeenAnimal(aid){
  return memo("seen:" + aid, function(){
    const d = rows("visits").filter(v => v.animalId === aid && isRevenue(v) &&
      v.date <= today()).map(v => v.date).sort();
    return d.length ? d[d.length - 1] : "";
  });
}
function lapsedAnimals(months){
  const lim = (months || 18) * 30.4;
  return rows("animals").filter(a => a.status === "active" && !a.deceased)
    .filter(a => {
      const ls = lastSeenAnimal(a.id);
      return ls && daysBetween(ls, today()) > lim && !futureBooked(a.id);
    });
}
function unpaidBalance(){
  return rows("invoices").filter(i => !i.paidDate)
    .reduce((a, i) => a + invoiceTotal(i), 0);
}

  /* ── Hayvanlar ── */

  for (let i = 0; i < 1400; i++){
    const sp = R.pick(["Dog","Dog","Dog","Dog","Cat","Cat","Cat","Rabbit",

      sex:R.pick(["Male neutered","Female spayed","Male","Female"]),
      dob:D(-R.int(120, 5200)),
      weight:sp === "Dog" ? Math.round(R.bt(4, 42) * 10) / 10
        : sp === "Cat" ? Math.round(R.bt(2.8, 7.5) * 10) / 10
        : sp === "Horse" ? Math.round(R.bt(380, 620))
        : Math.round(R.bt(0.2, 3.2) * 10) / 10,
      microchip:R.chance(.8) ? "9810" + R.int(10000000, 99999999) : "",
      insurer:R.chance(.42) ? R.pick(["Petplan","Agria","Bought By Many",
        "Animal Friends","Direct Line"]) + " · policy " + R.int(10000, 99999) : "",
      owner:owner, phone:phoneNo(R), email:"", address:"",
      alerts:R.chance(.12) ? R.pick(["Aggressive at the vet — muzzle",
        "Epileptic — on phenobarbital", "NSAID intolerant",
        "Needs sedation for nail clips", "Brachycephalic — anaesthetic risk"]) : "",
      since:D(-R.int(60, 3600)),
      deceased:dead ? D(-R.int(20, 600)) : "",
      terms:R.chance(.88) ? "Due on receipt" : "Net 15",
      notes:"",
      _rate:R.bt(.3, 3.4),                 /* yılda kaç ziyaret eğilimi */
      _lapsed:R.chance(.14)});
  }

  /* tür → ücret bandı · süre · ürün eğilimi */
  const K = {
    consult:   {svc:[38, 62],    proc:[0, 0],      med:.55, food:.18, w:26},
    vaccine:   {svc:[42, 78],    proc:[0, 0],      med:.12, food:.16, w:16},
    followup:  {svc:[22, 40],    proc:[0, 0],      med:.4,  food:.1,  w:9},
    dental:    {svc:[58, 92],    proc:[220, 480],  med:.5,  food:.12, w:5},
    neuter:    {svc:[42, 68],    proc:[180, 420],  med:.45, food:.08, w:4},
    surgery:   {svc:[58, 96],    proc:[420, 1350], med:.6,  food:.06, w:3},
    xray:      {svc:[38, 60],    proc:[120, 290],  med:.3,  food:.05, w:4},
    bloods:    {svc:[36, 58],    proc:[85, 195],   med:.35, food:.06, w:6},
    emergency: {svc:[95, 175],   proc:[60, 380],   med:.7,  food:.04, w:4},
    euthanasia:{svc:[95, 185],   proc:[45, 160],   med:.1,  food:0,   w:2},
    puppy:     {svc:[30, 52],    proc:[0, 0],      med:.5,  food:.55, w:6},
    repeat:    {svc:[0, 14],     proc:[0, 0],      med:.95, food:.35, w:15}
  };
  const KEYS = Object.keys(K);
  const TOTW = KEYS.reduce((a, k) => a + K[k].w, 0);
  const pickKind = () => {
    let r = R.bt(0, TOTW), a = 0;
    for (const k of KEYS){ a += K[k].w; if (r <= a) return k; }
    return "consult";
  };

  /* ── Ziyaretler ── */
  const visits = [], reminders = [];
  let ref = 5100, remSeq = 0;
  const liveAnimals = animals.filter(a => !a.deceased || true);
  for (let day = -400; day <= 21; day++){
    const d = D(day);
    const dow = parseD(d).getDay();
    if (dow === 0) continue;
    const n = dow === 6 ? R.int(10, 16) : R.int(22, 34);
    for (let k = 0; k < n; k++){
      const a = R.pick(liveAnimals);
      if (a.deceased && d > a.deceased) continue;
      if (a._lapsed && day > -220) continue;
      const kv = pickKind(), spec = K[kv], base = kindOf(kv);
      const who = (kv === "vaccine" || kv === "repeat" || kv === "followup") &&
        R.chance(.4) ? R.pick(nurses) : R.pick(surgeons);
      const mins = Math.round(base.mins * R.bt(.85, 1.3) / 5) * 5;
      const svc = Math.round(R.bt(spec.svc[0], spec.svc[1]));
      const proc = spec.proc[1] ? Math.round(R.bt(spec.proc[0], spec.proc[1])) : 0;
      /* ⚠ ÜRÜNÜN BRÜT KÂRI %28-36; hizmetinkinden çok daha düşük. */
      const medsFee = R.chance(spec.med) ? Math.round(R.bt(12, 95)) : 0;
      const foodFee = R.chance(spec.food) ? Math.round(R.bt(18, 78)) : 0;
      const roll = R.bt(0, 1);
      const st = day > 0 ? "booked"
        : roll < .045 ? "noshow"
        : roll < .065 ? "cancelled"
        /* ⚠ VETERİNERDE ÖDEME TEZGÂHTA ALINIR. Dörtte biri "faturalandı"
           kalınca 1.740 açık fatura çıkıyordu; gerçek klinikte açık
           bakiye cironun %3-5'i kadardır (sigorta doğrudan tahsilat). */
        : day > -6 ? R.pick(["seen","invoiced","paid","paid"])
        : R.chance(.94) ? "paid" : "invoiced";
      const gone = st === "noshow" || st === "cancelled";
      visits.push({id:id(), ref:String(ref++), status:st, date:d,
        time:R.pick(["08:40","09:00","09:20","10:00","10:40","11:20","14:00",
                     "14:20","15:00","15:40","16:20","17:00","17:40"]),
        animalId:a.id, vetId:who.id, kind:kv, minutes:mins,
        presenting:R.chance(.5) ? R.pick(["Off food for two days",
          "Limping on right hind", "Itchy — scratching neck",
          "Annual health check", "Vomiting since yesterday",
          "Lump on flank", "Routine booster", "Ear shaking",
          "Weight check", "Coughing at night"]) : "",
        serviceFee:gone ? 0 : svc,
        procedureFee:gone ? 0 : proc,
        labFee:gone ? 0 : (kv === "bloods" ? Math.round(R.bt(22, 58))
          : R.chance(.12) ? Math.round(R.bt(14, 46)) : 0),
        consumables:gone ? 0 : Math.round((svc + proc) * R.bt(.03, .08)),
        medsFee:gone ? 0 : medsFee,
        medsCost:gone ? 0 : Math.round(medsFee * R.bt(.62, .74)),
        foodFee:gone ? 0 : foodFee,
        foodCost:gone ? 0 : Math.round(foodFee * R.bt(.68, .78)),
        discount:R.chance(.05) ? R.int(5, 30) : 0,
        notes:""});
      /* ⚠ HATIRLATMA ZİYARETTEN DOĞAR. */
      if (!gone && (kv === "vaccine" || kv === "puppy") && day <= 0){
        reminders.push({id:id(), animalId:a.id,
          kind:kv === "puppy" ? "Annual booster" : R.pick(["Annual booster",
            "Annual booster", "Kennel cough", "Flea & worm"]),
          due:addDays(d, R.pick([365, 365, 365, 182, 90])),
          value:Math.round(R.bt(38, 88)),
          done:false, doneDate:"", notes:"", _seq:remSeq++});
      }
      if (!gone && kv === "dental" && day <= 0 && R.chance(.6)){
        reminders.push({id:id(), animalId:a.id, kind:"Dental check",
          due:addDays(d, 365), value:Math.round(R.bt(45, 75)),
          done:false, doneDate:"", notes:"", _seq:remSeq++});
      }
    }
  }

  /* ── Hatırlatmaları kapat: sonradan gelen hayvanınki yapılmış sayılır ─ */
  reminders.forEach(r => {
    const later = visits.some(v => v.animalId === r.animalId &&
      v.date > r.due && v.date <= today() && isRevenueLocal(v));
    if (later && R.chance(.85)){
      r.done = true;
      r.doneDate = addDays(r.due, R.int(1, 40));
    }
    const a = animals.find(x => x.id === r.animalId);
    if (a && a.deceased && r.due > a.deceased) r.done = true;
  });
  function isRevenueLocal(v){
    return v.status !== "noshow" && v.status !== "cancelled";
  }

  /* ── Faturalar: ziyaret başına ── */
  const invoices = [];
  let no = 7100;
  visits.filter(v => v.status === "invoiced" || v.status === "paid").forEach(v => {
    const a = animals.find(x => x.id === v.animalId);
    const inv = {id:id(), no:"INV-" + (no++), clientId:v.animalId, date:v.date,
      terms:(a && a.terms) || "Due on receipt", discount:0, extra:0, paidDate:""};
    if (v.status === "paid"){
      inv.paidDate = addDays(v.date, inv.terms === "Net 15" ? R.int(3, 18) : R.int(0, 4));
      if (inv.paidDate > today()) inv.paidDate = today();
    }
    v.invoiceId = inv.id;
    invoices.push(inv);
  });

  /* ── Gider defteri ─────────────────────────────────────────────────── */
  const RB = Object.assign(monthWindow(14),

  }, 0.14, ["Other", "Sundries"]);

}

  emptyTitle:"No vets yet",
  emptyText:"Vets are usually salaried or on a percentage of the service fee — never on product. Keep the split here so the numbers stay honest.",
  blank:() => ({status:"active", role:"Veterinary surgeon",
                payType:"percent", payRate:22}),
  fields:[
    {k:"name", label:"Name", req:true},
    {k:"status", label:"Status", type:"select", opts:ACTIVE, req:true},
    {k:"role", label:"Role", type:"select", req:true,
     opts:["Principal vet","Veterinary surgeon","Veterinary nurse",
           "Student nurse","Receptionist","Practice manager"]},
    {k:"specialism", label:"Special interest", ph:"Orthopaedics · exotics"},
    {k:"phone", label:"Phone"},
    {k:"payType", label:"Pay basis", type:"select", req:true,
     opts:[{v:"percent", t:"Percent of service fees"}, {v:"unit", t:"Per hour"},
           {v:"flat", t:"Flat per session"}]},
    {k:"payRate", label:"Pay rate", type:"num", step:"0.01"},
    {k:"registration", label:"Registration expires", type:"date"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Name", render:v => el("div", {class:"cell-2"}, [
      el("span", {class:"a", style:{fontWeight:"500"}, text:v.name || "—"}),
      el("span", {class:"b", text:v.specialism || ""})])},
    {k:"role", h:"Role", w:"160px", render:v =>
      el("span", {class:"pill acc plain", text:v.role || "—"})},
    {k:"visits", h:"Visits", type:"num",
      calc:v => rows("visits").filter(x => x.vetId === v.id && isRevenue(x)).length},
    {k:"rev", h:"Brought in", type:"money",
      calc:v => rows("visits").filter(x => x.vetId === v.id && isRevenue(x))
        .reduce((a, x) => a + visitValue(x), 0)},
    /* ⚠ Veterineri ciroyla değil ORTALAMA FATURAYLA kıyaslamak doğru:
       biri günde 30 hasta görüp az yazıyor, diğeri 18 hasta görüp çok. */
    {k:"act", h:"Avg invoice", type:"money", calc:v => {
      const xs = rows("visits").filter(x => x.vetId === v.id && isRevenue(x));
      return xs.length ? xs.reduce((a, x) => a + visitValue(x), 0) / xs.length : 0; },
      tdClass:v => { const xs = rows("visits").filter(x => x.vetId === v.id && isRevenue(x));
        const a = xs.length ? xs.reduce((s, x) => s + visitValue(x), 0) / xs.length : 0;
        return a >= 95 ? "good" : a > 0 ? "bad" : ""; }},
    {k:"pay", h:"Their pay", type:"money",
      calc:v => rows("visits").filter(x => x.vetId === v.id && isRevenue(x))
        .reduce((a, x) => a + vetPayFor(x), 0)},
    {k:"registration", h:"Registration", type:"date", w:"116px",
      tdClass:v => v.registration &&
        daysBetween(today(), v.registration) < 60 ? "bad" : ""},
    {k:"status", h:"Status", w:"88px", calc:v => v.status || "active",
      render:v => statusPill(v.status)}
  ]
};

V.entities.expenses = {
  title:"Expenses", sub:"Staff, drugs, stock and the building",
  icon:"cash", noun:"expense", addLabel:"Add expense",
  newTitle:"New expense", editTitle:"Expense", sort:"date", dir:"desc",
  emptyTitle:"No expenses yet",
  emptyText:"Salaries and drug stock are most of it. They flow into profit alongside service and product revenue.",
  blank:() => ({date:today(), category:"Drugs & medication stock"}),
  fields:[
    {k:"date", label:"Date", type:"date", req:true},
    {k:"category", label:"Category", type:"select", opts:EXP_CAT, req:true},
    {k:"amount", label:"Amount", type:"money", req:true, min:0},
    {k:"vetId", label:"Vet", type:"ref", ref:"vets", refLabel:r => r.name},
    {k:"vendor", label:"Paid to"},
    {k:"ref", label:"Invoice #"},
    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"date", h:"Date", type:"date", w:"104px"},
    {k:"category", h:"Category", render:e =>
      el("span", {class:"pill mute plain", text:e.category || "—"})},
    {k:"vetId", h:"Vet", calc:e => nameOf("vets", e.vetId)},
    {k:"vendor", h:"Paid to"},
    {k:"amount", h:"Amount", type:"money"}
  ],
  footer:list => ({date:"Total · " + list.length,
    amount:money0(list.reduce((a, e) => a + n0(e.amount), 0))})
};

boot();
</script>
</body>
</html>
