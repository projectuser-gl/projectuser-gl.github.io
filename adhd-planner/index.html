<title>ADHD Life Planner — Interactive Demo</title>
<style>
/* ---------------------------------------------------------------------------
   Bu sayfa BİLEREK tek temalı. Satılan ürün açık temalı bir Google Sheets
   dosyası; demoyu izleyicinin koyu temasına uydurmak ürünü yanlış tanıtır.
   Bu yüzden her renk açıkça boyanıyor ve body'nin zemini asla saydam değil.
   --------------------------------------------------------------------------- */
:root{
  --ground:#FFFFFF; --paper:#FFFFFF; --tint:#F7F9FC; --faint:#F0F3F8;
  --ink:#1F2937; --ink2:#4B5563; --muted:#9CA3AF; --hair:#E5E9F0;
  --nav:#F4F6FA; --navGroup:#8A93A5; --accent:#4F6DF5;
  --blue:#C7D9F5; --blueInk:#2C4C86;
  --pink:#F9D0DE; --pinkInk:#9B3B5C;
  --mint:#CFEBE0; --mintInk:#2F7A63;
  --sand:#FBE6C8; --sandInk:#96631C;
  --lilac:#DFD6F7; --lilacInk:#5B45A6;
  --bad:#B3261E;
  --chrome:#111726; --chromeInk:#E8ECF5; --chromeMuted:#8D97AE;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", sans-serif;
  --shell:196px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--ui);
  font-size:14px; line-height:1.45;
  -webkit-user-select:none; user-select:none;
}
/* Kopyalanamaz: demo, dosyanın kendisi değil. Tam koruma değil ama niyeti
   belli eder ve kazara seçmeyi engeller. */

/* ---------------------------------------------------------------- çerçeve */
.chrome{
  position:sticky; top:0; z-index:40; background:var(--chrome);
  color:var(--chromeInk); display:flex; align-items:center; gap:16px;
  padding:0 18px; height:46px; border-bottom:1px solid #000;
}
.chrome b{font-size:13px; font-weight:650; letter-spacing:.2px}
.chip{
  font-size:10.5px; letter-spacing:.7px; text-transform:uppercase;
  padding:3px 9px; border-radius:999px; background:#1E2740; color:#9FB4E8;
  font-weight:600;
}
.chrome .spacer{margin-left:auto}
.chrome small{color:var(--chromeMuted); font-size:11.5px}

.shell{display:grid; grid-template-columns:var(--shell) 1fr; align-items:start}

/* ------------------------------------------------------------- yan menü */
.side{
  position:sticky; top:46px; height:calc(100vh - 46px); overflow-y:auto;
  background:var(--nav); border-right:1px solid var(--hair); padding-bottom:28px;
}
.side .brand{padding:14px 12px 4px; text-align:center}
.side .brand b{display:block; font-size:13px; letter-spacing:.4px; font-weight:700}
.side .brand span{display:block; font-size:10.5px; color:var(--muted); margin-top:2px}
.side .grp{
  margin-top:12px; padding:5px 14px; background:var(--faint);
  font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--navGroup); font-weight:700;
}
.side a{
  display:flex; align-items:center; gap:9px; padding:5px 14px;
  color:var(--ink2); text-decoration:none; font-size:12.5px; cursor:pointer;
  border-left:3px solid transparent;
}
.side a:hover{background:#EDF1F8; color:var(--ink)}
.side a.on{
  background:var(--paper); color:var(--ink); font-weight:650;
  border-left-color:var(--accent);
}
.side a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.side a i{font-style:normal; width:16px; text-align:center; font-size:13px}

/* --------------------------------------------------------------- gövde */
.main{padding:22px 26px 80px; min-width:0; overflow-x:auto}
.head{display:flex; align-items:flex-start; gap:20px; margin-bottom:18px}
.head h1{margin:0; font-size:26px; font-weight:700; letter-spacing:-.4px}
.head p{margin:3px 0 0; color:var(--muted); font-size:13px; max-width:64ch}
.badge{
  margin-left:auto; flex:none; background:var(--tint); border:1px solid var(--hair);
  border-radius:4px; padding:9px 14px; font-size:10.5px; letter-spacing:.5px;
  color:var(--ink2); text-align:center; max-width:270px;
}

.band{
  margin-top:18px; padding:6px 10px; text-align:center; font-size:10px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase;
}
.band.blue{background:var(--blue); color:var(--blueInk)}
.band.pink{background:var(--pink); color:var(--pinkInk)}
.band.mint{background:var(--mint); color:var(--mintInk)}
.band.sand{background:var(--sand); color:var(--sandInk)}
.band.lilac{background:var(--lilac); color:var(--lilacInk)}

.cardtitle{font-size:12.5px; font-weight:700; margin:16px 0 6px}
.cardtitle.warn{color:var(--bad)}
.panel{border:1px solid var(--hair); background:var(--paper)}
.panel .row{display:flex; align-items:center; border-bottom:1px solid var(--faint);
  min-height:30px; font-size:12.5px; color:var(--ink2)}
.panel .row:last-child{border-bottom:0}
.panel .row .pad{padding:0 10px}
/* Vizyon panosu görseli: kart genişliğine göre kırpılıyor, oranı sabit. */
.goalpic{display:block; width:100%; aspect-ratio:620/260; object-fit:cover;
  border-bottom:1px solid var(--hair)}

/* --------------------------------------------------------------- tablo */
.tbl{border-collapse:collapse; width:max-content; min-width:100%;
  background:var(--paper); font-size:12.5px}
.tbl th{
  position:sticky; top:0; z-index:5; background:var(--tint); color:var(--ink2);
  font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; font-weight:700;
  text-align:left; padding:8px 10px; border-bottom:2px solid var(--hair);
  white-space:nowrap;
}
.tbl td{padding:6px 10px; border-bottom:1px solid var(--faint);
  border-right:1px solid var(--faint); vertical-align:middle; white-space:nowrap}
.tbl td:last-child{border-right:0}
.tbl tr:hover td{background:#FBFCFE}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums}
.tbl .mid{text-align:center}
.tbl .muted{color:var(--muted); font-style:italic; font-size:11.5px;
  white-space:normal; max-width:340px}
.tbl .strike{color:var(--muted); text-decoration:line-through}

.chipc{display:inline-block; padding:2px 9px; border-radius:3px; font-size:11px;
  font-weight:600; line-height:1.5}
.bar{display:block; position:relative; width:100%; height:11px; border-radius:2px; background:var(--hair);
  min-width:110px; overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; display:block; border-radius:2px}
.ck{display:inline-block; width:13px; height:13px; border-radius:2px;
  border:1.5px solid #B6BECD; vertical-align:-2px}
.ck.on{background:var(--accent); border-color:var(--accent); position:relative}
.ck.on::after{content:""; position:absolute; left:3.5px; top:.5px; width:3.5px;
  height:7px; border:solid #fff; border-width:0 1.8px 1.8px 0; transform:rotate(42deg)}

/* ----------------------------------------------------------- dashboard */
.dash{display:grid; grid-template-columns:minmax(360px,1fr) minmax(400px,1.12fr);
  gap:26px; align-items:start}
.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:10px}
.kpi{border:1px solid var(--hair); padding:9px 12px 12px}
.kpi span{display:block; font-size:9.5px; letter-spacing:.7px; color:var(--muted);
  font-weight:700; text-transform:uppercase}
.kpi b{display:block; font-size:22px; font-weight:700; margin-top:4px;
  font-variant-numeric:tabular-nums; text-align:center}
.legend{display:grid; grid-template-columns:1fr auto; gap:0;
  border:1px solid var(--hair)}
.legend div{padding:4px 10px; font-size:11.5px; font-weight:600;
  border-bottom:1px solid var(--paper)}
.legend b{padding:4px 10px; text-align:center; font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--faint); border-left:1px solid var(--hair)}
.donutwrap{display:flex; gap:18px; align-items:center;
  border:1px solid var(--hair); padding:14px}
.catbars{border:1px solid var(--hair); padding:12px 14px}
.catbars .r{display:grid; grid-template-columns:64px 1fr; gap:10px;
  align-items:center; margin-bottom:6px; font-size:11.5px; color:var(--ink2)}
.catbars .stack{display:flex; height:13px; background:var(--faint)}
.catbars .stack i{display:block; height:100%}
.catbars .key{display:flex; gap:14px; margin-top:10px; font-size:11px;
  color:var(--muted); justify-content:center}
.catbars .key span{display:flex; align-items:center; gap:5px}
.catbars .key u{width:10px; height:10px; text-decoration:none; display:block}
.spark{display:flex; align-items:flex-end; gap:4px; height:120px;
  border:1px solid var(--hair); padding:12px 14px 0}
.spark div{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; gap:4px; height:100%}
.spark i{display:block; width:100%; background:var(--blueInk); border-radius:2px 2px 0 0}
.spark s{text-decoration:none; font-size:9.5px; color:var(--muted); padding-bottom:6px}

/* ------------------------------------------------------------- takvim */
.cal{border:1px solid var(--hair); border-right:0; border-bottom:0}
.calhead{display:grid; grid-template-columns:repeat(7,1fr)}
.calhead div{background:var(--blue); color:var(--blueInk); font-size:11px;
  font-weight:700; text-align:center; padding:6px 0;
  border-right:1px solid var(--paper)}
.calgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-right:1px solid var(--hair); border-bottom:1px solid var(--hair);
  min-height:112px; padding:5px 7px 7px; background:var(--paper)}
.day.out{background:#FAFBFD; color:#C3C9D4}
.day.today{background:#EAF0FE}
.day .n{display:flex; justify-content:space-between; font-size:11px;
  font-weight:700; color:var(--ink2); margin-bottom:4px}
.day.out .n{color:#C3C9D4}
.day.today .n b{background:var(--ink); color:#fff; border-radius:3px;
  padding:0 5px; display:inline-block}
.day .n em{font-style:normal; color:var(--bad); font-size:10px}
.day p{margin:0 0 2px; font-size:11px; line-height:1.35; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.day.out p{color:#C3C9D4}
.controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.ctl{display:flex; align-items:stretch; border:1px solid var(--hair)}
.ctl span{background:var(--tint); color:var(--ink2); font-size:11px;
  padding:6px 10px; display:flex; align-items:center}
.ctl select,.ctl input{
  border:0; background:var(--paper); font:inherit; font-size:12.5px;
  font-weight:650; color:var(--ink); padding:6px 10px; text-align:center;
  -webkit-user-select:none; user-select:none; cursor:pointer;
}
.ctl select:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);
  outline-offset:-2px}
.legrow{display:flex; flex-wrap:wrap; gap:0; margin-bottom:12px}
.legrow span{display:flex; align-items:center; gap:6px; font-size:11px;
  color:var(--ink2); padding:4px 10px}

/* ------------------------------------------------------------- haftalık */
.week{border:1px solid var(--hair); border-right:0; border-bottom:0;
  display:grid; grid-template-columns:56px repeat(7,minmax(0,1fr))}
.week > div{border-right:1px solid var(--hair); border-bottom:1px solid var(--hair);
  padding:5px 8px; font-size:11px; min-height:26px}
.week .hd{background:var(--blue); color:var(--blueInk); font-weight:700;
  text-align:center}
.week .hd.now{box-shadow:inset 0 -3px 0 var(--blueInk)}
.week .tm{background:var(--tint); color:var(--muted); text-align:center;
  font-variant-numeric:tabular-nums}
.week .due{color:var(--ink2); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.week .blk{color:var(--blueInk); background:#EDF1FE; font-weight:600}
.week .lbl{background:var(--tint); color:var(--muted); font-size:9px;
  letter-spacing:1.4px; text-align:center; font-weight:700}
.week .sect{grid-column:1/-1; background:var(--lilac); color:var(--lilacInk);
  text-align:center; letter-spacing:3px; font-size:10px; font-weight:700;
  text-transform:uppercase}


/* ---- düzenlenebilir alanlar. Demo CANLI: ziyaretçi kutucuğu işaretleyince
   toplamlar, seriler ve dashboard yeniden hesaplanıyor. Hiçbir şey kaydedilmiyor;
   sayfayı yenilemek örnek veriyi geri getiriyor. */
[contenteditable]{outline:none; cursor:text}
[contenteditable]:hover{background:#F3F7FF; box-shadow:inset 0 -1px 0 var(--accent)}
[contenteditable]:focus{background:#EEF3FE; box-shadow:inset 0 0 0 1px var(--accent)}
.ck{cursor:pointer}
.ck:hover{border-color:var(--accent)}
.sel{border:0; background:transparent; font:inherit; font-size:11px; font-weight:600;
  padding:2px 6px; border-radius:3px; cursor:pointer; -webkit-appearance:none;
  appearance:none; text-align:center}
.sel:focus-visible{outline:2px solid var(--accent)}
.dt{border:0; background:transparent; font:inherit; font-size:11.5px; cursor:pointer;
  color:var(--ink2); width:100%; text-align:center}
.bar-live i{transition:width .18s ease}
@media (prefers-reduced-motion:reduce){.bar-live i{transition:none}}
.toolbar{display:flex; align-items:center; gap:10px; margin:0 0 14px}
.btn{border:1px solid var(--hair); background:var(--paper); color:var(--ink2);
  font:inherit; font-size:12px; padding:5px 12px; border-radius:4px; cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.livehint{font-size:11.5px; color:var(--muted)}

.note{margin-top:26px; color:var(--muted); font-size:11.5px}
@media (max-width:1080px){
  .dash{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="chrome">

</div>

/* ------------------------------------------------------------------ tarih */
const DAY = 864e5;
const T0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const addD = (d,n) => new Date(d.getTime() + n*DAY);
const isDate = v => !!v && typeof v === "object" && "d" in v;
const off  = v => isDate(v) ? addD(T0, v.d) : v;
const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth()
                   && a.getDate()===b.getDate();
const DOW = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON = ["January","February","March","April","May","June","July","August",
             "September","October","November","December"];
// YEREL tarihten üretiliyor. toISOString() UTC'ye çeviriyor ve UTC+3'te yerel
// gece yarısı bir önceki güne düşüyordu: bugüne ait işler tarih kutusunda dün
// görünüyordu. Takvim hesapları zaten yerel, sadece bu dönüşüm kaçmıştı.
const iso = d => d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" +
  String(d.getDate()).padStart(2,"0");
const fmtD = d => d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const dowIdx = d => (d.getDay()+6)%7;                    // 0 = Pazartesi
// Sheets'in WEEKNUM(d) varsayılanı: haftalar PAZAR başlar, 1 Ocak 1. haftadadır.
// ISO haftası kullanılınca "iki haftada bir" kuralı bazı haftalarda sheet ile
// demoda farklı güne düşüyordu.
const weekNo = d => { const j = new Date(d.getFullYear(),0,1);
  return Math.floor((Math.floor((d-j)/DAY) + j.getDay())/7) + 1; };

/* --------------------------------------------------- tekrar kuralı motoru
   build_adhd_pro.recurring_match() ile AYNI kurallar. İkisi ayrı yerde
   yazıldığı için kurallar değişirse iki tarafı da güncelle.                */
function recurs(rule, d){
  if (!rule.active) return false;
  const num = parseInt(rule.day,10);
  switch(rule.freq){
    case "Daily":     return true;
    case "Weekly":    return DOW[dowIdx(d)] === rule.day;
    case "Biweekly":  return DOW[dowIdx(d)] === rule.day && weekNo(d)%2===0;
    case "Monthly":   return d.getDate() === num;
    case "Quarterly": return d.getDate() === num && d.getMonth()%3===0;
    case "Yearly":    return d.getDate() === num && d.getMonth()===0;
  }
  return false;
}
const icon = c => SHEET.catEmoji[c] || "·";
function dayItems(d){
  const out = [];
  for (const t of SHEET.data["Tasks"]){
    const due = off(t.due);
    if (due && same(due,d) && t.task && t.status !== "Cancelled")
      out.push(icon(t.cat)+" "+t.task);
  }
  for (const r of SHEET.data["Recurring Tasks"])
    if (recurs(r,d)) out.push(icon(r.cat)+" "+r.task);
  return out;
}

/* --------------------------------------------------- türetilmiş alanlar
   demo_site.compute()'ın tarayıcı karşılığı. Statik demoda hesap Python'da bir
   kez yapılıyordu; demo artık düzenlenebilir olduğu için her değişiklikten
   sonra BURADA yeniden hesaplanmak zorunda. İki tarafın da aynı kuralı
   uygulaması şart, yoksa demo kendi içinde tutarsız olur. */
function recompute(tab){
  const rows = SHEET.data[tab] || [];
  rows.forEach((r, i) => {
    if (tab === "Habits"){
      const days = Array.from({length:31}, (_,j) => !!r["d"+(j+1)]);
      r.done = days.filter(Boolean).length;
      r.pct  = r.goal ? r.done / r.goal : null;
      let run = 0, best = 0; const runs = [];
      for (const v of days){ run = v ? run+1 : 0; runs.push(run); best = Math.max(best, run); }
      r.best = best;
      r.streak = runs[Math.min(runs.length, T0.getDate()) - 1];
    } else if (tab === "Budget"){
      r.diff = r.type === "Income" ? (r.actual||0) - (r.planned||0)
                                   : (r.planned||0) - (r.actual||0);
    } else if (tab === "Savings"){
      r.pct = r.target ? r.saved / r.target : null;
      r.months = r.monthly ? Math.ceil((r.target - r.saved) / r.monthly) : null;
    } else if (tab === "Debt Payoff"){
      r.pay = (r.min||0) + (r.extra||0);
      const rate = (r.apr||0)/1200;
      if (r.pay && r.balance){
        let n;
        if (rate <= 0) n = Math.ceil(r.balance / r.pay);
        else if (r.pay <= r.balance*rate) n = 999;
        else n = Math.ceil(Math.log(r.pay/(r.pay - r.balance*rate)) / Math.log(1+rate));
        r.months = n;
        r.interest = Math.max(0, Math.round(n*r.pay - r.balance));
      }
    } else if (tab === "Focus Sessions"){
      r.rate = r.planned ? r.actual / r.planned : null;
    } else if (tab === "Weight"){
      r.change = i === 0 ? null : Math.round((r.kg - rows[i-1].kg)*10)/10;
    } else if (tab === "Hydration"){
      r.pct = r.target ? r.glasses / r.target : null;
    } else if (tab === "Goals"){
      r.done = r.steps.filter(s => s[1]).length;
      r.total = r.steps.length;
    }
  });
}

/* ------------------------------------------------------------------ yardım */
const el = (t,c,h) => { const n=document.createElement(t);
  if(c) n.className=c; if(h!==undefined) n.innerHTML=h; return n; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const money = v => (v==null||v==="") ? "" :
  (v<0?"-":"")+"$"+Math.abs(Math.round(v)).toLocaleString("en-US");
const pct = v => (v==null||v==="") ? "" : Math.round(v*100)+"%";
const has = (arr,k) => arr && arr.indexOf(k) >= 0;
const bar = (v,max,col) => {
  if (!max) return "";
  const p = Math.max(0,Math.min(1, (v||0)/max))*100;
  return '<span class="bar bar-live"><i style="width:'+p.toFixed(1)+'%;background:'+col+'"></i></span>';
};
const chip = (txt,bg,ink) =>
  '<span class="chipc" style="background:'+bg+';color:'+ink+'">'+esc(txt)+'</span>';

/* Aşağıdakiler demoyu CANLI yapan üç bileşen. Her biri hangi satırın hangi
   alanını değiştirdiğini data-* ile taşıyor; tek bir olay dinleyicisi hepsini
   yakalıyor (satır başına dinleyici bağlamak 400 satırda ağırlaşıyor). */
const at = (tab,i,k) => 'data-t="'+esc(tab)+'" data-r="'+i+'" data-k="'+esc(k)+'"';
const ckLive = (tab,i,k,on) =>
  '<span class="ck'+(on?" on":"")+'" role="checkbox" tabindex="0" '+
  'aria-checked="'+(!!on)+'" '+at(tab,i,k)+'></span>';
const edit = (tab,i,k,v,cls) =>
  '<span contenteditable="true" spellcheck="false" class="'+(cls||"")+'" '+
  at(tab,i,k)+'>'+esc(v==null?"":v)+'</span>';
const selLive = (tab,i,k,v,opts,bg,ink) => {
  let s = '<select class="sel" '+at(tab,i,k)+
    ' style="background:'+bg+';color:'+ink+'">';
  opts.forEach(o => s += '<option'+(o===v?" selected":"")+'>'+esc(o)+'</option>');
  return s + '</select>';
};
const dateLive = (tab,i,k,d) =>
  '<input type="date" class="dt" '+at(tab,i,k)+' value="'+(d?iso(d):"")+'">';

/* ------------------------------------------------------- genel veri tablosu */
function renderTable(name){
  const cols = SHEET.schema[name], rows = SHEET.data[name] || [];
  const f = SHEET.fmt, moneyKeys = f.money[name] || [], barSpec = f.bars[name];
  const DROPS = {cat:SHEET.categories, status:SHEET.statuses, pri:SHEET.priorities};
  const RU = SHEET.rules[name] || {};
  const box = el("div");
  box.appendChild(toolbar(name));
  const wrap = el("div"); wrap.style.overflowX = "auto";
  const tb = el("table","tbl");
  const cg = el("colgroup");
  cols.forEach(c => { const x = el("col");
    x.style.width = Math.round(c.w*0.86)+"px"; cg.appendChild(x); });
  tb.appendChild(cg);
  const thead = el("thead"), tr = el("tr");
  cols.forEach(c => tr.appendChild(el("th","",esc(c.h))));
  thead.appendChild(tr); tb.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach((r, ri) => {
    const t2 = el("tr");
    cols.forEach(c => {
      const k = c.k; let v = r[k], cls = "", html = "";
      let tint = null;
      if (RU.chips && RU.chips[k] && RU.chips[k][v]) tint = RU.chips[k][v];
      if (RU.thresholds) for (const th of RU.thresholds){
        if (th[0] !== k) continue;
        const val = r[k];
        if (val == null || val === "") continue;
        const cmp = th[1] === ">=field" ? r[th[2]] : th[2];
        const hit = th[1] === ">=" ? val >= cmp : th[1] === "<=" ? val <= cmp
                  : th[1] === ">" ? val > cmp : th[1] === "<" ? val < cmp
                  : th[1] === ">=field" ? val >= cmp : false;
        if (hit){ tint = [th[3], th[4]]; break; }
      }
      if (has(f.check,k)) { cls = "mid"; html = ckLive(name,ri,k,v); }
      else if (barSpec && k === "bar") { html = bar(r[barSpec[0]], r[barSpec[1]], barSpec[2]); }
      else if (isDate(v)) { cls = "mid"; html = dateLive(name,ri,k,off(v)); }
      else if (has(f.cat,k) && SHEET.catColor[v])
        { cls="mid"; html = selLive(name,ri,k,v,DROPS.cat,SHEET.catColor[v],"#4B5563"); }
      else if (has(f.status,k) && SHEET.statusColor[v])
        { cls="mid"; html = selLive(name,ri,k,v,DROPS.status,
            SHEET.statusColor[v][0],SHEET.statusColor[v][1]); }
      else if (has(f.pri,k) && SHEET.priColor[v])
        { cls="mid"; html = selLive(name,ri,k,v,DROPS.pri,SHEET.priColor[v],"#4B5563"); }
      else if (RU.options && RU.options[k]) {
        cls = "mid";
        html = selLive(name,ri,k,v,RU.options[k],
                       tint ? tint[0] : "transparent", tint ? tint[1] : "var(--ink2)");
        tint = null;                       // rengi etiket taşıyor, hücre değil
      }
      // Hesaplanan sütunlar düzenlenmez: elle yazılan bir "%" ilk tıkta geri
      // hesaplanır ve demo bozuk görünür.
      else if (has(f.pct,k)) { cls="num"; html = esc(pct(v)); }
      else if (["diff","months","interest","pay","change","done","streak","best"]
               .indexOf(k) >= 0 && name !== "Goals")
        { cls="num"; html = esc(has(moneyKeys,k) ? money(v) : v); }
      else if (has(moneyKeys,k)) { cls="num"; html = edit(name,ri,k,money(v)); }
      else if (typeof v === "number") { cls = has(f.center,k) ? "mid num" : "num";
        html = edit(name,ri,k,v); }
      else { html = edit(name,ri,k,v); if (has(f.center,k)) cls = "mid";
             if (has(f.muted,k)) cls = "muted"; }
      if (RU.strike) for (const [tk, ck, cv] of RU.strike)
        if (k === tk && r[ck] === cv) cls += " strike";
      const td = el("td",cls,html);
      if (tint){ td.style.background = tint[0]; td.style.color = tint[1];
                 td.style.fontWeight = "600"; }
      if (RU.signed && RU.signed.indexOf(k) >= 0 && typeof v === "number" && v < 0)
        td.style.color = "var(--bad)";
      t2.appendChild(td);
    });
    tbody.appendChild(t2);
  });
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);
  return box;
}

/* Sekme üstü şerit: canlı olduğunu söyler, satır ekler, sıfırlar. */
const NO_ADD = ["Goals", "Habits", "Dashboard"];
function toolbar(name){
  const bar2 = el("div","toolbar");
  if (SHEET.data[name] && SHEET.schema[name] && NO_ADD.indexOf(name) < 0){
    const add = el("button","btn","+  Add a row");
    add.addEventListener("click", () => {
      const blank = {};
      SHEET.schema[name].forEach(c => {
        const k = c.k;
        blank[k] = has(SHEET.fmt.check,k) ? false
                 : has(SHEET.fmt.date,k) ? {d:0}
                 : has(SHEET.fmt.cat,k) ? SHEET.categories[0]
                 : has(SHEET.fmt.status,k) ? SHEET.statuses[SHEET.statuses.length-1]
                 : has(SHEET.fmt.pri,k) ? SHEET.priorities[1] : "";
      });
      SHEET.data[name].push(blank);
      touched(name);
    });
    bar2.appendChild(add);
  }
  bar2.appendChild(el("span","livehint",
    "Everything here is editable — tick a box or change a value and the totals, "+
    "streaks and dashboard move with it. Nothing is saved; refresh to start over."));
  return bar2;
}

let calState = {y:T0.getFullYear(), m:T0.getMonth(), start:"Monday", cat:"All"};
function renderCalendar(){
  const box = el("div");
  const ctl = el("div","controls");
  const mk = (label, opts, val, on) => {
    const c = el("div","ctl"); c.appendChild(el("span","",esc(label)));
    const s = el("select");
    opts.forEach(o => { const op = el("option","",esc(o.l));
      op.value = o.v; if (String(o.v)===String(val)) op.selected = true;
      s.appendChild(op); });
    s.addEventListener("change", e => { on(e.target.value); draw(); });
    c.appendChild(s); return c;
  };
  const years = []; for (let y=T0.getFullYear()-1; y<=T0.getFullYear()+3; y++)
    years.push({l:String(y), v:y});
  ctl.appendChild(mk("Year", years, calState.y, v => calState.y = +v));
  ctl.appendChild(mk("Month", MON.map((m,i)=>({l:m,v:i})), calState.m, v => calState.m = +v));
  ctl.appendChild(mk("Week starts", [{l:"Monday",v:"Monday"},{l:"Sunday",v:"Sunday"}],
                     calState.start, v => calState.start = v));
  ctl.appendChild(mk("Show", [{l:"All",v:"All"}].concat(
    SHEET.categories.map(c=>({l:c,v:c}))), calState.cat, v => calState.cat = v));
  box.appendChild(ctl);

  const lr = el("div","legrow");
  SHEET.categories.forEach(c => lr.appendChild(el("span","",
    "<em style='font-style:normal'>"+SHEET.catEmoji[c]+"</em>"+esc(c))))
  lr.querySelectorAll("span").forEach((s,i) =>
    s.style.background = SHEET.catColor[SHEET.categories[i]]);
  box.appendChild(lr);

  const body = el("div"); box.appendChild(body);
  function draw(){
    body.innerHTML = "";
    const first = new Date(calState.y, calState.m, 1);
    const base = calState.start === "Monday" ? dowIdx(first) : first.getDay();
    const anchor = addD(first, -base);
    body.appendChild(el("h2","", esc(MON[calState.m]+" "+calState.y)))
    body.lastChild.style.cssText =
      "text-align:center;font-size:21px;margin:4px 0 10px;font-weight:700";
    const cal = el("div","cal");
    const hd = el("div","calhead");
    for (let k=0;k<7;k++) hd.appendChild(el("div","",
      addD(anchor,k).toLocaleDateString("en-GB",{weekday:"long"})));
    cal.appendChild(hd);
    const grid = el("div","calgrid");
    for (let i=0;i<42;i++){
      const d = addD(anchor,i);
      let items = dayItems(d);
      if (calState.cat !== "All"){
        const ic = SHEET.catEmoji[calState.cat];
        items = items.filter(x => x.indexOf(ic) === 0);
      }
      const outside = d.getMonth() !== calState.m;
      const cell = el("div","day"+(outside?" out":"")+(same(d,T0)?" today":""));

      grid.appendChild(cell);
    }
    cal.appendChild(grid); body.appendChild(cal);
  }
  draw();
  return box;
}

function renderWeek(){

  const c = el("div","ctl"); c.appendChild(el("span","","Week starting"));
  const inp = el("input"); inp.type = "date"; inp.value = iso(weekStart);
  inp.addEventListener("change", e => {
    const d = new Date(e.target.value+"T00:00:00");
    if (!isNaN(d)) { weekStart = addD(d, -dowIdx(d)); draw(); }
  });
  c.appendChild(inp); ctl.appendChild(c);
  ctl.appendChild(el("div","",
    "<span style='color:var(--muted);font-size:12px;padding:7px 4px;display:block'>"+
    "Pick any date — the whole week follows it.</span>"));

  const body = el("div"); box.appendChild(body);

  function draw(){
    body.innerHTML = "";
    const days = []; for (let k=0;k<7;k++) days.push(addD(weekStart,k));
    const g = el("div","week");
    g.appendChild(el("div","hd",""));
    days.forEach(d => g.appendChild(el("div","hd"+(same(d,T0)?" now":""),
      esc(d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})))));
    for (let n=0;n<5;n++){

      days.forEach(d => { const it = dayItems(d);
        g.appendChild(el("div","due", esc(it[n]||""))); });

    g.appendChild(el("div","sect","time blocking"));
    for (let hh=6; hh<=22; hh++){
      g.appendChild(el("div","tm", (hh<10?"0":"")+hh+":00"));
      days.forEach(d => {

        g.appendChild(el("div", hits.length ? "blk" : "", esc(hits.join(", "))));
      });

    body.appendChild(g);
  }
  draw();
  return box;
}

/* Sheet'teki AREA grafiğinin birebir karşılığı. Çubuk kullanmak demoyu üründen
   ayırıyordu; demo ürünün aynası olmalı. */
function areaChart(values, maxY){
  const W = 620, H = 168, PADL = 26, PADB = 20, PADT = 8;
  const n = values.length;
  const x = i => PADL + (W - PADL - 6) * (i / (n - 1));
  const y = v => PADT + (H - PADT - PADB) * (1 - v / maxY);
  let line = "", area = "M" + x(0) + "," + y(0);
  values.forEach((v,i) => {
    const px = x(i).toFixed(1), py = y(v).toFixed(1);
    line += (i ? "L" : "M") + px + "," + py;
    area += "L" + px + "," + py;
  });
  area += "L" + x(n-1).toFixed(1) + "," + y(0) + "Z";
  let grid = "", ticks = "";
  for (let g = 0; g <= 4; g++){
    const gy = (PADT + (H - PADT - PADB) * g / 4).toFixed(1);
    const val = Math.round(maxY * (1 - g / 4));
    grid += '<line x1="'+PADL+'" y1="'+gy+'" x2="'+(W-6)+'" y2="'+gy+
      '" stroke="var(--faint)" stroke-width="1"></line>';
    grid += '<text x="'+(PADL-6)+'" y="'+(+gy+3)+'" text-anchor="end" font-size="9" '+
      'fill="var(--muted)">'+val+'</text>';
  }
  [5,10,15,20,25,30].forEach(d => {
    if (d > n) return;
    ticks += '<text x="'+x(d-1).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" '+
      'font-size="9" fill="var(--muted)">'+d+'</text>';
  });
  const box = el("div");
  box.style.cssText = "border:1px solid var(--hair);background:var(--paper);padding:6px 8px";
  box.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" '+
    'role="img" aria-label="Daily completion across the month">'+grid+
    '<path d="'+area+'" fill="#C9DCF7" opacity=".85"></path>'+
    '<path d="'+line+'" fill="none" stroke="#5B8DEF" stroke-width="2" '+
    'stroke-linejoin="round"></path>'+ticks+'</svg>';
  return box;
}

/* ------------------------------------------------------------- düzenleme
   Tek dinleyici bütün alanları yakalıyor: satır başına dinleyici bağlamak
   400 satırlık tabloda gözle görülür şekilde yavaşlatıyor. */
function commit(node, raw){
  const tab = node.dataset.t, i = +node.dataset.r, k = node.dataset.k;
  if (!tab || !SHEET.data[tab] || !SHEET.data[tab][i]) return;
  const row = SHEET.data[tab][i], old = row[k];
  let v = raw;
  if (typeof old === "number"){
    const n = parseFloat(String(raw).replace(/[^0-9.\-]/g, ""));
    v = isNaN(n) ? 0 : n;
  }
  row[k] = v;
  touched(tab);
}
document.addEventListener("click", e => {
  const ck = e.target.closest(".ck[data-t]");
  if (!ck) return;
  const tab = ck.dataset.t, i = +ck.dataset.r, k = ck.dataset.k;
  const row = SHEET.data[tab] && SHEET.data[tab][i];
  if (!row) return;
  if (tab === "Goals" && k.indexOf("step:") === 0){
    const n = +k.slice(5);
    row.steps[n][1] = row.steps[n][1] ? 0 : 1;
  } else {
    row[k] = !row[k];
  }
  touched(tab);
});
document.addEventListener("keydown", e => {
  if (e.target.classList && e.target.classList.contains("ck") &&
      (e.key === " " || e.key === "Enter")){ e.preventDefault(); e.target.click(); }
  if (e.target.hasAttribute && e.target.hasAttribute("contenteditable") &&
      e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener("change", e => {
  const n = e.target;
  if (!n.dataset || !n.dataset.t) return;
  if (n.classList.contains("sel")) commit(n, n.value);
  else if (n.classList.contains("dt")){
    const d = new Date(n.value + "T00:00:00");
    if (!isNaN(d)){
      const tab = n.dataset.t, i = +n.dataset.r, k = n.dataset.k;
      SHEET.data[tab][i][k] = {d: Math.round((d - T0)/DAY)};
      touched(tab);
    }
  }
}, true);
document.addEventListener("blur", e => {
  const n = e.target;
  if (n.dataset && n.dataset.t && n.hasAttribute("contenteditable"))
    commit(n, n.textContent.trim());
}, true);

window.addEventListener("hashchange",
  () => show(decodeURIComponent(location.hash.slice(1))));
show(decodeURIComponent(location.hash.slice(1)) || "Dashboard");
