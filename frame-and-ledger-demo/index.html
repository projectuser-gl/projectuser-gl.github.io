/* ── 25_jobmath.js ── */
/* ═══ İŞ ERİŞİM KATMANI (ÇEKİRDEK) ══════════════════════════════════════
   Çekirdek "load" ya da "repair order" bilmez; buradan geçer.
   ⚠ TÜRETİLMİŞ DEĞER SAKLANMAZ. Tutar/kâr/oran her zaman hesaplanır;
     saklanan kopya bir yerde güncellenmeyip raporu yalancı çıkarıyor.    */

const n0 = v => Number(v) || 0;

/* ═══ ÇİZİM ÖNBELLEĞİ ═══════════════════════════════════════════════════
   ⚠ ÖLÇÜLDÜ: salon demosunda müşteri tablosu AÇILMIYORDU. Sebep O(n²):
     `lapsedClients()` tüm müşteri × tüm randevu tarıyor ve tablo bunu HER
     SATIRIN hücresinde yeniden çağırıyordu — 1.180 satır × 11,6 milyon
     işlem. Sayfa iki dakikada açılmadı, ölçüm betiği bile düştü.
   ⚠ Önbellek HER render()'da temizleniyor; veri değişince bayat sonuç
     kalmıyor. Ağır bir türetilmiş değeri `memo("ad", fn)` ile sar. */
let _MEMO = {};
function memo(key, fn){
  if (!(key in _MEMO)) _MEMO[key] = fn();
  return _MEMO[key];
}
function memoClear(){ _MEMO = {}; }

const CK = () => V.job.clientKey;
const CE = () => V.job.clientEntity;

function nameOf(k, id, fld){
  if (!id) return "";
  const r = byId(k, id); if (!r) return "";
  return r[fld || "name"] || "";
}
const clientName = id => nameOf(CE(), id);

const jobRef   = j => j[V.job.refKey || "ref"] || "";
const jobStart = j => j[V.job.startKey || V.job.dateKey] || "";
const jobDate  = j => j[V.job.dateKey] || j[V.job.startKey] || "";
const jobLabel = j => V.job.label(j);
const jobValue = j => V.job.value(j);
const jobFee   = j => (V.job.fee ? V.job.fee(j) : 0);
const jobNet   = j => jobValue(j) - jobFee(j);
const jobQty   = j => (V.job.qty ? V.job.qty(j) : 0);
const jobRate  = j => { const q = jobQty(j); return q ? jobValue(j) / q : 0; };
const jobCardSub = j => (V.job.cardSub ? V.job.cardSub(j) : clientName(j[CK()]));
const qtyUnit  = () => (V.job.qtyUnit ? V.job.qtyUnit() : "");
const qtyUnitLabel = () => (V.job.qtyHead || qtyUnit().toUpperCase());

function isOpen(j){ return V.job.open.indexOf(j.status) >= 0; }
function isRevenue(j){ return V.job.dead.indexOf(j.status) < 0; }

function inRange(d, from, to){
  if (!d) return false;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}
function jobsIn(from, to){
  return rows(V.job.key).filter(j => isRevenue(j) && inRange(jobDate(j), from, to));
}
function sumBy(list, keyFn, valFn){
  const m = new Map();
  list.forEach(r => {
    const k = keyFn(r); if (k === "" || k === null || k === undefined) return;
    m.set(k, (m.get(k) || 0) + valFn(r));
  });
  return m;
}
function topN(map, n, fmtKey){
  return Array.from(map.entries())
    .map(([k, v]) => ({k:fmtKey ? fmtKey(k) : k, v:v}))
    .sort((a, b) => b.v - a.v).slice(0, n || 5);
}
/* ⚠ İÇİNDE BULUNULAN AY DIŞARIDA. Yarım ay grafiğin sonunda uçurum
   yapıyor ve iş çöküyormuş gibi görünüyor — demo ekranında en çok göze
   batan şey buydu. Bu ayın durumu KPI kartlarında zaten var. */
function lastMonths(n, includeCurrent){
  const out = [], d = new Date(); d.setDate(1);
  const off = includeCurrent ? 0 : 1;
  for (let i = n - 1 + off; i >= off; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"));
  }
  return out;
}

/* Çalışan hakedişi — ödeme tipi her meslekte aynı üç şekilden biri. */
function workerPay(w, list){
  const wf = V.entities[V.job.workerEntity].jobField;
  const ls = list || rows(V.job.key).filter(j => j[wf] === w.id && isRevenue(j));
  const g = ls.reduce((a, j) => a + jobValue(j), 0);
  const q = ls.reduce((a, j) => a + jobQty(j), 0);
  if (w.payType === "unit") return q * n0(w.payRate);
  if (w.payType === "flat") return ls.length * n0(w.payRate);
  return g * n0(w.payRate) / 100;
}

/* ── Fatura yardımcıları (alan-bağımsız) ─────────────────────────────── */
function nextInvoiceNo(){
  return (S.set.invoicePrefix || "INV-") + (n0(S.set.nextInvoice) || 1001);
}
/* ⚠ FATURA → İŞ İNDEKSİ. Eskiden her fatura için TÜM iş kayıtları
   taranıyordu: salonda 10.000 fatura × 11.771 randevu = 117 milyon işlem,
   fatura sayfası 3,8 saniyede açılıyordu. Tek geçişte indeks kuruluyor,
   her çizimde bir kez. */
function invoiceIndex(){
  return memo("core:invJobs", function(){
    const ix = {};
    rows(V.job.key).forEach(j => {
      if (!j.invoiceId) return;
      (ix[j.invoiceId] || (ix[j.invoiceId] = [])).push(j);
    });
    return ix;
  });
}
function invoiceTotal(inv){
  const js = invoiceIndex()[inv.id] || [];
  return js.reduce((a, j) => a + jobValue(j), 0) - n0(inv.discount) + n0(inv.extra);
}
function invoiceDue(inv){
  const days = {"Net 15":15, "Net 30":30, "Net 45":45, "Net 60":60,
                "Due on receipt":0, "Quick Pay (2 days)":2}[inv.terms || S.set.invoiceTerms];
  return addDays(inv.date, days === undefined ? 30 : days);
}
function invoiceStatus(inv){
  if (inv.paidDate) return {t:"Paid", pill:"good"};
  const due = invoiceDue(inv), od = due ? daysBetween(due, today()) : 0;
  if (od > 0) return {t:"Overdue " + od + "d", pill:"bad"};
  return {t:"Open", pill:"info"};
}

/* ── Uyarılar. Ortak üç kaynak + config'in eklediği. ─────────────────── */
function alerts(){
  const out = [], t = today();
  rows("docs").forEach(d => {
    if (!d.expires) return;
    const left = daysBetween(t, d.expires);
    if (left === null || left > 45) return;
    out.push({kind:left < 0 ? "bad" : "warn", icon:ICON.doc,
      text:(d.name || "Document") + (d.ownerLabel ? " · " + d.ownerLabel : ""),
      note:left < 0 ? "Expired " + (-left) + " days ago" : "Expires in " + left + " days",
      go:"docs"});
  });
  rows("invoices").forEach(inv => {
    if (inv.paidDate) return;
    const due = invoiceDue(inv), od = due ? daysBetween(due, t) : 0;
    if (od <= 0) return;
    out.push({kind:od > 15 ? "bad" : "warn", icon:ICON.invoice,
      text:(inv.no || "Invoice") + " · " + clientName(inv.clientId),
      note:od + " days overdue · " + money(invoiceTotal(inv)), go:"invoices"});
  });
  rows(V.job.key).forEach(j => {
    if (j.status !== V.job.doneState) return;
    const age = daysBetween(jobDate(j), t);
    if (age !== null && age > 3)
      out.push({kind:"warn", icon:ICON.cash,
        text:W("job") + " " + jobRef(j) + " not invoiced",
        note:"Finished " + age + " days ago · " + money(jobValue(j)), go:V.job.key});
  });
  if (V.alerts) V.alerts().forEach(a => out.push(a));
  const order = {bad:0, warn:1};
  return out.sort((a, b) => (order[a.kind] - order[b.kind])).slice(0, 40);
}

/* ═══ ANA SAYFA — KOMPOZİSYONLAR ════════════════════════════════════════
   ⚠ DERİ DEĞİŞTİRMEK YETMİYOR. Renk/font/çerçeve farklı olsa da her ürün
     aynı iskeleti kullanırsa (KPI şeridi üstte → grafik → uyarı → tablo)
     100 ürün yine birbirinin kopyası gibi duruyor. Bu yüzden PANONUN
     KOMPOZİSYONU da bir eksen: `V.design.dash`.

       kpi     sayı önce   — 8 kart, sonra grafik + durum, sonra liste
       hero    tek büyük sayı — üstte devasa rakam, yanında destek
       split   iki sütun   — solda iş akışı, sağda yığılı istatistik
       board   tahta önce  — aşama tahtası panonun kendisi, sayılar altta

   ⚠ HEPSİ AYNI KELİME DAĞARCIĞINI kullanıyor (kpiRow, trend, statusPart,
     attention, ranking, recentTable). Yeni kompozisyon eklemek widget
     yazmak değil, DİZİLİM yazmak.                                        */

let DASH_RANGE = 90;

function kpi(o){
  return el("div", {class:"kpi", style:{"--kc":o.color || "var(--accent)"}}, [
    el("div", {class:"kpi-label", text:o.label}),
    el("div", {class:"kpi-val", text:o.value}),
    el("div", {class:"kpi-foot"}, [
      o.delta !== undefined && o.delta !== null
        ? el("span", {class:"kpi-delta " + (o.delta > .05 ? "up" : o.delta < -.05 ? "down" : "flat"),
            text:(o.delta > 0 ? "▲ " : o.delta < 0 ? "▼ " : "") + Math.abs(o.delta).toFixed(0) + "%"})
        : null,
      o.note ? el("span", {class:"kpi-note", text:o.note}) : null,
      o.spark && o.spark.length > 1
        ? el("span", {class:"kpi-spark"}, spark(o.spark, 60, 22, o.color || "var(--accent)"))
        : null
    ])
  ]);
}

function periodStats(days){
  const from = addDays(today(), -days), prevFrom = addDays(today(), -days * 2);
  const cur = jobsIn(from, today()), prv = jobsIn(prevFrom, from);
  const rev = cur.reduce((a, j) => a + jobValue(j), 0);
  const revPrev = prv.reduce((a, j) => a + jobValue(j), 0);
  const netRev = cur.reduce((a, j) => a + jobNet(j), 0);
  const qty = cur.reduce((a, j) => a + jobQty(j), 0);
  const exp = rows("expenses").filter(e => inRange(e.date, from, today()))
    .reduce((a, e) => a + n0(e.amount), 0);
  const inputCost = V.job.unitEfficiency
    ? rows(V.job.unitEfficiency.entity).filter(f => inRange(f.date, from, today()))
        .reduce((a, f) => a + n0(f.cost), 0) : 0;
  const open = rows(V.job.key).filter(isOpen);
  const invs = rows("invoices");
  const ar = invs.filter(i => !i.paidDate).reduce((a, i) => a + invoiceTotal(i), 0);
  const overdue = invs.filter(i => {
    if (i.paidDate) return false;
    const d = invoiceDue(i); return d && daysBetween(d, today()) > 0;
  });
  /* ⚠ TEKRAR EDEN GELİR. İş kaydından gelmeyen ciro (üyelik, aidat, kira,
     retainer) V.recurring ile veriliyor. Yoksa K/Z yalancı çıkıyor. */
  const recur = V.recurring ? V.recurring(from, today()) : 0;
  const recurPrev = V.recurring ? V.recurring(prevFrom, from) : 0;
  const months = lastMonths(12);
  const byM = sumBy(rows(V.job.key).filter(isRevenue), j => monthKey(jobDate(j)), j => jobValue(j));
  const expByM = sumBy(rows("expenses"), e => monthKey(e.date), e => n0(e.amount));
  const inByM = V.job.unitEfficiency
    ? sumBy(rows(V.job.unitEfficiency.entity), f => monthKey(f.date), f => n0(f.cost))
    : new Map();
  return {
    from:from, days:days, cur:cur, prv:prv,
    jobRev:rev, recurring:recur,
    rev:rev + recur, revPrev:revPrev + recurPrev,
    net:netRev, qty:qty, exp:exp, inputCost:inputCost,
    profit:netRev + recur - exp - inputCost, open:open, ar:ar, overdue:overdue,
    invoices:invs, months:months,
    revSeries:months.map(m => (byM.get(m) || 0) +
      (V.recurringMonth ? V.recurringMonth(m) : 0)),
    costSeries:months.map(m => (expByM.get(m) || 0) + (inByM.get(m) || 0)),
    delta:function(a, b){ return b ? ((a - b) / b) * 100 : (a ? 100 : null); }
  };
}

/* ⚠ YÜKSEKLİK KOMPOZİSYONA GÖRE. İlk ekranda tek grafik varsa 210px yetmiyor:

/* Gider kırılımı — yığılmış çubuk. Panoyu grafik ağırlıklı yapan parça. */
function costMix(st){
  const cats = new Map();
  rows("expenses").forEach(e => {
    const k = monthKey(e.date); if (!k) return;
    const c = e.category || "Other";
    if (!cats.has(c)) cats.set(c, {});
    cats.get(c)[k] = (cats.get(c)[k] || 0) + n0(e.amount);
  });
  const top = Array.from(cats.entries())
    .map(([k, m]) => ({k:k, tot:Object.values(m).reduce((a, b) => a + b, 0), m:m}))
    .sort((a, b) => b.tot - a.tot).slice(0, 5);
  const series = top.map((t, i) => ({color:"var(--c" + ((i % 6) + 1) + ")",
    data:st.months.map(mk => t.m[mk] || 0)}));
  return el("div", {class:"panel chart grow"}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:"Where the Money Goes"}), el("div", {class:"sp"}),
      el("div", {class:"sm", style:{display:"flex", gap:"10px", flexWrap:"wrap"}},
        top.map((t, i) => el("span", {style:{display:"flex", alignItems:"center",
          gap:"5px"}}, [
          el("i", {style:{width:"9px", height:"9px", borderRadius:"2px",
            background:"var(--c" + ((i % 6) + 1) + ")"}}),
          el("span", {class:"mut", text:t.k})])))
    ]),
    el("div", {class:"panel-body"}, series.length
      ? stackChart(st.months.map(monthLabel), series, {height:200, fmt:money0})
      : noData(600, 180, "No costs logged yet"))
  ]);
}

/* Marj göstergesi — tek oranı büyük göstermek. */
function marginGauge(st){
  const m = st.rev ? st.profit / st.rev * 100 : 0;
  return panel("Profit Margin", "this period",
    el("div", {}, [
      gauge(Math.max(0, m), {size:168, thick:16,
        color:m >= 12 ? "var(--good)" : m > 0 ? "var(--warn)" : "var(--bad)",
        text:pct(m, 1), label:"margin"}),
      el("div", {class:"sm mut", style:{textAlign:"center", marginTop:"9px"},
        text:money0(st.rev) + " in · " + money0(st.rev - st.profit) + " out"})
    ]), false, "chart fixed grow");
}

/* Aylık kırılım kıvılcımları — çok sayıda seriyi az yerde. */
function trendGrid(st){
  const wf = V.job.workerEntity ? V.entities[V.job.workerEntity].jobField : null;
  const items = [];
  items.push({k:"Revenue", v:st.rev, series:st.revSeries.slice(-9), color:"var(--c1)"});
  items.push({k:"Costs", v:st.rev - st.profit, series:st.costSeries.slice(-9),
    color:"var(--c5)"});
  const cnt = st.months.map(mk =>
    rows(V.job.key).filter(j => monthKey(jobDate(j)) === mk && isRevenue(j)).length);
  items.push({k:W("jobs"), v:st.cur.length, series:cnt.slice(-9), color:"var(--c2)"});
  const prof = st.months.map((mk, i) => st.revSeries[i] - st.costSeries[i]);
  items.push({k:"Profit", v:st.profit, series:prof.slice(-9), color:"var(--c3)"});
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [el("h2", {text:"Last Nine Months"}),
      el("div", {class:"sp"}), el("div", {class:"hint", text:"month by month"})]),
    el("div", {class:"panel-body flush"}, sparkGrid(items, {fmt:money0}))
  ]);
}

/* Dar sütunda iki grafik — tahta/uyarı yanına görsel ağırlık koymak için. */

/* ── KOMPOZİSYONLAR ──────────────────────────────────────────────────
   ⚠ HER KOMPOZİSYONUN İLK EKRANINDA GERÇEK GRAFİK OLMALI. Listing görseli
     bu ekran; KPI kartı ve metinden ibaret pano Etsy'de "boş ve gösterişsiz"
     duruyor ve ürünü ucuz gösteriyor. Ölçüldü: `board` panosu ilk ekranda
     SIFIR grafik veriyordu, `focus` %14,6, `hero`nun en büyük grafiği %5,3.
     `tools/foldcheck.js` kalıcı denetliyor: alan ≥%18, en büyük ≥%7.     */
const DASH = {
  /* ⚠ SIRA: kartlar → grafikler → sıralamalar → uyarı/tahta → tablo.
     "Needs Attention" ve tahta metin ağırlıklı; ilk ekranda durduklarında
     listing görseli boş duruyordu. Hepsi aşağı alındı. Hedef ~%70 grafik. */
  kpi:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st), statusPart(st)]),
    el("div", {class:"grid g23"}, [costMix(st), marginGauge(st)]),
    kpiRow(c.slice(4), 4),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    trendGrid(st),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  hero:(st, c) => [
    heroNumber(c[0], st),
    el("div", {class:"grid g23"}, [
      el("div", {class:"stack"}, [kpiRow(c.slice(1, 4), 3), trend(st, "bars")]),
      el("div", {class:"stack"}, [statusPart(st), marginGauge(st)])]),
    costMix(st),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    trendGrid(st),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  split:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st), marginGauge(st)]),
    el("div", {class:"grid g2"}, [costMix(st), statusPart(st, "bars")]),
    kpiRow(c.slice(4), 4),
    trendGrid(st),
    el("div", {class:"grid g23"}, [boardPreview(true), rankClients(st)]),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  board:(st, c) => [
    kpiStrip(c.slice(0, 5)),
    el("div", {class:"grid g23"}, [trend(st), statusPart(st)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankWorkers(st) || rankClients(st),
      rankClients(st)].filter(Boolean)),
    boardPreview(true),
    el("div", {class:"grid g32"}, [attention(), recentTable(6)])
  ],
  report:(st, c) => [
    trend(st),
    kpiStrip(c),
    el("div", {class:"grid g23"}, [costMix(st), marginGauge(st)]),
    el("div", {class:"grid g2"}, [statusPart(st), rankClients(st)]),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankWorkers(st), recentTable(8)].filter(Boolean)),
    attention()
  ],
  focus:(st, c) => [
    kpiRow(c.slice(0, 4), 4),
    el("div", {class:"grid g23"}, [trend(st, null, 260), statusPart(st, null, 168)]),
    el("div", {class:"grid g32"}, [marginGauge(st), costMix(st)]),
    kpiRow(c.slice(4), 4),
    trendGrid(st),
    el("div", {class:"grid g2"}, [rankClients(st), rankWorkers(st)].filter(Boolean)),
    el("div", {class:"grid g23"}, [boardPreview(true), attention()]),
    recentTable(6)
  ]
};

    flexWrap:"wrap"}}, [

    segControl([{v:30,t:"30 days"},{v:90,t:"90 days"},{v:180,t:"6 months"},{v:365,t:"12 months"}],
      DASH_RANGE, v => { DASH_RANGE = v; render(); })
  ]));
  /* ⚠ Bilinmeyen kompozisyon SESSİZCE `kpi`ye düşmez — o, tüm ürünleri
     aynı panoya geri döndüren şeyin ta kendisi. Konsola yazıp öyle düşüyor. */
  const key = (V.design && V.design.dash) || "kpi";
  const build = DASH[key];
  if (!build) console.error("bilinmeyen pano kompozisyonu: " + key);
  (build || DASH.kpi)(st, cards).filter(Boolean).forEach(n => view.appendChild(n));
  return view;
}

/* ── 31_jobs.js ── */
/* ═══ İŞ KAYITLARI: TABLO · TAHTA · EDİTÖR (ÇEKİRDEK) ═══════════════════
   Her meslekte aynı üç ekran: iş listesi, aşama tahtası, iş formu.
   Alanlar, kolonlar, aşamalar ve canlı hesap şeridi config'ten.

   ⚠ EDİTÖR YAZARKEN HESAPLAR. Ustanın/dispeççinin işi kabul edip
     etmeyeceğine baktığı sayı bu; kaydettikten sonra görmek geç.
   ⚠ recordForm'un `extra` geri çağrısı (form, rec) sırasıyla gelir.
     Ters yazılmıştı ve "New job" düğmesi HİÇ açılmıyordu; sözdizimi
     denetimi göremiyor, yalnız tarayıcıda tıklayınca çıkıyor.            */

let JOB_FILTER = "open";

/* Canlı özet şeridi — config'in verdiği hücreleri çizer. */
function jobSummary(form, rec){
  if (!V.job.summary) return el("span", {});
  const box = el("div", {class:"full", style:{
    display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(104px,1fr))", gap:"1px",
    background:"var(--hair)", border:"1px solid var(--hair)", borderRadius:"var(--r)",
    overflow:"hidden", marginTop:"2px"}});
  function paint(){
    const d = readForm(form, V.job.fields());
    const j = Object.assign({}, rec, d);
    box.innerHTML = "";
    V.job.summary(j).forEach(c => box.appendChild(
      el("div", {style:{background:"var(--paper)", padding:"9px 11px",
        display:"flex", flexDirection:"column", gap:"2px"}}, [
        el("span", {style:{fontSize:"9.5px", letterSpacing:".07em",
          textTransform:"uppercase", color:"var(--muted)", fontWeight:"600"}, text:c.k}),
        el("span", {class:"mono", style:{fontSize:"14px", fontWeight:"600",
          color:c.c || "var(--ink)"}, text:c.v})
      ])));
  }
  form.addEventListener("input", paint);
  form.addEventListener("change", paint);
  setTimeout(paint, 0);
  return box;
}

function editJob(rec){
  recordForm({
    size:"wide", rec:rec, fields:V.job.fields(), extra:jobSummary,
    title:rec && rec.id ? W("job") + " " + jobRef(rec) : W("newJob"),
    sub:rec && rec.id ? jobLabel(rec) : (V.job.newHint || "Totals calculate as you type"),
    before:d => { if (!d.status) d.status = V.job.stages[0].v;
                  if (V.job.before) V.job.before(d); },
    onSave:d => { upsert(V.job.key, d); commit(W("job") + " saved."); render(); },
    onDelete:d => confirmBox("Delete " + W("jobLower") + "?",
      W("job") + " " + jobRef(d) + " will be removed. This cannot be undone.",
      () => { remove(V.job.key, d.id); commit("Deleted."); render(); })
  });
}
function newJob(){ editJob(V.job.blank ? V.job.blank() : {status:V.job.stages[0].v}); }

function viewJobs(){
  const all = rows(V.job.key), f = JOB_FILTER;
  const list = f === "all" ? all
    : f === "open" ? all.filter(isOpen)
    : f === "unpaid" ? all.filter(j => V.job.billable.indexOf(j.status) >= 0)
    : all.filter(j => j.status === f);
  return el("div", {class:"panel", style:{height:"100%"}}, [
    toolbar({
      id:V.job.key, repaint:render,
      placeholder:"Search " + W("jobNo").toLowerCase() + ", " + W("client").toLowerCase() + "…",
      controls:[segControl([
        {v:"open", t:"Open (" + all.filter(isOpen).length + ")"},
        {v:"unpaid", t:"To bill"},
        {v:V.job.paidState, t:"Paid"},
        {v:"all", t:"All (" + all.length + ")"}
      ], f, v => { JOB_FILTER = v; render(); })],
      actions:[
        el("button", {class:"btn sm", html:ICON.down + "<span>Export</span>",
          onclick:() => exportCSV(V.job.key + "-" + today(), V.job.cols(), list)}),
        el("button", {class:"btn pri sm", html:ICON.plus + "<span>" + W("newJob") + "</span>",
          onclick:newJob})
      ]
    }),
    el("div", {style:{flex:"1", minHeight:"0", overflow:"hidden"}}, dataTable({
      id:V.job.key, rows:list, cols:V.job.cols(),
      sort:V.job.startKey || V.job.dateKey, dir:"desc",
      onEdit:editJob, repaint:render,
      onDelete:j => confirmBox("Delete " + W("jobLower") + "?",
        W("job") + " " + jobRef(j) + " will be removed.",
        () => { remove(V.job.key, j.id); commit("Deleted."); render(); }),
      footer:V.job.footer,
      empty:el("div", {class:"empty"}, [
        el("div", {html:ICON[V.job.icon] || ICON.load}),
        el("h3", {text:f === "open" ? "No open " + W("jobsLower") : "No " + W("jobsLower") + " yet"}),
        el("p", {text:V.job.emptyText ||
          ("Add your first " + W("jobLower") + " and the dashboard, invoices and reports fill in by themselves.")}),
        el("button", {class:"btn pri", html:ICON.plus + "<span>" + W("newJob") + "</span>",
          onclick:newJob})
      ])
    }))
  ]);
}

/* ═══ AŞAMA TAHTASI (sürükle-bırak) ═════════════════════════════════════ */
let DRAG = null;
function viewBoard(){
  const board = el("div", {class:"kb"});
  V.job.stages.filter(s => !s.dead).forEach(s => {
    const list = rows(V.job.key).filter(j => j.status === s.v)
      .sort((a, b) => String(jobStart(a) || "").localeCompare(String(jobStart(b) || "")));
    const total = list.reduce((a, j) => a + jobValue(j), 0);
    /* ⚠ SÜTUN BAŞINA KART SINIRI. Salon demosunda "Paid" sütununda binlerce
       kart vardı ve tahta 2,2 saniyede çiziliyordu — üstelik o kadar kartı
       kimse sürüklemiyor. Sütunda en yeni CARD_CAP tanesi duruyor. */
    const CARD_CAP = 60;
    const lane = el("div", {class:"kb-list"});
    list.slice(0, CARD_CAP).forEach(j => lane.appendChild(el("div", {class:"kb-card", draggable:"true",
      onclick:() => editJob(j),
      ondragstart:e => { DRAG = j.id; e.currentTarget.classList.add("drag");
                         e.dataTransfer.effectAllowed = "move"; },
      ondragend:e => { DRAG = null; e.currentTarget.classList.remove("drag"); }}, [
      el("div", {class:"r1"}, [
        el("span", {class:"ref", text:jobRef(j) || "—"}),
        el("span", {class:"amt", text:money0(jobValue(j))})
      ]),
      el("div", {class:"r2", text:jobLabel(j)}),
      el("div", {class:"r3"}, [
        el("span", {text:dateShort(jobStart(j))}),
        el("span", {text:"·"}),
        el("span", {style:{flex:"1", overflow:"hidden", textOverflow:"ellipsis",
          whiteSpace:"nowrap"}, text:jobCardSub(j)}),
        jobQty(j) ? el("span", {class:"mono",
          text:money(jobRate(j)) + "/" + qtyUnit()}) : null
      ])
    ])));
    if (!list.length) lane.appendChild(el("div", {class:"sm mut",
      style:{padding:"14px 6px", textAlign:"center"},
      text:"Drop " + W("jobsLower") + " here"}));
    else if (list.length > CARD_CAP) lane.appendChild(el("button", {class:"btn sm ghost",
      style:{margin:"4px", width:"calc(100% - 8px)"},
      text:num(list.length - CARD_CAP) + " more — open the list",
      onclick:() => go(V.job.key)}));
    board.appendChild(el("div", {class:"kb-col",
      ondragover:e => { e.preventDefault(); e.currentTarget.classList.add("drop"); },
      ondragleave:e => e.currentTarget.classList.remove("drop"),
      ondrop:e => {
        e.preventDefault(); e.currentTarget.classList.remove("drop");
        const j = byId(V.job.key, DRAG);
        if (j && j.status !== s.v){
          j.status = s.v; stamp(j); commit("Moved to " + s.t + "."); render();
        }
      }}, [
      el("div", {class:"kb-head"}, [
        el("i", {class:"dot", style:{background:s.c}}),
        el("span", {class:"t", text:s.t}),
        el("span", {class:"n", text:list.length + " · " + money0(total)})
      ]),
      lane
    ]));
  });
  /* ⚠ `flex:1; min-height:0` olmadan uzun sütun sayfayı şişirip alt
     kartları ekranın dışında bırakıyordu. */
  board.style.flex = "1"; board.style.minHeight = "0";
  return el("div", {style:{height:"100%", display:"flex", flexDirection:"column",
    gap:"10px", minHeight:"0"}}, [
    el("div", {class:"sm mut", style:{flex:"0 0 auto"},
      text:"Drag a card between columns to change its status. Click a card to open it."}),
    board
  ]);
}

/* ═══ VARLIK EKRANI (ÇEKİRDEK) ══════════════════════════════════════════
   Listele / ara / sırala / ekle / düzenle / sil / dışa aktar. Her meslekte
   aynı iskelet; içini config dolduruyor.
   ⚠ SİLMEDEN ÖNCE BAĞ KONTROLÜ. Yüke bağlı aracı silmek raporda boş isim
     bırakıyordu; artık kaç kayıtta kullanıldığını söyleyip onay istiyoruz. */

/* ⚠ SİLMEDEN ÖNCE BAĞ SAYILIR. Yüke bağlı aracı silmek raporda boş isim
   bırakıyordu. Hangi alanın hangi varlığa baktığı config'ten geliyor —
   çekirdek "truckId" diye bir şey bilmez. */
function usedBy(key, id){
  const link = (V.entities[key] || {}).jobField;
  if (!link) return 0;
  return rows(V.job.key).filter(j => j[link] === id).length;
}

function crudView(cfg){
  const list = rows(cfg.key);
  const open = rec => recordForm({
    size:cfg.size || "", rec:rec, title:rec && rec.id ? cfg.editTitle : cfg.newTitle,
    sub:cfg.sub, fields:cfg.fields, extra:cfg.extra,
    before:cfg.before,
    onSave:d => { upsert(cfg.key, d); commit(cfg.saved || "Saved."); render(); },
    onDelete:d => {
      const n = usedBy(cfg.key, d.id);
      confirmBox("Delete " + (cfg.noun || "record") + "?",
        n ? "This is used on " + n + " load" + (n > 1 ? "s" : "") +
            ". They will keep their history but show a blank name."
          : "This record will be removed. This cannot be undone.",
        () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
    }
  });
  return el("div", {class:"panel", style:{height:"100%"}}, [
    toolbar({
      id:cfg.key, repaint:render, placeholder:cfg.placeholder || "Search…",
      controls:cfg.controls ? cfg.controls() : [],
      actions:[
        el("button", {class:"btn sm", html:ICON.down + "<span>Export</span>",
          onclick:() => exportCSV(cfg.key + "-" + today(), cfg.cols(), list)}),
        el("button", {class:"btn pri sm", html:ICON.plus + "<span>" + (cfg.addLabel || "Add") + "</span>",
          onclick:() => open(cfg.blank ? cfg.blank() : {})})
      ]
    }),
    el("div", {style:{flex:"1", minHeight:"0", overflow:"hidden"}}, dataTable({
      id:cfg.key, rows:list, cols:cfg.cols(), sort:cfg.sort, dir:cfg.dir,
      filter:cfg.filter, footer:cfg.footer, onEdit:open, repaint:render,
      onDelete:d => {
        const n = usedBy(cfg.key, d.id);
        confirmBox("Delete " + (cfg.noun || "record") + "?",
          n ? "Used on " + n + " load" + (n > 1 ? "s" : "") + "."
            : "This record will be removed.",
          () => { remove(cfg.key, d.id); commit("Deleted."); render(); });
      },
      empty:el("div", {class:"empty"}, [
        el("div", {html:cfg.icon || ICON.doc}),
        el("h3", {text:cfg.emptyTitle || "Nothing here yet"}),
        el("p", {text:cfg.emptyText || ""}),
        el("button", {class:"btn pri", html:ICON.plus + "<span>" + (cfg.addLabel || "Add") + "</span>",
          onclick:() => open(cfg.blank ? cfg.blank() : {})})
      ])
    }))
  ]);
}

/* ── 35_reports.js ── */
/* ═══ RAPORLAR (ÇEKİRDEK) ═══════════════════════════════════════════════
   Beş şekil her meslekte aynı: kâr-zarar · iş kârlılığı · birim başına ·
   çalışan hakedişi · müşteri. Hangileri gösterilecek ve neyle etiketlenecek
   V.reports'tan geliyor.
   ⚠ TEK KAYNAK. Rapor sayıları yüklerden ve giderlerden CANLI türetilir;
     ayrı bir "rapor tablosu" tutulmuyor. İki yerde saklanan sayı er geç
     birbirini tutmuyor.                                                   */

let REP_TAB = "pnl", REP_FROM = "", REP_TO = "";

function repRange(){
  const to = REP_TO || today();
  const from = REP_FROM || addDays(to, -365);
  return {from:from, to:to};
}

function pnlData(){
  const R = repRange();
  const ls = jobsIn(R.from, R.to);
  /* ⚠ Panodakiyle AYNI kanca; iki yerde farklı ciro göstermek en kötüsü. */
  const recur = V.recurring ? V.recurring(R.from, R.to) : 0;
  const revenue = ls.reduce((a, L) => a + jobValue(L), 0) + recur;
  const fees = ls.reduce((a, L) => a + jobFee(L), 0);
  const exps = rows("expenses").filter(e => inRange(e.date, R.from, R.to));
  const fuels = rows("fuel").filter(f => inRange(f.date, R.from, R.to));
  const byCat = sumBy(exps, e => e.category || "Other", e => n0(e.amount));
  const fuelTot = fuels.reduce((a, f) => a + n0(f.cost), 0);
  if (fuelTot) byCat.set("Fuel", (byCat.get("Fuel") || 0) + fuelTot);
  if (fees) byCat.set("Dispatch fee", (byCat.get("Dispatch fee") || 0) + fees);
  const costs = Array.from(byCat.values()).reduce((a, b) => a + b, 0);
  const miles = ls.reduce((a, L) => a + jobQty(L), 0);
  return {R:R, ls:ls, revenue:revenue, byCat:byCat, costs:costs,
          profit:revenue - costs, miles:miles};
}

function repPnl(){
  const d = pnlData();
  const cats = Array.from(d.byCat.entries()).map(([k, v]) => ({k:k, v:v}))
    .sort((a, b) => b.v - a.v);
  const out = el("div", {class:"stack"});
  out.appendChild(el("div", {class:"grid g4"}, [
    kpi({label:"Revenue", value:money0(d.revenue), color:"var(--c1)",
         note:d.ls.length + " loads"}),
    kpi({label:"Total Costs", value:money0(d.costs), color:"var(--c5)",
         note:d.revenue ? pct(d.costs / d.revenue * 100, 0) + " of revenue" : "—"}),
    kpi({label:"Net Profit", value:money0(d.profit),
         color:d.profit >= 0 ? "var(--good)" : "var(--bad)",
         note:d.revenue ? pct(d.profit / d.revenue * 100) + " margin" : "—"}),
    kpi({label:"Profit / " + qtyUnit(), value:d.miles ? money(d.profit / d.miles) : "—",
         color:"var(--c3)", note:num(d.miles) + " " + qtyUnit()})
  ]));
  out.appendChild(el("div", {class:"grid g23"}, [
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Cost Breakdown"})),
      el("div", {class:"panel-body flush"}, (() => {
        const t = el("table", {class:"dt"});
        t.appendChild(el("thead", {}, el("tr", {}, [
          el("th", {text:"Category"}), el("th", {class:"n", text:"Amount"}),
          el("th", {class:"n", text:"% of revenue"}), el("th", {class:"n", text:"Per " + qtyUnit()})
        ])));
        const tb = el("tbody");
        cats.forEach(c => tb.appendChild(el("tr", {}, [
          el("td", {text:c.k}),
          el("td", {class:"n strong", text:money(c.v)}),
          el("td", {class:"n mut", text:d.revenue ? pct(c.v / d.revenue * 100) : "—"}),
          el("td", {class:"n mut", text:d.miles ? money(c.v / d.miles) : "—"})
        ])));
        t.appendChild(tb);
        t.appendChild(el("tfoot", {}, el("tr", {}, [
          el("td", {text:"Total costs"}), el("td", {class:"n", text:money(d.costs)}),
          el("td", {class:"n", text:d.revenue ? pct(d.costs / d.revenue * 100) : "—"}),
          el("td", {class:"n", text:d.miles ? money(d.costs / d.miles) : "—"})
        ])));
        return cats.length ? el("div", {class:"tw"}, t)
          : el("div", {class:"empty", style:{padding:"36px"}}, [
              el("h3", {text:"No costs in this period"}),
              el("p", {text:"Log fuel and expenses to see where the money goes."})]);
      })())
    ]),
    el("div", {class:"panel"}, [
      el("div", {class:"panel-head"}, el("h2", {text:"Where the money goes"})),
      el("div", {class:"panel-body"}, cats.length
        ? donut(cats.slice(0, 6), {label:"Costs", fmt:money0, size:150})
        : noData(300, 140))
    ])
  ]));
  return out;
}

        {k:V.job.dateKey, h:V.job.dateHead || "Done", type:"date"},

function repTrucks(){
  const R = repRange();
  const list = rows(V.job.unitEntity).map(t => {
    const ls = jobsIn(R.from, R.to).filter(L => L[V.entities[V.job.unitEntity].jobField] === t.id);
    const rev = ls.reduce((a, L) => a + jobValue(L), 0);
    const mi = ls.reduce((a, L) => a + jobQty(L), 0);
    const fu = rows("fuel").filter(f => f.truckId === t.id && inRange(f.date, R.from, R.to));
    const gal = fu.reduce((a, f) => a + n0(f.gallons), 0);

      .reduce((a, e) => a + n0(e.amount), 0);
    return Object.assign({}, t, {_rev:rev, _mi:mi, _gal:gal, _fuel:fuelC, _exp:ex,
      _mpg:gal ? mi / gal : 0, _profit:rev - fuelC - ex, _loads:ls.length});

function repCustomers(){
  const R = repRange();
  const list = rows(CE()).map(b => {
    const ls = jobsIn(R.from, R.to).filter(L => L[CK()] === b.id);
    const rev = ls.reduce((a, L) => a + jobValue(L), 0);
    const mi = ls.reduce((a, L) => a + jobQty(L), 0);
    const invs = rows("invoices").filter(i => i.brokerId === b.id);
    const unpaid = invs.filter(i => !i.paidDate).reduce((a, i) => a + invoiceTotal(i), 0);
    const paid = invs.filter(i => i.paidDate);
    const avgPay = paid.length
      ? paid.reduce((a, i) => a + (daysBetween(i.date, i.paidDate) || 0), 0) / paid.length : null;
    return Object.assign({}, b, {_rev:rev, _mi:mi, _loads:ls.length,
      _rpm:mi ? rev / mi : 0, _unpaid:unpaid, _avgPay:avgPay});
  });
  return el("div", {class:"panel"}, [
    el("div", {class:"panel-head"}, [
      el("h2", {text:"Customer Report"}), el("div", {class:"sp"}),
      el("span", {class:"hint", text:"Average days to pay tells you who to keep hauling for"})

        _rev:money0(l.reduce((a,b) => a + b._rev, 0)),
        _unpaid:money0(l.reduce((a,b) => a + b._unpaid, 0))})

  if (inp) inp.addEventListener("change", () => {
    S.set[f.k] = f.type === "check" ? inp.checked

function pickLogo(){
  const inp = el("input", {type:"file", accept:"image/*", style:{display:"none"}});
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 256, sc = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        S.set.logo = c.toDataURL("image/png");
        commit("Logo updated."); render();
      };
      img.onerror = () => toast("That image could not be read.", "err");
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(() => inp.remove(), 900);
}

    minWidth:"116px", padding:"12px 10px", borderRadius:"var(--r)", textAlign:"center",
    border:"1px solid " + (accent ? "var(--accent)" : "var(--hair)"),
    background:accent ? "var(--accent-soft)" : "var(--sunk)"}}, [
    el("div", {style:{fontWeight:"600", fontSize:"12.5px", marginBottom:"2px"},
      text:label}),
    el("div", {class:"sm mut", text:sub})
  ]);
  return el("div", {style:{display:"flex", gap:"9px", alignItems:"center",
    flexWrap:"wrap", marginBottom:"4px"}}, [
    box("This computer", "where you work", true),
    el("div", {class:"mut", style:{flex:"0 0 auto", fontSize:"17px"}, text:"⇄"}),
    box("Shared folder", "Dropbox · Drive · iCloud"),
    el("div", {class:"mut", style:{flex:"0 0 auto", fontSize:"17px"}, text:"⇄"}),
    box("Your other computer", "same app, same data")
  ]);
}

function viewSync(){

    const l = document.getElementById("storageLine");
    if (!l) return;
    l.textContent = si.persisted
      ? "Your browser has marked this app's storage as permanent — it won't be cleared to free up space."
      : "Your browser keeps this app's storage on a best-effort basis. It can be cleared if the disk fills up, which is another reason to connect a folder.";
  });
  const n = totalRecords();
  const backedUp = S.set.lastBackup;
  const daysSince = backedUp ? daysBetween(backedUp, today()) : null;

    borderLeft:"3px solid var(--" + (safe ? "good" : "bad") + ")"}},

      alignItems:"flex-start", flexWrap:"wrap"}}, [
    el("span", {html:safe ? ICON.check : ICON.alert, style:{flex:"0 0 auto",
      color:"var(--" + (safe ? "good" : "bad") + ")", marginTop:"2px"}}),
    el("div", {style:{flex:"1", minWidth:"250px"}}, [
      el("div", {style:{fontWeight:"600", fontSize:"14px", marginBottom:"3px"},

/* ═══ KABUK + YÖNLENDİRME (ÇEKİRDEK) ════════════════════════════════════
   Sayfa listesi config'ten TÜRETİLİR, elle yazılmaz.
   ⚠ TEK ÇİZİM YOLU. Her değişiklikten sonra render() çağrılır ve görünüm
     durumdan yeniden kurulur. Kısmi DOM güncellemesi denendi; iki ekran
     birbirini tutmaz hâle geldi.
   ⚠ HER NAV ANAHTARININ SAYFASI OLMALI. Bir kez `sync` nav'a eklendi ama
     PAGES'e eklenmedi ve uygulama AÇILIŞTA ÇÖKTÜ. Artık build doğruluyor. */

let PAGES = {}, NAV = [], COUNTS = {}, PAGE = "dash";

function buildPages(){
  PAGES = {
    dash: {t:"Dashboard", s:V.dashSub || "Everything at a glance",
           i:"dash", fn:viewDashboard}
  };
  PAGES[V.job.key] = {t:W("jobs"), s:V.job.sub || ("Every " + W("jobLower") + ", start to paid"),
                      i:V.job.icon || "load", fn:viewJobs};
  if (V.job.board !== false)
    PAGES.board = {t:W("board"), s:"Drag " + W("jobsLower") + " through their stages",
                   i:"board", fn:viewBoard};
  PAGES.invoices = {t:"Invoices", s:"Bill " + W("jobsLower") + " and track what's owed",
                    i:"invoice", fn:viewInvoices};
  Object.keys(V.entities).forEach(k => {
    const e = V.entities[k];
    PAGES[k] = {t:e.title || e.noun + "s", s:e.sub || "", i:e.icon || "doc",
                fn:(function(kk){ return function(){ return entityView(kk); }; })(k)};
  });
  Object.keys(V.pages || {}).forEach(k => { PAGES[k] = V.pages[k]; });
  PAGES.reports  = {t:"Reports", s:V.reportsSub || "Where the money goes", i:"chart", fn:viewReports};
  PAGES.sync     = {t:"Backup & Sync", s:"Keep your work safe — and on both computers if you want",
                    i:"folder", fn:viewSync};
  PAGES.settings = {t:"Settings", s:"Company, look and your data", i:"gear", fn:viewSettings};

  NAV = V.nav.concat([["Your Data", ["sync", "settings"]]]);

  /* ⚠ NAV ile PAGES TUTARLILIĞI. Eksik sayfa açılışta çökertiyor. */
  NAV.forEach(g => g[1].forEach(k => {
    if (!PAGES[k]) throw new Error("nav'da '" + k + "' var ama sayfası yok");
  }));

  COUNTS = {
    invoices: () => rows("invoices").filter(i => !i.paidDate).length,
    sync:     () => DIR ? 0 : (!S.set.lastBackup ||
                daysBetween(S.set.lastBackup, today()) > 14) ? 1 : 0
  };
  COUNTS[V.job.key] = () => rows(V.job.key).filter(isOpen).length;
  if (V.entities.docs) COUNTS.docs = () => rows("docs").filter(d => d.expires &&
    daysBetween(today(), d.expires) < 45).length;
  Object.keys(V.counts || {}).forEach(k => { COUNTS[k] = V.counts[k]; });
}

function go(p){ if (PAGES[p]){ PAGE = p; SORT = {}; SHOWN = {}; render(); } }

function buildNav(){
  const nav = $("#nav"); nav.innerHTML = "";
  NAV.forEach(g => {
    nav.appendChild(el("div", {class:"nav-group", text:g[0]}));
    g[1].forEach(k => {
      const p = PAGES[k], c = COUNTS[k] ? COUNTS[k]() : 0;
      nav.appendChild(el("button", {
        class:"nav-item" + (PAGE === k ? " on" : ""), title:p.t,
        onclick:() => { document.body.classList.remove("nav-open"); go(k); }}, [
        el("span", {class:"ic", html:ICON[p.i] || ICON.doc}),
        el("span", {class:"lbl", text:p.t}),
        c ? el("span", {class:"cnt", text:String(c)}) : null
      ]));
    });
  });
}

function paintSync(needsPermission){
  const chip = $("#syncChip"); if (!chip) return;
  const dot = $(".sync-dot", chip), txt = $(".sync-txt", chip);
  if (!HAS_FS){
    dot.className = "sync-dot"; txt.textContent = "Saved on this device";
    chip.title = browserName() + " can't save to a folder by itself — click to see what to do.";
  } else if (!DIR){
    dot.className = "sync-dot off"; txt.textContent = "Not saved anywhere else";
    chip.title = "Click to turn on automatic saving — takes about twenty seconds";
  } else if (needsPermission){
    dot.className = "sync-dot off"; txt.textContent = "Reconnect folder";
    chip.title = "Click to grant access again";
  } else {
    dot.className = "sync-dot ok"; txt.textContent = "Saving automatically";
    chip.title = "Every change is written to " + (FILE_NAME || "your folder");
  }
  chip.onclick = () => (needsPermission && DIR) ? reconnect() : go("sync");
}

function render(){
  memoClear();          /* ağır türetilmiş değerler her çizimde bir kez */
  document.documentElement.dataset.skin = S.set.skin || V.skin;
  applyFavicon();
  const p = PAGES[PAGE] || PAGES.dash;
  $("#app").classList.toggle("rail-collapsed", !!S.set.railCollapsed);
  $("#pageTitle").textContent = p.t;
  $("#pageSub").textContent = p.s || "";
  $("#brandName").textContent = S.set.company || V.name;
  const mark = $("#brandMark"); mark.innerHTML = "";
  if (S.set.logo) mark.appendChild(el("img", {src:S.set.logo, alt:""}));
  else mark.textContent = (S.set.company || V.initials || "").replace(/[^A-Za-z]/g, "")
    .slice(0, 2).toUpperCase() || "FD";
  buildNav(); paintSync(HAS_FS && DIR && !FILE_NAME);
  const v = $("#view"); v.innerHTML = ""; v.appendChild(p.fn()); v.scrollTop = 0;
}

function keys(e){
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "n" && !e.metaKey && !e.ctrlKey){
    if (PAGE === V.job.key || PAGE === "dash" || PAGE === "board"){ e.preventDefault(); newJob(); }
    else if (PAGE === "invoices"){ e.preventDefault(); newInvoice(); }
  }
  if (e.key === "/"){
    const s = $(".search .inp"); if (s){ e.preventDefault(); s.focus(); s.select(); }
  }
}

async function boot(){
  validateVertical();
  buildPages();
  const had = loadLocal();
  /* ⚠ Demo YALNIZCA arka planı boş bırakmamak için geçici olarak yükleniyor;
     kaydedilmiyor. Kullanıcı seçimini yapana kadar diske hiçbir şey yazılmaz. */
  if (!had) S = normalize(V.demo());
  document.documentElement.dataset.skin = S.set.skin || V.skin;
  document.title = V.name;
  $("#railToggle").onclick = () => { S.set.railCollapsed = !S.set.railCollapsed; commit(); render(); };
  /* ⚠ Dar ekranda ray kayan panel; düğme onu açıp kapatıyor. Sadece
     gizlemek menüyü tamamen erişilemez bırakırdı. */
  $("#navToggle").innerHTML = ICON.menu;
  $("#navToggle").onclick = () => document.body.classList.toggle("nav-open");
  document.body.addEventListener("click", e => {
    if (!document.body.classList.contains("nav-open")) return;
    if (e.target.closest("#rail") || e.target.closest("#navToggle")) return;
    document.body.classList.remove("nav-open");
  });
  $("#newLoadBtn").onclick = newJob;
  $("#newLoadBtn").textContent = W("newJob");
  $("#themeBtn").onclick = () => { SET_TAB = "look"; go("settings"); };
  $(".brand-sub").textContent = V.tagline;
  document.addEventListener("keydown", keys);
  render();
  demoBanner();
  if (!had && !DEMO_MODE){
    await firstRun();          /* sessizce demo yükleme — SOR */
  }
  await resumeFolder();
}

/* ═══ ÖRNEK VERİ KİTAPLIĞI ══════════════════════════════════════════════
   Her dikeyin demo'sunda tekrar eden işler burada bir kez.
   ⚠ EN ÇOK ZAMANI GİDER YAPISI YİYORDU. freight'te marj iki kez (%2, %49),
     autoshop'ta iki kez (%28, −%18), carwash'ta iki kez yanlış çıktı ve her
     seferinde elle kalem ekleyip çıkardım. `expenseBook` artık HEDEF MARJI
     alıp giderleri ona göre üretiyor — sektörün kalem dağılımını koruyarak.
   ⚠ Kalem ADLARI dikeyden geliyor. Ortak bir gider listesi kullanmak
     ürünleri jenerikleştirir: yıkamacının "kimyasal", tesisatçının
     "malzeme", fotoğrafçının "ekipman kiralama" kalemi var.              */

function seeded(n){
  let s = n || 20260828;
  const R = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  R.pick = a => a[Math.floor(R() * a.length)];
  R.bt = (a, b) => a + R() * (b - a);
  R.int = (a, b) => Math.floor(R.bt(a, b));
  R.chance = p => R() < p;
  return R;
}

  "Nadia","Ivo","Selma","Joris","Amara","Petra","Kai","Lena","Otto","Rosa","Idris","Vera"];
const NAME_LAST = ["Whitfield","Ellery","Raman","Baptiste","Nakamura","Lund","Vasquez",
  "Okoro","Halvorsen","Karim","Moreau","Petrov","Byrne","Mensah","Ferrara","Doyle",
  "Tanaka","Cabrera","Haddad","Keane","Nasser","Obi","Lindqvist","Rossi","Aziz",
  "Bakker","Ionescu","Farouk","Novak","Sandoval","Achterberg","Beaumont","Quintero"];

function personName(R){ return R.pick(NAME_FIRST) + " " + R.pick(NAME_LAST); }
function phoneNo(R){
  return "(" + R.pick(["214","469","972","817"]) + ") 555-0" + R.int(100, 999);
}
function plateNo(R){
  const L = () => String.fromCharCode(65 + R.int(0, 26));
  return L() + L() + L() + "-" + R.int(1000, 9999);
}

/* ── GİDER DEFTERİ ────────────────────────────────────────────────────
   revByMonth : {"2026-07": 41200, …}   aylık ciro
   spec       : {fixed:[[ad, aylık, oynaklık], …],
                 variable:[[ad, ciro oranı, oynaklık], …],
                 occasional:[[ad, kaç ayda bir, min, max], …]}
   target     : hedef net marj (0.15 = %15)
   ⚠ HEDEFE "denge kalemi" ile varılıyor: sabit + değişken kalemler
     sektörün dağılımını korur, kalan fark `balanceAs` kalemine yazılır
     (genelde ücretler — her işte en büyük ve en esnek kalem).            */
function expenseBook(R, revByMonth, spec, target, balanceAs){
  const out = [], months = Object.keys(revByMonth).sort();
  const D = mk => mk + "-" + String(R.int(2, 27)).padStart(2, "0");
  months.forEach(mk => {
    const rev = revByMonth[mk] || 0;
    if (!rev) return;
    let spent = 0;
    (spec.fixed || []).forEach(f => {
      const amt = Math.round(f[1] * R.bt(1 - (f[2] || .08), 1 + (f[2] || .08)));
      out.push({id:uid(), date:D(mk), category:f[0], amount:amt, vendor:f[3] || ""});
      spent += amt;
    });
    (spec.variable || []).forEach(v => {
      const amt = Math.round(rev * v[1] * R.bt(1 - (v[2] || .12), 1 + (v[2] || .12)));
      if (amt > 0){
        out.push({id:uid(), date:D(mk), category:v[0], amount:amt, vendor:v[3] || ""});
        spent += amt;
      }
    });
    (spec.occasional || []).forEach(o => {
      if (!R.chance(1 / (o[1] || 3))) return;
      const amt = Math.round(R.bt(o[2], o[3]));
      out.push({id:uid(), date:D(mk), category:o[0], amount:amt, vendor:o[4] || ""});
      spent += amt;
    });
    /* denge kalemi — hedef marja getiren fark */
    const want = rev * (1 - target);
    const gap = Math.round(want - spent);
    if (gap > 0)
      out.push({id:uid(), date:D(mk), category:balanceAs[0], amount:gap,
                vendor:balanceAs[1] || ""});
  });
  return out;
}

/* ═══ DEMO İÇİNDE AYARLARI GEÇİCİ OLARAK KUR ════════════════════════════
   ⚠ BU TUZAĞA İKİ KEZ DÜŞTÜK. Alan fonksiyonlarının çoğu `S.set`'ten
     okuyor (gün ücreti, vergi oranı, servis malzemesi yüzdesi...). Ama
     `DEMO()` henüz S'e yazmadığı için o değerler UNDEFINED → 0 dönüyor:
       · electrical: gün ücretli işler ciroya 0 yazıldı, giderler eksik
         üretildi, net marj %16 hedeflenirken %27 çıktı
       · autoshop: vergi ve servis malzemesi 0 sayıldı
     Çözüm: demo ayarlarını ÖNCE kur, hesabı onunla yap, sonra geri al.
   ⚠ Aynı sebeple demo içinde `rows()` / `byId()` de kullanma — S boş. */
function withSettings(set, fn){
  const prev = S.set;
  S.set = Object.assign({}, DEFAULT_SET, set);
  try { return fn(); }
  finally { S.set = prev; }
}

/* Aylık ciro haritası — expenseBook'un girdisi. */
function revenueByMonth(list, dateOf, valueOf){
  const m = {};
  list.forEach(x => {
    const k = monthKey(dateOf(x));
    if (k) m[k] = (m[k] || 0) + valueOf(x);
  });
  return m;
}

/* Son N ayın anahtarları — gider defteri bu pencereyi doldurur. */
function monthWindow(n){
  const out = {}, d = new Date(); d.setDate(1);
  for (let i = n; i >= 0; i--){
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out[x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")] = 0;
  }
  return out;
}

/* İş aşamalarını doldur: son günler kasıtlı yoğun, tahta boş kalmasın.
   ⚠ Düz dağıtımda 78 yükün 4'ü son 16 güne düşüyordu ve dispeç tahtası
     BOŞ açılıyordu; boş ürün ne satar ne anlatır. */
function openStagePlan(stages, perStage){
  const plan = [];
  stages.forEach((st, si) => {
    for (let k = 0; k < (perStage || 4); k++)
      plan.push({st:st, day:-Math.floor((si * (perStage || 4) + k) / 2.2) - 1});
  });
  return plan;
}

     fiyatlıyor ama işin yarısı ekran başında geçiyor: seçim, düzenleme,

     öldürüyor; ayrıca bekleyen iş nakit akışını tıkıyor çünkü çoğu
     sözleşmede bakiye teslimde ödeniyor.
   ⚠ ÜÇÜNCÜ: PAKET vs SAATLİK. Paket işler öngörülebilir ama kapsam
     kayması (scope creep) orada oluyor; saatlik iş güvenli ama az.
   ⚠ DÖRDÜNCÜ: DEPOLAMA. Her çekim kalıcı bir maliyet bırakıyor —
     yıllarca saklanan terabaytlar sessizce birikiyor.                   */

const SHOOT_TYPES = ["Wedding","Engagement","Family","Newborn","Maternity",
  "Portrait","Headshots","Corporate event","Product","Property","Food",
  "Graduation","Christening","Pet","Fashion","Band / press","School"];
const PRICING = [{v:"package", t:"Package"}, {v:"hourly", t:"Hourly"},
                 {v:"dayrate", t:"Day rate"}, {v:"retainer", t:"Retainer"}];
const DELIVERY = ["Online gallery","USB","Prints","Album","Gallery + album",
  "Digital files only"];

function shShootHours(J){ return n0(J.shootHours); }
/* ⚠ Masa başı saatleri: seçim + düzenleme + teslim. İşin görünmeyen yarısı. */
function shDeskHours(J){ return n0(J.cullHours) + n0(J.editHours) + n0(J.deliverHours); }
function shTotalHours(J){ return shShootHours(J) + shDeskHours(J); }
function shValue(J){
  return n0(J.fee) + n0(J.extras) + n0(J.printSale) - n0(J.discount);
}
function shCost(J){
  return shTotalHours(J) * n0(S.set.ownHourCost) + n0(J.secondShooter) +
         n0(J.printCost) + n0(J.travel) + n0(J.hire);
}
function shMargin(J){ const v = shValue(J); return v ? (v - shCost(J)) / v * 100 : 0; }
/* İlan edilen saat ücreti ile GERÇEK saat ücreti arasındaki fark. */
function shHeadlineRate(J){
  const h = shShootHours(J); return h ? shValue(J) / h : 0;
}
function shTrueRate(J){
  const h = shTotalHours(J); return h ? shValue(J) / h : 0;
}
function deskShare(from, to){
  const js = rows("shoots").filter(j => isRevenue(j) && inRange(j.date, from, to));
  const shoot = js.reduce((a, j) => a + shShootHours(j), 0);
  const desk = js.reduce((a, j) => a + shDeskHours(j), 0);
  const t = shoot + desk;
  return t ? desk / t * 100 : 0;
}
/* Teslim süresi: çekim → teslim. */
function turnaround(J){
  return J.delivered ? daysBetween(J.date, J.delivered) : null;
}
function avgTurnaround(from, to){
  const ds = rows("shoots").filter(j => inRange(j.date, from, to))
    .map(turnaround).filter(x => x !== null);
  return ds.length ? ds.reduce((a, b) => a + b, 0) / ds.length : 0;
}
function overdueDeliveries(){
  return rows("shoots").filter(j => !j.delivered && j.promised &&
    daysBetween(j.promised, today()) > 0 &&
    ["shot","editing","ready"].indexOf(j.status) >= 0);
}
/* ⚠ BEKLEYEN BAKİYE. Çoğu sözleşmede bakiye teslimde ödeniyor; geciken
   teslim doğrudan tıkanmış nakit demek. */
function heldBalance(){
  return rows("shoots").filter(j => !j.delivered &&
    ["shot","editing","ready"].indexOf(j.status) >= 0)
    .reduce((a, j) => a + Math.max(0, shValue(j) - n0(j.deposit)), 0);
}
function storageGB(){
  return rows("shoots").reduce((a, j) => a + n0(j.gb), 0);
}
function storageCost(){
  return storageGB() / 1000 * n0(S.set.storagePerTB) * 12;
}

        /* ⚠ İşin görünmeyen yarısı. */
        {k:"At the desk", v:num(dk, 1) + " hr",
         c:tot && dk / tot > .6 ? "var(--warn)" : "var(--muted)"},
        {k:"Headline rate", v:sh ? money(head) : "—", c:"var(--muted)"},
        {k:"True rate", v:tot ? money(tru) : "—",
         c:tru >= 75 ? "var(--good)" : tru > 0 ? "var(--bad)" : "var(--muted)"},
        {k:"Margin", v:v ? pct(shMargin(J), 0) : "—",
         c:shMargin(J) < 45 ? "var(--warn)" : "var(--good)"}
      ];
    },

    fields:() => [
      {k:"ref", label:"Job #", req:true, ph:"e.g. 2026-041"},
      {k:"status", label:"Status", type:"select", req:true,
       opts:V.job.stages.map(s => ({v:s.v, t:s.t}))},
      {k:"date", label:"Shoot date", type:"date", req:true},
      {k:"clientId", label:"Client", type:"ref", ref:"clients",
       refLabel:r => r.name, req:true},
      {k:"type", label:"Type of shoot", type:"select", opts:SHOOT_TYPES, req:true},
      {k:"pricing", label:"Priced how", type:"select", opts:PRICING, req:true},
      {k:"shooterId", label:"Photographer", type:"ref", ref:"shooters",
       refLabel:r => r.name},
      {k:"location", label:"Location", ph:"Fairview Manor · outdoors"},
      {k:"shootHours", label:"Hours shooting", type:"num", min:0, step:"0.5", req:true},
      /* ⚠ Bu üç alan ürünün ana içgörüsünü besliyor. */
      {k:"cullHours", label:"Hours culling", type:"num", min:0, step:"0.5",
       hint:"Choosing the keepers — always longer than people think"},
      {k:"editHours", label:"Hours editing", type:"num", min:0, step:"0.5"},
      {k:"deliverHours", label:"Hours delivering", type:"num", min:0, step:"0.25",
       hint:"Gallery, album layout, prints, emails"},
      {k:"fee", label:"Fee", type:"money", min:0, req:true},
      {k:"deposit", label:"Deposit taken", type:"money", min:0},
      {k:"printSale", label:"Prints & albums sold", type:"money", min:0},
      {k:"printCost", label:"Prints & albums cost", type:"money", min:0},
      {k:"secondShooter", label:"Second shooter paid", type:"money", min:0},
      {k:"travel", label:"Travel cost", type:"money", min:0},
      {k:"hire", label:"Kit hire", type:"money", min:0},
      {k:"extras", label:"Extras", type:"money", min:0},
      {k:"discount", label:"Discount", type:"money", min:0},
      {k:"promised", label:"Promised by", type:"date",
       hint:"You get a warning when this passes and the gallery is not out"},
      {k:"delivered", label:"Delivered on", type:"date"},
      {k:"deliveryVia", label:"Delivered how", type:"select", opts:DELIVERY, blank:"—"},
      {k:"gb", label:"Storage used (GB)", type:"num", min:0,
       hint:"Every shoot leaves a permanent cost behind"},
      {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
    ],

    cols:() => [
      {k:"ref", h:"Job #", w:"104px", render:J =>
        el("span", {class:"mono", style:{fontWeight:"600"}, text:J.ref || "—"})},
      {k:"date", h:"Shoot", type:"date", w:"106px"},
      {k:"clientId", h:"Client & shoot", calc:J => jobLabel(J), render:J =>
        el("div", {class:"cell-2"}, [
          el("span", {class:"a", text:clientName(J.clientId) || "—"}),
          el("span", {class:"b", text:[J.type, J.location].filter(Boolean).join(" · ")})])},
      {k:"shootHours", h:"Shoot hrs", type:"num", dp:1},
      {k:"desk", h:"Desk hrs", type:"num", dp:1, calc:J => shDeskHours(J),
        tdClass:J => shTotalHours(J) && shDeskHours(J) / shTotalHours(J) > .65
          ? "bad" : ""},
      {k:"fee", h:"Fee", type:"money", calc:J => shValue(J)},
      {k:"head", h:"Headline $/hr", type:"money", calc:J => shHeadlineRate(J),
        tdClass:() => "mut"},
      /* ⚠ İki oran yan yana — fark fotoğrafçının hiç görmediği şey. */
      {k:"true", h:"True $/hr", type:"money", calc:J => shTrueRate(J),
        tdClass:J => shTrueRate(J) >= 75 ? "good"
          : shTrueRate(J) > 0 && shTrueRate(J) < 38 ? "bad" : ""},
      {k:"turn", h:"Turnaround", type:"num", calc:J => turnaround(J) || 0,
        render:J => { const t = turnaround(J);
          return el("span", {class:"mono", style:{color:t > 42 ? "var(--bad)" : "var(--muted)"},
            text:t === null ? "—" : t + " d"}); }},
      {k:"status", h:"Status", w:"110px",
        calc:J => (V.job.stages.find(s => s.v === J.status) || {}).t || "",
        render:J => { const s = V.job.stages.find(x => x.v === J.status) || V.job.stages[0];
          return el("span", {class:"pill " + s.pill, text:s.t}); }}
    ],

    footer:list => ({ref:"Total · " + list.length,
      shootHours:num(list.reduce((a, J) => a + shShootHours(J), 0), 1),
      desk:num(list.reduce((a, J) => a + shDeskHours(J), 0), 1),
      fee:money0(list.reduce((a, J) => a + shValue(J), 0)),
      true:(function(){ const h = list.reduce((a, J) => a + shTotalHours(J), 0);
        return h ? money(list.reduce((a, J) => a + shValue(J), 0) / h) : "—"; })()})
  },

  kpis:st => {
    const sh = st.cur.reduce((a, J) => a + shShootHours(J), 0);
    const tot = st.cur.reduce((a, J) => a + shTotalHours(J), 0);
    const desk = deskShare(st.from, today());
    const turn = avgTurnaround(st.from, today());
    const late = overdueDeliveries();
    const held = heldBalance();
    const prints = st.cur.reduce((a, J) => a + n0(J.printSale), 0);
    const lost = rows("shoots").filter(j => j.status === "lost" &&
      inRange(j.date, st.from, today())).length;
    return [
      /* ⚠ hero panosunda devasa görünen kart — kasıtlı. */
      {label:"True Hourly Rate", value:tot ? money(st.rev / tot) : "—",
       color:tot && st.rev / tot >= 75 ? "var(--good)" : "var(--bad)",
       delta:sh && tot ? -((tot - sh) / tot * 100) : null,
       note:"headline " + (sh ? money(st.rev / sh) : "—") + " once editing is counted",
       spark:st.revSeries.slice(-8)},
      {label:"Revenue", value:money0(st.rev), color:"var(--c1)",
       delta:st.delta(st.rev, st.revPrev), note:st.cur.length + " shoots"},
      {label:"Desk Time", value:pct(desk, 0),
       color:desk > 62 ? "var(--warn)" : "var(--c2)",
       note:"of your hours are culling, editing and delivering"},
      {label:"Turnaround", value:turn ? Math.round(turn) + " days" : "—",
       color:turn > 42 ? "var(--bad)" : "var(--c3)",
       note:late.length + " past their promised date"},
      /* ⚠ Teslim edilmeyen iş = tıkanmış nakit. */
      {label:"Balances Held Up", value:money0(held),
       color:held ? "var(--bad)" : "var(--good)",
       note:"waiting on galleries you have not sent"},
      {label:"Print & Album Sales", value:money0(prints),
       color:st.rev && prints / st.rev >= .12 ? "var(--good)" : "var(--warn)",
       note:st.rev ? pct(prints / st.rev * 100, 0) + " of revenue" : "—"},
      {label:"Booking Rate",
       value:(st.cur.length + lost) ? pct(st.cur.length / (st.cur.length + lost) * 100, 0) : "—",
       color:"var(--c6)", note:lost + " enquiries that did not book"},
      {label:"Net Profit", value:money0(st.profit),
       color:st.profit >= 0 ? "var(--good)" : "var(--bad)",
       note:st.rev ? pct(st.profit / st.rev * 100) + " margin · " +
         num(storageGB() / 1000, 1) + " TB stored" : "—"}
    ];
  },

  reports:["pnl","jobs","worker","client"],
  settings:{
    invoiceFields:[
      {k:"ownHourCost", label:"Your cost per working hour", type:"money", min:0,
       hint:"What an hour of your time has to earn to be worth it"},
      {k:"storagePerTB", label:"Storage cost per TB per month", type:"money", min:0}
    ],
    unitFields:[]
  },
  invoiceCols:[{h:"Job #"}, {h:"Shoot"}, {h:"Type"},
               {h:"Delivered"}, {h:"Amount", n:true}],
  invoiceLine:J => [
    {v:"<b>" + esc(J.ref || "") + "</b>"},
    {v:esc(date(J.date)) + (J.location
      ? '<br><span style="color:#777;font-size:10.5px">' + esc(J.location) + "</span>" : "")},
    {v:esc(J.type || "")},
    {v:esc(J.delivered ? date(J.delivered) : "—")},
    {v:money(shValue(J)), n:true}
  ],

  nav:[
    ["Studio",  ["dash", "shoots", "board"]],
    ["People",  ["clients", "shooters"]],
    ["Kit",     ["kit"]],
    ["Money",   ["invoices", "expenses"]],
    ["Insight", ["reports"]]
  ],
  counts:{
    shoots:() => overdueDeliveries().length,
    kit:() => rows("kit").filter(k => k.dueBack &&
      daysBetween(today(), k.dueBack) < 3).length
  },
  alerts:() => {
    const out = [];
    overdueDeliveries().forEach(j => {
      const late = daysBetween(j.promised, today());
      const bal = Math.max(0, shValue(j) - n0(j.deposit));
      out.push({kind:late > 14 ? "bad" : "warn", icon:ICON.clock,
        text:clientName(j.clientId) + " · " + j.type,
        note:late + " days past promised · " + money0(bal) + " balance waiting",
        go:"shoots"});
    });
    rows("kit").forEach(k => {
      if (!k.dueBack) return;
      const l = daysBetween(today(), k.dueBack);
      if (l !== null && l < 3)
        out.push({kind:l < 0 ? "bad" : "warn", icon:ICON.alert,
          text:k.name + (k.lentTo ? " · with " + k.lentTo : ""),
          note:l < 0 ? "Overdue back " + (-l) + " days" : "Due back in " + l + " days",
          go:"kit"});
    });
    return out;
  },
  demo:() => DEMO(),
  entities:{}
};

    {k:"prints", h:"Prints bought", type:"money",

V.entities.shooters = {

  jobField:"shooterId", icon:"driver", noun:"photographer",

  editTitle:"Photographer", sort:"name", dir:"asc",
  emptyTitle:"No photographers yet",
  emptyText:"Add yourself and any second shooters. Editing hours and true rate split by person.",
  blank:() => ({status:"active", payType:"flat", payRate:0}),
  fields:[
    {k:"name", label:"Name", req:true},

    {k:"notes", label:"Notes", type:"textarea", full:true, rows:2}
  ],
  cols:() => [
    {k:"name", h:"Photographer", render:s => el("div", {class:"cell-2"}, [

    {k:"shoots", h:"Shoots", type:"num",

    {k:"sh", h:"Shoot hrs", type:"num", dp:1,
      calc:s => rows("shoots").filter(j => j.shooterId === s.id)
        .reduce((a, j) => a + shShootHours(j), 0)},
    {k:"desk", h:"Desk hrs", type:"num", dp:1,
      calc:s => rows("shoots").filter(j => j.shooterId === s.id)
        .reduce((a, j) => a + shDeskHours(j), 0)},
    /* ⚠ Kişi başına düzenleme oranı — kim ekranda kayboluyor. */
    {k:"ratio", h:"Desk per shoot hour", type:"num", dp:2, calc:s => {
      const js = rows("shoots").filter(j => j.shooterId === s.id);
      const sh = js.reduce((a, j) => a + shShootHours(j), 0);
      const dk = js.reduce((a, j) => a + shDeskHours(j), 0);
      return sh ? dk / sh : 0; },
      tdClass:s => { const js = rows("shoots").filter(j => j.shooterId === s.id);
        const sh = js.reduce((a, j) => a + shShootHours(j), 0);
        const dk = js.reduce((a, j) => a + shDeskHours(j), 0);
        return sh && dk / sh > 2.5 ? "bad" : "good"; }},
    {k:"rev", h:"Revenue", type:"money",

    {k:"pay", h:"Their pay", type:"money", calc:s => workerPay(s)},

      render:s => statusPill(s.status)}
  ]
